<script>
// ===================== CONFIG =====================
// GANTI dengan URL Web App Google Apps Script kamu
// Contoh: https://script.google.com/macros/s/AKfycb.../exec
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwS5U4gH1kTpPtBbSC8_Oj7ZnS0pOWjvZN4P6fT6aICABp6QhXLu68_S1HXl-lSoOM/exec';

// ===================== STATE =====================
let data = { transaksi: [], rekening: [], hutangPiutang: [], anggaran: [], recurring: [], tujuanNabung: [], userName: 'Pengguna' };
let currentPage = 'home';
let hutangFilter = 'semua';
let pinBuffer = '';
let hasPinLock = false;

// ===================== UTILS =====================
const rp = n => 'Rp' + Math.round(Number(n) || 0).toLocaleString('id-ID');
const today = () => new Date().toISOString().slice(0, 10);
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('opacity-0');
  setTimeout(() => t.classList.add('opacity-0'), 2200);
}

/**
 * Panggil backend GAS via fetch
 * Contoh: run('getInitialData')
 *         run('addTransaksi', { jenis: 'Pemasukan', ... })
 */
async function run(action, payload) {
  if (!WEB_APP_URL || WEB_APP_URL.includes('XXXX')) {
    toast('Isi dulu WEB_APP_URL di Index.html');
    throw new Error('WEB_APP_URL belum diisi');
  }

  try {
    const res = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, data: payload }),
      redirect: 'follow'
    });

    const text = await res.text();
    let json;
    try {
      json = JSON.parse(text);
    } catch (e) {
      console.error('Response bukan JSON:', text);
      throw new Error('Respons server tidak valid');
    }

    if (!json.success) {
      throw new Error(json.error || 'Gagal memproses permintaan');
    }
    return json.data;
  } catch (err) {
    console.error(err);
    toast('Error: ' + (err.message || err));
    throw err;
  }
}

// ===================== INIT =====================
async function init() {
  try {
    const pinExists = await run('hasPin');
    if (pinExists) {
      hasPinLock = true;
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('pin-lock').classList.remove('hidden');
      document.getElementById('pin-lock').classList.add('flex');
      return;
    }
    await loadData();
  } catch (e) {
    document.getElementById('loading').innerHTML = '<p class="text-white">Gagal memuat. Coba refresh.</p>';
  }
}

async function loadData() {
  data = await run('getInitialData');
  document.getElementById('user-name').textContent = data.userName || 'Pengguna';
  document.getElementById('input-nama').value = data.userName || '';
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('pin-lock').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('app').classList.add('flex');
  renderAll();
}

// ===================== PIN =====================
function pressPin(n) {
  if (pinBuffer.length >= 4) return;
  pinBuffer += n;
  updatePinDots();
  if (pinBuffer.length === 4) verifyPin();
}
function deletePin() {
  pinBuffer = pinBuffer.slice(0, -1);
  updatePinDots();
  document.getElementById('pin-error').textContent = '';
}
function updatePinDots() {
  document.querySelectorAll('.pin-dot').forEach((d, i) => {
    d.classList.toggle('bg-white', i < pinBuffer.length);
    d.classList.toggle('border-white/40', i >= pinBuffer.length);
  });
}
async function verifyPin() {
  const ok = await run('checkPin', pinBuffer);
  if (ok) {
    pinBuffer = '';
    await loadData();
  } else {
    document.getElementById('pin-error').textContent = 'PIN salah';
    pinBuffer = '';
    updatePinDots();
  }
}

// ===================== NAV =====================
function showPage(page) {
  currentPage = page;
  ['home','transaksi','rekening','hutang','lainnya','anggaran','recurring','tujuan','settings'].forEach(p => {
    const el = document.getElementById('page-' + p);
    if (el) el.classList.toggle('hidden', p !== page);
  });
  document.querySelectorAll('.nav-btn').forEach(btn => {
    const active = btn.dataset.page === page || (['anggaran','recurring','tujuan','settings'].includes(page) && btn.dataset.page === 'lainnya');
    btn.classList.toggle('text-navy-700', active);
    btn.classList.toggle('text-slate-400', !active);
  });
  if (page === 'transaksi') renderTransaksi();
  if (page === 'rekening') renderRekening();
  if (page === 'hutang') renderHutang();
  if (page === 'anggaran') renderAnggaran();
  if (page === 'recurring') renderRecurring();
  if (page === 'tujuan') renderTujuan();
}

// ===================== RENDER =====================
function renderAll() {
  renderHome();
  renderTransaksi();
  renderRekening();
  renderHutang();
  renderAnggaran();
  renderRecurring();
  renderTujuan();
}

function renderHome() {
  const kasRekening = data.rekening.filter(r => r.Nama !== 'Kredit (Non-Kas)' && r.Nama !== 'Reimburse');
  const total = kasRekening.reduce((s, r) => s + (Number(r.Saldo) || 0), 0);
  document.getElementById('total-saldo').textContent = rp(total);

  const now = new Date();
  const ym = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  let masuk = 0, keluar = 0;
  data.transaksi.forEach(t => {
    if (!t.Tanggal || !t.Tanggal.startsWith(ym)) return;
    if (['Transfer Keluar','Transfer Masuk'].includes(t.Kategori)) return;
    if (t.Jenis === 'Pemasukan') masuk += Number(t.Nominal);
    else keluar += Number(t.Nominal);
  });
  document.getElementById('home-pemasukan').textContent = rp(masuk);
  document.getElementById('home-pengeluaran').textContent = rp(keluar);

  // rekening cards
  const rekEl = document.getElementById('home-rekening');
  rekEl.innerHTML = kasRekening.map(r => `
    <div class="shrink-0 w-36 bg-white rounded-xl border border-slate-100 p-3 shadow-sm">
      <div class="w-3 h-3 rounded-full mb-2" style="background:${r.Warna || '#1B3A5F'}"></div>
      <p class="text-xs text-slate-500 truncate">${r.Nama}</p>
      <p class="font-semibold text-sm mt-0.5">${rp(r.Saldo)}</p>
    </div>
  `).join('') || '<p class="text-sm text-slate-400">Belum ada rekening</p>';

  // recent trx
  const trxEl = document.getElementById('home-trx');
  const recent = data.transaksi.slice(0, 8);
  trxEl.innerHTML = recent.length ? recent.map(trxCard).join('') : '<p class="text-sm text-slate-400 text-center py-6">Belum ada transaksi</p>';
}

function trxCard(t) {

      <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg ${isIn ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">

function renderTransaksi() {

function filterHutang(f) {
  hutangFilter = f;
  ['semua','Hutang','Piutang'].forEach(x => {
    const btn = document.getElementById('btn-hp-' + (x === 'semua' ? 'semua' : x.toLowerCase()));

    btn.className = `flex-1 py-2 rounded-xl text-sm font-medium ${active ? 'bg-navy-700 text-white' : 'bg-white border border-slate-200'}`;
  });
  renderHutang();
}

function renderHutang() {
  let list = data.hutangPiutang;
  if (hutangFilter !== 'semua') list = list.filter(h => h.Jenis === hutangFilter);
  document.getElementById('list-hutang').innerHTML = list.map(h => {
    const sisa = Number(h.SisaHutang) || 0;
    const total = Number(h.TotalHutang) || 0;
    const pct = total > 0 ? Math.min(100, Math.round((total - sisa) / total * 100)) : 0;
    const isHutang = h.Jenis === 'Hutang';
    return `
      <div class="bg-white rounded-xl border border-slate-100 p-4 shadow-sm" onclick="openHutangDetail('${h.ID}')">
        <div class="flex justify-between items-start">

            <p class="font-medium mt-1">${h.Nama}</p>

function renderAnggaran() {
  const now = new Date();
  const ym = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  document.getElementById('list-anggaran').innerHTML = data.anggaran.map(a => {
    const used = data.transaksi
      .filter(t => t.Jenis === 'Pengeluaran' && t.Kategori === a.Kategori && t.Tanggal && t.Tanggal.startsWith(ym))
      .reduce((s, t) => s + Number(t.Nominal), 0);
    const limit = Number(a.LimitBulanan) || 0;
    const pct = limit > 0 ? Math.min(100, Math.round(used / limit * 100)) : 0;
    const over = used > limit;
    return `
      <div class="bg-white rounded-xl border border-slate-100 p-4">
        <div class="flex justify-between">
          <p class="font-medium">${a.Kategori}</p>
          <p class="text-sm ${over ? 'text-rose-600' : 'text-slate-500'}">${rp(used)} / ${rp(limit)}</p>

          <div>

        </div>

  if (type === 'progress') {
    html = `
      <div class="p-5">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-semibold text-lg">Setor ke ${preset.nama}</h3>
          <button onclick="closeModal()" class="text-slate-400 text-2xl">×</button>
        </div>
        <div class="space-y-3">
          <input type="hidden" id="f-id" value="${preset.id}">

            <label class="text-xs text-slate-500">Nominal</label>

          </div>
          <div>
            <label class="text-xs text-slate-500">Dari Rekening</label>
            <select id="f-akun" class="w-full border border-slate-200 rounded-xl px-3 py-2.5">
              ${data.rekening.filter(r=>r.Nama!=='Kredit (Non-Kas)').map(r=>`<option value="${r.Nama}">${r.Nama}</option>`).join('')}
            </select>
          </div>
          <button onclick="saveProgress()" class="w-full bg-navy-700 text-white py-3 rounded-xl font-medium">Setor</button>
        </div>
      </div>`;
  }

  if (type === 'reimburse') {
    html = `
      <div class="p-5">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-semibold text-lg">Reimburse</h3>

        </div>
        <div class="space-y-3">
          <div>
            <label class="text-xs text-slate-500">Nominal Pengeluaran</label>
            <input id="f-nominal" type="number" class="w-full border border-slate-200 rounded-xl px-3 py-2.5">
          </div>
          <div>
            <label class="text-xs text-slate-500">% yang diklaim</label>
            <input id="f-persen" type="number" class="w-full border border-slate-200 rounded-xl px-3 py-2.5" value="100">

          <div>
            <label class="text-xs text-slate-500">Dari Rekening</label>
            <select id="f-akun" class="w-full border border-slate-200 rounded-xl px-3 py-2.5">
              ${data.rekening.filter(r=>r.Nama!=='Kredit (Non-Kas)').map(r=>`<option value="${r.Nama}">${r.Nama}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="text-xs text-slate-500">Kategori</label>
            <input id="f-kategori" class="w-full border border-slate-200 rounded-xl px-3 py-2.5" value="Reimburse">
          </div>
          <div>
            <label class="text-xs text-slate-500">Tanggal</label>
            <input id="f-tanggal" type="date" class="w-full border border-slate-200 rounded-xl px-3 py-2.5" value="${today()}">
          </div>

            <input id="f-catatan" class="w-full border border-slate-200 rounded-xl px-3 py-2.5">
          </div>
          <button onclick="saveReimburse()" class="w-full bg-navy-700 text-white py-3 rounded-xl font-medium">Simpan</button>
        </div>
      </div>`;
  }

  if (type === 'setpin') {
    html = `
      <div class="p-5">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-semibold text-lg">Atur PIN</h3>
          <button onclick="closeModal()" class="text-slate-400 text-2xl">×</button>
        </div>

          <div>

          </div>
          <button onclick="savePin()" class="w-full bg-navy-700 text-white py-3 rounded-xl font-medium">Simpan PIN</button>
        </div>
      </div>`;

  box.innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
  document.getElementById('modal-overlay').classList.add('flex');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
  document.getElementById('modal-overlay').classList.remove('flex');
}

function setJenis(j) {
  document.getElementById('f-jenis').value = j;
  document.getElementById('btn-jenis-in').className = `flex-1 py-2.5 rounded-xl text-sm font-medium ${j==='Pemasukan'?'bg-emerald-600 text-white':'bg-slate-100'}`;
  document.getElementById('btn-jenis-out').className = `flex-1 py-2.5 rounded-xl text-sm font-medium ${j==='Pengeluaran'?'bg-rose-600 text-white':'bg-slate-100'}`;
}

function toggleMetode() {
  const m = document.getElementById('f-metode').value;
  document.getElementById('field-bunga').classList.toggle('hidden', m !== 'Cicilan Tetap');
  document.getElementById('field-tenor').classList.toggle('hidden', m !== 'Cicilan Tetap');
  document.getElementById('field-biaya').classList.toggle('hidden', m !== 'Paylater');
}

// ===================== ACTIONS =====================
async function saveTrx() {
  const payload = {
    id: document.getElementById('f-id').value || undefined,
    jenis: document.getElementById('f-jenis').value,
    nominal: document.getElementById('f-nominal').value,
    kategori: document.getElementById('f-kategori').value,
    akun: document.getElementById('f-akun').value,
    tanggal: document.getElementById('f-tanggal').value,
    catatan: document.getElementById('f-catatan').value
  };
  data = payload.id ? await run('updateTransaksi', payload) : await run('addTransaksi', payload);
  closeModal();
  renderAll();
  toast('Transaksi disimpan');
}

function editTrx(id) {
  const t = data.transaksi.find(x => x.ID === id);
  if (!t) return;
  openModal('trx', { id: t.ID, jenis: t.Jenis, nominal: t.Nominal, kategori: t.Kategori, akun: t.Akun, tanggal: t.Tanggal, catatan: t.Catatan });
}

async function delTrx(id) {
  if (!confirm('Hapus transaksi ini?')) return;
  data = await run('deleteTransaksi', id);
  closeModal();
  renderAll();
  toast('Dihapus');
}

async function saveRekening() {
  const id = document.getElementById('f-id').value;
  if (id) {
    const payload = { id, nama: document.getElementById('f-nama').value };
    const sb = document.getElementById('f-saldo-baru').value;
    if (sb !== '') payload.saldoBaru = sb;
    data = await run('updateRekening', payload);
  } else {
    data = await run('addRekening', {
      nama: document.getElementById('f-nama').value,
      saldoAwal: document.getElementById('f-saldo').value
    });
  }
  closeModal();
  renderAll();
  toast('Rekening disimpan');
}

function editRekening(id) {
  const r = data.rekening.find(x => x.ID === id);
  if (!r) return;
  openModal('rekening', { id: r.ID, nama: r.Nama });
}

async function delRekening(id) {
  if (!confirm('Hapus rekening ini?')) return;
  data = await run('deleteRekening', id);
  closeModal();
  renderAll();
  toast('Dihapus');
}

async function saveTransfer() {
  data = await run('addTransfer', {
    akunAsal: document.getElementById('f-asal').value,
    akunTujuan: document.getElementById('f-tujuan').value,
    nominal: document.getElementById('f-nominal').value,
    biayaAdmin: document.getElementById('f-admin').value,
    tanggal: document.getElementById('f-tanggal').value,
    catatan: document.getElementById('f-catatan').value
  });
  closeModal();
  renderAll();
  toast('Transfer berhasil');
}

async function saveHutang() {
  const metode = document.getElementById('f-metode').value;
  const payload = {
    jenis: document.getElementById('f-jenis-hp').value,
    nama: document.getElementById('f-nama').value,
    metode,
    bentuk: document.getElementById('f-bentuk').value,
    pokok: document.getElementById('f-pokok').value,
    bungaPersen: document.getElementById('f-bunga-persen')?.value || 0,
    bungaNominal: document.getElementById('f-bunga-nominal')?.value || 0,
    tenor: document.getElementById('f-tenor')?.value || 0,
    biayaLayanan: document.getElementById('f-biaya')?.value || 0,
    akun: document.getElementById('f-akun').value,
    tanggal: document.getElementById('f-tanggal').value,
    jatuhTempo: document.getElementById('f-jatuh').value,
    catatan: document.getElementById('f-catatan').value
  };
  data = await run('addHutangPiutang', payload);
  closeModal();
  renderAll();
  toast('Berhasil dicatat');
}

function openHutangDetail(id) {
  const h = data.hutangPiutang.find(x => x.ID === id);
  if (!h) return;
  if (h.Status === 'Lunas') {
    toast('Sudah lunas');
    return;
  }
  openModal('bayar', {
    id: h.ID,
    nama: h.Nama,
    sisa: h.SisaHutang,
    nominalCicilan: h.NominalCicilan || h.SisaHutang
  });
}

async function saveBayar() {
  data = await run('bayarCicilan', {
    id: document.getElementById('f-id').value,
    nominal: document.getElementById('f-nominal').value,
    tanggal: document.getElementById('f-tanggal').value,
    catatan: document.getElementById('f-catatan').value,
    akun: document.getElementById('f-akun').value
  });
  closeModal();
  renderAll();
  toast('Pembayaran dicatat');
}

async function saveAnggaran() {
  data.anggaran = await run('addAnggaran', {
    kategori: document.getElementById('f-kategori').value,
    limitBulanan: document.getElementById('f-limit').value
  });
  closeModal();
  renderAnggaran();
  toast('Anggaran ditambah');
}

async function saveRecurring() {
  data.recurring = await run('addRecurring', {
    jenis: document.getElementById('f-jenis').value,
    kategori: document.getElementById('f-kategori').value,
    akun: document.getElementById('f-akun').value,
    nominal: document.getElementById('f-nominal').value,
    tanggalPerBulan: document.getElementById('f-tgl').value,
    catatan: document.getElementById('f-catatan').value
  });
  closeModal();
  renderRecurring();
  toast('Berhasil ditambah');
}

async function delRecurring(id) {
  if (!confirm('Hapus?')) return;
  data.recurring = await run('deleteRecurring', id);
  renderRecurring();
  toast('Dihapus');
}

async function saveTujuan() {
  data.tujuanNabung = await run('addTujuanNabung', {
    nama: document.getElementById('f-nama').value,
    targetNominal: document.getElementById('f-target').value,
    tanggalTarget: document.getElementById('f-tgl').value
  });
  closeModal();
  renderTujuan();
  toast('Tujuan ditambah');
}

async function saveProgress() {
  data = await run('tambahProgressNabung', {
    id: document.getElementById('f-id').value,
    nominalTambahan: document.getElementById('f-nominal').value,
    akun: document.getElementById('f-akun').value
  });
  closeModal();
  renderAll();
  toast('Berhasil disetor');
}

async function saveReimburse() {
  data = await run('addReimburseTransaksi', {
    nominal: document.getElementById('f-nominal').value,
    persentase: document.getElementById('f-persen').value,
    akun: document.getElementById('f-akun').value,
    kategori: document.getElementById('f-kategori').value,
    tanggal: document.getElementById('f-tanggal').value,
    catatan: document.getElementById('f-catatan').value
  });
  closeModal();
  renderAll();
  toast('Reimburse dicatat');
}

async function saveNama() {
  const name = document.getElementById('input-nama').value;
  data.userName = await run('setDisplayName', name);
  document.getElementById('user-name').textContent = data.userName;
  toast('Nama disimpan');
}

async function savePin() {
  const pin = document.getElementById('f-pin').value;
  if (pin.length !== 4) return toast('PIN harus 4 digit');
  await run('setPin', pin);
  closeModal();
  toast('PIN berhasil diset');
}

async function removePinUI() {
  if (!confirm('Hapus PIN?')) return;
  await run('removePin');
  toast('PIN dihapus');
}

async function doBackup() {
  const json = await run('exportBackupJson');
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kas-pribadi-backup-' + today() + '.json';
  a.click();
  toast('Backup diunduh');
}

async function doRestore(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!confirm('Restore akan menimpa semua data. Lanjutkan?')) return;
  const text = await file.text();
  data = await run('restoreBackupJson', text);
  renderAll();
  toast('Restore berhasil');
}

async function confirmReset() {
  if (!confirm('Yakin reset SEMUA data? Tidak bisa dibatalkan.')) return;
  data = await run('resetAllData');
  renderAll();
  toast('Data direset');
}

// Start
init();
</script>
</body>
</html>
