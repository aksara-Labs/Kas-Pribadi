<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B1F36">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Catatan Kas">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <title>Catatan Kas</title>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (e) {
          console.warn('SW register gagal', e);
        });
      });
    }
  </script>
  <style>
    :root{
      /* Brand */
      --blue:#1D4ED8;
      --blue-dark:#0B1F36;
      --blue-mid:#1E3A5F;
      --blue-pale:#EFF4FB;
      --green:#059669;
      --green-pale:#ECFDF5;
      --red:#E11D48;
      --red-pale:#FFF1F2;
      --amber:#D97706;
      --amber-pale:#FFFBEB;
      /* Ink */
      --ink:#0B1220;
      --ink-soft:#475569;
      --ink-faint:#94A3B8;
      /* Surface */
      --line:#E6ECF4;
      --bg:#F2F5F9;
      --card:#FFFFFF;
      --input-bg:#EEF2F7;
      --overlay:rgba(11,31,54,.48);
      /* Radius scale */
      --radius:20px;
      --radius-sm:12px;
      --radius-xs:8px;
      --radius-pill:999px;
      /* Shadow scale — subtle, not loud */
      --shadow:0 8px 24px -12px rgba(15,39,68,.14);
      --shadow-sm:0 1px 3px rgba(15,39,68,.06);
      --shadow-card:0 1px 2px rgba(15,39,68,.04), 0 6px 16px -10px rgba(15,39,68,.1);
      /* Spacing scale */
      --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px;
      /* Type scale */
      --fs-xs:11px; --fs-sm:12.5px; --fs-md:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:28px;
      --lh-tight:1.15; --lh-body:1.45;
      /* Form / sheet tokens */
      --form-radius: 14px;
      --chip-radius: 999px;
      --card-radius: 16px;
      --hero-radius: 18px;
    }
    html.dark{
      --blue-pale:#1E334F;
      --green-pale:#123D2C;
      --red-pale:#452828;
      --amber-pale:#453618;
      --ink:#F1F5F9;
      --ink-soft:#B8C4D4;
      --ink-faint:#8494A8;
      --line:#334155;
      --bg:#0B1220;
      --card:#152033;
      --input-bg:#1C2A40;
      --overlay:rgba(0,0,0,.65);
    }
    html.dark .item-card,
    html.dark .rekening-card,
    html.dark .rekap-card,
    html.dark .today-summary,
    html.dark .quick-actions,
    html.dark .urgency-chip,
    html.dark .custom-range-box,
    html.dark .settings-list{
      border-color:rgba(51,65,85,.9);
    }
    html.dark .filter-chip{
      border-color:var(--line); background:var(--card); color:var(--ink-soft);
    }
    html.dark .filter-chip.on{
      background:var(--blue); border-color:var(--blue); color:#fff;
    }
    html.dark .day-heading::after{ opacity:.5; }
    html.dark body{ background:var(--bg); }

    html.dark .trx-card,
    html.dark .hp-list-card,
    html.dark .rek-card,
    html.dark .rekap-toolbar,
    html.dark .settings-advanced,
    html.dark .hp-rincian,
    html.dark .hp-pay-zone{
      border-color: rgba(51,65,85,.95);
      background: var(--card);
      box-shadow: none;
    }
    html.dark .hp-list-chip.muted,
    html.dark .trx-d-chip,
    html.dark .rek-chip{
      background: var(--input-bg);
      color: var(--ink-faint);
    }
    html.dark .hp-list-chip.warn{ background:#3D2E0A; color:#FBBF24; }
    html.dark .hp-list-chip.danger{ background:#3F1A1A; color:#FCA5A5; }
    html.dark .hp-list-chip.ok{ background:#0F3D2E; color:#6EE7B7; }
    html.dark .hp-list-next{ border-color: rgba(51,65,85,.8); }
    html.dark .insight-strip{
      background: var(--card);
      border: 1px solid rgba(51,65,85,.9);
    }
    html.dark .insight-main{ color: var(--ink-soft); }
    html.dark .insight-sub{ color: var(--ink-faint); }
    html.dark .trx-detail-hero{ border-color: rgba(51,65,85,.9); }
    html.dark .filter-section{
      background: var(--card);
      border-color: rgba(51,65,85,.9);
    }
    html.dark .filter-chip.on{
      background: #1A365D;
      border-color: #3B82F6;
      color: #E2E8F0;
    }
    html.dark .filter-one-btn.on{
      background: rgba(59,130,246,.12);
      border-color: rgba(59,130,246,.4);
      color: #93C5FD;
    }
    html.dark .hp-tl-row{ border-color: rgba(51,65,85,.7); }
    html.dark .hp-tl-row.next .hp-tl-date{ color: #93C5FD; }

    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; min-width:0;}
    html,body{
      margin:0; padding:0; height:100%; width:100%;
      overflow:hidden; overflow-x:hidden; overscroll-behavior:none;
      touch-action:pan-y; -ms-touch-action:pan-y;
      font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg); color:var(--ink);
    }
    #app{
      position:fixed; top:0; left:50%; transform:translate3d(-50%,0,0);
      display:flex; flex-direction:column;
      width:100vw;
      background:
        radial-gradient(80% 40% at 50% -10%, rgba(59,130,246,.08) 0%, transparent 60%),
        var(--bg);
      overflow:hidden; overflow-x:hidden; touch-action:pan-y;
      backface-visibility:hidden;
    }
    #appInner{
      display:flex; flex-direction:column; width:100%; height:100%;
      transform-origin:top left;
    }
    button{font-family:inherit; border:none; background:none; cursor:pointer;}
    .num{ font-variant-numeric:tabular-nums; }

    /* ---------- TOP BAR ---------- */
    #topbar{
      flex:0 0 auto; color:#fff; padding:10px 16px 12px; position:relative; z-index:2;
      background: linear-gradient(145deg, #2B4C7E 0%, #1A365D 48%, #0B1F36 100%);
      background-color:#0B1F36;
    }
    .topbar-row{display:flex; align-items:center; justify-content:space-between; width:100%;}
    .topbar-row h1{font-size:17px; font-weight:700; margin:0; letter-spacing:.2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    .topbar-icon-btn{
      width:34px; height:34px; flex:0 0 34px; display:flex; align-items:center; justify-content:center;
      border-radius:50%; color:#fff; opacity:.95; background:rgba(255,255,255,.12);
    }
    .topbar-icon-btn:active{background:rgba(255,255,255,.22);}
    .topbar-spacer{width:36px; flex:0 0 36px;}
    .month-nav{display:flex; align-items:center; justify-content:center; gap:6px; flex:1 1 auto; min-width:0; overflow:hidden;}
    .month-nav .month-label{font-size:17px; font-weight:700; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

    /* ---------- SUMMARY CARD (overlaps top bar) ---------- */
    #summary{
      margin:10px 14px 0; background:var(--card); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:12px 8px;
      display:grid; grid-template-columns:1fr 1fr 1fr; position:relative; z-index:3;
      flex:0 0 auto; border:1px solid rgba(226,232,240,.8);
    }
    #summary.cols-4{grid-template-columns:1fr 1fr; row-gap:10px;}
    #summary.hero-mode{
      display:block; background:transparent; box-shadow:none; padding:0; margin:2px 0 0;
    }
    #summary .stat{text-align:center; padding:2px 3px; position:relative; min-width:0;}
    #summary .stat:not(:last-child)::after{
      content:""; position:absolute; right:0; top:8%; bottom:8%; width:1px; background:var(--line);
    }
    #summary.cols-4 .stat::after{display:none;}
    #summary.cols-4 .stat:nth-child(1)::after,
    #summary.cols-4 .stat:nth-child(3)::after{
      display:block; content:""; position:absolute; right:0; top:8%; bottom:8%; width:1px; background:var(--line);
    }
    #summary.cols-4 .stat:nth-child(3),
    #summary.cols-4 .stat:nth-child(4){
      border-top:1px solid var(--line); padding-top:10px;
    }
    #summary .stat .lbl{font-size:11px; color:var(--ink-faint); font-weight:600; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    #summary .stat .val{font-size:13px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-0.2px;}
    #summary .stat .val.green{color:var(--green);}
    #summary .stat .val.red{color:var(--red);}
    #summary .stat .val.blue{color:var(--blue-dark);}

    /* ---------- GREETING + DATE ROW ---------- */
    .greeting-row{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:0 0 2px; color:#fff;
    }

    .wx-pill{
      display:inline-flex; align-items:center; gap:4px;
      background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.12);
      border-radius:999px; padding:3px 9px; font-size:11px; font-weight:700;
      color:#fff; white-space:nowrap; margin-left:6px; vertical-align:middle;
      max-width:42vw; overflow:hidden; text-overflow:ellipsis;
    }
    .wx-pill .wx-ic{ font-size:12px; line-height:1; }
    .wx-pill .wx-t{ opacity:.95; }
    .wx-pill.loading{ opacity:.65; }
    .hello-row{ display:flex; align-items:center; flex-wrap:wrap; gap:2px 0; }

    .greeting-row .hello{font-size:12px; opacity:.8; font-weight:600; letter-spacing:.15px;}
    .greeting-row .name{font-size:17px; font-weight:800; margin-top:1px; letter-spacing:-.25px; line-height:1.15;}
    .name-edit-btn{text-align:left; color:#fff;}
    .name-edit-btn:active{opacity:.8;}
    .date-pill{
      display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.14); color:#fff;
      border-radius:12px; padding:8px 11px; font-size:11.5px; font-weight:700; white-space:nowrap; flex:0 0 auto;
      border:1px solid rgba(255,255,255,.12);
    }
    .date-pill:active{background:rgba(255,255,255,.26);}
    .date-pill svg{flex:0 0 auto;}

    /* ---------- BALANCE HERO CARD ---------- */
    .balance-hero{
      margin:0 14px; padding:14px 16px 12px; border-radius:20px; color:#fff;
      background:
        radial-gradient(90% 120% at 100% 0%, rgba(255,255,255,.2), transparent 55%),
        radial-gradient(60% 80% at 0% 100%, rgba(59,130,246,.25), transparent 50%),
        linear-gradient(155deg, #2A4A7A 0%, var(--blue) 42%, var(--blue-dark) 100%);
      box-shadow:0 12px 28px -12px rgba(15,39,68,.45); position:relative; z-index:3; overflow:hidden;
    }
    .balance-hero .top-lbl{
      display:flex; align-items:center; gap:8px; font-size:11px; font-weight:700; letter-spacing:.6px;
      opacity:.8; text-transform:uppercase;
    }
    .balance-hero .top-lbl button{color:#fff; opacity:.9; display:flex; align-items:center;}
    .balance-hero .amount{font-size:26px; font-weight:800; margin:4px 0 10px; letter-spacing:-.5px; line-height:1.1;}
    .balance-hero .pill-row{display:flex; gap:10px;}
    .balance-hero .pill{
      flex:1; display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.12);
      border-radius:14px; padding:10px 12px; min-width:0; border:1px solid rgba(255,255,255,.1);
    }
    .balance-hero .pill .ic{
      width:28px; height:28px; border-radius:10px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    }
    .balance-hero .pill.in .ic{background:rgba(16,185,129,.95);}
    .balance-hero .pill.out .ic{background:rgba(239,68,68,.95);}
    .balance-hero .pill .txt{min-width:0;}
    .balance-hero .pill .txt .l{font-size:10px; opacity:.8; font-weight:600;}
    .balance-hero .pill .txt .v{font-size:13px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.2px;}
    .insight-strip{
      margin:10px 0 0;
      padding:10px 14px;
      border-radius:14px;
      background:var(--card);
      border:1px solid var(--line);
      box-shadow:var(--shadow-sm);
      font-size:12.5px;
      font-weight:600;
      color:var(--ink-soft);
      line-height:1.4;
    }
    .balance-hero .cashflow-row{
      display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding-top:12px;
      border-top:1px solid rgba(255,255,255,.14);
    }
    .balance-hero .cashflow-row .l{font-size:11px; opacity:.75; font-weight:600;}
    .balance-hero .cashflow-row .v{font-size:17px; font-weight:800; margin-top:2px; letter-spacing:-.3px;}
    .cashflow-tag{
      background:rgba(255,255,255,.16); border-radius:20px; padding:5px 12px; font-size:10.5px; font-weight:700;
      border:1px solid rgba(255,255,255,.12);
    }

    /* ---------- QUICK ACTIONS ---------- */
    .quick-actions{
      margin:10px 14px 6px; background:var(--card); border-radius:18px;
      box-shadow:var(--shadow-sm); padding:12px 8px 10px; border:1px solid rgba(226,232,240,.55);
      display:grid; grid-template-columns:repeat(4,1fr); gap:4px;
    }
    .quick-actions button{
      display:flex; flex-direction:column; align-items:center; gap:8px; padding:4px 2px;
    }
    .quick-actions .qa-ic{
      width:48px; height:48px; border-radius:16px; display:flex; align-items:center; justify-content:center; color:#fff;
      box-shadow:0 6px 14px -4px rgba(0,0,0,.2);
    }
    .quick-actions .qa-ic.in{background:linear-gradient(145deg,#34D399,#059669);}
    .quick-actions .qa-ic.out{background:linear-gradient(145deg,#F87171,#DC2626);}
    .quick-actions .qa-ic.transfer{background:linear-gradient(145deg,#60A5FA,#1E3A5F);}
    .quick-actions .qa-ic.more{background:var(--input-bg); color:var(--ink-soft); box-shadow:none; border:1px solid var(--line);}
    .quick-actions .qa-lbl{font-size:12px; font-weight:700; color:var(--ink); letter-spacing:-.1px;}
    .quick-actions .qa-sub{display:none;} /* bersih: label utama saja */

    /* ---------- SECTION HEADER ---------- */
    .section-header{
      display:flex; align-items:center; justify-content:space-between; margin:8px 2px 12px;
    }
    .section-header .t{font-size:16px; font-weight:800; color:var(--ink); letter-spacing:-.3px;}
    .section-header .more{
      display:flex; align-items:center; gap:2px; color:var(--blue); font-size:12.5px; font-weight:700;
    }

    .day-heading{gap:6px; align-items:center;}
    .day-heading .cal-ic{color:var(--ink-faint); display:flex; flex:0 0 auto;}

    /* ---------- NOTIF BADGE (topbar bell) ---------- */
    .topbar-icon-btn{position:relative;}
    .topbar-notif-badge{
      position:absolute; top:2px; right:2px; min-width:16px; height:16px; padding:0 4px; border-radius:8px;
      background:var(--red); color:#fff; font-size:9.5px; font-weight:800; display:flex; align-items:center;
      justify-content:center; line-height:1; border:1.5px solid var(--blue);
    }

    /* ---------- CONTENT ---------- */
    #content{
      flex:1 1 auto; overflow-y:auto; overflow-x:hidden;
      -webkit-overflow-scrolling:touch; padding:12px 16px 120px;
      contain:layout style;
      overscroll-behavior-y:contain;
    }
    .view{display:none; opacity:0;}
    .view.active{
      display:block; contain:layout style;
      animation:viewIn .22s ease-out both;
    }
    @keyframes viewIn{
      from{ opacity:0; transform:translate3d(0,8px,0); }
      to{ opacity:1; transform:translate3d(0,0,0); }
    }

    .day-group{margin-bottom:14px; content-visibility:auto; contain-intrinsic-size:auto 120px;}
    .day-heading{
      font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase;
      letter-spacing:.55px; margin:8px 4px 10px; display:flex; align-items:center; gap:10px;
    }
    .day-heading::after{
      content:""; flex:1; height:1px; background:var(--line); opacity:.85;
    }
    .item-card{
      background:var(--card); border-radius:18px; padding:14px 14px;
      display:flex; align-items:center; gap:14px; margin-bottom:10px;
      border:1px solid rgba(226,232,240,.55);
      box-shadow:var(--shadow-sm);
      transition:background-color .12s ease, box-shadow .12s ease;
      -webkit-tap-highlight-color:transparent;
      contain:layout style;
    }
    .item-card:active{background:#F8FAFC; box-shadow:none;}
    html.dark .item-card:active{background:#1A2740;}
    .icon-badge img{ width:22px; height:22px; object-fit:contain; }
    .icon-badge{
      width:46px; height:46px; border-radius:15px; flex:0 0 auto;
      display:flex; align-items:center; justify-content:center;
    }
    .icon-badge.green{background:linear-gradient(145deg,#ECFDF5,var(--green-pale)); color:var(--green);}
    .icon-badge.red{background:linear-gradient(145deg,#FEF2F2,var(--red-pale)); color:var(--red);}
    .icon-badge.amber{background:linear-gradient(145deg,#FFFBEB,var(--amber-pale)); color:var(--amber);}
    .icon-badge.blue{background:linear-gradient(145deg,#EFF6FF,var(--blue-pale)); color:var(--blue-dark);}
    .item-main{flex:1 1 auto; min-width:0;}
    .item-title{font-size:14px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.1px;}
    .item-sub{font-size:11.5px; color:var(--ink-faint); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .item-amount{font-size:14px; font-weight:800; flex:0 0 auto; text-align:right; letter-spacing:-.2px;}
    .item-amount.green{color:var(--green);}
    .item-amount.red{color:var(--red);}
    .item-amount.blue{color:var(--blue-dark);}
    .item-amount.lunas-amount{opacity:.55;}
    .section-header{display:flex; align-items:center; justify-content:space-between; margin:2px 2px 12px;}
    .section-header .t{font-size:15px; font-weight:800; letter-spacing:-.2px;}
    .section-header .more{font-size:12px; font-weight:700; color:var(--blue);}

    .empty-state{
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:48px 24px; color:var(--ink-faint); text-align:center;
    }
    .empty-state .empty-icon{
      width:64px; height:64px; border-radius:20px; margin-bottom:16px;
      display:flex; align-items:center; justify-content:center;
      background:var(--blue-pale); color:var(--blue);
    }
    .empty-state .empty-icon svg{opacity:1; margin:0;}
    .empty-state svg{margin-bottom:14px; opacity:.55;}
    .empty-state .t1{font-size:15px; font-weight:800; color:var(--ink); letter-spacing:-.2px;}
    .empty-state .t2{font-size:13px; margin-top:6px; line-height:1.45; max-width:260px; color:var(--ink-faint); font-weight:500;}

    /* segmented control (hutang piutang filter) */
    .segmented{
      display:flex; background:var(--input-bg); border-radius:14px; padding:4px; margin-bottom:12px;
      border:1px solid var(--line); box-shadow:inset 0 1px 2px rgba(15,39,68,.04);
    }
    .segmented button{
      flex:1; padding:9px 0; font-size:12.5px; font-weight:700; border-radius:11px; color:var(--ink-faint);
      transition:background-color .12s ease, color .12s ease, transform .12s ease;
    }
    .segmented button:active{ transform:scale(.98); }
    .segmented button.active{background:var(--blue); color:#fff; box-shadow:0 4px 12px -4px rgba(30,58,95,.4);}

    .status-pill{
      font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; margin-left:8px; white-space:nowrap;
    }
    .status-pill.belum{background:var(--amber-pale); color:var(--amber);}
    .status-pill.lunas{background:var(--green-pale); color:var(--green); }

    .metode-tag{
      font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px; margin-left:6px;
      background:var(--blue-pale); color:var(--blue-dark); white-space:nowrap;
    }

    /* urgency chips */
    .urgency-row{display:flex; gap:10px; margin-bottom:14px;}
    .urgency-chip{
      flex:1; display:flex; align-items:center; gap:10px; background:var(--card); border-radius:16px;
      padding:12px 14px; box-shadow:var(--shadow-sm); border:1.5px solid rgba(226,232,240,.55);
      text-align:left; transition:transform .12s ease, border-color .12s ease, background-color .12s ease;
    }
    .urgency-chip:active{ transform:scale(.98); }
    .urgency-chip .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
    .urgency-chip.overdue .dot{background:var(--red);}
    .urgency-chip.upcoming .dot{background:var(--amber);}
    .urgency-chip .n{font-size:16px; font-weight:800; line-height:1;}
    .urgency-chip .t{font-size:10.5px; color:var(--ink-faint); font-weight:600; margin-top:2px;}
    .urgency-chip.active.overdue{border-color:var(--red); background:var(--red-pale);}
    .urgency-chip.active.upcoming{border-color:var(--amber); background:var(--amber-pale);}

    /* metode selector grid (form) */
    .metode-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
    .metode-btn{
      border:1.5px solid var(--line); border-radius:10px; padding:10px 6px; font-size:12.5px;
      font-weight:700; color:var(--ink-soft); background:var(--input-bg); text-align:center; line-height:1.3;
    }
    .metode-btn small{display:block; font-weight:500; color:var(--ink-faint); font-size:10.5px; margin-top:2px;}
    .metode-btn.active{background:var(--blue-pale); border-color:var(--blue); color:var(--blue-dark);}
    .metode-btn.active small{color:var(--blue-dark); opacity:.75;}

    .bunga-toggle{display:flex; gap:8px; margin-bottom:8px;}
    .bunga-toggle button{
      padding:6px 12px; border-radius:8px; border:1.5px solid var(--line); font-size:12px; font-weight:700;
      color:var(--ink-faint); background:var(--input-bg);
    }
    .bunga-toggle button.active{background:var(--blue); border-color:var(--blue); color:#fff;}

    .preview-box{
      background:var(--blue-pale); border-radius:12px; padding:12px 14px; margin:4px 0 14px;
    }
    .preview-box .pr{display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; color:var(--blue-dark);}
    .preview-box .pr b{font-weight:800;}
    .preview-box .pr.big{font-size:14.5px; padding-top:6px; margin-top:4px; border-top:1px dashed rgba(47,99,176,.25);}

    .progress-wrap{margin:6px 0 14px;}
    .progress-track{height:8px; background:var(--line); border-radius:6px; overflow:hidden;}
    .progress-fill{height:100%; background:var(--blue); border-radius:6px;}
    .progress-label{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-faint); margin-top:6px; font-weight:600;}

    .riwayat-title{font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:16px 0 8px;}
    .riwayat-empty{font-size:12.5px; color:var(--ink-faint); padding:6px 0 2px;}

    /* rekap */
    .rekap-card{
      background:var(--card); border-radius:18px; padding:16px 16px; margin-bottom:12px;
      box-shadow:var(--shadow-sm); border:1px solid rgba(226,232,240,.55);
    }
    .rekap-card:active{background:#F8FAFC;}
    .rekap-date{font-size:18px; font-weight:800; color:var(--ink); margin-bottom:12px; text-align:center; letter-spacing:-.3px;}
    .rekap-row{display:flex; justify-content:space-between; padding:10px 0; font-size:14px; border-bottom:1px solid rgba(226,232,240,.55);}
    .rekap-row:last-child{border-bottom:none;}
    .rekap-row .k{color:var(--ink-soft); font-weight:600;}
    .rekap-row .v{font-weight:800; color:var(--ink); letter-spacing:-.2px;}
    .rekap-row .v.green{color:var(--green);}
    .custom-range-box{background:var(--card); border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow-sm); border:1px solid rgba(226,232,240,.55);}

    .kategori-row{padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer;}
    .kategori-row:last-child{border-bottom:none;}
    .kategori-row-top{display:flex; justify-content:space-between; font-size:15.5px; margin-bottom:6px;}
    .kategori-row-top .chev{color:var(--ink-faint); font-weight:400; margin-left:2px;}
    .kategori-bar-track{height:6px; background:var(--line); border-radius:4px; overflow:hidden;}
    .kategori-bar-fill{height:100%; border-radius:4px;}

    .export-icon-btn{
      display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 10px;
      border-radius:10px; background:var(--blue-pale); color:var(--blue-dark); font-size:9.5px; font-weight:700;
    }
    .export-icon-btn:active{background:var(--blue); color:#fff;}

    /* rekening cards */
    .total-saldo-card{
      background:
        radial-gradient(90% 120% at 100% 0%, rgba(255,255,255,.2), transparent 55%),
        radial-gradient(60% 80% at 0% 100%, rgba(59,130,246,.25), transparent 50%),
        linear-gradient(155deg, #2A4A7A 0%, var(--blue) 42%, var(--blue-dark) 100%);
      color:#fff; border-radius:22px;
      padding:20px 20px 18px; margin-bottom:16px;
      box-shadow:0 12px 28px -12px rgba(15,39,68,.45);
    }
    .total-saldo-card .lbl{font-size:11px; opacity:.8; font-weight:700; letter-spacing:.55px; text-transform:uppercase;}
    .total-saldo-card .val{font-size:28px; font-weight:800; margin-top:8px; letter-spacing:-.5px; line-height:1.1;}
    .total-saldo-card .sub{font-size:12px; opacity:.75; margin-top:8px; font-weight:600;}
    .rekening-card{
      background:var(--card); border-radius:18px; padding:14px 14px; margin-bottom:10px;
      display:flex; align-items:center; gap:14px; box-shadow:var(--shadow-sm);
      border:1px solid rgba(226,232,240,.55);
    }
    .rekening-dot{width:10px; height:36px; border-radius:8px; flex:0 0 auto;}
    .bank-logo{
      width:42px; height:42px; border-radius:12px; flex:0 0 auto;
      display:flex; align-items:center; justify-content:center;
      font-size:11px; font-weight:800; color:#fff; letter-spacing:-0.3px;
      box-shadow:0 2px 6px rgba(0,0,0,.12); overflow:hidden; text-align:center; line-height:1.1;
      padding:2px; background:#fff;
    }
    .bank-logo img{width:100%; height:100%; object-fit:contain; display:block; content-visibility:auto;}
    .bank-logo.sm{width:28px; height:28px; border-radius:8px; font-size:9px;}
    .rekening-info{flex:1; min-width:0;}
    .rekening-info .nm{font-size:14px; font-weight:700; letter-spacing:-.1px;}
    .rekening-info .sd{font-size:17px; font-weight:800; margin-top:3px; color:var(--blue-dark); letter-spacing:-.3px;}
    .rekening-more{color:var(--ink-faint); padding:6px;}

    /* ---------- FAB ---------- */
    #fab{ display:none !important; }

    /* ---------- BOTTOM NAV ---------- */
    #bottomnav{
      flex:0 0 auto; display:flex; align-items:stretch; gap:2px;
      background:var(--card); border-top:1px solid var(--line);
      padding:6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); z-index:14;
      box-shadow:0 -1px 0 var(--line);
      
    }
    html.dark #bottomnav{ box-shadow:none; }
    #bottomnav button{
      flex:1 1 0; min-width:0; max-width:100%;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:2px; padding:6px 2px 5px; margin:0;
      color:var(--ink-faint); font-size:10px; font-weight:600; line-height:1.15;
      border-radius:12px; letter-spacing:-0.1px;
      transition:color .12s ease, background-color .12s ease;
      -webkit-tap-highlight-color:transparent;
    }
    #bottomnav button:active{ background:var(--input-bg); }
    #bottomnav button.active{
      color:var(--blue); background:var(--blue-pale); font-weight:700;
    }
    html.dark #bottomnav button.active{ background:rgba(59,130,246,.15); color:#93C5FD; }
    #bottomnav button svg{
      width:20px; height:20px; flex-shrink:0;
      stroke-width:2; opacity:.85;
    }
    #bottomnav button.active svg{ opacity:1; }
    #bottomnav button .nav-label{
      max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      padding:0 1px;
    }
    .nav-icon-wrap{ position:relative; display:inline-flex; align-items:center; justify-content:center; }

    #bottomnav button.nav-add{
      flex:0 0 auto; width:58px; padding:0; margin:0 4px;
      background:transparent; color:inherit; position:relative; z-index:2;
    }
    #bottomnav button.nav-add:active{ background:transparent; }
    #bottomnav button.nav-add:active .nav-add-ic{ transform:scale(.92); }
    #bottomnav button.nav-add .nav-add-ic{
      width:52px; height:52px; border-radius:18px;
      display:flex; align-items:center; justify-content:center;
      background:linear-gradient(160deg,#4F8CFF 0%,#2563EB 45%,#1E3A5F 100%);
      box-shadow:0 8px 20px rgba(37,99,235,.42), 0 0 0 4px var(--card);
      margin-top:-22px;
      transition:transform .14s ease, box-shadow .14s ease;
    }
    html.dark #bottomnav button.nav-add .nav-add-ic{
      background:linear-gradient(160deg,#60A5FA 0%,#3B82F6 50%,#1E3A5F 100%);
      box-shadow:0 8px 20px rgba(59,130,246,.4), 0 0 0 4px var(--card);
    }
    .add-action-list{ display:flex; flex-direction:column; gap:8px; margin-top:4px; }
    .add-action-btn{
      display:flex; align-items:center; gap:12px; width:100%;
      padding:14px 14px; border-radius:16px; border:1px solid var(--line);
      background:var(--card); text-align:left; font-family:inherit;
      transition:transform .12s ease, background-color .12s ease;
    }
    .add-action-btn:active{ transform:scale(.98); background:var(--input-bg); }
    .add-action-btn .aa-ic{
      width:40px; height:40px; border-radius:12px; flex:0 0 auto;
      display:flex; align-items:center; justify-content:center; color:#fff;
    }
    .add-action-btn .aa-ic.in{ background:linear-gradient(145deg,#34D399,#059669); }
    .add-action-btn .aa-ic.out{ background:linear-gradient(145deg,#F87171,#DC2626); }
    .add-action-btn .aa-ic.tf{ background:linear-gradient(145deg,#60A5FA,#1E3A5F); }
    .add-action-btn .aa-t{ font-size:14px; font-weight:800; color:var(--ink); }
    .add-action-btn .aa-s{ font-size:12px; color:var(--ink-faint); font-weight:500; margin-top:2px; }

    .nav-badge{
      position:absolute; top:-5px; right:-9px; min-width:15px; height:15px; padding:0 4px;
      border-radius:8px; background:var(--red); color:#fff; font-size:9px; font-weight:800;
      display:flex; align-items:center; justify-content:center; line-height:1;
      box-shadow:0 0 0 2px var(--card);
    }

    /* ---------- SHEET / MODAL ---------- */
    #sheet-overlay{
      position:fixed; inset:0; background:var(--overlay); z-index:20; opacity:0; pointer-events:none;
      transition:opacity .18s ease-out;
      backface-visibility:hidden;
    }
    #sheet-overlay.show{opacity:1; pointer-events:auto; }
    #sheet{
      position:fixed; left:50%; bottom:0; width:100vw;
      transform:translate3d(-50%,100%,0);
      z-index:21; transition:transform .22s cubic-bezier(.32,.72,0,1);
      overflow-x:hidden;
      backface-visibility:hidden;
    }
    #sheet.show{transform:translate3d(-50%,0,0);}
    #sheetInner{
      background:var(--card); border-radius:24px 24px 0 0; display:flex; flex-direction:column;
      box-shadow:0 -8px 32px -8px rgba(15,39,68,.15);
      overflow-x:hidden; overflow-y:auto; -webkit-overflow-scrolling:touch;
      transform-origin:top left; width:100%;
    }
    #sheet-handle{width:40px; height:4px; background:var(--ink-faint); opacity:.45; border-radius:4px; margin:10px auto 4px; flex:0 0 auto;}
    #sheet-close-btn{
      position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
      display:flex; align-items:center; justify-content:center; color:var(--ink-faint); background:var(--input-bg); z-index:2;
    }
    #sheet-close-btn:active{background:var(--line);}
    #sheet-content{padding:4px 20px 28px; overflow-y:auto; overflow-x:hidden;}
    .sheet-title{font-size:19px; font-weight:800; margin:4px 36px 16px 0; letter-spacing:-.3px; color:var(--ink);}

    .riwayat-row{display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:8px 0; border-bottom:1px solid var(--line); gap:10px;}
    .riwayat-row:last-child{border-bottom:none;}
    .riwayat-row .d{color:var(--ink-faint); flex:1; min-width:0;}
    .riwayat-del-btn{color:var(--ink-faint); flex:0 0 auto; padding:4px;}
    .riwayat-del-btn:active{color:var(--red);}


    .liburan-banner{
      margin:8px 14px 0; padding:12px 14px; border-radius:16px;
      background:linear-gradient(145deg,#243B6B,var(--blue-dark)); color:#fff;
      box-shadow:var(--shadow-sm);
    }
    .liburan-banner .lb-k{font-size:10px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; opacity:.8;}
    .liburan-banner .lb-n{font-size:15px; font-weight:800; margin:2px 0 8px;}
    .liburan-banner .lb-row{display:flex; justify-content:space-between; font-size:12px; font-weight:700;}
    .liburan-track{height:6px; background:rgba(255,255,255,.2); border-radius:6px; overflow:hidden; margin-top:8px;}
    .liburan-fill{height:100%; background:#34D399; border-radius:6px;}
    .kantong-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px;}
    .kantong-row:last-child{border-bottom:none;}

    .form-section{
      border:1px solid var(--line); border-radius:16px; margin-bottom:14px; overflow:hidden;
      background:var(--input-bg);
    }
    .form-section > summary{
      list-style:none; cursor:pointer; padding:12px 14px; font-size:13.5px; font-weight:800;
      color:var(--ink); display:flex; align-items:center; justify-content:space-between;
    }
    .form-section > summary::-webkit-details-marker{display:none;}
    .form-section > summary::after{content:"›"; font-size:18px; color:var(--ink-faint); transform:rotate(90deg); transition:transform .15s ease;}
    .form-section[open] > summary::after{transform:rotate(-90deg);}
    .form-section .form-section-body{padding:0 14px 14px; background:var(--card);}
    .form-group{margin-bottom:14px;}
    .form-label{font-size:12px; font-weight:700; color:var(--ink-faint); margin-bottom:6px; display:block; letter-spacing:.15px;}
    .form-input, .form-select, .form-textarea{
      width:100%; border:1.5px solid var(--line); border-radius:14px; padding:12px 14px;
      font-size:15px; color:var(--ink); background:var(--input-bg); font-family:inherit;
      transition:border-color .15s ease, background-color .15s ease, box-shadow .15s ease;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus{
      outline:none; border-color:var(--blue); background:var(--card);
      box-shadow:0 0 0 3px rgba(30,58,95,.12);
    }
    .toggle-pair{display:flex; gap:8px;}
    .toggle-pair button{
      flex:1; padding:12px 0; border-radius:14px; border:1.5px solid var(--line); font-weight:700; font-size:13.5px;
      color:var(--ink-faint); background:var(--input-bg);
      transition:background-color .12s ease, border-color .12s ease, color .12s ease, transform .12s ease;
    }
    .toggle-pair button:active{ transform:scale(.98); }
    .toggle-pair button.active{background:var(--blue-pale); border-color:var(--blue); color:var(--blue-dark);}
    .toggle-pair button.active.income{background:var(--green-pale); border-color:var(--green); color:var(--green);}
    .toggle-pair button.active.expense{background:var(--red-pale); border-color:var(--red); color:var(--red);}
    .toggle-pair button.active.hutang{background:var(--amber-pale); border-color:var(--amber); color:var(--amber);}
    .toggle-pair button.active.piutang{background:var(--green-pale); border-color:var(--green); color:var(--green);}

    .btn-primary{
      width:100%; padding:14px 0; border-radius:14px;
      background:linear-gradient(145deg, var(--blue-mid), var(--blue-dark)); color:#fff;
      font-weight:700; font-size:15px; margin-top:8px; letter-spacing:-.2px;
      box-shadow:0 8px 20px -8px rgba(30,58,95,.45);
    }
    .btn-primary:active{opacity:.9;}
    .btn-danger-text{width:100%; text-align:center; padding:12px 0; color:var(--red); font-weight:700; font-size:13px;}
    .btn-secondary{
      width:100%; padding:12px 0; border-radius:12px; background:var(--input-bg); color:var(--ink-soft);
      font-weight:700; font-size:13px; margin-top:8px; border:1px solid var(--line);
    }
    .settings-stack{display:flex; flex-direction:column; gap:14px; padding-bottom:8px;}
    .settings-section-label{
      font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
      color:var(--ink-faint); padding:2px 6px 0; margin:0;
    }
    .settings-list{
      display:flex; flex-direction:column; gap:0; background:var(--card);
      border-radius:16px; overflow:hidden; border:1px solid var(--line);
      box-shadow:var(--shadow-sm);
    }
    .settings-row{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      width:100%; min-height:52px; padding:13px 16px; background:transparent;
      border:none; border-bottom:1px solid var(--line);
      text-align:left; font-family:inherit; color:var(--ink); cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      transition:background .12s ease;
    }
    .settings-row:last-child{border-bottom:none;}
    .settings-row:active{background:var(--input-bg);}
    .settings-row .sr-label{font-size:14.5px; font-weight:650; letter-spacing:-.01em; line-height:1.25;}
    .settings-row .sr-hint{display:block; font-size:11.5px; font-weight:500; color:var(--ink-faint); margin-top:2px; line-height:1.3;}
    .settings-row .sr-value{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-faint); font-weight:600; flex:0 0 auto; max-width:48%;}
    .settings-row .sr-chev{font-size:18px; color:var(--ink-faint); font-weight:400; opacity:.7; line-height:1;}
    .settings-row.danger .sr-label{color:var(--red);}
    .settings-row.active-row{background:var(--blue-pale);}
    .settings-row.active-row .sr-label{color:var(--blue-dark);}
    .sr-badge{
      display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px;
      font-size:11px; font-weight:700; background:var(--input-bg); color:var(--ink-soft);
      white-space:nowrap;
    }
    .sr-badge.on{ background:var(--green-pale); color:var(--green); }
    .sr-badge.off{ background:var(--input-bg); color:var(--ink-faint); }
    .sr-badge.warn{ background:var(--amber-pale); color:var(--amber); }
    .settings-foot{
      text-align:center; font-size:11.5px; font-weight:600; color:var(--ink-faint);
      padding:8px 12px 4px; line-height:1.4;
    }
    .row-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
    .detail-row{display:flex; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); font-size:14px;}
    .detail-row:last-child{border-bottom:none;}
    .detail-row .k{color:var(--ink-faint); flex:0 0 auto;}
    .detail-row .v{font-weight:700; text-align:right; word-break:break-word; overflow-wrap:anywhere; min-width:0;}



    .filter-one-btn{
      width:100%; display:flex; align-items:center; gap:10px;
      padding:12px 14px; border-radius:16px; border:1px solid rgba(226,232,240,.7);
      background:var(--card); color:var(--ink); box-shadow:var(--shadow-sm);
      font-family:inherit; text-align:left; font-size:13.5px; font-weight:700;
      transition:transform .12s ease, background-color .12s ease;
    }
    .filter-one-btn:active{ transform:scale(.985); }
    .filter-one-btn.on{
      border-color:rgba(30,58,95,.35); background:var(--blue-pale); color:var(--blue-dark);
    }
    .filter-one-btn .fob-ic{
      width:28px; height:28px; border-radius:10px; flex:0 0 auto;
      display:flex; align-items:center; justify-content:center;
      background:var(--input-bg); color:var(--ink-soft);
    }
    .filter-one-btn.on .fob-ic{ background:var(--blue); color:#fff; }
    .filter-one-btn .fob-txt{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .filter-one-btn .fob-badge{
      width:8px; height:8px; border-radius:50%; background:var(--blue); flex:0 0 auto;
    }
    .filter-one-btn .fob-chev{ color:var(--ink-faint); font-size:18px; font-weight:400; flex:0 0 auto; }
    html.dark .filter-one-btn{ border-color:var(--line); }
    html.dark .filter-one-btn.on{ background:rgba(59,130,246,.15); color:#93C5FD; border-color:rgba(59,130,246,.35); }

    /* Filter pills */
    .filter-scroll{
      display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch;
      padding:2px 0 8px; margin:0 0 2px; scrollbar-width:none;
    }
    .filter-scroll + .filter-scroll{ margin-top:2px; }
    .filter-scroll::-webkit-scrollbar{display:none;}
    .filter-chip{
      flex:0 0 auto; padding:8px 14px; border-radius:999px; font-size:12px; font-weight:700;
      border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
      white-space:nowrap; box-shadow:0 1px 2px rgba(15,39,68,.04);
    }
    .filter-chip.on{
      background:var(--blue); border-color:var(--blue); color:#fff;
      box-shadow:0 4px 12px -4px rgba(30,58,95,.4);
    }
    .filter-chip.ghost{ background:var(--input-bg); }
    .today-summary{
      display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;
      margin:0 0 16px; padding:14px 10px; border-radius:18px;
      background:var(--card); border:1px solid rgba(226,232,240,.55);
      box-shadow:var(--shadow-sm);
    }
    .today-summary .ts-item{text-align:center; min-width:0; padding:0 4px;}
    .today-summary .ts-item:not(:last-child){border-right:1px solid var(--line);}
    .today-summary .ts-l{font-size:9.5px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.35px;}
    .today-summary .ts-v{font-size:13.5px; font-weight:800; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.2px;}
    .today-summary .ts-v.in{color:var(--green);}
    .today-summary .ts-v.out{color:var(--red);}
    /* Skeleton: opacity pulse only (GPU-cheap, no gradient paint) */
    .skel-wrap{width:100%; max-width:300px; padding:0 20px; contain:layout style;}
    .skel-line{
      height:12px; border-radius:8px; margin-bottom:10px;

      .quick-actions .qa-ic,

      .btn-secondary,

    #toast{

    @media (prefers-reduced-motion: reduce){

    /* ========== PRO UI POLISH ========== */
    body{ -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; letter-spacing:-0.01em; }

    /* Balance hero — premium card */

    .item-card, .rekening-card, .rekap-card, .settings-list, .insight-strip{
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
      background: var(--card);
    }
    .item-card{
      padding: 12px 12px; margin-bottom: 8px; gap: 12px;
      transition: transform .12s ease, background .12s ease;
    }
    .item-card:active{ transform: scale(.985); background: var(--input-bg); box-shadow: none; }
    .item-title{ font-size: var(--fs-md); font-weight: 700; letter-spacing: -.02em; }
    .item-sub{ font-size: var(--fs-xs); color: var(--ink-faint); margin-top: 2px; line-height: var(--lh-body); }
    .item-amount{ font-size: var(--fs-md); font-weight: 800; letter-spacing: -.03em; }

    .icon-badge{
      width: 40px; height: 40px; border-radius: var(--radius-xs);
      box-shadow: none;
    }

    /* Forms */
    .form-label{
      font-size: var(--fs-xs); font-weight: 700; color: var(--ink-soft);
      letter-spacing: .02em; margin-bottom: 6px;
    }
    .form-input, .form-select{
      border-radius: var(--radius-sm);
      border: 1.5px solid transparent;
      background: var(--input-bg);
      padding: 12px 14px;
      font-size: var(--fs-md); font-weight: 600;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .form-input:focus, .form-select:focus{
      outline: none;
      border-color: rgba(29,78,216,.4);
      box-shadow: 0 0 0 3px rgba(29,78,216,.1);
      background: var(--card);
    }

    /* Buttons */
    .btn-primary{
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: var(--fs-md); font-weight: 800; letter-spacing: -.01em;
      background: var(--blue-mid);
      box-shadow: 0 6px 16px -8px rgba(11,31,54,.45);
      border: none;
    }
    .btn-primary:active{ transform: scale(.98); opacity: .95; }
    .btn-secondary{
      border-radius: var(--radius-sm);
      padding: 13px 16px;
      font-weight: 700; font-size: var(--fs-md);
      background: var(--input-bg);
      color: var(--ink-soft);
      border: 1px solid var(--line);
    }
    .btn-secondary:active{ transform: scale(.98); }

    /* Sheet */
    #sheet{ border-radius: 20px 20px 0 0; }
    .sheet-title{
      font-size: var(--fs-lg); font-weight: 800; letter-spacing: -.03em;
      margin: 4px 0 14px;

    #sheet-handle{
      width: 36px; height: 4px; border-radius: 4px;
      background: var(--line); margin: 10px auto 8px;

    .filter-chip{
      border-radius: var(--radius-pill);
      padding: 7px 12px;
      font-size: var(--fs-sm); font-weight: 700;
      border: 1px solid var(--line);
      background: var(--card);
      box-shadow: none;

      background: var(--blue-mid);

    /* Balance hero — restrained */
    .balance-hero{
      border-radius: var(--radius);
      padding: var(--s-4) var(--s-4) var(--s-3);
      box-shadow: 0 12px 28px -14px rgba(11,31,54,.4);

    /* Settings rows */
    .settings-row{ padding: 13px 14px; }
    .settings-row .sr-label{ font-size: var(--fs-md); font-weight: 700; }
    .settings-row .sr-value{ font-size: var(--fs-sm); color: var(--ink-faint); font-weight: 600; }

    /* Content padding */
    #content{ padding: var(--s-2) var(--s-3) var(--s-4); }
    #summary{ margin: var(--s-3) var(--s-3) 0; border-radius: var(--radius); }

    /* Empty state */
    .empty-state{

    #loading{

    .form-group label.form-label{ cursor: default; }
    .form-input:disabled, .form-select:disabled{ opacity: .6; }

<script>
  // ================= GITHUB PAGES + GAS API =================

  function getAppToken_(){
    try { return localStorage.getItem('kasAppToken') || ''; } catch(e){ return ''; }
  }

    } catch(e){}
  }

    try {
      return sessionStorage.getItem('kasSession') || localStorage.getItem('kasSessionPersist') || '';
    } catch(e){ return ''; }
  }
  function setSession_(v){
    try {
      if(v){
        sessionStorage.setItem('kasSession', String(v));
        localStorage.setItem('kasSessionPersist', String(v));
      } else {
        sessionStorage.removeItem('kasSession');
        localStorage.removeItem('kasSessionPersist');
      }
    } catch(e){}
  }
  function authQuery_(){
    var q = '';

    var ses = getSession_();
    if(tok) q += '&token=' + encodeURIComponent(tok);
    if(ses) q += '&session=' + encodeURIComponent(ses);
    return q;
  }

    } catch(e){}
  }

      if(document.visibilityState === 'visible' && isUnlocked_()) warmServer_();
    }, 180000); // 3 menit — jaga GAS tetap hangat
  }

  function friendlyApiError_(err) {
    if (!err) return 'Koneksi gagal, coba lagi';
    if (err.name === 'AbortError') return 'Server lambat, coba lagi sebentar';
    var m = String(err.message || err);
    if (/Failed to fetch|NetworkError|Load failed|network|offline/i.test(m)) return 'Tidak ada internet, coba lagi';
    if (/Timeout/i.test(m)) return 'Server lambat, coba lagi';
    if (/Respons server tidak valid|Unexpected token|JSON/i.test(m)) return 'Server belum siap, coba lagi';
    if (/Token aplikasi tidak valid/i.test(m)) return 'Token API salah — cek di Pengaturan';
    if (/Terlalu banyak/i.test(m)) return 'Terlalu sering menyimpan, tunggu sebentar';
    if (/PIN salah/i.test(m)) return 'PIN salah';
    if (/Sesi berakhir|belum unlock/i.test(m)) {
      // Jangan kunci app / hapus sesi di sini — biar simpan yang handle retry
      return 'Sesi server perlu diperbarui';
    }
    // Jangan tampilkan stack teknis ke user
    if (m.length > 120 || /TypeError|ReferenceError|at\s+/i.test(m)) return 'Terjadi kesalahan, coba lagi';
    return m;
  }

  function parseApiResponse_(text) {
    var json;
    try { json = JSON.parse(text); }
    catch (e) { throw new Error('Respons server tidak valid'); }
    if (!json || !json.success) throw new Error((json && json.error) || 'Gagal');
    return json.data;
  }

  function fetchOnce_(url, options, timeoutMs) {
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var ms = timeoutMs || API_TIMEOUT_MS;

    var opts = Object.assign({ redirect: 'follow', cache: 'no-store' }, options || {});
    if (ctrl) opts.signal = ctrl.signal;
    return fetch(url, opts)
      .then(function (res) { return res.text(); })
      .then(function (text) {
        clearTimeout(timer);
        return parseApiResponse_(text);
      })
      .catch(function (err) {
        clearTimeout(timer);
        throw err;
      });
  }

  function fetchWithRetry_(url, options, retriesLeft, timeoutMs) {
    return fetchOnce_(url, options, timeoutMs).catch(function (err) {
      if (retriesLeft <= 0) throw err;
      return new Promise(function (resolve) { setTimeout(resolve, 500); })
        .then(function () { return fetchWithRetry_(url, options, retriesLeft - 1, timeoutMs); });
    });
  }

  function createRunner(successCb, failCb) {
    return new Proxy({}, {
      get: function(_, action) {
        if (action === 'withFailureHandler') {
          return function(newFail) { return createRunner(successCb, newFail); };
        }
        return function() {
          var args = Array.prototype.slice.call(arguments);
          var payload = args.length === 0 ? undefined : (args.length === 1 ? args[0] : args);

          // Semua mutasi pakai POST (lebih andal & tidak kepotong URL)
          var WRITE_ACT = {
            addTransaksi:1, updateTransaksi:1, deleteTransaksi:1, addRekening:1, updateRekening:1, deleteRekening:1,
            addTransfer:1, addHutangPiutang:1, updateHutangPiutang:1, bayarCicilan:1, addReimburseTransaksi:1,
            setPin:1, removePin:1, createBudgetLiburan:1, pindahKantongLiburan:1, tutupBudgetLiburan:1,
            restoreBackupJson:1, addTujuanNabung:1, tambahProgressNabung:1, generateRekapExport:1
          };
          if (WRITE_ACT[action] || (payload !== undefined && typeof payload === 'object' && JSON.stringify(payload).length > 1200)) {
            // 0 retry — retry tulis bikin transaksi dobel di Sheet
            callWithPost_(action, payload, successCb, failCb, 0);
            return;
          }
          var url = WEB_APP_URL + '?action=' + encodeURIComponent(action) + authQuery_();
          if (payload !== undefined) {
            var dataStr = typeof payload === 'string' ? payload : JSON.stringify(payload);
            url += '&data=' + encodeURIComponent(dataStr);
          }

          fetchWithRetry_(url, { method: 'GET' }, 1)
            .then(function (data) {
              if (typeof successCb === 'function') successCb(data);
            })
            .catch(function (err) {
              var msg = friendlyApiError_(err);
              if (typeof failCb === 'function') failCb(new Error(msg));
              else console.error(err);
            });
        };
      }
    });
  }

  function callWithPost_(action, payload, successCb, failCb, retries) {
    var opts = {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: action,
        data: payload,
        token: getAppToken_(),
        session: getSession_()
      })
    };

    fetchWithRetry_(WEB_APP_URL, opts, r, API_WRITE_TIMEOUT_MS)
      .then(function (data) {
        if (typeof successCb === 'function') successCb(data);
      })
      .catch(function (err) {
        if (typeof failCb === 'function') failCb(new Error(friendlyApiError_(err)));
      });
  }

  var google = {
    script: {
      run: {
        withSuccessHandler: function(successCb) {
          return createRunner(successCb, null);
        }
      }
    }
  };

  // ================= VISUAL VIEWPORT FIT =================
  // The layout viewport this page renders inside (governed by Apps Script's
  // wrapper page) can be wider/positioned differently than what's actually
  // visible on screen. window.visualViewport reports the REAL visible area
  // directly from the OS/browser, independent of that wrapper's math — so we
  // use it to explicitly pin #app (and the modal sheet) to the real screen,
  // in pixels, instead of trusting vw/%/transform-based CSS alone.
  // Di GitHub Pages: JANGAN pakai transform scale (bikin konten hilang/blank).
  // Pakai zoom CSS + layout normal biar flex tetap jalan.
  // Zoom 70%–100% (default 90% — lebih lega di HP modern)
  var uiScale = Number(localStorage.getItem('kasUiScale'));
  if (!uiScale || isNaN(uiScale) || uiScale < 0.7 || uiScale > 1) uiScale = 0.9;
  try { localStorage.setItem('kasUiScale', String(uiScale)); } catch(e) {}
  var isDarkMode = localStorage.getItem('kasDarkMode') === '1';
  document.documentElement.classList.toggle('dark', isDarkMode);
  function setDarkMode(on){
    isDarkMode = on;
    document.documentElement.classList.toggle('dark', on);
    try{ localStorage.setItem('kasDarkMode', on ? '1' : '0'); }catch(e){}
  }

  function applyUiScale(realW, realH){
    var inner = document.getElementById('appInner');
    if(!inner) return;
    // Layout penuh — tanpa transform scale
    inner.style.width = '100%';
    inner.style.height = '100%';
    inner.style.transform = 'none';
    // Zoom hanya mempengaruhi visual, tidak merusak flex box
    if (uiScale !== 1) {
      inner.style.zoom = String(uiScale);
    } else {
      inner.style.zoom = '';
    }
  }
  function applySheetScale(realW, realH){
    var sheetInner = document.getElementById('sheetInner');
    if(!sheetInner) return;
    sheetInner.style.width = '100%';
    sheetInner.style.maxHeight = (realH * 0.9) + 'px';
    sheetInner.style.transform = 'none';
  }
  function setUiScale(scale){
    uiScale = scale;
    try{ localStorage.setItem('kasUiScale', String(scale)); }catch(e){}
    fitViewport();
  }

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden'){
      // Keluar / minimize app → kunci otomatis
      if(pinEnabled){
        try { clearUnlocked_(); } catch(e){}
      }
    }
    if(document.visibilityState === 'visible'){
      try {
        if(pinEnabled && !isUnlocked_()){
          lockAppNow_();
        }
      } catch(e){}
      try { fireDueNotifs_(false); fireTrxReminders_(false); startTrxRemindScheduler_(); } catch(e) {}
    }

  window.addEventListener('pagehide', function(){
    if(pinEnabled) try { clearUnlocked_(); } catch(e){}
  });

  function fitViewport(){
    var vv = window.visualViewport;
    var app = document.getElementById('app');
    var sheet = document.getElementById('sheet');
    if(!app) return;
    // Fullscreen sederhana — cocok untuk GitHub Pages / browser HP
    app.style.left = '0';
    app.style.top = '0';
    app.style.width = '100%';
    app.style.height = '100%';
    app.style.transform = 'none';

    var w = (vv && vv.width) ? vv.width : window.innerWidth;
    applyUiScale(w, h);
    if(sheet){
      sheet.style.left = '0';
      sheet.style.width = '100%';
      sheet.style.transform = sheet.classList.contains('show') ? 'translate3d(0,0,0)' : 'translate3d(0,100%,0)';
      applySheetScale(w, h);
    }
  }

  window.addEventListener('resize', fitViewport);
  window.addEventListener('orientationchange', function(){ setTimeout(fitViewport, 150); });
  window.addEventListener('load', fitViewport);
  setTimeout(fitViewport, 300);
  setTimeout(fitViewport, 800);
  setTimeout(fitViewport, 1500);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', fitViewport);
    window.visualViewport.addEventListener('scroll', fitViewport);
  }

  // ================= RIBUAN (thousand-separator) FORMATTING =================
  // Any <input class="num-input"> gets live "1.000.000" style formatting as the
  // user types. Use rawNum(el) to read back the plain number for calculations —
  // never read a num-input's .value directly with Number()/parseInt().
  function formatRibuan(digitsStr){
    digitsStr = String(digitsStr || '').replace(/\D/g, '');
    if(!digitsStr) return '';
    return digitsStr.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }
  function ribuanStr(n){
    n = Math.round(Number(n) || 0);
    return formatRibuan(String(Math.abs(n)));
  }
  function rawNum(elOrId){
    var el = typeof elOrId === 'string' ? document.getElementById(elOrId) : elOrId;
    if(!el) return 0;
    var digits = String(el.value || '').replace(/\D/g, '');
    return digits ? Number(digits) : 0;
  }
  document.getElementById('sheet-content').addEventListener('input', function(e){
    if(!e.target.classList || !e.target.classList.contains('num-input')) return;
    var el = e.target;
    var digitsBeforeCursor = el.value.slice(0, el.selectionStart).replace(/\D/g, '').length;
    var formatted = formatRibuan(el.value);
    el.value = formatted;
    // Re-place the cursor after the same count of digits it was after before formatting.
    var seen = 0, pos = formatted.length;
    for(var i = 0; i < formatted.length; i++){
      if(/\d/.test(formatted[i])) seen++;
      if(seen === digitsBeforeCursor){ pos = i + 1; break; }
    }
    try{ el.setSelectionRange(pos, pos); }catch(err){}
  });

  // ================= STATE =================
  var STATE = { transaksi: [], rekening: [], hutangPiutang: [], anggaran: [], budgetLiburan: [], recurring: [], tujuanNabung: [], dailyTriggerActive: false, userName: 'Pengguna' };
  var currentTab = 'transaksi';
  var currentDate = new Date();
  var hutangFilter = 'Semua';

  var MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  var MONTHS_SHORT = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  var DAYS = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  var DAYS_SHORT = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];

  function fmtRupiah(n){
    n = Math.round(Number(n) || 0);
    var neg = n < 0; n = Math.abs(n);
    var s = n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (neg ? '-Rp ' : 'Rp ') + s;
  }
  function flashFieldErr_(id){
    var el = document.getElementById(id);
    if(!el) return;
    el.classList.add('field-err');
    try { el.focus(); } catch(e){}
    setTimeout(function(){ try { el.classList.remove('field-err'); } catch(e){} }, 2200);
  }
  function toast(msg){
    msg = String(msg || '').trim();
    if(!msg) return;
    // Kurangi noise
    if(/^(Siap|Mengunduh|Menyiapkan\b)/i.test(msg)) return;
    if(toast._last === msg && Date.now() - (toast._lastAt || 0) < 1800) return;
    toast._last = msg;
    toast._lastAt = Date.now();
    var el = document.getElementById('toast');
    if(!el) return;
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toast._h);
    var ms = msg.length > 48 ? 3200 : 2000;
    toast._h = setTimeout(function(){ el.classList.remove('show'); }, ms);
  }

  var undoState = null;
  function toastWithUndo(msg, onUndo, onCommit){
    if(undoState) undoState.commit();
    var el = document.getElementById('undo-toast');
    document.getElementById('undo-toast-msg').textContent = msg;
    el.classList.add('show');
    var committed = false;
    var timer = setTimeout(function(){ commit(); }, 4000);
    function commit(){
      if(committed) return; committed = true;
      el.classList.remove('show');
      undoState = null;
      onCommit();
    }
    function undo(){
      if(committed) return; committed = true;
      clearTimeout(timer);
      el.classList.remove('show');
      undoState = null;
      onUndo();
    }
    undoState = { commit: commit, undo: undo };
    document.getElementById('undo-toast-btn').onclick = undo;
  }
  function parseYMD(s){
    var p = String(s).split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  function toYMD(d){
    var y = d.getFullYear(), m = ('0' + (d.getMonth()+1)).slice(-2), day = ('0' + d.getDate()).slice(-2);
    return y + '-' + m + '-' + day;
  }
  function fmtDayHeading(ymd){
    var d = parseYMD(ymd);
    return DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

  // ================= INIT =================
  // PIN & sidik jari DINONAKTIFKAN — app langsung masuk
  var pinEnabled = false;
  try {
    localStorage.removeItem('kasHasPin');
    localStorage.removeItem('kasPinHash');
    localStorage.removeItem('kasPinSalt');
    localStorage.removeItem('kasBioCred');

  function localPinHash_(pin){
    // Hash lokal sederhana + salt tetap per-install (cukup untuk kunci layar HP)
    var salt = '';
    try { salt = localStorage.getItem('kasPinSalt') || ''; } catch(e){}
    if(!salt){
      salt = 'kas' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      try { localStorage.setItem('kasPinSalt', salt); } catch(e){}
    }
    var s = salt + '|' + String(pin || '');
    var h = 5381;
    for(var i = 0; i < s.length; i++){
      h = ((h << 5) + h) + s.charCodeAt(i);
      h = h | 0;
    }
    // mix kedua
    var h2 = 0;
    for(var j = 0; j < s.length; j++){
      h2 = (h2 * 31 + s.charCodeAt(j)) | 0;
    }
    return (h >>> 0).toString(16) + '-' + (h2 >>> 0).toString(16) + '-' + s.length;
  }

  function mergeTransaksiKeepLocal_(serverList){

    var local = (STATE && STATE.transaksi) ? STATE.transaksi : [];
    var pending = local.filter(function(x){
      return x && String(x.ID || '').indexOf('local-') === 0;
    });
    pending.forEach(function(p){
      var found = server.some(function(s){
        if(!s) return false;
        return String(s.Tanggal||'') === String(p.Tanggal||'')
          && String(s.Jenis||'') === String(p.Jenis||'')
          && String(s.Kategori||'') === String(p.Kategori||'')
          && String(s.Akun||'') === String(p.Akun||'')
          && Number(s.Nominal) === Number(p.Nominal);

      if(!found) server.unshift(p);

  function applyState_(data){

      if(typeof __kasSyncing === 'number' && __kasSyncing > 0){
        pendingLocal = (STATE.transaksi || []).filter(function(x){
          return x && String(x.ID || '').indexOf('local-') === 0;
        });

    } catch(e){}
    STATE = data || {};
    if (!Array.isArray(STATE.transaksi)) STATE.transaksi = [];
    if(pendingLocal.length){
      pendingLocal.forEach(function(p){
        var found = STATE.transaksi.some(function(s){
          return s && String(s.Tanggal||'') === String(p.Tanggal||'')
            && String(s.Jenis||'') === String(p.Jenis||'')
            && String(s.Kategori||'') === String(p.Kategori||'')
            && String(s.Akun||'') === String(p.Akun||'')

    if (!Array.isArray(STATE.rekening)) STATE.rekening = [];
    if (!Array.isArray(STATE.hutangPiutang)) STATE.hutangPiutang = [];

    if(typeof STATE.hasPin === 'boolean'){

    // Normalisasi kantong budget liburan (server kirim Kantong / KantongJson)

          b.Kantong = Array.isArray(k) ? k : [];

  function bioSupported_(){
    return !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);
  }
  function bioEnabled_(){

  function bufToB64url_(buf){
    var bytes = new Uint8Array(buf);
    var s = '';
    for(var i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function b64urlToBuf_(str){
    var s = str.replace(/-/g,'+').replace(/_/g,'/');
    while(s.length % 4) s += '=';
    var bin = atob(s);
    var out = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
    return out.buffer;
  }
  function registerBiometric_(){
    if(!bioSupported_()) return Promise.reject(new Error('HP/browser tidak mendukung biometrik'));
    var challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);
    var userId = new Uint8Array(16);
    crypto.getRandomValues(userId);
    // platform + residentKey discouraged = sidik jari HP lokal, bukan passkey Google
    var opts = {
      publicKey: {
        challenge: challenge,
        rp: { name: 'Catatan Kas', id: location.hostname },
        user: {
          id: userId,
          name: 'catatan-kas-local',
          displayName: 'Catatan Kas'
        },
        pubKeyCredParams: [
          { alg: -7, type: 'public-key' },
          { alg: -257, type: 'public-key' }
        ],
        authenticatorSelection: {
          authenticatorAttachment: 'platform',
          userVerification: 'required',
          residentKey: 'discouraged',
          requireResidentKey: false
        },
        attestation: 'none',
        timeout: 90000
      }
    };
    return navigator.credentials.create(opts).then(function(cred){
      if(!cred) throw new Error('Dibatalkan');
      var id = bufToB64url_(cred.rawId);
      localStorage.setItem('kasBioCredId', id);
      localStorage.setItem('kasBioOn', '1');
      return true;
    });
  }

  function unlockWithBiometric_(){
    if(!bioEnabled_()) return Promise.reject(new Error('Biometrik belum diaktifkan'));
    var id = localStorage.getItem('kasBioCredId');
    var challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);
    // allowCredentials + transports internal = pakai sensor HP, bukan akun Google
    return navigator.credentials.get({

      google.script.run.withSuccessHandler(function(res){

  function applyDelta_(d){
    if(!d || typeof d !== 'object') return;
    // Patch ringan dari server (cepat)
    if(d.trxPatch){
      var up = d.trxPatch.upsert || [];
      var rm = d.trxPatch.remove || [];
      if(rm.length){
        STATE.transaksi = (STATE.transaksi || []).filter(function(t){
          return rm.indexOf(t.ID) < 0;
        });
      }
      up.forEach(function(row){
        if(!row || !row.ID) return;
        STATE.transaksi = (STATE.transaksi || []).filter(function(t){
          if(t.ID === row.ID) return false;
          if(String(t.ID||'').indexOf('local-')===0
            && String(t.Tanggal||'')===String(row.Tanggal||'')
            && String(t.Jenis||'')===String(row.Jenis||'')
            && Number(t.Nominal)===Number(row.Nominal)
            && String(t.Kategori||'')===String(row.Kategori||'')) return false;
          return true;
        });
        STATE.transaksi.unshift(row);
      });
      if(d.trxPatch.recomputeSaldo || (d.trxPatch.remove && d.trxPatch.remove.length)){
        try { recomputeSaldoLocal_(); } catch(e){}
      }
    }
    if(Array.isArray(d.transaksi)) safeApplyTransaksi_(d.transaksi);
    if(Array.isArray(d.rekening)) STATE.rekening = d.rekening;
    if(Array.isArray(d.hutangPiutang)) STATE.hutangPiutang = d.hutangPiutang;
    if(Array.isArray(d.anggaran)) STATE.anggaran = d.anggaran;
    if(Array.isArray(d.budgetLiburan)){
      STATE.budgetLiburan = d.budgetLiburan;
      STATE.budgetLiburan.forEach(function(b){
        if (!b.Kantong || !b.Kantong.length) {
          try {
            var k = typeof b.KantongJson === 'string' ? JSON.parse(b.KantongJson || '[]') : (b.KantongJson || []);
            b.Kantong = Array.isArray(k) ? k : [];
          } catch (e) { b.Kantong = []; }
        }
        b.Plafon = Number(b.Plafon) || 0;
      });
      try { localStorage.setItem('kasBudgetLiburan', JSON.stringify(STATE.budgetLiburan)); } catch (e) {}
    }
    if(Array.isArray(d.recurring)) STATE.recurring = d.recurring;
    if(Array.isArray(d.tujuanNabung)) STATE.tujuanNabung = d.tujuanNabung;
    if(d.userName) STATE.userName = d.userName;
    if(typeof d.hasPin === 'boolean'){ STATE.hasPin = d.hasPin; applyServerPinFlag_(d.hasPin); }
    if(typeof d.dailyTriggerActive === 'boolean') STATE.dailyTriggerActive = d.dailyTriggerActive;
  }
  function absorbServerData_(data, arrayKey){
    if(data && data.delta){ applyDelta_(data); return; }
    if(Array.isArray(data) && arrayKey){ STATE[arrayKey] = data; return; }
    if(data && typeof data === 'object' && !Array.isArray(data)){ applyState_(data); }
  }
  function refreshState(data){
    if(data && data.needsPin) return;
    if(data && data.delta){
      applyDelta_(data);
      // Setelah mutasi sukses, buang local-* yang sudah ada di server
      STATE.transaksi = (STATE.transaksi || []).filter(function(x){
        if(!x || String(x.ID||'').indexOf('local-') !== 0) return true;
        // masih pending jika tidak ada match di list server
        return !(data.transaksi || []).some(function(s){
          return s && String(s.Tanggal||'') === String(x.Tanggal||'')
            && String(s.Jenis||'') === String(x.Jenis||'')
            && Number(s.Nominal) === Number(x.Nominal)
            && String(s.Kategori||'') === String(x.Kategori||'');
        });
      });
    } else if(data){
      if(isEmptyPayload_(data) && cacheHasData_(readCache_())){
        try { renderAll(); } catch(e) {}
        return;
      }
      applyStateFromSheet_(data);
    }
    try { renderAll(); } catch(e) { console.error(e); }
    if(!isEmptyPayload_(STATE)) schedulePersistCache_();
  }

  function updateSyncPill_(){

    if(!el) return;

  function withBusyBtn_(btn, work){
    if(!btn){ work(function(){}); return; }
    if(btn.dataset.busy === '1') return;
    btn.dataset.busy = '1';
    btn.disabled = true;
    var prev = btn.textContent;
    btn.textContent = 'Menyimpan…';
    var released = false;
    function release(){
      if(released) return;
      released = true;
      btn.dataset.busy = '0';
      btn.disabled = false;
      btn.textContent = prev;
    }
    setTimeout(release, 12000);
    try { work(release); } catch(e){ release(); throw e; }
  }

  function saveOptimistic(msg, startRun){
    if(!guardOnline_()) return;
    closeSheet();
    __kasSyncing++;
    updateSyncPill_();
    var finished = false;
    var retriedSession = false;
    function doneOk(data){
      if(finished) return;
      finished = true;
      __kasSyncing = Math.max(0, __kasSyncing - 1);
      updateSyncPill_();
      if(data) refreshState(data);
      try { clearOfflineFlag_(); } catch(e){}
      toast(msg || 'Tersimpan');
    }
    function doneFail(err){
      if(finished) return;
      // Sesi invalid → minta PIN, kirim ulang 1x
      doneFailFinal(err);
    }
    function doneFailFinal(err){
      if(finished) return;
      finished = true;
      __kasSyncing = Math.max(0, __kasSyncing - 1);
      updateSyncPill_();
      toast(err && err.message ? err.message : 'Gagal menyimpan. Coba lagi.');
    }
    function kickOff(){
      try { startRun(doneOk, doneFail); } catch(e){ doneFail(e); }
    }
    // PIN aktif tapi belum ada sesi → ambil sesi dulu
    kickOff();
  }

  function showLocalNotif_(title, body, tag){
    if(!('Notification' in window) || Notification.permission !== 'granted') return Promise.resolve(false);
    var iconUrl = new URL('icon-192.png', location.href).href;
    var badgeUrl = new URL('badge-72.png', location.href).href;
    var appUrl = new URL('./', location.href).href;
    var nopts = {
      body: body || '',
      icon: iconUrl,
      badge: badgeUrl,
      tag: tag || 'kas-notif',
      renotify: true,
      requireInteraction: false,
      data: { url: appUrl }
    };
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      return navigator.serviceWorker.ready.then(function(reg){
        return reg.showNotification(title, nopts).then(function(){ return true; });
      }).catch(function(){
        try { new Notification(title, nopts); return true; } catch(e){ return false; }
      });
    }
    try { new Notification(title, nopts); return Promise.resolve(true); }
    catch(e){ return Promise.resolve(false); }
  }
  function requestDueNotifPermission_(){
    if(!('Notification' in window)){ toast('Browser tidak mendukung notifikasi'); return; }
    Notification.requestPermission().then(function(p){
      if(p === 'granted'){

        toast('Pengingat aktif');
        fireDueNotifs_(true);

    });

  function fireDueNotifs_(force){
    if(!('Notification' in window) || Notification.permission !== 'granted') return;
    if(!force && !notifEnabled_()) return;
    var key = 'kasNotifSent-' + toYMD(new Date());
    var sent = {};
    try { sent = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) {}
    var n = 0;
    (STATE.hutangPiutang || []).forEach(function(h){
      if(h.Status === 'Lunas' || !h.JatuhTempo) return;
      var days = daysUntil(h.JatuhTempo);
      if(days === null || days > 3) return;
      var id = String(h.ID || h.Nama);
      if(sent[id]) return;
      var title = days < 0 ? 'Hutang jatuh tempo!' : (days === 0 ? 'Jatuh tempo hari ini' : 'Jatuh tempo ' + days + ' hari lagi');
      var body = (h.Nama || 'Hutang') + ' • ' + fmtRupiah(h.SisaHutang || h.TotalHutang);
      showLocalNotif_(title, body, 'kas-due-' + id);
      sent[id] = 1;
      n++;
    });
    try { localStorage.setItem(key, JSON.stringify(sent)); } catch(e) {}
    return n;
  }

  function fireTrxReminders_(force){
    if(!('Notification' in window) || Notification.permission !== 'granted') return;
    if(!force && !trxRemindEnabled_()) return;
    var now = new Date();
    var ymd = toYMD(now);
    var h = now.getHours();
    var mi = now.getMinutes();
    TRX_REMIND_HOURS.forEach(function(hour){
      if(h !== hour || mi > 4) return;
      var key = 'kasTrxRemind-' + ymd + '-' + hour;
      try { if(localStorage.getItem(key) === '1') return; } catch(e){}
      var label = hour <= 10 ? 'pagi' : hour <= 12 ? 'siang' : hour <= 15 ? 'sore' : hour <= 18 ? 'petang' : 'malam';
      showLocalNotif_(
        'Catat transaksi dulu',
        'Pengingat ' + label + ' · Sudah catat kas jam ' + (hour < 10 ? '0' : '') + hour + ':00?',
        'kas-trx-remind-' + hour
      );
      try { localStorage.setItem(key, '1'); } catch(e){}
    });
  }

    var dariEl = document.getElementById('f-search-dari');
    var sampaiEl = document.getElementById('f-search-sampai');
    function runSearch(){
      var q = qEl.value.trim().toLowerCase();
      var dari = dariEl.value, sampai = sampaiEl.value;
      var resEl = document.getElementById('search-result');
      if(!q && !dari && !sampai){
        resEl.innerHTML = '<div class="search-hint">Ketik kata kunci atau pilih rentang tanggal.</div>';
        return;
      }
      var results = STATE.transaksi.filter(function(t){
        if(dari && t.Tanggal < dari) return false;
        if(sampai && t.Tanggal > sampai) return false;
        if(q){
          var untuk = '';
          try { untuk = parseUntuk_(t) || ''; } catch(e) {}
          var hay = ((t.Kategori||'') + ' ' + (t.Catatan||'') + ' ' + (t.Akun||'') + ' ' + untuk + ' ' + (t.Jenis||'')).toLowerCase();
          if(hay.indexOf(q) === -1) return false;
        }
        return true;
      });
      results = collapseTransferLegs_(results);
      results.sort(function(a,b){ return b.Tanggal < a.Tanggal ? -1 : b.Tanggal > a.Tanggal ? 1 : 0; });
      if(!results.length){
        resEl.innerHTML = emptyState('Tidak ketemu', 'Coba kata lain, atau kosongkan filter tanggal.');
        return;
      }
      var limited = results.slice(0, 80);
      var totalNominal = 0;
      results.forEach(function(t){
        if(isTransferLeg(t)) return;
        totalNominal += (t.Jenis==='Pemasukan'?1:-1) * Number(t.Nominal);
      });
      var html = '<div class="search-meta">' + results.length + ' ditemukan' +
        (results.length > 80 ? ' · tampil 80' : '') +
        ' · <span class="num" style="font-weight:800;color:' + (totalNominal>=0?'var(--green)':'var(--red)') + '">' +
        fmtRupiah(totalNominal) + '</span></div>';
      limited.forEach(function(t){ html += renderTrxCard(t); });
      resEl.innerHTML = html;
      resEl.querySelectorAll('.item-card[data-kind="trx"]').forEach(function(card){
        card.addEventListener('click', function(){
          closeSheet();
          setTimeout(function(){ openTrxDetail(card.dataset.id); }, 220);
        });
      });
    }
    qEl.addEventListener('input', runSearch);
    dariEl.addEventListener('change', runSearch);
    sampaiEl.addEventListener('change', runSearch);
  }

  function clearAppCache_(){
    if(!confirm('Hapus cache di HP ini?\n\nData di spreadsheet tetap aman. Yang dihapus: cache data, filter, foto struk lokal. Preferensi & token tetap.')) return;
    // JANGAN hapus token/session/zoom/theme — biar API tetap jalan
    var keepKeys = {
      kasUiScale:1, kasDarkMode:1, kasShowBalance:1, kasViewMode:1,
      kasNotifOn:1, kasWeatherV1:1, kasAppToken:1, kasSession:1,
      kasDisplayName:1, kasPinHash:1, kasUnlocked:1
    };
    try {
      Object.keys(localStorage).forEach(function(k){
        if(keepKeys[k]) return;
        if(k.indexOf('kas') === 0 || k.indexOf('kasNotifSent-') === 0){
          try { localStorage.removeItem(k); } catch(e) {}
        }
      });
    } catch(e) {}
    try { trxFilter = { akun: '', kategori: '', untuk: '' }; } catch(e) {}
    closeSheet();
    toast('Cache dihapus — memuat dari Spreadsheet…');

    // Soft reload: app tetap terlihat, banner loading di atas (TIDAK full-screen forever)
    var loadEl = document.getElementById('loading');
    var appEl = document.getElementById('app');
    if(appEl) appEl.style.display = 'flex';
    if(loadEl){
      loadEl.style.display = 'flex';
      loadEl.style.opacity = '0.92';
      loadEl.innerHTML =
        '<div class="splash-brand"><img src="splash-logo.png" alt="AksaraLabs" width="200" height="200" decoding="async"></div>' +
        '<div class="splash-title">Catatan Kas</div>' +
        '<div class="spinner" style="margin-top:14px;"></div>' +
        '<div class="splash-sub">Memuat dari Spreadsheet…</div>' +
        '<button type="button" id="btn-cancel-cache-load" style="margin-top:18px;padding:10px 20px;border:1px solid rgba(255,255,255,.35);border-radius:10px;background:transparent;color:#fff;font-weight:700;font-size:13px;">Batal / tampilkan app</button>';
      setTimeout(function(){
        var c = document.getElementById('btn-cancel-cache-load');
        if(c) c.onclick = function(){
          if(loadEl) loadEl.style.display = 'none';
          if(appEl) appEl.style.display = 'flex';
          try { renderAll(); } catch(e){}
        };
      }, 0);
    }

    var finished = false;
    function finishOk(data){
      if(finished) return;
      finished = true;
      if(loadEl){ loadEl.style.display = 'none'; loadEl.style.opacity = ''; }
      if(appEl) appEl.style.display = 'flex';
      if(!data || data.needsPin){
        toast('Data dimuat (sesi terbatas)');
        try { renderAll(); } catch(e){}
        return;
      }
      if(isEmptyPayload_(data)){
        toast('Sheet kosong — cek Spreadsheet');
        try { renderAll(); } catch(e){}
        return;
      }
      try {
        applyStateFromSheet_(data);
        onDataLoaded(STATE, false);
        toast('Cache bersih · data dari Spreadsheet');
      } catch(e){
        console.error(e);
        toast('Gagal render: ' + (e.message || e));
        try { renderAll(); } catch(e2){}
      }
    }
    function finishFail(err){
      if(finished) return;
      finished = true;
      if(loadEl){ loadEl.style.display = 'none'; loadEl.style.opacity = ''; }
      if(appEl) appEl.style.display = 'flex';
      try { renderAll(); } catch(e){}
      toast((err && err.message) ? err.message : 'Gagal muat — app tetap jalan');
    }
    // Safety: max 18 detik, jangan stuck
    setTimeout(function(){
      if(!finished) finishFail(new Error('Server lambat — coba Muat ulang dari Spreadsheet'));
    }, 18000);

    try {
      google.script.run.withSuccessHandler(finishOk).withFailureHandler(finishFail).getInitialData();
    } catch(e){
      finishFail(e);
    }
  }
