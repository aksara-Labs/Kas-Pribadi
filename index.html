    el.querySelectorAll('.kategori-row[data-goal-id]').forEach(function(row){
      row.addEventListener('click', function(){ openGoalDetail(row.dataset.goalId); });
    });
  }

  function openGoalForm(){
    openSheet(
      '<div class="sheet-title">Tambah Tujuan Nabung</div>' +
      '<div class="form-group"><label class="form-label">Nama Tujuan</label><input class="form-input" id="f-goal-nama" type="text" placeholder="Contoh: DP Motor, Dana Darurat"></div>' +
      '<div class="form-group"><label class="form-label">Target Nominal</label><input class="form-input num num-input" id="f-goal-target" type="text" inputmode="numeric" placeholder="0"></div>' +
      '<div class="form-group"><label class="form-label">Target Tanggal (opsional)</label><input class="form-input" id="f-goal-tanggal" type="date"></div>' +
      '<button class="btn-primary" id="btn-save-goal">Simpan</button>'
    );
    document.getElementById('btn-save-goal').addEventListener('click', function(){
      var nama = document.getElementById('f-goal-nama').value.trim();
      var target = rawNum('f-goal-target');
      if(!nama){ toast('Nama tujuan harus diisi'); return; }
      if(!target || target <= 0){ toast('Target nominal harus diisi'); return; }
      var payload = { nama: nama, targetNominal: target, tanggalTarget: document.getElementById('f-goal-tanggal').value };
      var btn = document.getElementById('btn-save-goal'); btn.textContent = 'Menyimpan…';
      google.script.run.withSuccessHandler(function(list){
        STATE.tujuanNabung = list; closeSheet(); renderRekening(); toast('Tujuan nabung ditambahkan');
      }).withFailureHandler(function(err){ btn.textContent='Simpan'; toast('Gagal: ' + err.message); }).addTujuanNabung(payload);
    });
  }

  function openGoalDetail(id){
    var g = STATE.tujuanNabung.find(function(x){ return x.ID === id; });
    if(!g) return;
    var pct = g.TargetNominal > 0 ? Math.min(100, Math.round(Number(g.TerkumpulNominal)/Number(g.TargetNominal)*100)) : 0;
    var sisa = Math.max(0, Number(g.TargetNominal) - Number(g.TerkumpulNominal));
    openSheet(
      '<div class="sheet-title">' + esc(g.Nama) + '</div>' +
      '<div class="detail-row"><span class="k">Terkumpul</span><span class="v num">' + fmtRupiah(g.TerkumpulNominal) + '</span></div>' +
      '<div class="detail-row"><span class="k">Target</span><span class="v num">' + fmtRupiah(g.TargetNominal) + '</span></div>' +
      '<div class="detail-row"><span class="k">Sisa</span><span class="v num">' + fmtRupiah(sisa) + '</span></div>' +
      (g.TanggalTarget ? '<div class="detail-row"><span class="k">Target Tanggal</span><span class="v">' + esc(g.TanggalTarget) + '</span></div>' : '') +
      '<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="progress-label"><span>' + pct + '% tercapai</span></div></div>' +
      (sisa > 0 ?
        '<div class="form-group" style="margin-top:16px;"><label class="form-label">Setor Nominal</label><input class="form-input num num-input" id="f-goal-setor" type="text" inputmode="numeric" placeholder="0"></div>' +
        '<div class="form-group"><label class="form-label">Ambil dari Rekening (opsional)</label><select class="form-select" id="f-goal-akun"><option value="">Jangan catat sebagai transaksi</option>' + accountOptions() + '</select></div>' +
        '<button class="btn-primary" id="btn-setor-goal">Setor</button>'
      : '<div style="text-align:center; font-weight:700; color:var(--green); margin-top:10px;">🎉 Target Tercapai!</div>') +
      '<button class="btn-danger-text" id="btn-del-goal">' + ICON_TRASH + ' &nbsp;Hapus Tujuan</button>'
    );
    var setorBtn = document.getElementById('btn-setor-goal');
    if(setorBtn){
      setorBtn.addEventListener('click', function(){
        var nominal = rawNum('f-goal-setor');
        if(!nominal || nominal <= 0){ toast('Nominal setor harus diisi'); return; }
        var akun = document.getElementById('f-goal-akun').value;
        var payload = { id: id, nominalTambahan: nominal, akun: akun };
        saveOptimistic('Setoran dicatat', function(ok, fail){
          google.script.run.withSuccessHandler(ok).withFailureHandler(fail).tambahProgressNabung(payload);
        });
      });
    }
    document.getElementById('btn-del-goal').addEventListener('click', function(){
      if(!confirm('Hapus tujuan nabung ini?')) return;
      google.script.run.withSuccessHandler(function(list){
        STATE.tujuanNabung = list; closeSheet(); renderRekening(); toast('Tujuan nabung dihapus');
      }).withFailureHandler(function(err){ toast('Gagal: ' + err.message); }).deleteTujuanNabung(id);
    });
  }

  function openTransferForm(){
    var today = toYMD(currentDate);
    openSheet(
      '<div class="sheet-title">Transfer Antar Rekening</div>' +
      '<div class="form-group"><label class="form-label">Dari Rekening</label><select class="form-select" id="f-akun-asal">' + accountOptions() + '</select></div>' +
      '<div class="form-group"><label class="form-label">Ke Rekening</label><select class="form-select" id="f-akun-tujuan">' + accountOptions() + '</select></div>' +
      '<div class="form-group"><label class="form-label">Nominal Transfer</label><input class="form-input num num-input" id="f-transfer-nominal" type="text" inputmode="numeric" placeholder="0"></div>' +
      '<div class="form-group"><label class="form-label">Biaya Admin (opsional)</label><input class="form-input num num-input" id="f-transfer-biaya" type="text" inputmode="numeric" placeholder="0"></div>' +
      '<div style="font-size:11px; color:var(--ink-faint); margin:-8px 0 4px;">Biaya admin otomatis dicatat sebagai Pengeluaran dari rekening asal.</div>' +
      '<div class="form-group"><label class="form-label">Tanggal</label><input class="form-input" id="f-tanggal" type="date" value="' + today + '"></div>' +
      '<div class="form-group"><label class="form-label">Catatan (opsional)</label><input class="form-input" id="f-catatan" type="text" placeholder="Catatan tambahan"></div>' +
      '<button class="btn-primary" id="btn-save-transfer">Transfer</button>'
    );
    document.getElementById('btn-save-transfer').addEventListener('click', function(){
      var akunAsal = document.getElementById('f-akun-asal').value;
      var akunTujuan = document.getElementById('f-akun-tujuan').value;
      var nominal = rawNum('f-transfer-nominal');
      var biayaAdmin = rawNum('f-transfer-biaya');
      var tanggal = document.getElementById('f-tanggal').value;
      if(!akunAsal || !akunTujuan){ toast('Pilih rekening asal dan tujuan'); return; }
      if(akunAsal === akunTujuan){ toast('Rekening asal dan tujuan tidak boleh sama'); return; }
      if(!nominal || nominal <= 0){ toast('Nominal transfer harus diisi'); return; }
      if(!tanggal){ toast('Tanggal harus diisi'); return; }
      var payload = { akunAsal: akunAsal, akunTujuan: akunTujuan, nominal: nominal, biayaAdmin: biayaAdmin, tanggal: tanggal, catatan: document.getElementById('f-catatan').value };
      saveOptimistic('Transfer berhasil dicatat', function(ok, fail){
        google.script.run.withSuccessHandler(ok).withFailureHandler(fail).addTransfer(payload);
      });
    });
  }

  // ================= REKAP =================
  var rekapSubTab = 'realtime'; // 'realtime' | 'bulanan' | 'custom'
  var HUTANG_KATEGORI = ['Terima Hutang','Bayar Hutang','Beri Piutang','Terima Piutang','Top Up Hutang','Top Up Piutang'];

  function numOnly(n){
    n = Math.round(Number(n) || 0);
    var neg = n < 0; n = Math.abs(n);
    return (neg ? '-' : '') + formatRibuan(String(n));
  }
  function pad2(n){ return ('0' + n).slice(-2); }
  function fmtRangeLabel(fromD, toD){
    return pad2(fromD.getDate()) + ' ' + MONTHS_SHORT[fromD.getMonth()] + ' ' + fromD.getFullYear() +
      ' - ' + pad2(toD.getDate()) + ' ' + MONTHS_SHORT[toD.getMonth()] + ' ' + toD.getFullYear();
  }
  function lastDayOfMonth(y, m){ return new Date(y, m+1, 0).getDate(); }

  function computeRekap(fromYMD, toYMD){
    var pengeluaran = 0, pemasukan = 0;
    var hutangTambah = 0, hutangKurang = 0;
    var piutangTambah = 0, piutangKurang = 0;
    STATE.transaksi.forEach(function(t){
      if(t.Tanggal < fromYMD || t.Tanggal > toYMD) return;
      if(isTransferLeg(t)) return;
      var n = Number(t.Nominal);
      if(t.Jenis === 'Pemasukan') pemasukan += n; else pengeluaran += n;
      if(t.Kategori === 'Terima Hutang' || t.Kategori === 'Top Up Hutang') hutangTambah += n;
      else if(t.Kategori === 'Bayar Hutang') hutangKurang += n;
      else if(t.Kategori === 'Beri Piutang' || t.Kategori === 'Top Up Piutang') piutangTambah += n;
      else if(t.Kategori === 'Terima Piutang') piutangKurang += n;
    });
    // Hutang/piutang bentuk Barang: kewajiban nambah tanpa kas "Terima Hutang"
    STATE.hutangPiutang.forEach(function(h){
      if(!h.Tanggal || h.Tanggal < fromYMD || h.Tanggal > toYMD) return;
      if(h.Bentuk !== 'Barang') return;
      var pokok = Number(h.Pokok) || 0;
      if(pokok <= 0) return;
      if(h.Jenis === 'Hutang') hutangTambah += pokok;
      else if(h.Jenis === 'Piutang') piutangTambah += pokok;
    });
    return {
      pengeluaran: pengeluaran,
      pemasukan: pemasukan,
      selisih: pemasukan - pengeluaran,
      hutangTambah: hutangTambah,
      hutangKurang: hutangKurang,
      piutangTambah: piutangTambah,
      piutangKurang: piutangKurang,
      hutangPiutang: hutangTambah - hutangKurang
    };
  }

  function rekapRowHtml(label, value, mode, focus){
    var cls = 'dark', text;
    if(mode === 'pemasukan'){ cls = 'green'; text = '+' + numOnly(value); }
    else if(mode === 'delta'){ if(value >= 0){ cls = 'green'; text = '+' + numOnly(value); } else { text = numOnly(value); } }
    else if(mode === 'hutang-tambah'){ cls = 'red'; text = '+' + numOnly(value); }
    else if(mode === 'hutang-kurang'){ cls = 'green'; text = '−' + numOnly(value); }
    else { text = numOnly(value); }
    var focusAttr = focus ? ' data-focus="' + focus + '" style="cursor:pointer;"' : '';
    return '<div class="rekap-row"' + focusAttr + '><span class="k">' + label + '</span><span class="v ' + cls + ' num">' + text + '</span></div>';
  }
  function rekapCardHtml(dateLabel, data, fromYMD, toYMD){
    var html = '<div class="rekap-card" data-from="' + fromYMD + '" data-to="' + toYMD + '">' +
      '<div class="rekap-date">' + dateLabel + '</div>' +
      rekapRowHtml('Pengeluaran', data.pengeluaran, 'plain', 'pengeluaran') +
      rekapRowHtml('Pemasukan', data.pemasukan, 'pemasukan', 'pemasukan') +
      rekapRowHtml('Selisih', data.selisih, 'delta', 'rekap') +
      rekapRowHtml('Hutang Bertambah', data.hutangTambah, 'hutang-tambah', 'hutang-tambah') +
      rekapRowHtml('Hutang Berkurang', data.hutangKurang, 'hutang-kurang', 'hutang-kurang');
    if(data.piutangTambah || data.piutangKurang){
      html += rekapRowHtml('Piutang Bertambah', data.piutangTambah, 'hutang-tambah', 'piutang-tambah') +
        rekapRowHtml('Piutang Berkurang', data.piutangKurang, 'hutang-kurang', 'piutang-kurang');
    }
    html += '</div>';
    return html;
  }
  function wireRekapCards(container){
    container.querySelectorAll('.rekap-card').forEach(function(card){
      var from = card.dataset.from, to = card.dataset.to;
      card.querySelectorAll('.rekap-row[data-focus]').forEach(function(row){
        row.addEventListener('click', function(e){
          e.stopPropagation();
          var focus = row.dataset.focus;
          if(focus === 'hutang-tambah' || focus === 'hutang-kurang' || focus === 'piutang-tambah' || focus === 'piutang-kurang'){
            openHutangRekapDetail(from, to, focus);
          } else {
            openRekapDetail(from, to, focus === 'pemasukan' ? 'kategori' : 'kategori');
          }
        });
      });
      card.addEventListener('click', function(){
        openRekapDetail(from, to);
      });
    });
  }

  function openHutangRekapDetail(fromYMD, toYMD_, focus){
    var titles = {
      'hutang-tambah': 'Hutang Bertambah',
      'hutang-kurang': 'Hutang Berkurang',
      'piutang-tambah': 'Piutang Bertambah',
      'piutang-kurang': 'Piutang Berkurang'
    };
    var title = titles[focus] || 'Detail';
    var items = [];
    var total = 0;

    if(focus === 'hutang-tambah'){
      STATE.transaksi.forEach(function(t){
        if(t.Tanggal < fromYMD || t.Tanggal > toYMD_) return;
        if(t.Kategori === 'Terima Hutang' || t.Kategori === 'Top Up Hutang'){
          items.push({ tanggal: t.Tanggal, nama: t.Catatan || t.Kategori, sub: t.Akun || '', nominal: Number(t.Nominal), kind: 'trx' });
          total += Number(t.Nominal);
        }
      });
      STATE.hutangPiutang.forEach(function(h){
        if(!h.Tanggal || h.Tanggal < fromYMD || h.Tanggal > toYMD_) return;
        if(h.Bentuk !== 'Barang' || h.Jenis !== 'Hutang') return;
        var pokok = Number(h.Pokok) || 0;
        if(pokok <= 0) return;
        items.push({ tanggal: h.Tanggal, nama: h.Nama, sub: (h.Catatan || 'Barang/Jasa') + ' • Hutang', nominal: pokok, kind: 'hp', id: h.ID });
        total += pokok;
      });
    } else if(focus === 'hutang-kurang'){
      STATE.transaksi.forEach(function(t){
        if(t.Tanggal < fromYMD || t.Tanggal > toYMD_) return;
        if(t.Kategori !== 'Bayar Hutang') return;
        items.push({ tanggal: t.Tanggal, nama: t.Catatan || 'Bayar Hutang', sub: t.Akun || '', nominal: Number(t.Nominal), kind: 'trx' });
        total += Number(t.Nominal);
      });
    } else if(focus === 'piutang-tambah'){
      STATE.transaksi.forEach(function(t){
        if(t.Tanggal < fromYMD || t.Tanggal > toYMD_) return;
        if(t.Kategori === 'Beri Piutang' || t.Kategori === 'Top Up Piutang'){
          items.push({ tanggal: t.Tanggal, nama: t.Catatan || t.Kategori, sub: t.Akun || '', nominal: Number(t.Nominal), kind: 'trx' });
          total += Number(t.Nominal);
        }
      });
      STATE.hutangPiutang.forEach(function(h){
        if(!h.Tanggal || h.Tanggal < fromYMD || h.Tanggal > toYMD_) return;
        if(h.Bentuk !== 'Barang' || h.Jenis !== 'Piutang') return;
        var pokok = Number(h.Pokok) || 0;
        if(pokok <= 0) return;
        items.push({ tanggal: h.Tanggal, nama: h.Nama, sub: (h.Catatan || 'Barang/Jasa') + ' • Piutang', nominal: pokok, kind: 'hp', id: h.ID });
        total += pokok;
      });
    } else if(focus === 'piutang-kurang'){
      STATE.transaksi.forEach(function(t){
        if(t.Tanggal < fromYMD || t.Tanggal > toYMD_) return;
        if(t.Kategori !== 'Terima Piutang') return;
        items.push({ tanggal: t.Tanggal, nama: t.Catatan || 'Terima Piutang', sub: t.Akun || '', nominal: Number(t.Nominal), kind: 'trx' });
        total += Number(t.Nominal);
      });
    }

    items.sort(function(a,b){ return b.tanggal < a.tanggal ? -1 : b.tanggal > a.tanggal ? 1 : 0; });

    var isTambah = focus.indexOf('tambah') !== -1;
    var html = '<div class="sheet-title">' + title + '</div>' +
      '<div style="font-size:12.5px; color:var(--ink-faint); margin-bottom:6px;">' + fmtRangeLabel(parseYMD(fromYMD), parseYMD(toYMD_)) + '</div>' +
      '<div style="font-size:22px; font-weight:800; margin-bottom:14px;" class="num ' + (isTambah?'red':'green') + '">' +
        (isTambah?'+':'−') + fmtRupiah(total) + '</div>';

    if(!items.length){
      html += emptyState('Tidak ada data', 'Tidak ada catatan di rentang ini.');
    } else {
      items.forEach(function(it){
        html += '<div class="item-card"' + (it.kind==='hp' && it.id ? ' data-hpid="' + it.id + '"' : '') + '>' +
          '<div class="icon-badge ' + (isTambah?'red':'green') + '">' + (isTambah?ICON_EXPENSE:ICON_INCOME) + '</div>' +
          '<div class="item-main"><div class="item-title">' + esc(it.nama) + '</div>' +
          '<div class="item-sub">' + esc(it.tanggal) + (it.sub ? ' • ' + esc(it.sub) : '') + '</div></div>' +
          '<div class="item-amount ' + (isTambah?'red':'green') + ' num">' + (isTambah?'+':'−') + fmtRupiah(it.nominal) + '</div>' +
        '</div>';
      });
    }
    openSheet(html);
    document.querySelectorAll('.item-card[data-hpid]').forEach(function(card){
      card.addEventListener('click', function(){
        openHutangDetail(card.dataset.hpid);
      });
    });
  }

  function renderRekap(){
    var el = document.getElementById('view-rekap');
    var segHtml = '<div class="segmented" id="rekap-segmented">' +
      [['realtime','Realtime'],['bulanan','Bulanan'],['custom','Custom']].map(function(s){
        return '<button data-s="' + s[0] + '" class="' + (rekapSubTab===s[0]?'active':'') + '">' + s[1] + '</button>';
      }).join('') + '</div>';
    el.innerHTML = segHtml + '<div id="rekap-body"></div>';
    document.querySelectorAll('#rekap-segmented button').forEach(function(b){
      b.addEventListener('click', function(){ rekapSubTab = b.dataset.s; renderRekap(); });
    });
    if(rekapSubTab === 'realtime') renderRekapRealtime();
    else if(rekapSubTab === 'bulanan') renderRekapBulanan();
    else renderRekapCustom();
  }

  function renderRekapRealtime(){
    var body = document.getElementById('rekap-body');
    var today = new Date();
    var y = today.getFullYear(), m = today.getMonth();
    var fromD = new Date(y, m, 1), toD = new Date(y, m, lastDayOfMonth(y, m));
    var fromYMD = toYMD(fromD), toYMD_ = toYMD(toD);
    var data = computeRekap(fromYMD, toYMD_);
    var hasData = data.pengeluaran || data.pemasukan || data.hutangTambah || data.hutangKurang || data.piutangTambah || data.piutangKurang;
    body.innerHTML = '<div style="text-align:center; font-weight:700; font-size:14px; margin:4px 0 14px;">' + fmtRangeLabel(fromD, toD) + '</div>' +
      (hasData ? rekapCardHtml('Bulan Berjalan', data, fromYMD, toYMD_) : emptyState('Tidak ada data', 'Belum ada transaksi di bulan ini.'));
    wireRekapCards(body);
  }

  function monthsWithData(){
    var set = {};
    STATE.transaksi.forEach(function(t){ var d = parseYMD(t.Tanggal); set[d.getFullYear()+'-'+d.getMonth()] = true; });
    STATE.hutangPiutang.forEach(function(h){ if(h.Tanggal){ var d = parseYMD(h.Tanggal); set[d.getFullYear()+'-'+d.getMonth()] = true; } });
    var today = new Date();
    delete set[today.getFullYear()+'-'+today.getMonth()];
    var arr = Object.keys(set).map(function(k){ var p = k.split('-'); return { y: Number(p[0]), m: Number(p[1]) }; });
    arr.sort(function(a,b){ return (b.y*12+b.m) - (a.y*12+a.m); });
    return arr;
  }

  function renderRekapBulanan(){
    var body = document.getElementById('rekap-body');
    var months = monthsWithData();
    if(!months.length){
      body.innerHTML = emptyState('Tidak ada data', 'Belum ada riwayat bulan sebelumnya.');
      return;
    }
    var html = '';
    months.forEach(function(mo){
      var fromD = new Date(mo.y, mo.m, 1), toD = new Date(mo.y, mo.m, lastDayOfMonth(mo.y, mo.m));
      var fromYMD = toYMD(fromD), toYMD_ = toYMD(toD);
      var data = computeRekap(fromYMD, toYMD_);
      html += rekapCardHtml(fmtRangeLabel(fromD, toD), data, fromYMD, toYMD_);
    });
    body.innerHTML = html;
    wireRekapCards(body);
  }

  function renderRekapCustom(){
    var body = document.getElementById('rekap-body');
    var today = toYMD(new Date());
    body.innerHTML =
      '<div class="custom-range-box">' +
        '<div class="row-2 form-group" style="margin-bottom:8px;">' +
          '<div><label class="form-label">Dari</label><input class="form-input" id="f-rekap-dari" type="date" value="' + today + '"></div>' +
          '<div><label class="form-label">Sampai</label><input class="form-input" id="f-rekap-sampai" type="date" value="' + today + '"></div>' +
        '</div>' +
        '<button class="btn-primary" id="btn-rekap-terapkan" style="margin-top:0;">Terapkan</button>' +
      '</div>' +
      '<div id="rekap-custom-result"></div>';
    document.getElementById('btn-rekap-terapkan').addEventListener('click', function(){
      var fromYMD = document.getElementById('f-rekap-dari').value;
      var toYMD_ = document.getElementById('f-rekap-sampai').value;
      var resEl = document.getElementById('rekap-custom-result');
      if(!fromYMD || !toYMD_){ toast('Pilih tanggal dari dan sampai'); return; }
      if(fromYMD > toYMD_){ toast('Tanggal "Dari" tidak boleh setelah "Sampai"'); return; }
      var data = computeRekap(fromYMD, toYMD_);
      resEl.innerHTML = rekapCardHtml(fmtRangeLabel(parseYMD(fromYMD), parseYMD(toYMD_)), data, fromYMD, toYMD_);
      wireRekapCards(resEl);
    });

  function categoryBreakdown(trx, jenis){
    var map = {};
    trx.forEach(function(t){
      if(t.Jenis !== jenis) return;
      if(isTransferLeg(t)) return;
      var k = t.Kategori || 'Tanpa Kategori';
      map[k] = (map[k] || 0) + Number(t.Nominal);
    });
    var arr = Object.keys(map).map(function(k){ return { kategori: k, total: map[k] }; });
    arr.sort(function(a,b){ return b.total - a.total; });
    return arr;
  }

  function svgBarCompare(pemasukan, pengeluaran){
    var max = Math.max(pemasukan, pengeluaran, 1);
    var chartH = 120;
    var hIn = Math.round((pemasukan/max) * chartH);
    var hOut = Math.round((pengeluaran/max) * chartH);
    return '<svg viewBox="0 0 240 165" style="width:100%; max-width:260px; display:block; margin:8px auto 4px;">' +
      '<rect x="35" y="' + (chartH-hIn+10) + '" width="60" height="' + Math.max(hIn,2) + '" rx="6" fill="#1FAA6D"/>' +
      '<rect x="145" y="' + (chartH-hOut+10) + '" width="60" height="' + Math.max(hOut,2) + '" rx="6" fill="#E5484D"/>' +
      '<text x="65" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#1FAA6D">' + numOnly(pemasukan) + '</text>' +
      '<text x="175" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#E5484D">' + numOnly(pengeluaran) + '</text>' +
      '<text x="65" y="150" text-anchor="middle" font-size="12" fill="#5B6478">Pemasukan</text>' +
      '<text x="175" y="150" text-anchor="middle" font-size="12" fill="#5B6478">Pengeluaran</text>' +
    '</svg>';
  }

  function svgDailyTrend(trx, fromYMD, toYMD_){
    var start = parseYMD(fromYMD), end = parseYMD(toYMD_);
    var days = [];
    var d = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    var guard = 0;
    while(d <= end && guard < 62){ days.push(toYMD(d)); d.setDate(d.getDate()+1); guard++; }
    if(days.length < 2) return '';
    var map = {};
    trx.forEach(function(t){
      if(t.Jenis === 'Pengeluaran' && !isTransferLeg(t)) map[t.Tanggal] = (map[t.Tanggal]||0) + Number(t.Nominal);
    });
    var max = 1;
    days.forEach(function(dy){ if((map[dy]||0) > max) max = map[dy]; });
    var barW = 9, gap = 5, chartH = 90;
    var svgW = days.length * (barW+gap);
    var bars = days.map(function(dy, i){
      var val = map[dy] || 0;
      var h = Math.max(Math.round((val/max) * chartH), val>0?2:0);
      var x = i * (barW+gap);
      return '<rect x="' + x + '" y="' + (chartH-h) + '" width="' + barW + '" height="' + h + '" rx="2" fill="' + (val>0?'#E5484D':'#E7EBF2') + '"/>';
    }).join('');
    return '<div style="margin-top:18px;"><div class="riwayat-title" style="margin-bottom:10px;">Tren Pengeluaran Harian</div>' +
      '<div style="overflow-x:auto;"><svg viewBox="0 0 ' + svgW + ' ' + chartH + '" style="width:' + Math.max(svgW,280) + 'px; height:' + chartH + 'px; display:block;">' + bars + '</svg></div></div>';
  }

  function renderKategoriRows(items, colorVar){
    if(!items.length) return '<div class="riwayat-empty">Tidak ada data.</div>';
    var max = items[0].total || 1;
    return items.map(function(it){
      var pct = Math.round((it.total/max) * 100);
      return '<div class="kategori-row" data-kategori="' + esc(it.kategori) + '">' +
        '<div class="kategori-row-top"><span>' + esc(it.kategori) + '</span><span class="num">' + numOnly(it.total) + ' <span class="chev">›</span></span></div>' +
        '<div class="kategori-bar-track"><div class="kategori-bar-fill" style="width:' + pct + '%; background:' + colorVar + ';"></div></div>' +
      '</div>';
    }).join('');
  }

  function openRekapDetail(fromYMD, toYMD_, presetTab){
    var detailTab = presetTab || 'kategori';

    function renderDetail(){
      var trx = STATE.transaksi.filter(function(t){ return t.Tanggal >= fromYMD && t.Tanggal <= toYMD_; });
      var html =
        '<div class="sheet-title" style="display:flex; align-items:center; justify-content:space-between;">' +
          '<span>' + fmtRangeLabel(parseYMD(fromYMD), parseYMD(toYMD_)) + '</span>' +
          '<span style="display:flex; gap:6px; flex:0 0 auto;">' +
            '<button class="export-icon-btn" id="btn-export-xlsx" title="Export Excel">' + ICON_DOWNLOAD + '<span>XLS</span></button>' +
            '<button class="export-icon-btn" id="btn-export-pdf" title="Export PDF">' + ICON_DOWNLOAD + '<span>PDF</span></button>' +
          '</span>' +
        '</div>' +
        '<div class="segmented" id="rekapdetail-segmented">' +
          [['grafik','Grafik'],['kategori','Kategori'],['transaksi','Transaksi']].map(function(s){
            return '<button data-s="' + s[0] + '" class="' + (detailTab===s[0]?'active':'') + '">' + s[1] + '</button>';
          }).join('') +
        '</div>';

      if(!trx.length){
        html += emptyState('Tidak ada data', 'Tidak ada transaksi pada rentang ini.');
      } else if(detailTab === 'grafik'){
        var d = computeRekap(fromYMD, toYMD_);
        html += svgBarCompare(d.pemasukan, d.pengeluaran);
        html += svgDailyTrend(trx, fromYMD, toYMD_);
      } else if(detailTab === 'kategori'){
        var pengKat = categoryBreakdown(trx, 'Pengeluaran');
        var masKat = categoryBreakdown(trx, 'Pemasukan');
        html += '<div class="riwayat-title" style="margin-top:14px;">Pengeluaran per Kategori</div>' + renderKategoriRows(pengKat, 'var(--red)');
        html += '<div class="riwayat-title" style="margin-top:18px;">Pemasukan per Kategori</div>' + renderKategoriRows(masKat, 'var(--green)');
      } else {
        var byDay = {};
        trx.forEach(function(t){ (byDay[t.Tanggal] = byDay[t.Tanggal] || []).push(t); });
        var days = Object.keys(byDay).sort().reverse();
        days.forEach(function(day){
          html += '<div class="day-group"><div class="day-heading"><span>' + fmtDayHeading(day) + '</span></div>';
          byDay[day].forEach(function(t){
            var isIn = t.Jenis === 'Pemasukan';
            var isTransfer = isTransferLeg(t);
            var badgeClass = isTransfer ? 'blue' : (isIn ? 'green' : 'red');
            var icon = isTransfer ? ICON_TRANSFER : (isIn ? ICON_INCOME : ICON_EXPENSE);
            var amountClass = isTransfer ? 'blue' : (isIn ? 'green' : 'red');
            html += '<div class="item-card">' +
              '<div class="icon-badge ' + badgeClass + '">' + icon + '</div>' +
              '<div class="item-main"><div class="item-title">' + esc(t.Kategori || (isIn?'Pemasukan':'Pengeluaran')) + '</div>' +
              '<div class="item-sub">' + esc(t.Akun || '-') + (t.Catatan ? ' • ' + esc(t.Catatan) : '') + '</div></div>' +
              '<div class="item-amount ' + amountClass + ' num">' + (isTransfer ? '' : (isIn?'+':'-')) + fmtRupiah(t.Nominal) + '</div>' +
            '</div>';
          });
          html += '</div>';
        });
      }

      openSheet(html);

      document.querySelectorAll('#rekapdetail-segmented button').forEach(function(b){
        b.addEventListener('click', function(){ detailTab = b.dataset.s; renderDetail(); });
      });
      document.querySelectorAll('.kategori-row').forEach(function(row){
        row.addEventListener('click', function(){

  function openKategoriTransaksi(kategori, fromYMD, toYMD_){
    var trx = STATE.transaksi.filter(function(t){
      return t.Tanggal >= fromYMD && t.Tanggal <= toYMD_ && (t.Kategori || 'Tanpa Kategori') === kategori;
    });
    var html = '<div class="sheet-title">' + esc(kategori) + '</div>' +
      '<div style="font-size:12.5px; color:var(--ink-faint); margin-bottom:10px;">' + fmtRangeLabel(parseYMD(fromYMD), parseYMD(toYMD_)) + '</div>';
    if(!trx.length){
      html += emptyState('Tidak ada data', 'Tidak ada transaksi.');
    } else {
      trx.sort(function(a,b){ return b.Tanggal < a.Tanggal ? -1 : b.Tanggal > a.Tanggal ? 1 : 0; });
      trx.forEach(function(t){
        var isIn = t.Jenis === 'Pemasukan';
        html += '<div class="item-card">' +
          '<div class="icon-badge ' + (isIn?'green':'red') + '">' + (isIn?ICON_INCOME:ICON_EXPENSE) + '</div>' +
          '<div class="item-main"><div class="item-title">' + esc(t.Tanggal) + '</div>' +
          '<div class="item-sub">' + esc(t.Akun || '-') + (t.Catatan ? ' • ' + esc(t.Catatan) : '') + '</div></div>' +
          '<div class="item-amount ' + (isIn?'green':'red') + ' num">' + (isIn?'+':'-') + fmtRupiah(t.Nominal) + '</div>' +
        '</div>';
      });
    }
    openSheet(html);
  }

  function doExport(format, fromYMD, toYMD_, btn){
    var original = btn.innerHTML;
    btn.innerHTML = '<span>...</span>';
    var label = fmtRangeLabel(parseYMD(fromYMD), parseYMD(toYMD_));
    google.script.run.withSuccessHandler(function(res){
      btn.innerHTML = original;
      var url = 'https://docs.google.com/spreadsheets/d/' + res.spreadsheetId + '/export?format=' + format + '&gid=' + res.sheetId +
        (format === 'pdf' ? '&size=A4&portrait=true&fitw=true&gridlines=false' : '');
      window.open(url, '_blank');
      toast('Export siap, membuka di tab baru…');
    }).withFailureHandler(function(err){
      btn.innerHTML = original;
      toast('Gagal export: ' + err.message);
    }).generateRekapExport({ fromYMD: fromYMD, toYMD: toYMD_, labelRange: label });
  }

  function closeSheet(){
    overlay.classList.remove('show'); sheet.classList.remove('show');

  window.addEventListener('popstate', function(){

    // the sheet is already hidden by then), or from the user pressing the phone's
    // back button while the sheet is open — in which case we close the sheet
    // instead of letting the browser navigate away from the app.
    if(sheet.classList.contains('show')){
      overlay.classList.remove('show'); sheet.classList.remove('show');

  function submitTrxForm(today){
    var nominal = rawNum('f-nominal');
    var tanggal = document.getElementById('f-tanggal').value;
    if(!nominal || nominal <= 0){ toast('Nominal harus diisi'); return; }
    if(!tanggal){ toast('Tanggal harus diisi'); return; }
    var btn = document.getElementById('btn-save-trx');

    if(trxSumber === 'Hutang' && trxJenis === 'Pengeluaran'){
      var kategori = document.getElementById('f-kategori').value.trim();
      var namaHutang = document.getElementById('f-h-nama').value.trim() || kategori || 'Pembelian';
      var payload = {
        jenis: 'Hutang', nama: namaHutang, metode: trxHutangMetode, bentuk: 'Barang',
        pokok: nominal, tanggal: tanggal, kategori: kategori,
        jatuhTempo: document.getElementById('f-h-tempo') ? document.getElementById('f-h-tempo').value : '',
        catatan: document.getElementById('f-catatan').value || ''
      };
      if(trxHutangMetode === 'Cicilan Tetap'){
        var tenor = Number(document.getElementById('f-h-tenor').value);
        if(!tenor || tenor <= 0){ toast('Tenor harus diisi'); return; }
        payload.tenor = tenor;
        payload.bungaPersen = Number(document.getElementById('f-h-bunga-persen').value) || 0;
        payload.bungaNominal = rawNum('f-h-bunga-nominal') || 0;
      } else if(trxHutangMetode === 'Paylater'){
        payload.biayaLayanan = rawNum('f-h-biaya') || 0;
      }
      saveOptimistic('Dicatat sebagai Hutang', function(ok, fail){
        google.script.run.withSuccessHandler(function(data){
          ok(data);
          var hb = document.querySelector('#bottomnav button[data-tab="hutang"]');
          if(hb) hb.click();
        }).withFailureHandler(fail).addHutangPiutang(payload);
      });
      return;
    }

    if(trxSumber === 'Reimburse' && trxJenis === 'Pengeluaran'){
      var akun = document.getElementById('f-akun').value;
      if(!akun){ toast('Pilih sumber rekening'); return; }
      var payload = {
        nominal: nominal, akun: akun, tanggal: tanggal,
        persentase: Math.max(0, Math.min(100, Number(document.getElementById('f-reimburse-persen').value) || 0)),
        kategori: document.getElementById('f-kategori').value,
        catatan: document.getElementById('f-catatan').value
      };
      saveOptimistic('Transaksi Reimburse dicatat', function(ok, fail){
        google.script.run.withSuccessHandler(ok).withFailureHandler(fail).addReimburseTransaksi(payload);
      });
      return;
    }

    var payload = {
      jenis: trxJenis, nominal: nominal, tanggal: tanggal,
      akun: document.getElementById('f-akun').value,
      kategori: document.getElementById('f-kategori').value,
      catatan: document.getElementById('f-catatan').value
    };
    saveOptimistic('Transaksi disimpan', function(ok, fail){
      google.script.run.withSuccessHandler(ok).withFailureHandler(fail).addTransaksi(payload);
    });
  }

  function addMonthsJS(ymd, n){
    if(!ymd) return '';
    var d = parseYMD(ymd);
    var day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    var lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day, lastDay));
    return toYMD(d);
  }

        if(lock) return; lock = true;
        var pokok = rawNum(pokokEl)||0, persen = Number(persenEl.value)||0;

        if(lock) return; lock = true;

        updateCicilanPreview(); lock = false;

      nominalEl.addEventListener('input', fromNominal);

    var payload = {
      jenis: hpJenis, nama: nama, metode: hpMetode, bentuk: bentuk, pokok: pokok, tanggal: tanggal,

      catatan: document.getElementById('f-catatan').value

      payload.biayaLayanan = rawNum('f-biaya') || 0;

      google.script.run.withSuccessHandler(ok).withFailureHandler(fail).addHutangPiutang(payload);
    });
  }

          'Kamu belum punya rekening. Tambahkan rekening dulu di tab <b>Rekening</b> untuk bisa mencatat pembayaran ' + (isHutang?'hutang':'piutang') + ' ini.</div>';
      } else {
        html += '<div class="form-group" style="margin-top:16px;"><label class="form-label">Nominal Bayar</label>' +
          '<input class="form-input num num-input" id="f-bayar-nominal" type="text" inputmode="numeric" value="' + ribuanStr(defaultBayar) + '"' +
          (h.Metode==='Cicilan Tetap'||h.Metode==='Paylater'||h.Metode==='Sekaligus' ? ' readonly' : '') + '></div>' +
          '<div class="form-group"><label class="form-label">Tanggal Bayar</label><input class="form-input" id="f-bayar-tanggal" type="date" value="' + today + '"></div>' +
          '<div class="form-group"><label class="form-label">' + (isHutang ? 'Bayar Dari Rekening' : 'Uang Diterima ke Rekening') + '</label>' +
          '<select class="form-select" id="f-akun-lunas">' + accountOptions() + '</select></div>' +
          '<button class="btn-primary" id="btn-bayar">' + payLabel + '</button>';
      }
    }
    html += '<div class="riwayat-title">Riwayat Pembayaran</div><div id="riwayat-list"><div class="riwayat-empty">Memuat…</div></div>';
    html += '<button class="btn-danger-text" id="btn-del-hp">' + ICON_TRASH + ' &nbsp;Hapus Catatan</button>';
    openSheet(html);

    document.getElementById('btn-edit-hp').addEventListener('click', function(){ openHutangEditForm(h); });
    document.getElementById('btn-topup-hp').addEventListener('click', function(){ openTopUpForm(h); });
    var btnSinkron = document.getElementById('btn-sinkron-hp');
    if(btnSinkron){
      btnSinkron.addEventListener('click', function(){
        btnSinkron.textContent = 'Menyinkronkan…';
        google.script.run.withSuccessHandler(function(data){
          refreshState(data);
          toast('Sudah masuk Transaksi & Rekap');
          openHutangDetail(id);
        }).withFailureHandler(function(err){
          btnSinkron.textContent = 'Masukkan ke Transaksi & Rekap';
          toast('Gagal: ' + err.message);
        }).sinkronHutangBarang(id);
      });
    }

    google.script.run.withSuccessHandler(function(list){
      var box = document.getElementById('riwayat-list');
      if(!box) return;
      if(!list.length){ box.innerHTML = '<div class="riwayat-empty">Belum ada pembayaran.</div>'; return; }
      box.innerHTML = list.map(function(p){
        return '<div class="riwayat-row"><span class="d">' + esc(p.Tanggal) + '</span><span class="num">' + fmtRupiah(p.Nominal) + '</span>' +
          '<button class="riwayat-del-btn" data-pid="' + p.ID + '">' + ICON_TRASH + '</button></div>';
      }).join('');
      box.querySelectorAll('.riwayat-del-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          if(!confirm('Hapus pembayaran ini? Sisa hutang dan saldo rekening akan dikembalikan seperti sebelum pembayaran ini dicatat.')) return;
          google.script.run.withSuccessHandler(function(data){
            refreshState(data); toast('Pembayaran dihapus, saldo dikembalikan'); openHutangDetail(id);
          }).withFailureHandler(function(err){ toast('Gagal: ' + err.message); }).hapusPembayaran(btn.dataset.pid);
        });
      });
    }).withFailureHandler(function(){}).getRiwayatPembayaran(id);

    if(!lunas && STATE.rekening.length){
      document.getElementById('btn-bayar').addEventListener('click', function(){
        var nominal = rawNum('f-bayar-nominal');
        var tanggalBayar = document.getElementById('f-bayar-tanggal').value;
        var akun = document.getElementById('f-akun-lunas').value;
        if(!nominal || nominal <= 0){ toast('Nominal bayar harus diisi'); return; }
        if(!akun){ toast('Pilih rekening sumber dana'); return; }
        var payload = { id: id, nominal: nominal, tanggal: tanggalBayar, catatAsTransaksi: true, akun: akun };
        saveOptimistic('Pembayaran dicatat', function(ok, fail){
          google.script.run.withSuccessHandler(ok).withFailureHandler(fail).bayarCicilan(payload);
        });
      });
    }
    document.getElementById('btn-del-hp').addEventListener('click', function(){
      if(!confirm('Hapus catatan ini beserta riwayat pembayarannya?')) return;
      closeSheet();
      var card = document.querySelector('.item-card[data-id="' + id + '"]');
      if(card) card.style.display = 'none';
      toastWithUndo('Catatan dihapus', function onUndo(){
        if(card) card.style.display = '';
      }, function onCommit(){
        google.script.run.withSuccessHandler(function(data){
          refreshState(data);
        }).withFailureHandler(function(err){ toast('Gagal: ' + err.message); if(card) card.style.display = ''; }).deleteHutangPiutang(id);
      });
    });
  }

  function openHutangEditForm(h){
    var isCicilanTetap = h.Metode === 'Cicilan Tetap';
    var isPaylater = h.Metode === 'Paylater';
    var html =
      '<div class="sheet-title">Edit ' + esc(h.Nama) + '</div>' +
      '<div class="form-group"><label class="form-label">Nama</label><input class="form-input" id="f-e-nama" type="text" value="' + esc(h.Nama) + '"></div>' +
      '<div class="form-group"><label class="form-label">' + (isCicilanTetap ? 'Pokok Pinjaman' : isPaylater ? 'Nominal Transaksi' : 'Total ' + h.Jenis) + '</label>' +
      '<input class="form-input num num-input" id="f-e-pokok" type="text" inputmode="numeric" value="' + ribuanStr(h.Pokok) + '"></div>';
    if(isCicilanTetap){
      html +=
        '<div class="form-group"><label class="form-label">Bunga</label>' +
          '<div class="bunga-toggle"><button type="button" class="active" data-bm="persen">Persen (%)</button><button type="button" data-bm="nominal">Nominal (Rp)</button></div>' +
          '<div class="row-2">' +
            '<input class="form-input num" id="f-e-bunga-persen" type="number" inputmode="decimal" value="' + (h.BungaPersen || '') + '">' +
            '<input class="form-input num num-input" id="f-e-bunga-nominal" type="text" inputmode="numeric" value="' + ribuanStr(h.BungaNominal) + '">' +
          '</div>' +
        '</div>' +
        '<div class="form-group"><label class="form-label">Tenor (bulan)</label><input class="form-input num" id="f-e-tenor" type="number" inputmode="numeric" value="' + h.Tenor + '"></div>' +
        '<div class="preview-box">' +
          '<div class="pr"><span>Total Hutang Baru</span><b class="num" id="e-prev-total">Rp 0</b></div>' +
          '<div class="pr"><span>Angsuran / bulan Baru</span><b class="num" id="e-prev-angsuran">Rp 0</b></div>' +
        '</div>';
    } else if(isPaylater){
      html += '<div class="form-group"><label class="form-label">Biaya Layanan (opsional)</label><input class="form-input num num-input" id="f-e-bunga-nominal" type="text" inputmode="numeric" value="' + ribuanStr(h.BungaNominal) + '"></div>';
    }
    html +=
      '<div class="form-group"><label class="form-label">Jatuh Tempo</label><input class="form-input" id="f-e-tempo" type="date" value="' + esc(h.JatuhTempo || '') + '"></div>' +
      '<div class="form-group"><label class="form-label">Catatan</label><input class="form-input" id="f-e-catatan" type="text" value="' + esc(h.Catatan || '') + '"></div>' +
      '<div style="font-size:11px; color:var(--ink-faint); margin:-8px 0 4px;">Bagian yang sudah terbayar tidak berubah — hanya sisa hutangnya yang menyesuaikan angka baru ini.</div>' +
      '<button class="btn-primary" id="btn-save-edit-hp">Simpan Perubahan</button>';
    openSheet(html);

    function updateEditPreview(){
      if(!isCicilanTetap) return;
      var pokok = rawNum('f-e-pokok') || 0;
      var bunga = rawNum('f-e-bunga-nominal') || 0;
      var tenor = Number(document.getElementById('f-e-tenor').value) || 1;
      document.getElementById('e-prev-total').textContent = fmtRupiah(pokok + bunga);
      document.getElementById('e-prev-angsuran').textContent = fmtRupiah(Math.round((pokok + bunga) / tenor));
    }
    if(isCicilanTetap){
      document.querySelectorAll('.bunga-toggle button').forEach(function(b){
        b.addEventListener('click', function(){
          document.querySelectorAll('.bunga-toggle button').forEach(function(x){ x.classList.remove('active'); });
          b.classList.add('active');
        });
      });
      var pokokEl = document.getElementById('f-e-pokok');
      var persenEl = document.getElementById('f-e-bunga-persen');
      var nominalEl = document.getElementById('f-e-bunga-nominal');
      var tenorEl = document.getElementById('f-e-tenor');
      var lock = false;
      function fromPersen(){ if(lock)return; lock=true; var p=rawNum(pokokEl)||0, per=Number(persenEl.value)||0; nominalEl.value = p&&per?ribuanStr(Math.round(p*per/100)):''; updateEditPreview(); lock=false; }
      function fromNominal(){ if(lock)return; lock=true; var p=rawNum(pokokEl)||0, n=rawNum(nominalEl)||0; persenEl.value = p&&n?Math.round((n/p*100)*10)/10:''; updateEditPreview(); lock=false; }
      persenEl.addEventListener('input', fromPersen);
      nominalEl.addEventListener('input', fromNominal);
      pokokEl.addEventListener('input', function(){ persenEl.value ? fromPersen() : fromNominal(); });
      tenorEl.addEventListener('input', updateEditPreview);
      updateEditPreview();
    } else if(isPaylater){
      document.getElementById('f-e-pokok').addEventListener('input', function(){});
    }

    document.getElementById('btn-save-edit-hp').addEventListener('click', function(){
      var nama = document.getElementById('f-e-nama').value.trim();
      var pokok = rawNum('f-e-pokok');
      if(!nama){ toast('Nama harus diisi'); return; }
      if(!pokok || pokok <= 0){ toast('Nominal harus diisi'); return; }
      var payload = {
        id: h.ID, nama: nama, pokok: pokok,
        jatuhTempo: document.getElementById('f-e-tempo').value,
        catatan: document.getElementById('f-e-catatan').value,
        tanggal: h.Tanggal
      };
      if(isCicilanTetap){
        var tenor = Number(document.getElementById('f-e-tenor').value);
        if(!tenor || tenor <= 0){ toast('Tenor harus diisi'); return; }
        payload.tenor = tenor;
        payload.bungaPersen = Number(document.getElementById('f-e-bunga-persen').value) || 0;
        payload.bungaNominal = rawNum('f-e-bunga-nominal');
      } else if(isPaylater){
        payload.bungaNominal = rawNum('f-e-bunga-nominal');
      }
      saveOptimistic('Perubahan disimpan', function(ok, fail){
        google.script.run.withSuccessHandler(ok).withFailureHandler(fail).updateHutangPiutang(payload);
      });
    });
  }

  function openTopUpForm(h){
    var today = toYMD(currentDate);
    var isHutang = h.Jenis === 'Hutang';
    var html =
      '<div class="sheet-title">Top Up ' + esc(h.Nama) + '</div>' +
      '<div class="form-group"><label class="form-label">Nominal Tambahan</label><input class="form-input num num-input" id="f-topup-nominal" type="text" inputmode="numeric" placeholder="0"></div>' +
      '<div class="form-group"><label class="form-label">Tanggal</label><input class="form-input" id="f-topup-tanggal" type="date" value="' + today + '"></div>';
    if(h.Bentuk === 'Tunai'){
      html += '<div class="form-group"><label class="form-label">' + (isHutang ? 'Rekening Sumber (uang masuk ke sini)' : 'Rekening Sumber (uang keluar dari sini)') + '</label>' +
        '<select class="form-select" id="f-topup-akun">' + accountOptions() + '</select></div>';
    } else {
      html += '<div style="font-size:11px; color:var(--ink-faint); margin:-8px 0 4px;">Ini hutang bentuk Barang/Jasa, jadi tambahan ini juga tidak dicatat sebagai transaksi rekening.</div>';
    }
    html += '<button class="btn-primary" id="btn-save-topup">Tambahkan</button>';
    openSheet(html);
    document.getElementById('btn-save-topup').addEventListener('click', function(){
      var nominalTambahan = rawNum('f-topup-nominal');
      var tanggal = document.getElementById('f-topup-tanggal').value;
      if(!nominalTambahan || nominalTambahan <= 0){ toast('Nominal tambahan harus diisi'); return; }
      if(!tanggal){ toast('Tanggal harus diisi'); return; }
      var akunEl = document.getElementById('f-topup-akun');
      if(h.Bentuk === 'Tunai' && (!akunEl || !akunEl.value)){ toast('Pilih rekening sumber dana'); return; }
      var payload = { id: h.ID, nominalTambahan: nominalTambahan, tanggal: tanggal, akun: akunEl ? akunEl.value : '' };
      saveOptimistic('Nominal berhasil ditambahkan', function(ok, fail){
        google.script.run.withSuccessHandler(ok).withFailureHandler(fail).topUpHutang(payload);
      });
    });
  }

  // ---- Tambah / Edit Rekening ----
  function openRekeningForm(){
    openSheet(
      '<div class="sheet-title">Tambah Rekening</div>' +
      '<div class="form-group"><label class="form-label">Nama Rekening</label><input class="form-input" id="f-nama" type="text" placeholder="Contoh: Kas Tunai, BCA, GoPay"></div>' +
      '<div class="form-group"><label class="form-label">Saldo Awal</label><input class="form-input num num-input" id="f-saldo" type="text" inputmode="numeric" placeholder="0"></div>' +
      '<button class="btn-primary" id="btn-save-rek">Simpan</button>'
    );
    document.getElementById('btn-save-rek').addEventListener('click', function(){
      var nama = document.getElementById('f-nama').value.trim();
      if(!nama){ toast('Nama rekening harus diisi'); return; }
      var payload = { nama: nama, saldoAwal: rawNum('f-saldo') || 0 };
      saveOptimistic('Rekening ditambahkan', function(ok, fail){
        google.script.run.withSuccessHandler(ok).withFailureHandler(fail).addRekening(payload);
      });
    });
  }

  function openReimburseDetail(r){
    var today = toYMD(currentDate);
    var otherAccounts = STATE.rekening.filter(function(x){ return x.Nama !== 'Reimburse'; });
    var saldo = Number(r.Saldo);
    var html =
      '<div class="sheet-title">Saldo Reimburse</div>' +
      '<div class="total-saldo-card"><div class="lbl">TOTAL KLAIM BELUM DICAIRKAN</div><div class="val num">' + fmtRupiah(saldo) + '</div></div>' +
      '<div style="font-size:12.5px; color:var(--ink-soft); line-height:1.6; margin-bottom:16px;">Ini kumpulan klaim reimburse dari transaksi yang kamu bayar duluan. Kalau kantor/pihak lain sudah mengganti uangnya, catat di sini biar masuk ke rekening yang benar.</div>';
    if(saldo <= 0 || !otherAccounts.length){
      html += emptyState('Belum ada yang bisa diklaim', saldo<=0 ? 'Saldo reimburse masih kosong.' : 'Tambahkan rekening lain dulu buat tujuan klaim.');
    } else {
      html +=
        '<div class="form-group"><label class="form-label">Rekening Tujuan</label><select class="form-select" id="f-claim-akun">' +
          otherAccounts.map(function(a){ return '<option value="' + esc(a.Nama) + '">' + esc(a.Nama) + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="form-group"><label class="form-label">Nominal Claim</label><input class="form-input num num-input" id="f-claim-nominal" type="text" inputmode="numeric" value="' + ribuanStr(saldo) + '"></div>' +
        '<div class="form-group"><label class="form-label">Tanggal</label><input class="form-input" id="f-claim-tanggal" type="date" value="' + today + '"></div>' +
        '<button class="btn-primary" id="btn-claim">Claim Sekarang</button>';
    }
    openSheet(html);
    var claimBtn = document.getElementById('btn-claim');
    if(claimBtn){
      claimBtn.addEventListener('click', function(){
        var akunTujuan = document.getElementById('f-claim-akun').value;
        var nominal = rawNum('f-claim-nominal');
        var tanggal = document.getElementById('f-claim-tanggal').value;
        if(!akunTujuan){ toast('Pilih rekening tujuan'); return; }
        if(!nominal || nominal <= 0){ toast('Nominal claim harus diisi'); return; }
        if(nominal > saldo){ toast('Nominal claim melebihi saldo reimburse'); return; }
        if(!tanggal){ toast('Tanggal harus diisi'); return; }
        var payload = { akunAsal: 'Reimburse', akunTujuan: akunTujuan, nominal: nominal, biayaAdmin: 0, tanggal: tanggal, catatan: 'Claim Reimburse' };
        saveOptimistic('Claim berhasil dicatat', function(ok, fail){
          google.script.run.withSuccessHandler(ok).withFailureHandler(fail).addTransfer(payload);
        });
      });
    }
  }

  function openRekeningEdit(id){
    var r = STATE.rekening.find(function(x){ return x.ID === id; });
    if(!r) return;
    openSheet(
      '<div class="sheet-title">Edit Rekening</div>' +
      '<div class="form-group"><label class="form-label">Nama Rekening</label><input class="form-input" id="f-nama" type="text" value="' + esc(r.Nama) + '"></div>' +
      '<div class="detail-row"><span class="k">Saldo Saat Ini</span><span class="v num">' + fmtRupiah(r.Saldo) + '</span></div>' +
      '<div class="form-group"><label class="form-label">Saldo Baru (sesuai kenyataan)</label><input class="form-input num num-input" id="f-saldo-baru" type="text" inputmode="numeric" value="' + ribuanStr(r.Saldo) + '"></div>' +
      '<div style="font-size:11px; color:var(--ink-faint); margin:-8px 0 12px; line-height:1.5;">Kalau beda dengan saldo sistem, selisihnya otomatis dicatat sebagai <b>Pemasukan</b> atau <b>Pengeluaran</b> kategori “Penyesuaian Saldo”.</div>' +
      '<button class="btn-primary" id="btn-update-rek">Simpan Perubahan</button>' +
      '<button class="btn-danger-text" id="btn-del-rek">' + ICON_TRASH + ' &nbsp;Hapus Rekening</button>'
    );
    document.getElementById('btn-update-rek').addEventListener('click', function(){
      var nama = document.getElementById('f-nama').value.trim();
      if(!nama){ toast('Nama rekening harus diisi'); return; }
      var payload = { id: id, nama: nama, saldoBaru: rawNum('f-saldo-baru') };
      if(payload.saldoBaru === null || payload.saldoBaru === undefined || isNaN(payload.saldoBaru)){
        toast('Saldo baru harus diisi'); return;
      }
      saveOptimistic('Rekening diperbarui', function(ok, fail){
        google.script.run.withSuccessHandler(ok).withFailureHandler(fail).updateRekening(payload);
      });
    });
    document.getElementById('btn-del-rek').addEventListener('click', function(){
      if(!confirm('Hapus rekening ini? Transaksi yang terkait tidak akan terhapus.')) return;
      closeSheet();
      var card = document.querySelector('.rekening-card[data-id="' + id + '"]');
      if(card) card.style.display = 'none';
      toastWithUndo('Rekening dihapus', function onUndo(){
        if(card) card.style.display = '';
      }, function onCommit(){
        google.script.run.withSuccessHandler(function(data){
          refreshState(data);
        }).withFailureHandler(function(err){ toast('Gagal: ' + err.message); if(card) card.style.display = ''; }).deleteRekening(id);
      });
    });
  }
</script>
</body>
</html>
