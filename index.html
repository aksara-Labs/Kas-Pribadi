  function submitTrxForm(today){
    if(__trxSubmitLock) return;
    var nominal = rawNum('f-nominal');
    var tanggal = document.getElementById('f-tanggal').value;
    if(!nominal || nominal <= 0){ toast('Nominal harus diisi'); flashFieldErr_('f-nominal'); return; }
    if(!tanggal){ toast('Tanggal harus diisi'); flashFieldErr_('f-tanggal'); return; }
    // JANGAN kunci dulu — validasi dulu, baru kunci saat benar-benar simpan

    if(trxSumber === 'Hutang' && trxJenis === 'Pengeluaran'){
      var kategori = (document.getElementById('f-kategori') && document.getElementById('f-kategori').value || '').trim();
      if(!kategori){ toast('Pilih kategori'); flashFieldErr_('f-kategori'); return; }
      if(kategori === 'Lainnya'){
        var customKat = (document.getElementById('f-kategori-custom') && document.getElementById('f-kategori-custom').value || '').trim();
        if(!customKat){ toast('Isi nama kategori baru'); return; }
        kategori = customKat;
        saveCustomKategori_(kategori);
      }
      if(/^transport$/i.test(kategori)){
        var tsub = window.__trxTransportSub || '';
        if(!tsub){ toast('Pilih jenis transport: BBM, Parkir, dll'); return; }
        kategori = tsub;
        saveCustomKategori_(kategori);
      }
      var untuk = window.__trxUntuk || 'Pribadi';
      if(!untuk){ toast('Pilih pengeluaran untuk siapa'); return; }
      var tempat = (document.getElementById('f-tempat') && document.getElementById('f-tempat').value || '').trim();
      var sp = (typeof tempatFieldSpec_ === 'function') ? tempatFieldSpec_(kategori) : { label:'Beli di mana', prefix:'di' };
      if(!tempat){ toast('Isi ' + (sp.label || 'detail').toLowerCase()); flashFieldErr_('f-tempat'); return; }
      var catatanParts = ['Untuk: ' + untuk];
      if(sp.prefix) catatanParts.push(sp.prefix + ' ' + tempat);
      else catatanParts.push(tempat);
      var catatanExtra = (document.getElementById('f-catatan') && document.getElementById('f-catatan').value || '').trim();
      if(catatanExtra) catatanParts.push(catatanExtra);
      var namaHutang = (document.getElementById('f-h-nama') && document.getElementById('f-h-nama').value || '').trim() || kategori || 'Pembelian';
      var payload = {
        jenis: 'Hutang', nama: namaHutang, metode: trxHutangMetode, bentuk: 'Barang',
        pokok: nominal, tanggal: tanggal, kategori: kategori,
        jatuhTempo: document.getElementById('f-h-tempo') ? document.getElementById('f-h-tempo').value : '',
        catatan: catatanParts.join(' • ')
      };
      if(trxHutangMetode === 'Cicilan Tetap'){
        var tenor = Number(document.getElementById('f-h-tenor').value);
        if(!tenor || tenor <= 0){ toast('Tenor harus diisi'); return; }
        payload.tenor = tenor;
        payload.bungaPersen = Number(document.getElementById('f-h-bunga-persen').value) || 0;
        payload.bungaNominal = rawNum('f-h-bunga-nominal') || 0;
      } else if(trxHutangMetode === 'Paylater'){
        payload.biayaLayanan = rawNum('f-h-biaya') || 0;
      }
      __trxSubmitLock = true;
      setTimeout(unlockTrxSubmit_, 3000);
      saveOptimistic('Dicatat sebagai Hutang', function(ok, fail){
        google.script.run.withSuccessHandler(function(data){
          unlockTrxSubmit_();
          ok(data);
          var hb = document.querySelector('#bottomnav button[data-tab="hutang"]');
          if(hb) hb.click();
        }).withFailureHandler(function(err){ unlockTrxSubmit_(); fail(err); }).addHutangPiutang(payload);
      });
      return;
    }

    if(trxSumber === 'Reimburse' && trxJenis === 'Pengeluaran'){
      var akun = document.getElementById('f-akun').value;
      if(!akun){ toast('Pilih sumber rekening'); flashFieldErr_('f-akun'); return; }
      var payload = {
        nominal: nominal, akun: akun, tanggal: tanggal,
        persentase: Math.max(0, Math.min(100, Number(document.getElementById('f-reimburse-persen').value) || 0)),
        kategori: document.getElementById('f-kategori').value,
        catatan: document.getElementById('f-catatan').value
      };
      __trxSubmitLock = true;
      setTimeout(unlockTrxSubmit_, 3000);
      saveOptimistic('Transaksi Reimburse dicatat', function(ok, fail){
        google.script.run.withSuccessHandler(function(d){ unlockTrxSubmit_(); ok(d); })
          .withFailureHandler(function(err){ unlockTrxSubmit_(); fail(err); }).addReimburseTransaksi(payload);
      });
      return;
    }

    var akun = document.getElementById('f-akun').value;
    var kategori = (document.getElementById('f-kategori').value || '').trim();
    if(!akun){ toast('Pilih akun'); flashFieldErr_('f-akun'); return; }
    if(!kategori){ toast('Pilih kategori'); flashFieldErr_('f-kategori'); return; }

    // Lainnya → input manual jadi kategori baru
    if(kategori === 'Lainnya'){
      var customKat = (document.getElementById('f-kategori-custom') && document.getElementById('f-kategori-custom').value || '').trim();
      if(!customKat){ toast('Isi nama kategori baru'); return; }
      if(customKat === 'Lainnya'){ toast('Pakai nama kategori yang lebih spesifik'); return; }
      kategori = customKat;
      saveCustomKategori_(kategori);
    }
    // Transport → wajib pilih sub (BBM / Parkir / …)
    if(/^transport$/i.test(kategori)){
      var tsub = window.__trxTransportSub || '';
      if(!tsub){ toast('Pilih jenis transport: BBM, Parkir, dll'); return; }
      kategori = tsub;
      saveCustomKategori_(kategori);
    }

    var catatanExtra = (document.getElementById('f-catatan') && document.getElementById('f-catatan').value) || '';
    var catatanParts = [];

    if(trxJenis === 'Pengeluaran'){
      var untuk = window.__trxUntuk || 'Pribadi';
      if(!untuk){ toast('Pilih pengeluaran untuk siapa'); return; }
      catatanParts.push('Untuk: ' + untuk);

      var tempat = (document.getElementById('f-tempat') && document.getElementById('f-tempat').value || '').trim();
      var sp = (typeof tempatFieldSpec_ === 'function') ? tempatFieldSpec_(kategori) : { label:'Beli di mana', prefix:'di' };
      if(!tempat){ toast('Isi ' + (sp.label || 'detail').toLowerCase()); flashFieldErr_('f-tempat'); return; }
      if(sp.prefix) catatanParts.push(sp.prefix + ' ' + tempat);
      else catatanParts.push(tempat);
      var bidEl = document.getElementById('f-liburan-id');
      if(bidEl && bidEl.value){
        catatanParts.push('LiburanID:' + bidEl.value);
        var bb = (STATE.budgetLiburan || []).filter(function(x){ return x.ID === bidEl.value; })[0];
        if(bb) catatanParts.push('Liburan: ' + bb.Nama);
      }
    }
    if(catatanExtra.trim()) catatanParts.push(catatanExtra.trim());
    if(window.__trxFotoDataUrl) catatanParts.push('[Foto]');

    var budgetIdVal = '';
    var bidEl = document.getElementById('f-liburan-id');
    if(bidEl && bidEl.value) budgetIdVal = bidEl.value;
    var untukVal = (trxJenis === 'Pengeluaran') ? (window.__trxUntuk || 'Pribadi') : '';
    var tempId = 'local-' + Date.now() + '-' + Math.floor(Math.random() * 1e6);
    var payload = {
      jenis: trxJenis, nominal: nominal, tanggal: tanggal,
      akun: akun,
      kategori: kategori,
      catatan: catatanParts.join(' • '),
      budgetId: budgetIdVal,
      untuk: untukVal,
      clientKey: tempId
    };

    // Semua valid — baru kunci tombol (cegah double-tap)
    __trxSubmitLock = true;
    var bSave = document.getElementById('btn-save-trx');
    if(bSave){ bSave.dataset.busy = '1'; bSave.disabled = true; bSave.textContent = 'Menyimpan…'; }
    setTimeout(unlockTrxSubmit_, 2500);
    // Langsung tampil di list (optimistic), baru sync ke server
    var localRow = {
      ID: tempId,
      Tanggal: tanggal,
      Jenis: trxJenis,
      Kategori: kategori,
      Akun: akun,
      Nominal: nominal,
      Catatan: payload.catatan,
      BudgetId: budgetIdVal || '',
      Untuk: untukVal || ''
    };
    if(window.__trxFotoDataUrl){
      saveTrxFoto_(fotoKeyFromTrx_(localRow), window.__trxFotoDataUrl);
    }
    STATE.transaksi = [localRow].concat(STATE.transaksi || []);
    // Update saldo rekening kasar di UI
    STATE.rekening.forEach(function(r){
      if(r.Nama === akun){
        var s = Number(r.Saldo) || 0;
        r.Saldo = trxJenis === 'Pemasukan' ? s + nominal : s - nominal;
      }
    });
    try { localStorage.setItem('kasCacheV1', JSON.stringify(STATE)); } catch(e){}
    closeSheet();
    toast('Tersimpan');
    __kasSyncing++;
    updateSyncPill_();
    renderAll();

    function pushTrxToServer_(){
      google.script.run.withSuccessHandler(function(data){
        __kasSyncing = Math.max(0, __kasSyncing - 1);
        updateSyncPill_();
        if(data){
          STATE.transaksi = (STATE.transaksi || []).filter(function(x){ return x.ID !== tempId; });
          if(data.trxPatch || data.delta){
            applyDelta_(data);
          } else if(data){
            applyDelta_(data);
          }
          // Jangan full renderAll — list sudah tampil; cukup patch ID di DOM jika ada
          try {
            var card = document.querySelector('.item-card[data-id="' + tempId + '"], .trx-card[data-id="' + tempId + '"]');
            var newId = null;
            if(data.trxPatch && data.trxPatch.upsert && data.trxPatch.upsert[0])
              newId = data.trxPatch.upsert[0].ID;
            else if(data.transaksi && data.transaksi[0]) newId = data.transaksi[0].ID;
            if(card && newId){
              card.setAttribute('data-id', newId);
              // update local row id if still in STATE
              (STATE.transaksi || []).forEach(function(x){ if(x.ID === tempId) x.ID = newId; });
            }
            // jangan full re-render — list sudah benar
          } catch(e){}
          try { localStorage.setItem('kasCacheV1', JSON.stringify(STATE)); } catch(e){}
          /* tersimpan silent */
          try { clearOfflineFlag_(); } catch(e){}
          try { warmServer_(); } catch(e){}
        } else {
          toast('Server tidak mengembalikan data');
        }
      }).withFailureHandler(function(err){
        __kasSyncing = Math.max(0, __kasSyncing - 1);
        updateSyncPill_();
        try { localStorage.setItem('kasCacheV1', JSON.stringify(STATE)); } catch(e){}
        toast((err && err.message ? err.message : 'Gagal ke server') + ' — masih di HP');
      }).addTransaksi(payload);
    }
    // Jika PIN aktif tapi belum ada sesi server → minta PIN dulu
    pushTrxToServer_();
  }

      if(!nominal || nominal <= 0){ toast('Nominal harus diisi'); flashFieldErr_('f-e-nominal'); return; }
      if(!tanggal){ toast('Tanggal harus diisi'); flashFieldErr_('f-e-tanggal'); return; }
      var newAkun = document.getElementById('f-e-akun').value;
      var newKat = document.getElementById('f-e-kategori').value;
      var newCat = document.getElementById('f-e-catatan').value;
      var payload = {
        id: t.ID, jenis: editJenis, nominal: nominal, tanggal: tanggal,
        akun: newAkun, kategori: newKat, catatan: newCat
      };
      // Snapshot untuk rollback
      var old = {
        Jenis: t.Jenis, Nominal: Number(t.Nominal)||0, Tanggal: t.Tanggal,
        Akun: t.Akun, Kategori: t.Kategori, Catatan: t.Catatan
      };
      // Balik saldo lama, terapkan saldo baru (kasar)
      STATE.rekening.forEach(function(r){
        if(r.Nama === old.Akun){
          var s = Number(r.Saldo)||0;
          r.Saldo = old.Jenis === 'Pemasukan' ? s - old.Nominal : s + old.Nominal;
        }
      });
      STATE.rekening.forEach(function(r){
        if(r.Nama === newAkun){
          var s = Number(r.Saldo)||0;
          r.Saldo = editJenis === 'Pemasukan' ? s + nominal : s - nominal;
        }
      });
      t.Jenis = editJenis;
      t.Nominal = nominal;
      t.Tanggal = tanggal;
      t.Akun = newAkun;
      t.Kategori = newKat;
      t.Catatan = newCat;
      try { localStorage.setItem('kasCacheV1', JSON.stringify(STATE)); } catch(e){}
      closeSheet();
      toast('Diperbarui');
      __kasSyncing++;
      updateSyncPill_();
      renderAll();
      google.script.run.withSuccessHandler(function(data){
        __kasSyncing = Math.max(0, __kasSyncing - 1);
        updateSyncPill_();
        if(data){
          if(data.trxPatch || data.delta) applyDelta_(data);
          else applyDelta_(data);
          try { localStorage.setItem('kasCacheV1', JSON.stringify(STATE)); } catch(e){}
        }
        try { clearOfflineFlag_(); } catch(e){}
      }).withFailureHandler(function(err){
        __kasSyncing = Math.max(0, __kasSyncing - 1);
        updateSyncPill_();
        // Rollback
        STATE.rekening.forEach(function(r){
          if(r.Nama === newAkun){
            var s = Number(r.Saldo)||0;
            r.Saldo = editJenis === 'Pemasukan' ? s - nominal : s + nominal;
          }
        });
        STATE.rekening.forEach(function(r){
          if(r.Nama === old.Akun){
            var s = Number(r.Saldo)||0;
            r.Saldo = old.Jenis === 'Pemasukan' ? s + old.Nominal : s - old.Nominal;
          }
        });
        t.Jenis = old.Jenis; t.Nominal = old.Nominal; t.Tanggal = old.Tanggal;
        t.Akun = old.Akun; t.Kategori = old.Kategori; t.Catatan = old.Catatan;
        try { localStorage.setItem('kasCacheV1', JSON.stringify(STATE)); } catch(e){}
        renderAll();
        toast((err && err.message) ? err.message : 'Gagal sync — dikembalikan');
      }).updateTransaksi(payload);
    });
  }

  function addMonthsJS(ymd, n){
    if(!ymd) return '';
    var d = parseYMD(ymd);
    var day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    var lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day, lastDay));
    return toYMD(d);
  }

  function stripJadwalFromCatatan_(catatan){
    return String(catatan || '').replace(/\s*JADWAL:[^|\n]*/i, '').replace(/\s{2,}/g, ' ').replace(/\s*·\s*$/,'').trim();
  }
  function buildJadwalTag_(entries){
    var map = {};
    (entries || []).forEach(function(e){
      if(!e || !e.date || !(Number(e.amount) > 0)) return;
      map[e.date] = (map[e.date] || 0) + Number(e.amount);
    });
    var keys = Object.keys(map).sort();
    if(!keys.length) return '';
    return 'JADWAL:' + keys.map(function(d){ return d + '=' + Math.round(map[d]); }).join(';');
  }
  function mergeJadwalIntoCatatan_(catatan, newEntries){
    var all = parseJadwalTagihan_(catatan).concat(newEntries || []);
    var tag = buildJadwalTag_(all);
    var base = stripJadwalFromCatatan_(catatan);
    if(!tag) return base;
    return (base ? base + ' · ' : '') + tag;
  }
  // Jadwal cicilan tidak rata: JADWAL:2026-10-04=525000;2026-11-04=630100;...
  function parseJadwalTagihan_(catatan){
    var m = String(catatan || '').match(/JADWAL:([^\n|]+)/i);
    if(!m) return [];
    return m[1].split(';').map(function(part){
      part = part.trim();
      if(!part) return null;
      var bits = part.split('=');
      if(bits.length < 2) return null;
      var amount = Number(String(bits[1]).replace(/[^\d.]/g, '')) || 0;
      if(amount <= 0) return null;
      return { date: bits[0].trim(), amount: amount };
    }).filter(Boolean);
  }
  function nextTagihanDariJadwal_(h){
    var jadwal = parseJadwalTagihan_(h.Catatan);
    if(!jadwal.length) return null;
    var terbayar = Math.max(0, Number(h.TotalHutang) - Number(h.SisaHutang));
    var acc = 0;
    for(var i = 0; i < jadwal.length; i++){
      var prevAcc = acc;
      acc += jadwal[i].amount;
      if(terbayar < acc - 0.01){
        var alreadyOnThis = Math.max(0, terbayar - prevAcc);
        var sisaTagihan = Math.round(jadwal[i].amount - alreadyOnThis);
        if(sisaTagihan <= 0) continue;
        return { amount: sisaTagihan, date: jadwal[i].date, ke: i + 1, total: jadwal.length };
      }
    }
    return null;
  }

    var terbayarAmt = Math.max(0, Number(h.TotalHutang) - Number(h.SisaHutang));
    var catatanBersih = stripJadwalFromCatatan_(h.Catatan || '');
    var dueShow = nextDueDateFor_(h) || h.JatuhTempo || '';
    var daysDue = dueShow ? daysUntil(dueShow) : null;

    var progressLabel = '';

        if(terbayarAmt >= accP - 0.01) doneCount++;

    document.getElementById('btn-del-hp').addEventListener('click', function(){
      if(!confirm('Hapus catatan hutang/piutang ini?')) return;
      saveOptimistic('Dihapus', function(ok, fail){
        google.script.run.withSuccessHandler(ok).withFailureHandler(fail).deleteHutangPiutang(id);
      });
    });

            '<div class="row-2">' +
              '<input class="form-input num" id="f-e-bunga-persen" type="number" inputmode="decimal" value="' + (h.BungaPersen || '') + '">' +

          '</div>' +

        '</div>' +

      '<button class="btn-primary" id="btn-save-edit-hp">Simpan perubahan</button>';

    function updateEditPreview(){
      if(!isCicilanTetap) return;
      var pokok = rawNum('f-e-pokok') || 0;
      var bunga = rawNum('f-e-bunga-nominal') || 0;
      var tenor = Number(document.getElementById('f-e-tenor').value) || 1;
      document.getElementById('e-prev-total').textContent = fmtRupiah(pokok + bunga);
      document.getElementById('e-prev-angsuran').textContent = fmtRupiah(Math.round((pokok + bunga) / tenor));
    }
    if(isCicilanTetap){
      document.querySelectorAll('.bunga-toggle button').forEach(function(b){
        b.addEventListener('click', function(){
          document.querySelectorAll('.bunga-toggle button').forEach(function(x){ x.classList.remove('active'); });
          b.classList.add('active');
        });
      });
      var pokokEl = document.getElementById('f-e-pokok');
      var persenEl = document.getElementById('f-e-bunga-persen');
      var nominalEl = document.getElementById('f-e-bunga-nominal');
      var tenorEl = document.getElementById('f-e-tenor');
      var lock = false;
      function fromPersen(){ if(lock)return; lock=true; var p=rawNum(pokokEl)||0, per=Number(persenEl.value)||0; nominalEl.value = p&&per?ribuanStr(Math.round(p*per/100)):''; updateEditPreview(); lock=false; }
      function fromNominal(){ if(lock)return; lock=true; var p=rawNum(pokokEl)||0, n=rawNum(nominalEl)||0; persenEl.value = p&&n?Math.round((n/p*100)*10)/10:''; updateEditPreview(); lock=false; }
      persenEl.addEventListener('input', fromPersen);
      nominalEl.addEventListener('input', fromNominal);
      pokokEl.addEventListener('input', function(){ persenEl.value ? fromPersen() : fromNominal(); });
      tenorEl.addEventListener('input', updateEditPreview);
      updateEditPreview();
    } else if(isPaylater){
      document.getElementById('f-e-pokok').addEventListener('input', function(){});
    }

    document.getElementById('btn-save-edit-hp').addEventListener('click', function(){
      var nama = document.getElementById('f-e-nama').value.trim();
      var pokok = rawNum('f-e-pokok');
      if(!nama){ toast('Nama harus diisi'); return; }
      if(!pokok || pokok <= 0){ toast('Nominal harus diisi'); flashFieldErr_('f-nominal'); return; }
      var baseCat = document.getElementById('f-e-catatan').value || '';
      var jadwalEl = document.getElementById('f-e-jadwal');
      if(jadwalEl && jadwalEl.value.trim()){
        var lines = jadwalEl.value.split(/[\n;]+/).map(function(s){ return s.trim(); }).filter(Boolean);
        var entries = lines.map(function(line){
          var bits = line.split('=');
          if(bits.length < 2) return null;
          var amount = Number(String(bits[1]).replace(/[^\d.]/g, '')) || 0;
          if(amount <= 0) return null;
          return { date: bits[0].trim(), amount: amount };
        }).filter(Boolean);
        var tag = buildJadwalTag_(entries);
        baseCat = stripJadwalFromCatatan_(baseCat);
        if(tag) baseCat = (baseCat ? baseCat + ' · ' : '') + tag;
      }
      var payload = {
        id: h.ID, nama: nama, pokok: pokok,
        jatuhTempo: document.getElementById('f-e-tempo').value,
        catatan: baseCat,
        tanggal: h.Tanggal
      };
      if(isCicilanTetap){
        var tenor = Number(document.getElementById('f-e-tenor').value);
        if(!tenor || tenor <= 0){ toast('Tenor harus diisi'); return; }
        payload.tenor = tenor;
        payload.bungaPersen = Number(document.getElementById('f-e-bunga-persen').value) || 0;
        payload.bungaNominal = rawNum('f-e-bunga-nominal');
      } else if(isPaylater){
        payload.bungaNominal = rawNum('f-e-bunga-nominal');
      }
      saveOptimistic('Perubahan disimpan', function(ok, fail){
        google.script.run.withSuccessHandler(ok).withFailureHandler(fail).updateHutangPiutang(payload);
      });
    });
  }

      html += '<div class="form-group" style="margin:0;"><label class="form-label">' + (isHutang ? 'Rekening tujuan' : 'Rekening sumber') + '</label>' +
        '<select class="form-select" id="f-topup-akun">' + accountOptions(h.Akun || '') + '</select></div>';

      html += '<div style="font-size:11px; color:var(--ink-faint);">Barang/Jasa — tidak masuk rekening.</div>';
    }
    html += '</div><button class="btn-primary" id="btn-save-topup">Tambahkan</button>';
    openSheet(html);

    function refreshTopUpPreview(){
      if(!isCicilan) return;
      var tambah = rawNum('f-topup-nominal') || 0;
      var bunga = rawNum('f-topup-bunga') || 0;
      var sisa = (Number(h.SisaHutang) || 0) + tambah + bunga;
      var tenorEl = document.getElementById('f-topup-tenor');
      var tenor = Number(tenorEl && tenorEl.value) || Number(h.Tenor) || 1;
      var cicilanManual = rawNum('f-topup-cicilan');
      var cicilan = cicilanManual > 0 ? cicilanManual : Math.round(sisa / Math.max(1, tenor));
      var elS = document.getElementById('tu-prev-sisa');
      var elC = document.getElementById('tu-prev-cicilan');
      if(elS) elS.textContent = fmtRupiah(sisa);
      if(elC) elC.textContent = fmtRupiah(cicilan);
    }
    if(isCicilan){
      ['f-topup-nominal','f-topup-bunga','f-topup-tenor','f-topup-cicilan'].forEach(function(id){
        var el = document.getElementById(id);
        if(el) el.addEventListener('input', refreshTopUpPreview);
      });
      refreshTopUpPreview();
    }

    document.getElementById('btn-save-topup').addEventListener('click', function(){
      var nominalTambahan = rawNum('f-topup-nominal');
      var tanggal = document.getElementById('f-topup-tanggal').value;
      if(!nominalTambahan || nominalTambahan <= 0){ toast('Pokok tambahan harus diisi'); return; }
      if(!tanggal){ toast('Tanggal harus diisi'); flashFieldErr_('f-tanggal'); return; }
      var akunEl = document.getElementById('f-topup-akun');
      if(h.Bentuk === 'Tunai' && (!akunEl || !akunEl.value)){ toast('Pilih rekening'); return; }
      var payload = {
        id: h.ID,
        nominalTambahan: nominalTambahan,
        tanggal: tanggal,
        akun: akunEl ? akunEl.value : ''
      };
      if(isCicilan){
        payload.bungaTambahan = rawNum('f-topup-bunga') || 0;
        var tenorV = document.getElementById('f-topup-tenor');
        var tenorN = (tenorV && tenorV.value) ? Number(tenorV.value) : 0;
        if(tenorN > 0) payload.tenorBaru = tenorN;
        var cicV = rawNum('f-topup-cicilan');
        if(cicV > 0) payload.nominalCicilan = cicV;
        var tempoEl = document.getElementById('f-topup-tempo');
        var tempo0 = tempoEl && tempoEl.value ? tempoEl.value : '';
        if(tempo0) payload.jatuhTempo = tempo0;
        // Susun / gabung jadwal cicilan (tanggal sama dijumlah)
        if(tempo0 && cicV > 0 && (tenorN > 0 || Number(h.Tenor) > 0)){
          var nTen = tenorN > 0 ? tenorN : Number(h.Tenor) || 1;
          var entries = [];
          for(var i = 0; i < nTen; i++){
            entries.push({ date: addMonthsJS(tempo0, i), amount: cicV });
          }
          payload.catatan = mergeJadwalIntoCatatan_(h.Catatan || '', entries);
        }
      }
      saveOptimistic('Top up tersimpan', function(ok, fail){
        google.script.run.withSuccessHandler(ok).withFailureHandler(fail).topUpHutang(payload);
      });
    });
  }

      }
      saveOptimistic('Rekening diperbarui', function(ok, fail){
        google.script.run.withSuccessHandler(ok).withFailureHandler(fail).updateRekening(payload);
      });
    });
    document.getElementById('btn-del-rek').addEventListener('click', function(){
      if(!confirm('Hapus rekening ini? Transaksi yang terkait tidak akan terhapus.')) return;
      closeSheet();
      var card = document.querySelector('.rekening-card[data-id="' + id + '"]');
      if(card) card.style.display = 'none';
      toastWithUndo('Rekening dihapus', function onUndo(){
        if(card) card.style.display = '';
      }, function onCommit(){
        google.script.run.withSuccessHandler(function(data){
          refreshState(data);
        }).withFailureHandler(function(err){ toast('Gagal: ' + err.message); if(card) card.style.display = ''; }).deleteRekening(id);
      });
    });
  }

  // Start app setelah semua fungsi & ICON_* siap (hindari crash cache load)
  initApp();
</script>
</body>
</html>
