<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Catatan Kas">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <title>Catatan Kas</title>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (e) {
          console.warn('SW register gagal', e);
        });
      });
    }
  </script>
  <style>
    :root{
      --blue:#1A365D;
      --blue-dark:#0B1F36;
      --blue-mid:#2B4C7E;
      --blue-pale:#E8EEF6;
      --green:#10B981;
      --green-pale:#ECFDF5;
      --red:#EF4444;
      --red-pale:#FEF2F2;
      --amber:#F59E0B;
      --amber-pale:#FFFBEB;
      --ink:#0F172A;
      --ink-soft:#475569;
      --ink-faint:#94A3B8;
      --line:#E2E8F0;
      --bg:#F1F5F9;
      --card:#FFFFFF;
      --input-bg:#F1F5F9;
      --overlay:rgba(11,31,54,.48);
      --radius:18px;
      --radius-sm:14px;
      --shadow:0 4px 20px -6px rgba(15,39,68,.12);
      --shadow-sm:0 1px 3px rgba(15,39,68,.06);
    }
    html.dark{
      --blue-pale:#1A2D45;
      --green-pale:#0F3324;
      --red-pale:#3A2220;
      --amber-pale:#3A2C15;
      --ink:#E8EEF5;
      --ink-soft:#A8B4C4;
      --ink-faint:#6B7A8F;
      --line:#2A3548;
      --bg:#0B1220;
      --card:#152033;
      --input-bg:#1A2740;
      --overlay:rgba(0,0,0,.6);
    }
    html.dark body{ background:var(--bg); }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; min-width:0;}
    html,body{
      margin:0; padding:0; height:100%; width:100%;
      overflow:hidden; overflow-x:hidden; overscroll-behavior:none;
      touch-action:pan-y; -ms-touch-action:pan-y;
      font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg); color:var(--ink);
    }
    #app{
      position:fixed; top:0; left:50%; transform:translate3d(-50%,0,0);
      display:flex; flex-direction:column;
      width:100vw; background:var(--bg);
      overflow:hidden; overflow-x:hidden; touch-action:pan-y;
      backface-visibility:hidden;
    }
    #appInner{
      display:flex; flex-direction:column; width:100%; height:100%;
      transform-origin:top left;
    }
    button{font-family:inherit; border:none; background:none; cursor:pointer;}
    .num{ font-variant-numeric:tabular-nums; }

    /* ---------- TOP BAR ---------- */
    #topbar{
      flex:0 0 auto; color:#fff; padding:14px 16px 16px; position:relative; z-index:2;
      background:
        linear-gradient(165deg, rgba(11,31,54,.72) 0%, rgba(26,54,93,.88) 55%, rgba(11,31,54,.94) 100%),
        url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80') center 40%/cover no-repeat,
        linear-gradient(135deg, var(--blue-mid), var(--blue-dark));
    }
    .topbar-row{display:flex; align-items:center; justify-content:space-between; width:100%;}
    .topbar-row h1{font-size:17px; font-weight:700; margin:0; letter-spacing:.2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    .topbar-icon-btn{
      width:36px; height:36px; flex:0 0 36px; display:flex; align-items:center; justify-content:center;
      border-radius:50%; color:#fff; opacity:.95; background:rgba(255,255,255,.12);
    }
    .topbar-icon-btn:active{background:rgba(255,255,255,.22);}
    .topbar-spacer{width:36px; flex:0 0 36px;}
    .month-nav{display:flex; align-items:center; justify-content:center; gap:6px; flex:1 1 auto; min-width:0; overflow:hidden;}
    .month-nav .month-label{font-size:17px; font-weight:700; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

    /* ---------- SUMMARY CARD (overlaps top bar) ---------- */
    #summary{
      margin:10px 14px 0; background:var(--card); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:12px 8px;
      display:grid; grid-template-columns:1fr 1fr 1fr; position:relative; z-index:3;
      flex:0 0 auto; border:1px solid rgba(226,232,240,.8);
    }
    #summary.cols-4{grid-template-columns:1fr 1fr; row-gap:10px;}
    #summary.hero-mode{
      display:block; background:transparent; box-shadow:none; padding:0; margin:8px 0 0;
    }
    #summary .stat{text-align:center; padding:2px 3px; position:relative; min-width:0;}
    #summary .stat:not(:last-child)::after{
      content:""; position:absolute; right:0; top:8%; bottom:8%; width:1px; background:var(--line);
    }
    #summary.cols-4 .stat::after{display:none;}
    #summary.cols-4 .stat:nth-child(1)::after,
    #summary.cols-4 .stat:nth-child(3)::after{
      display:block; content:""; position:absolute; right:0; top:8%; bottom:8%; width:1px; background:var(--line);
    }
    #summary.cols-4 .stat:nth-child(3),
    #summary.cols-4 .stat:nth-child(4){
      border-top:1px solid var(--line); padding-top:10px;
    }
    #summary .stat .lbl{font-size:11px; color:var(--ink-faint); font-weight:600; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    #summary .stat .val{font-size:13px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-0.2px;}
    #summary .stat .val.green{color:var(--green);}
    #summary .stat .val.red{color:var(--red);}
    #summary .stat .val.blue{color:var(--blue-dark);}

    /* ---------- GREETING + DATE ROW ---------- */
    .greeting-row{
      display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
      padding:2px 2px 10px; color:#fff;
    }
    .greeting-row .hello{font-size:12.5px; opacity:.85; font-weight:600;}
    .greeting-row .name{font-size:17px; font-weight:800; margin-top:1px;}
    .name-edit-btn{text-align:left; color:#fff;}
    .name-edit-btn:active{opacity:.8;}
    .date-pill{
      display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.16); color:#fff;
      border-radius:12px; padding:9px 12px; font-size:12.5px; font-weight:700; white-space:nowrap; flex:0 0 auto;
    }
    .date-pill:active{background:rgba(255,255,255,.26);}
    .date-pill svg{flex:0 0 auto;}

    /* ---------- BALANCE HERO CARD ---------- */
    .balance-hero{
      margin:0 14px 0; padding:16px 16px 14px; border-radius:var(--radius); color:#fff;
      background:
        radial-gradient(120% 140% at 100% -20%, rgba(255,255,255,.18), transparent 50%),
        linear-gradient(145deg, #243B6B 0%, var(--blue) 45%, var(--blue-dark) 100%);
      box-shadow:0 6px 16px -8px rgba(15,39,68,.35); position:relative; z-index:3; overflow:hidden;
      
    }
    .balance-hero .top-lbl{
      display:flex; align-items:center; gap:7px; font-size:11px; font-weight:700; letter-spacing:.5px;
      opacity:.85; text-transform:uppercase;
    }
    .balance-hero .top-lbl button{color:#fff; opacity:.9; display:flex; align-items:center;}
    .balance-hero .amount{font-size:22px; font-weight:800; margin:4px 0 10px; letter-spacing:.2px;}
    .balance-hero .pill-row{display:flex; gap:8px;}
    .balance-hero .pill{
      flex:1; display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.14);
      border-radius:12px; padding:7px 10px; min-width:0;
    }
    .balance-hero .pill .ic{
      width:26px; height:26px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    }
    .balance-hero .pill.in .ic{background:var(--green);}
    .balance-hero .pill.out .ic{background:var(--red);}
    .balance-hero .pill .txt{min-width:0;}
    .balance-hero .pill .txt .l{font-size:10px; opacity:.85; font-weight:600;}
    .balance-hero .pill .txt .v{font-size:12.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .balance-hero .cashflow-row{
      display:flex; align-items:center; justify-content:space-between; margin-top:10px; padding-top:10px;
      border-top:1px solid rgba(255,255,255,.18);
    }
    .balance-hero .cashflow-row .l{font-size:10.5px; opacity:.8; font-weight:600;}
    .balance-hero .cashflow-row .v{font-size:16px; font-weight:800; margin-top:1px;}
    .cashflow-tag{
      background:rgba(255,255,255,.18); border-radius:20px; padding:4px 10px; font-size:10px; font-weight:700;
    }

    /* ---------- QUICK ACTIONS ---------- */
    .quick-actions{
      margin:10px 14px 6px; background:var(--card); border-radius:18px;
      box-shadow:0 1px 3px rgba(15,39,68,.05); padding:14px 8px; border:1px solid rgba(226,232,240,.65);
      display:grid; grid-template-columns:repeat(4,1fr);
    }
    .quick-actions button{
      display:flex; flex-direction:column; align-items:center; gap:6px; padding:4px 2px;
    }
    .quick-actions .qa-ic{
      width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; color:#fff;
      box-shadow:0 4px 10px -3px rgba(0,0,0,.18);
    }
    .quick-actions .qa-ic.in{background:linear-gradient(145deg,#34D399,var(--green));}
    .quick-actions .qa-ic.out{background:linear-gradient(145deg,#F87171,var(--red));}
    .quick-actions .qa-ic.transfer{background:linear-gradient(145deg,#3B82F6,var(--blue));}
    .quick-actions .qa-ic.more{background:var(--input-bg); color:var(--ink-soft); box-shadow:none;}
    .quick-actions .qa-lbl{font-size:11.5px; font-weight:700; color:var(--ink);}
    .quick-actions .qa-sub{font-size:9.5px; color:var(--ink-faint); font-weight:600;}

    /* ---------- SECTION HEADER ---------- */
    .section-header{
      display:flex; align-items:center; justify-content:space-between; margin:18px 2px 10px;
    }
    .section-header .t{font-size:15px; font-weight:800; color:var(--ink);}
    .section-header .more{
      display:flex; align-items:center; gap:2px; color:var(--blue); font-size:12.5px; font-weight:700;
    }

    .day-heading{gap:6px; align-items:center;}
    .day-heading .cal-ic{color:var(--ink-faint); display:flex; flex:0 0 auto;}

    /* ---------- NOTIF BADGE (topbar bell) ---------- */
    .topbar-icon-btn{position:relative;}
    .topbar-notif-badge{
      position:absolute; top:2px; right:2px; min-width:16px; height:16px; padding:0 4px; border-radius:8px;
      background:var(--red); color:#fff; font-size:9.5px; font-weight:800; display:flex; align-items:center;
      justify-content:center; line-height:1; border:1.5px solid var(--blue);
    }

    /* ---------- CONTENT ---------- */
    #content{
      flex:1 1 auto; overflow-y:auto; overflow-x:hidden;
      -webkit-overflow-scrolling:touch; padding:12px 14px 100px;
      contain:layout style;
      overscroll-behavior-y:contain;
    }
    .view{display:none; opacity:0;}
    .view.active{
      display:block; contain:layout style;
      animation:viewIn .22s ease-out both;
    }
    @keyframes viewIn{
      from{ opacity:0; transform:translate3d(0,8px,0); }
      to{ opacity:1; transform:translate3d(0,0,0); }
    }

    .day-group{margin-bottom:14px; content-visibility:auto; contain-intrinsic-size:auto 120px;}
    .day-heading{
      font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase;
      letter-spacing:.5px; margin:4px 4px 10px; display:flex; align-items:center; gap:8px;
    }
    .day-heading::after{
      content:""; flex:1; height:1px; background:var(--line); opacity:.85;
    }
    .item-card{
      background:var(--card); border-radius:16px; padding:12px 14px;
      display:flex; align-items:center; gap:12px; margin-bottom:8px;
      border:1px solid rgba(226,232,240,.65);
      box-shadow:0 1px 2px rgba(15,39,68,.04);
      transition:background-color .12s ease, box-shadow .12s ease;
      -webkit-tap-highlight-color:transparent;
      contain:layout style;
    }
    .item-card:active{background:#F8FAFC; box-shadow:none;}
    html.dark .item-card:active{background:#1A2740;}
    .icon-badge{
      width:44px; height:44px; border-radius:14px; flex:0 0 auto;
      display:flex; align-items:center; justify-content:center;
    }
    .icon-badge.green{background:linear-gradient(145deg,#ECFDF5,var(--green-pale)); color:var(--green);}
    .icon-badge.red{background:linear-gradient(145deg,#FEF2F2,var(--red-pale)); color:var(--red);}
    .icon-badge.amber{background:linear-gradient(145deg,#FFFBEB,var(--amber-pale)); color:var(--amber);}
    .icon-badge.blue{background:linear-gradient(145deg,#EFF6FF,var(--blue-pale)); color:var(--blue-dark);}
    .item-main{flex:1 1 auto; min-width:0;}
    .item-title{font-size:14px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.1px;}
    .item-sub{font-size:11.5px; color:var(--ink-faint); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .item-amount{font-size:14px; font-weight:800; flex:0 0 auto; text-align:right; letter-spacing:-.2px;}
    .item-amount.green{color:var(--green);}
    .item-amount.red{color:var(--red);}
    .item-amount.blue{color:var(--blue-dark);}
    .item-amount.lunas-amount{opacity:.55;}
    .section-header{display:flex; align-items:center; justify-content:space-between; margin:2px 2px 12px;}
    .section-header .t{font-size:15px; font-weight:800; letter-spacing:-.2px;}
    .section-header .more{font-size:12px; font-weight:700; color:var(--blue);}

    .empty-state{
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:70px 20px; color:var(--ink-faint); text-align:center;
    }
    .empty-state svg{margin-bottom:14px; opacity:.55;}
    .empty-state .t1{font-size:14px; font-weight:600; color:var(--ink-soft);}
    .empty-state .t2{font-size:12.5px; margin-top:4px;}

    /* segmented control (hutang piutang filter) */
    .segmented{
      display:flex; background:var(--input-bg); border-radius:12px; padding:3px; margin-bottom:12px;
      border:1px solid var(--line);
    }
    .segmented button{
      flex:1; padding:8px 0; font-size:12px; font-weight:700; border-radius:10px; color:var(--ink-faint);
    }
    .segmented button.active{background:var(--blue); color:#fff; box-shadow:0 2px 8px -2px rgba(26,54,93,.35);}

    .status-pill{
      font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; margin-left:8px; white-space:nowrap;
    }
    .status-pill.belum{background:var(--amber-pale); color:var(--amber);}
    .status-pill.lunas{background:var(--green-pale); color:var(--green); }

    .metode-tag{
      font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px; margin-left:6px;
      background:var(--blue-pale); color:var(--blue-dark); white-space:nowrap;
    }

    /* urgency chips */
    .urgency-row{display:flex; gap:8px; margin-bottom:14px;}
    .urgency-chip{
      flex:1; display:flex; align-items:center; gap:8px; background:var(--card); border-radius:12px;
      padding:10px 12px; box-shadow:0 1px 2px rgba(40,30,15,.06); border:1.5px solid transparent;
      text-align:left;
    }
    .urgency-chip .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
    .urgency-chip.overdue .dot{background:var(--red);}
    .urgency-chip.upcoming .dot{background:var(--amber);}
    .urgency-chip .n{font-size:16px; font-weight:800; line-height:1;}
    .urgency-chip .t{font-size:10.5px; color:var(--ink-faint); font-weight:600; margin-top:2px;}
    .urgency-chip.active.overdue{border-color:var(--red); background:var(--red-pale);}
    .urgency-chip.active.upcoming{border-color:var(--amber); background:var(--amber-pale);}

    /* metode selector grid (form) */
    .metode-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
    .metode-btn{
      border:1.5px solid var(--line); border-radius:10px; padding:10px 6px; font-size:12.5px;
      font-weight:700; color:var(--ink-soft); background:var(--input-bg); text-align:center; line-height:1.3;
    }
    .metode-btn small{display:block; font-weight:500; color:var(--ink-faint); font-size:10.5px; margin-top:2px;}
    .metode-btn.active{background:var(--blue-pale); border-color:var(--blue); color:var(--blue-dark);}
    .metode-btn.active small{color:var(--blue-dark); opacity:.75;}

    .bunga-toggle{display:flex; gap:8px; margin-bottom:8px;}
    .bunga-toggle button{
      padding:6px 12px; border-radius:8px; border:1.5px solid var(--line); font-size:12px; font-weight:700;
      color:var(--ink-faint); background:var(--input-bg);
    }
    .bunga-toggle button.active{background:var(--blue); border-color:var(--blue); color:#fff;}

    .preview-box{
      background:var(--blue-pale); border-radius:12px; padding:12px 14px; margin:4px 0 14px;
    }
    .preview-box .pr{display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; color:var(--blue-dark);}
    .preview-box .pr b{font-weight:800;}
    .preview-box .pr.big{font-size:14.5px; padding-top:6px; margin-top:4px; border-top:1px dashed rgba(47,99,176,.25);}

    .progress-wrap{margin:6px 0 14px;}
    .progress-track{height:8px; background:var(--line); border-radius:6px; overflow:hidden;}
    .progress-fill{height:100%; background:var(--blue); border-radius:6px;}
    .progress-label{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-faint); margin-top:6px; font-weight:600;}

    .riwayat-title{font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:16px 0 8px;}
    .riwayat-empty{font-size:12.5px; color:var(--ink-faint); padding:6px 0 2px;}

    /* rekap */
    .rekap-card{
      background:var(--card); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:10px;
      box-shadow:0 1px 2px rgba(40,30,15,.06);
    }
    .rekap-card:active{background:#FBFCFE;}
    .rekap-date{font-size:21px; font-weight:700; color:var(--ink); margin-bottom:8px; text-align:center;}
    .rekap-row{display:flex; justify-content:space-between; padding:9px 0; font-size:14px;}
    .rekap-row .k{color:var(--ink-soft);}
    .rekap-row .v{font-weight:700; color:var(--ink);}
    .rekap-row .v.green{color:var(--green);}
    .custom-range-box{background:var(--card); border-radius:var(--radius-sm); padding:14px; margin-bottom:14px; box-shadow:0 1px 2px rgba(40,30,15,.06);}

    .kategori-row{padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer;}
    .kategori-row:last-child{border-bottom:none;}
    .kategori-row-top{display:flex; justify-content:space-between; font-size:15.5px; margin-bottom:6px;}
    .kategori-row-top .chev{color:var(--ink-faint); font-weight:400; margin-left:2px;}
    .kategori-bar-track{height:6px; background:var(--line); border-radius:4px; overflow:hidden;}
    .kategori-bar-fill{height:100%; border-radius:4px;}

    .export-icon-btn{
      display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 10px;
      border-radius:10px; background:var(--blue-pale); color:var(--blue-dark); font-size:9.5px; font-weight:700;
    }
    .export-icon-btn:active{background:var(--blue); color:#fff;}

    /* rekening cards */
    .total-saldo-card{
      background:radial-gradient(120% 160% at 85% -30%, rgba(255,255,255,.18), transparent 55%), linear-gradient(135deg,var(--blue),var(--blue-dark)); color:#fff; border-radius:var(--radius);
      padding:18px 20px; margin-bottom:16px;
    }
    .total-saldo-card .lbl{font-size:11px; opacity:.85; font-weight:600; letter-spacing:.4px; text-transform:uppercase;}
    .total-saldo-card .val{font-size:22px; font-weight:800; margin-top:4px;}
    .rekening-card{
      background:var(--card); border-radius:var(--radius-sm); padding:14px; margin-bottom:10px;
      display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-sm);
      border:1px solid rgba(226,232,240,.7);
    }
    .rekening-dot{width:10px; height:36px; border-radius:8px; flex:0 0 auto;}
    .bank-logo{
      width:42px; height:42px; border-radius:12px; flex:0 0 auto;
      display:flex; align-items:center; justify-content:center;
      font-size:11px; font-weight:800; color:#fff; letter-spacing:-0.3px;
      box-shadow:0 2px 6px rgba(0,0,0,.12); overflow:hidden; text-align:center; line-height:1.1;
      padding:2px; background:#fff;
    }
    .bank-logo img{width:100%; height:100%; object-fit:contain; display:block; content-visibility:auto;}
    .bank-logo.sm{width:28px; height:28px; border-radius:8px; font-size:9px;}
    .rekening-info{flex:1; min-width:0;}

    /* ---------- LOADING / TOAST ---------- */

      border-radius:50%; animation:spin .7s linear infinite;
          }

    #toast{
      position:fixed; left:50%; bottom:110px; transform:translate3d(-50%,12px,0); background:#1C2333; color:#fff;
      padding:11px 18px; border-radius:12px; font-size:13.5px; font-weight:600; z-index:60; opacity:0;

    #undo-toast{
      position:fixed; left:50%; bottom:110px; transform:translate3d(-50%,12px,0); background:#1C2333; color:#fff;
      padding:11px 12px 11px 18px; border-radius:12px; font-size:13.5px; font-weight:600; z-index:61; opacity:0;
      transition:opacity .18s ease, transform .18s ease; pointer-events:none; max-width:88%; display:flex; align-items:center; gap:14px;
    }
    #undo-toast.show{opacity:1; transform:translate3d(-50%,0,0); pointer-events:auto;}
    #undo-toast-btn{color:var(--blue); font-weight:800; font-size:13px; padding:6px 8px; flex:0 0 auto;}
    @media (prefers-reduced-motion: reduce){
      *, *::before, *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
      }
      #sheet, #sheet-overlay{ transition:none !important; }
      .view.active{ animation:none !important; opacity:1 !important; transform:none !important; }
    }
  </style>
</head>

<script>
  // ================= GITHUB PAGES + GAS API =================
  // URL Web App Google Apps Script (sudah diisi)
  var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwS5U4gH1kTpPtBbSC8_Oj7ZnS0pOWjvZN4P6fT6aICABp6QhXLu68_S1HXl-lSoOM/exec';

  // Polyfill google.script.run — GET + 1x retry (GAS sering cold-start / lambat)
  var API_TIMEOUT_MS = 45000;

  function friendlyApiError_(err) {
    if (!err) return 'Koneksi gagal';
    if (err.name === 'AbortError') return 'Server lambat, coba lagi';
    var m = String(err.message || err);
    if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Jaringan terputus, coba lagi';
    if (/Timeout/i.test(m)) return 'Server lambat, coba lagi';
    if (/Respons server tidak valid/i.test(m)) return 'Server belum siap, coba lagi';
    return m;
  }

  function parseApiResponse_(text) {
    var json;
    try { json = JSON.parse(text); }
    catch (e) { throw new Error('Respons server tidak valid'); }
    if (!json || !json.success) throw new Error((json && json.error) || 'Gagal');
    return json.data;
  }

  function fetchOnce_(url, options) {
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) try { ctrl.abort(); } catch (e) {} }, API_TIMEOUT_MS);
    var opts = Object.assign({ redirect: 'follow', cache: 'no-store' }, options || {});
    if (ctrl) opts.signal = ctrl.signal;
    return fetch(url, opts)
      .then(function (res) { return res.text(); })
      .then(function (text) {
        clearTimeout(timer);
        return parseApiResponse_(text);
      })
      .catch(function (err) {
        clearTimeout(timer);
        throw err;
      });
  }

  function fetchWithRetry_(url, options, retriesLeft) {
    return fetchOnce_(url, options).catch(function (err) {
      if (retriesLeft <= 0) throw err;
      // Tunggu sebentar lalu coba 1x lagi (cold start GAS sering sembuh di percobaan ke-2)
      return new Promise(function (resolve) { setTimeout(resolve, 1500); })
        .then(function () { return fetchWithRetry_(url, options, retriesLeft - 1); });
    });
  }

  function createRunner(successCb, failCb) {
    return new Proxy({}, {
      get: function(_, action) {
        if (action === 'withFailureHandler') {
          return function(newFail) { return createRunner(successCb, newFail); };
        }
        return function() {
          var args = Array.prototype.slice.call(arguments);
          var payload = args.length === 0 ? undefined : (args.length === 1 ? args[0] : args);

          var url = WEB_APP_URL + '?action=' + encodeURIComponent(action);
          if (payload !== undefined) {
            var dataStr = typeof payload === 'string' ? payload : JSON.stringify(payload);
            if (action === 'restoreBackupJson' || dataStr.length > 1800) {
              callWithPost_(action, payload, successCb, failCb);
              return;
            }
            url += '&data=' + encodeURIComponent(dataStr);
          }

          fetchWithRetry_(url, { method: 'GET' }, 1)
            .then(function (data) {
              if (typeof successCb === 'function') successCb(data);
            })
            .catch(function (err) {
              var msg = friendlyApiError_(err);
              if (typeof failCb === 'function') failCb(new Error(msg));
              else console.error(err);
            });
        };
      }
    });
  }

  function callWithPost_(action, payload, successCb, failCb) {
    var opts = {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, data: payload })
    };
    fetchWithRetry_(WEB_APP_URL, opts, 1)
      .then(function (data) {
        if (typeof successCb === 'function') successCb(data);
      })
      .catch(function (err) {
        if (typeof failCb === 'function') failCb(new Error(friendlyApiError_(err)));
      });
  }

  var google = {
    script: {
      run: {
        withSuccessHandler: function(successCb) {
          return createRunner(successCb, null);
        }
      }
    }
  };

  // ================= VISUAL VIEWPORT FIT =================
  // The layout viewport this page renders inside (governed by Apps Script's
  // wrapper page) can be wider/positioned differently than what's actually
  // visible on screen. window.visualViewport reports the REAL visible area
  // directly from the OS/browser, independent of that wrapper's math — so we
  // use it to explicitly pin #app (and the modal sheet) to the real screen,
  // in pixels, instead of trusting vw/%/transform-based CSS alone.
  // Di GitHub Pages: JANGAN pakai transform scale (bikin konten hilang/blank).
  // Pakai zoom CSS + layout normal biar flex tetap jalan.
  // Zoom hanya 70%–100% (default 80% biar tidak kegedean di HP)
  var uiScale = Number(localStorage.getItem('kasUiScale'));
  if (!uiScale || isNaN(uiScale) || uiScale < 0.7 || uiScale > 1) uiScale = 0.8;
  try { localStorage.setItem('kasUiScale', String(uiScale)); } catch(e) {}
  var isDarkMode = localStorage.getItem('kasDarkMode') === '1';
  document.documentElement.classList.toggle('dark', isDarkMode);
  function setDarkMode(on){
    isDarkMode = on;
    document.documentElement.classList.toggle('dark', on);
    try{ localStorage.setItem('kasDarkMode', on ? '1' : '0'); }catch(e){}
  }

  function applyUiScale(realW, realH){
    var inner = document.getElementById('appInner');
    if(!inner) return;
    // Layout penuh — tanpa transform scale
    inner.style.width = '100%';
    inner.style.height = '100%';
    inner.style.transform = 'none';
    // Zoom hanya mempengaruhi visual, tidak merusak flex box
    if (uiScale !== 1) {
      inner.style.zoom = String(uiScale);
    } else {
      inner.style.zoom = '';
    }
  }
  function applySheetScale(realW, realH){
    var sheetInner = document.getElementById('sheetInner');
    if(!sheetInner) return;
    sheetInner.style.width = '100%';
    sheetInner.style.maxHeight = (realH * 0.9) + 'px';

  function setUiScale(scale){
    uiScale = scale;
    try{ localStorage.setItem('kasUiScale', String(scale)); }catch(e){}
    fitViewport();
  }

  function fitViewport(){
    var vv = window.visualViewport;
    var app = document.getElementById('app');
    var sheet = document.getElementById('sheet');
    if(!app) return;
    // Fullscreen sederhana — cocok untuk GitHub Pages / browser HP
    app.style.left = '0';
    app.style.top = '0';
    app.style.width = '100%';
    app.style.height = '100%';
    app.style.transform = 'none';
    var h = (vv && vv.height) ? vv.height : window.innerHeight;
    var w = (vv && vv.width) ? vv.width : window.innerWidth;
    applyUiScale(w, h);
    if(sheet){
      sheet.style.left = '0';
      sheet.style.width = '100%';
      sheet.style.transform = sheet.classList.contains('show') ? 'translate3d(0,0,0)' : 'translate3d(0,100%,0)';
      applySheetScale(w, h);
    }

  // ================= RIBUAN (thousand-separator) FORMATTING =================
  // Any <input class="num-input"> gets live "1.000.000" style formatting as the
  // user types. Use rawNum(el) to read back the plain number for calculations —
  // never read a num-input's .value directly with Number()/parseInt().
  function formatRibuan(digitsStr){
    digitsStr = String(digitsStr || '').replace(/\D/g, '');
    if(!digitsStr) return '';
    return digitsStr.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }
  function ribuanStr(n){
    n = Math.round(Number(n) || 0);
    return formatRibuan(String(Math.abs(n)));
  }
  function rawNum(elOrId){
    var el = typeof elOrId === 'string' ? document.getElementById(elOrId) : elOrId;
    if(!el) return 0;
    var digits = String(el.value || '').replace(/\D/g, '');
    return digits ? Number(digits) : 0;
  }
  document.getElementById('sheet-content').addEventListener('input', function(e){
    if(!e.target.classList || !e.target.classList.contains('num-input')) return;
    var el = e.target;
    var digitsBeforeCursor = el.value.slice(0, el.selectionStart).replace(/\D/g, '').length;
    var formatted = formatRibuan(el.value);
    el.value = formatted;
    // Re-place the cursor after the same count of digits it was after before formatting.
    var seen = 0, pos = formatted.length;
    for(var i = 0; i < formatted.length; i++){
      if(/\d/.test(formatted[i])) seen++;
      if(seen === digitsBeforeCursor){ pos = i + 1; break; }
    }
    try{ el.setSelectionRange(pos, pos); }catch(err){}
  });

  var DAYS = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

  function fmtRupiah(n){
    n = Math.round(Number(n) || 0);
    var neg = n < 0; n = Math.abs(n);
    var s = n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');

  function toast(msg){
    var t = document.getElementById('toast');

  var undoState = null;
  function toastWithUndo(msg, onUndo, onCommit){
    if(undoState) undoState.commit();
    var el = document.getElementById('undo-toast');
    document.getElementById('undo-toast-msg').textContent = msg;
    el.classList.add('show');
    var committed = false;
    var timer = setTimeout(function(){ commit(); }, 4000);
    function commit(){
      if(committed) return; committed = true;
      el.classList.remove('show');
      undoState = null;
      onCommit();
    }
    function undo(){
      if(committed) return; committed = true;
      clearTimeout(timer);
      el.classList.remove('show');
      undoState = null;
      onUndo();
    }
    undoState = { commit: commit, undo: undo };
    document.getElementById('undo-toast-btn').onclick = undo;
  }
  function parseYMD(s){
    var p = String(s).split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  function toYMD(d){
    var y = d.getFullYear(), m = ('0' + (d.getMonth()+1)).slice(-2), day = ('0' + d.getDate()).slice(-2);
    return y + '-' + m + '-' + day;
  }
  function fmtDayHeading(ymd){
    var d = parseYMD(ymd);
    return DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

    Notification.requestPermission().then(function(p){

  function fireDueNotifs_(){
    if(!('Notification' in window) || Notification.permission !== 'granted') return;
    var key = 'kasNotifSent-' + toYMD(new Date());
    var sent = {};
    try { sent = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) {}
    (STATE.hutangPiutang || []).forEach(function(h){
      if(h.Status === 'Lunas' || !h.JatuhTempo) return;
      var days = daysUntil(h.JatuhTempo);
      if(days === null || days > 3) return;
      var id = h.ID || h.Nama;
      if(sent[id]) return;
      var title = days < 0 ? 'Hutang jatuh tempo!' : (days === 0 ? 'Jatuh tempo hari ini' : 'Jatuh tempo ' + days + ' hari lagi');
      try {
        new Notification(title, {
          body: (h.Nama || 'Hutang') + ' • ' + fmtRupiah(h.SisaHutang || h.TotalHutang),
          tag: 'kas-due-' + id
        });
        sent[id] = 1;
      } catch(e) {}
    });
    try { localStorage.setItem(key, JSON.stringify(sent)); } catch(e) {}
  }

    var keep = {

    };
    try {
      // Hapus key app yang dikenal
      ['kasCacheV1','kasFotoMap','kasCustomKategori','kasTrxFilter'].forEach(function(k){
        try { localStorage.removeItem(k); } catch(e) {}
      });
      // Hapus notif harian
      Object.keys(localStorage).forEach(function(k){
        if(k.indexOf('kasNotifSent-') === 0) try { localStorage.removeItem(k); } catch(e) {}
      });
      // Kembalikan preferensi tampilan
      Object.keys(keep).forEach(function(k){
        if(keep[k] != null) try { localStorage.setItem(k, keep[k]); } catch(e) {}
      });
    } catch(e) {}
    // Reset filter di memori
    try {
      trxFilter = { akun: '', kategori: '', untuk: '' };
    } catch(e) {}
    toast('Cache dihapus');
    closeSheet();
    // Muat ulang data dari server
    document.getElementById('loading').style.display = 'flex';

    document.getElementById('loading').innerHTML =
      '<div class="spinner"></div><div style="font-size:13px; color:var(--ink-faint); font-weight:600;">Memuat ulang…</div>';

  function exportTransaksiCsv_(){
    var rows = [['Tanggal','Jenis','Kategori','Akun','Nominal','Untuk','Catatan']];
    (STATE.transaksi || []).forEach(function(t){
      var untuk = parseUntukDariCatatan_(t.Catatan) || '';
      var cat = String(t.Catatan || '').replace(/"/g, '""');
      rows.push([
        t.Tanggal || '',
        t.Jenis || '',
        t.Kategori || '',
        t.Akun || '',
        String(t.Nominal || 0),
        untuk,
        cat
      ]);
    });
    var csv = rows.map(function(r){
      return r.map(function(c){ return '"' + String(c) + '"'; }).join(',');
    }).join('\n');
    var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'catatan-kas-' + toYMD(new Date()) + '.csv';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('CSV diunduh — buka di Excel');
  }

  function currentMonthSpent(kategori){
    var today = new Date();
    var y = today.getFullYear(), m = today.getMonth();
    var total = 0;
    STATE.transaksi.forEach(function(t){
      if(t.Jenis !== 'Pengeluaran') return;
      if(isTransferLeg(t)) return;
      if((t.Kategori||'') !== kategori) return;
      var d = parseYMD(t.Tanggal);
      if(d.getFullYear()===y && d.getMonth()===m) total += Number(t.Nominal);
    });
    return total;
  }

  function compressImageFile_(file, maxW, quality, cb){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try { cb(canvas.toDataURL('image/jpeg', quality || 0.7)); }
        catch(e){ cb(''); }
      };
      img.onerror = function(){ cb(''); };
      img.src = reader.result;
    };
    reader.onerror = function(){ cb(''); };
    reader.readAsDataURL(file);
  }

  function esc(s){

  function daysUntil(ymd){
    if(!ymd) return null;
    var today = new Date(); today.setHours(0,0,0,0);
    var d = parseYMD(ymd); d.setHours(0,0,0,0);
    return Math.round((d - today) / 86400000);
  }
  function urgencyOf(h){
    if(h.Status === 'Lunas' || !h.JatuhTempo) return null;
    var days = daysUntil(h.JatuhTempo);
    if(days === null) return null;
    if(days < 0) return 'overdue';
    if(days <= 7) return 'upcoming';
    return null;
  }

  // Nominal yang ditampilkan di kartu: untuk yang sudah Lunas selalu TotalHutang
  // (SisaHutang-nya 0), untuk yang masih Aktif berupa SisaHutang pada metode cicilan.
  function amountShownFor(h){
    var lunas = h.Status === 'Lunas';
    return (h.Metode === 'Cicilan Bebas' || h.Metode === 'Cicilan Tetap') && !lunas ? Number(h.SisaHutang) : Number(h.TotalHutang);
  }

  var hutangSortBy = 'default';
  function sortHutangList(list){
    var arr = list.slice();
    if(hutangSortBy === 'jatuh-tempo'){
      arr.sort(function(a,b){
        if(!a.JatuhTempo && !b.JatuhTempo) return 0;
        if(!a.JatuhTempo) return 1;
        if(!b.JatuhTempo) return -1;
        return a.JatuhTempo < b.JatuhTempo ? -1 : a.JatuhTempo > b.JatuhTempo ? 1 : 0;
      });
    } else if(hutangSortBy === 'nominal-desc'){
      arr.sort(function(a,b){ return amountShownFor(b) - amountShownFor(a); });
    }
    return arr;
  }

    var overdueCount = 0, upcomingCount = 0;
    byJenis.forEach(function(h){
      if(h.Status === 'Lunas') lunasCount++; else aktifCount++;
      var u = urgencyOf(h);
      if(u === 'overdue') overdueCount++;
      else if(u === 'upcoming') upcomingCount++;
    });

    var statusHtml = '<div class="segmented" id="hp-status-segmented" style="margin-bottom:10px;">' +
      '<button data-st="Aktif" class="' + (hutangStatusFilter==='Aktif'?'active':'') + '">Aktif (' + aktifCount + ')</button>' +
      '<button data-st="Lunas" class="' + (hutangStatusFilter==='Lunas'?'active':'') + '">Lunas (' + lunasCount + ')</button>' +
    '</div>';

    var segHtml = '<div class="segmented" id="hp-segmented">' +
      ['Semua','Hutang','Piutang'].map(function(f){
        return '<button data-f="' + f + '" class="' + (hutangFilter===f?'active':'') + '">' + f + '</button>';
      }).join('') + '</div>';

    var sortHtml = '<select class="form-select" id="f-hutang-sort" style="margin-bottom:14px;">' +
      '<option value="default"' + (hutangSortBy==='default'?' selected':'') + '>Terbaru Ditambahkan</option>' +
      (hutangStatusFilter==='Aktif' ? '<option value="jatuh-tempo"' + (hutangSortBy==='jatuh-tempo'?' selected':'') + '>Jatuh Tempo Terdekat</option>' : '') +
      '<option value="nominal-desc"' + (hutangSortBy==='nominal-desc'?' selected':'') + '>' + (hutangStatusFilter==='Aktif' ? 'Sisa Terbesar' : 'Nominal Terbesar') + '</option>' +
    '</select>';

    var urgencyHtml = hutangStatusFilter !== 'Aktif' ? '' : (
      '<div class="urgency-row">' +
      '<button class="urgency-chip overdue' + (urgencyFilter==='overdue'?' active':'') + '" id="chip-overdue">' +
        '<span class="dot"></span><div><div class="n">' + overdueCount + '</div><div class="t">Jatuh Tempo</div></div>' +
      '</button>' +
      '<button class="urgency-chip upcoming' + (urgencyFilter==='upcoming'?' active':'') + '" id="chip-upcoming">' +
        '<span class="dot"></span><div><div class="n">' + upcomingCount + '</div><div class="t">Akan Jatuh Tempo (7 hari)</div></div>' +
      '</button>' +
    '</div>');

    var list = byJenis.filter(function(h){
      var isLunas = h.Status === 'Lunas';
      if(hutangStatusFilter === 'Aktif' && isLunas) return false;
      if(hutangStatusFilter === 'Lunas' && !isLunas) return false;
      if(hutangStatusFilter === 'Aktif' && urgencyFilter !== 'all' && urgencyOf(h) !== urgencyFilter) return false;
      return true;
    });
    list = sortHutangList(list);

    var html = statusHtml + segHtml + sortHtml + urgencyHtml;
    // Tombol tambah hutang / piutang — selalu tampil
    html += '<div style="display:flex; gap:8px; margin-bottom:12px;">' +
      '<button class="btn-primary" id="btn-add-hutang" style="margin:0; flex:1; padding:12px 0; font-size:13.5px;">+ Hutang</button>' +
      '<button class="btn-secondary" id="btn-add-piutang" style="margin:0; flex:1; padding:12px 0; font-size:13.5px; background:var(--green-pale); color:var(--green);">+ Piutang</button>' +
    '</div>';
    if(!list.length){
      html += hutangStatusFilter === 'Lunas'
        ? emptyState('Belum ada yang lunas', 'Hutang atau piutang yang sudah lunas akan muncul di sini.')
        : emptyState('Belum ada catatan aktif', 'Ketuk tombol + Hutang atau + Piutang di atas.');
    } else {
      list.forEach(function(h){
        var isHutang = h.Jenis === 'Hutang';
        var lunas = h.Status === 'Lunas';
        var sub = (isHutang?'Hutang':'Piutang') + ' • ' + esc(METODE_SHORT[h.Metode] || h.Metode) + (h.Bentuk === 'Barang' ? ' (Barang)' : '');
        if(h.Metode === 'Cicilan Tetap' && !lunas){
          sub += ' ' + (Number(h.CicilanTerbayar)+1 <= Number(h.Tenor) ? (Number(h.CicilanTerbayar)+1) : Number(h.Tenor)) + '/' + h.Tenor;
        }
        if(Number(h.BungaNominal) > 0){
          sub += ' • Bunga ' + fmtRupiah(h.BungaNominal) + (h.BungaPersen ? ' (' + h.BungaPersen + '%)' : '');
        }
        if(!lunas && h.JatuhTempo){
          var days = daysUntil(h.JatuhTempo);
          sub += ' • ' + (days < 0 ? 'Telat ' + Math.abs(days) + ' hari' : days === 0 ? 'Jatuh tempo hari ini' : days + ' hari lagi');
        }
        var amountShown = amountShownFor(h);
        html += '<div class="item-card" data-id="' + h.ID + '" data-kind="hp">' +
          '<div class="icon-badge ' + (isHutang?'amber':'green') + '">' +
            (isHutang ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>'
                      : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>') +
          '</div>' +
          '<div class="item-main"><div class="item-title">' + esc(h.Nama) +
            '<span class="status-pill ' + (lunas?'lunas':'belum') + '">' + (lunas?'Lunas':'Belum Lunas') + '</span></div>' +
          '<div class="item-sub">' + sub + '</div></div>' +
          '<div class="item-amount ' + (isHutang?'red':'green') + ' num' + (lunas?' lunas-amount':'') + '">' + fmtRupiah(amountShown) + '</div>' +
        '</div>';
      });
    }
    el.innerHTML = html;
    el.querySelectorAll('#hp-status-segmented button').forEach(function(b){
      b.addEventListener('click', function(){
        hutangStatusFilter = b.dataset.st;
        urgencyFilter = 'all';
        if(hutangSortBy === 'jatuh-tempo') hutangSortBy = 'default';
        renderHutang();
      });
    });
    el.querySelectorAll('#hp-segmented button').forEach(function(b){
      b.addEventListener('click', function(){ hutangFilter = b.dataset.f; renderHutang(); });
    });
    var chipOverdue = document.getElementById('chip-overdue');
    var chipUpcoming = document.getElementById('chip-upcoming');
    if(chipOverdue) chipOverdue.addEventListener('click', function(){
      urgencyFilter = urgencyFilter === 'overdue' ? 'all' : 'overdue'; renderHutang();
    });
    if(chipUpcoming) chipUpcoming.addEventListener('click', function(){
      urgencyFilter = urgencyFilter === 'upcoming' ? 'all' : 'upcoming'; renderHutang();
    });
    document.getElementById('f-hutang-sort').addEventListener('change', function(){ hutangSortBy = this.value; renderHutang(); });
    var btnAddHutang = document.getElementById('btn-add-hutang');
    var btnAddPiutang = document.getElementById('btn-add-piutang');
    if(btnAddHutang) btnAddHutang.addEventListener('click', function(){ openHutangForm('Hutang'); });
    if(btnAddPiutang) btnAddPiutang.addEventListener('click', function(){ openHutangForm('Piutang'); });
    el.querySelectorAll('.item-card[data-kind="hp"]').forEach(function(card){
      card.addEventListener('click', function(){ openHutangDetail(card.dataset.id); });
    });
  }

  // ================= REKENING VIEW =================
  var rekeningSortBy = 'default';
  function sortRekeningList(list){
    var arr = list.slice();
    if(rekeningSortBy === 'nama') arr.sort(function(a,b){ return a.Nama.localeCompare(b.Nama); });
    else if(rekeningSortBy === 'saldo-desc') arr.sort(function(a,b){ return Number(b.Saldo) - Number(a.Saldo); });
    else if(rekeningSortBy === 'saldo-asc') arr.sort(function(a,b){ return Number(a.Saldo) - Number(b.Saldo); });
    return arr;
  }

  function bankLogoHtml(nama, sizeClass){
    var m = bankMeta_(nama);
    var cls = 'bank-logo' + (sizeClass ? ' ' + sizeClass : '');
    var style = 'background:' + (m.bg || '#1A365D') + ';' + (m.color ? 'color:' + m.color + ';' : '');

      return '<div class="' + cls + '" style="' + style + 'padding:4px;" title="' + esc(nama) + '">' +

  function renderRekening(){
    var el = document.getElementById('view-rekening');
    var total = 0;
    STATE.rekening.forEach(function(r){
      if(!r.Nama || r.Nama === 'Kredit (Non-Kas)' || r.Nama === 'Reimburse') return;
      total += Number(r.Saldo) || 0;
    });
    var html = '<div class="total-saldo-card"><div class="lbl">TOTAL SALDO KESELURUHAN</div><div class="val num">' + fmtRupiah(total) + '</div></div>';
    // Tombol tambah rekening — selalu tampil
    html += '<button class="btn-primary" id="btn-add-rekening" style="margin-bottom:10px; display:flex; align-items:center; justify-content:center; gap:8px;">' +
      '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
      'Tambah Rekening</button>';
    if(STATE.rekening.filter(function(r){ return r.Nama && r.Nama !== 'Kredit (Non-Kas)' && r.Nama !== 'Reimburse'; }).length >= 2){
      html += '<button class="btn-secondary" id="btn-transfer" style="margin-bottom:10px; display:flex; align-items:center; justify-content:center; gap:8px;">' +
        '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>' +
        'Transfer Antar Rekening</button>';
    }
    if(STATE.rekening.length >= 2){
      html += '<select class="form-select" id="f-rekening-sort" style="margin-bottom:14px;">' +
        '<option value="default"' + (rekeningSortBy==='default'?' selected':'') + '>Urutan Ditambahkan</option>' +
        '<option value="nama"' + (rekeningSortBy==='nama'?' selected':'') + '>Nama A-Z</option>' +
        '<option value="saldo-desc"' + (rekeningSortBy==='saldo-desc'?' selected':'') + '>Saldo Terbesar</option>' +
        '<option value="saldo-asc"' + (rekeningSortBy==='saldo-asc'?' selected':'') + '>Saldo Terkecil</option>' +
      '</select>';
    }
    var visibleRek = STATE.rekening.filter(function(r){ return r.Nama && String(r.Nama).trim(); });
    if(!visibleRek.length){
      html += emptyState('Belum ada rekening', 'Ketuk tombol "Tambah Rekening" di atas.');
    } else {
      sortRekeningList(STATE.rekening).forEach(function(r){
        if(!r.Nama || !String(r.Nama).trim()) return; // skip rekening kosong
        var isReimburse = r.Nama === 'Reimburse';
        var isKreditNonKas = r.Nama === 'Kredit (Non-Kas)';
        var tag = isReimburse ? '<span class="metode-tag" style="margin-left:6px;">Klaim</span>'
          : (isKreditNonKas ? '<span class="metode-tag" style="margin-left:6px;">Virtual</span>' : '');
        html += '<div class="rekening-card" data-id="' + r.ID + '" data-kind="rek">' +
          bankLogoHtml(r.Nama) +
          '<div class="rekening-info"><div class="nm">' + esc(r.Nama) + tag + '</div><div class="sd num">' + fmtRupiah(r.Saldo) + '</div></div>' +
          '<div class="rekening-more">' +
            '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>' +
          '</div></div>';
      });
    }

  // ================= REKAP =================
  var rekapSubTab = 'realtime'; // 'realtime' | 'bulanan' | 'custom'
  var HUTANG_KATEGORI = ['Terima Hutang','Bayar Hutang','Beri Piutang','Terima Piutang','Top Up Hutang','Top Up Piutang'];

  function numOnly(n){
    n = Math.round(Number(n) || 0);
    var neg = n < 0; n = Math.abs(n);
    return (neg ? '-' : '') + formatRibuan(String(n));
  }
  function pad2(n){ return ('0' + n).slice(-2); }
  function fmtRangeLabel(fromD, toD){
    return pad2(fromD.getDate()) + ' ' + MONTHS_SHORT[fromD.getMonth()] + ' ' + fromD.getFullYear() +
      ' - ' + pad2(toD.getDate()) + ' ' + MONTHS_SHORT[toD.getMonth()] + ' ' + toD.getFullYear();
  }
  function lastDayOfMonth(y, m){ return new Date(y, m+1, 0).getDate(); }

  function parseUntukDariCatatan_(catatan){
    var m = String(catatan || '').match(/Untuk:\s*(Pribadi|Istri|Anak|Bersama)/i);
    return m ? m[1] : null;
  }

  function simpleBarChartHtml_(items){
    var max = 0;
    items.forEach(function(it){ if(it.value > max) max = it.value; });
    if(max <= 0) return '';
    var html = '<div style="margin:8px 0 4px; display:flex; flex-direction:column; gap:6px;">';
    items.forEach(function(it){
      if(!it.value) return;
      var pct = Math.max(4, Math.round(it.value / max * 100));
      html += '<div>' +
        '<div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:2px;"><span>' + esc(it.label) + '</span><span class="num">' + fmtRupiah(it.value) + '</span></div>' +
        '<div style="height:8px; background:var(--input-bg); border-radius:99px; overflow:hidden;">' +
          '<div style="height:100%; width:' + pct + '%; background:' + (it.color || 'var(--blue)') + '; border-radius:99px;"></div>' +
        '</div></div>';
    });
    html += '</div>';
    return html;
  }
  function topKategoriBars_(fromYMD, toYMD, limit){
    var map = {};
    (STATE.transaksi || []).forEach(function(t){
      if(t.Jenis !== 'Pengeluaran') return;
      if(t.Tanggal < fromYMD || t.Tanggal > toYMD) return;
      if(isTransferLeg(t)) return;
      var k = t.Kategori || 'Lainnya';
      map[k] = (map[k] || 0) + (Number(t.Nominal) || 0);
    });
    var arr = Object.keys(map).map(function(k){ return { label: k, value: map[k], color: '#1A365D' }; });
    arr.sort(function(a,b){ return b.value - a.value; });
    return arr.slice(0, limit || 5);
  }

  function computeRekap(fromYMD, toYMD){
    var pengeluaran = 0, pemasukan = 0;
    var hutangTambah = 0, hutangKurang = 0;
    var piutangTambah = 0, piutangKurang = 0;
    var untukMap = { Pribadi: 0, Istri: 0, Anak: 0, Bersama: 0, Lainnya: 0 };
    STATE.transaksi.forEach(function(t){
      if(t.Tanggal < fromYMD || t.Tanggal > toYMD) return;
      if(isTransferLeg(t)) return;
      var n = Number(t.Nominal) || 0;
      if(t.Jenis === 'Pemasukan') pemasukan += n;
      else {
        pengeluaran += n;
        var u = parseUntukDariCatatan_(t.Catatan);
        if(u && untukMap[u] !== undefined) untukMap[u] += n;
        else untukMap.Lainnya += n;
      }
      if(t.Kategori === 'Terima Hutang' || t.Kategori === 'Top Up Hutang') hutangTambah += n;
      else if(t.Kategori === 'Bayar Hutang') hutangKurang += n;
      else if(t.Kategori === 'Beri Piutang' || t.Kategori === 'Top Up Piutang') piutangTambah += n;
      else if(t.Kategori === 'Terima Piutang') piutangKurang += n;
    });
    // Hutang/piutang bentuk Barang: kewajiban nambah tanpa kas "Terima Hutang"
    STATE.hutangPiutang.forEach(function(h){
      if(!h.Tanggal || h.Tanggal < fromYMD || h.Tanggal > toYMD) return;
      if(h.Bentuk !== 'Barang') return;
      var pokok = Number(h.Pokok) || 0;
      if(pokok <= 0) return;
      if(h.Jenis === 'Hutang') hutangTambah += pokok;
      else if(h.Jenis === 'Piutang') piutangTambah += pokok;
    });
    return {
      pengeluaran: pengeluaran,
      pemasukan: pemasukan,
      selisih: pemasukan - pengeluaran,
      hutangTambah: hutangTambah,
      hutangKurang: hutangKurang,
      piutangTambah: piutangTambah,
      piutangKurang: piutangKurang,
      hutangPiutang: hutangTambah - hutangKurang,
      untuk: untukMap
    };
  }

  function rekapRowHtml(label, value, mode, focus){
    var cls = 'dark', text;
    if(mode === 'pemasukan'){ cls = 'green'; text = '+' + numOnly(value); }
    else if(mode === 'delta'){ if(value >= 0){ cls = 'green'; text = '+' + numOnly(value); } else { text = numOnly(value); } }
    else if(mode === 'hutang-tambah'){ cls = 'red'; text = '+' + numOnly(value); }
    else if(mode === 'hutang-kurang'){ cls = 'green'; text = '−' + numOnly(value); }
    else { text = numOnly(value); }
    var focusAttr = focus ? ' data-focus="' + focus + '" style="cursor:pointer;"' : '';
    return '<div class="rekap-row"' + focusAttr + '><span class="k">' + label + '</span><span class="v ' + cls + ' num">' + text + '</span></div>';
  }
  function rekapCardHtml(dateLabel, data, fromYMD, toYMD){
    var html = '<div class="rekap-card" data-from="' + fromYMD + '" data-to="' + toYMD + '">' +
      '<div class="rekap-date">' + dateLabel + '</div>' +
      rekapRowHtml('Pengeluaran', data.pengeluaran, 'plain', 'pengeluaran') +
      rekapRowHtml('Pemasukan', data.pemasukan, 'pemasukan', 'pemasukan') +
      rekapRowHtml('Selisih', data.selisih, 'delta', 'rekap');

    // Breakdown pengeluaran per "Untuk" + grafik batang
    var u = data.untuk || {};
    var hasUntuk = (u.Pribadi || u.Istri || u.Anak || u.Bersama || u.Lainnya);
    if(hasUntuk){
      html += '<div style="font-size:11px; font-weight:700; color:var(--ink-faint); margin:10px 0 4px; text-transform:uppercase; letter-spacing:.3px;">Pengeluaran per orang</div>';
      if(u.Pribadi) html += rekapRowHtml('• Pribadi', u.Pribadi, 'plain', 'pengeluaran');
      if(u.Istri) html += rekapRowHtml('• Istri', u.Istri, 'plain', 'pengeluaran');
      if(u.Anak) html += rekapRowHtml('• Anak', u.Anak, 'plain', 'pengeluaran');
      if(u.Bersama) html += rekapRowHtml('• Bersama', u.Bersama, 'plain', 'pengeluaran');
      if(u.Lainnya) html += rekapRowHtml('• Belum ditandai', u.Lainnya, 'plain', 'pengeluaran');
      html += simpleBarChartHtml_([
        { label: 'Pribadi', value: u.Pribadi || 0, color: '#3B82F6' },
        { label: 'Istri', value: u.Istri || 0, color: '#EC4899' },
        { label: 'Anak', value: u.Anak || 0, color: '#F59E0B' },
        { label: 'Bersama', value: u.Bersama || 0, color: '#10B981' }
      ]);
    }
    // Grafik kategori (top 5 pengeluaran)
    var katBars = topKategoriBars_(fromYMD, toYMD, 5);
    if(katBars.length){
      html += '<div style="font-size:11px; font-weight:700; color:var(--ink-faint); margin:12px 0 4px; text-transform:uppercase; letter-spacing:.3px;">Top kategori</div>';
      html += simpleBarChartHtml_(katBars);
    }

    html +=
      rekapRowHtml('Hutang Bertambah', data.hutangTambah, 'hutang-tambah', 'hutang-tambah') +
      rekapRowHtml('Hutang Berkurang', data.hutangKurang, 'hutang-kurang', 'hutang-kurang');
    if(data.piutangTambah || data.piutangKurang){
      html += rekapRowHtml('Piutang Bertambah', data.piutangTambah, 'hutang-tambah', 'piutang-tambah') +
        rekapRowHtml('Piutang Berkurang', data.piutangKurang, 'hutang-kurang', 'piutang-kurang');
    }
    html += '</div>';
    return html;
  }
  function wireRekapCards(container){

  function openHutangRekapDetail(fromYMD, toYMD_, focus){
    var titles = {
      'hutang-tambah': 'Hutang Bertambah',
      'hutang-kurang': 'Hutang Berkurang',
      'piutang-tambah': 'Piutang Bertambah',
      'piutang-kurang': 'Piutang Berkurang'
    };
    var title = titles[focus] || 'Detail';
    var items = [];
    var total = 0;

    if(focus === 'hutang-tambah'){
      STATE.transaksi.forEach(function(t){
        if(t.Tanggal < fromYMD || t.Tanggal > toYMD_) return;
        if(t.Kategori === 'Terima Hutang' || t.Kategori === 'Top Up Hutang'){
          items.push({ tanggal: t.Tanggal, nama: t.Catatan || t.Kategori, sub: t.Akun || '', nominal: Number(t.Nominal), kind: 'trx' });
          total += Number(t.Nominal);
        }
      });
      STATE.hutangPiutang.forEach(function(h){
        if(!h.Tanggal || h.Tanggal < fromYMD || h.Tanggal > toYMD_) return;
        if(h.Bentuk !== 'Barang' || h.Jenis !== 'Hutang') return;
        var pokok = Number(h.Pokok) || 0;
        if(pokok <= 0) return;
        items.push({ tanggal: h.Tanggal, nama: h.Nama, sub: (h.Catatan || 'Barang/Jasa') + ' • Hutang', nominal: pokok, kind: 'hp', id: h.ID });
        total += pokok;
      });
    } else if(focus === 'hutang-kurang'){
      STATE.transaksi.forEach(function(t){
        if(t.Tanggal < fromYMD || t.Tanggal > toYMD_) return;
        if(t.Kategori !== 'Bayar Hutang') return;
        items.push({ tanggal: t.Tanggal, nama: t.Catatan || 'Bayar Hutang', sub: t.Akun || '', nominal: Number(t.Nominal), kind: 'trx' });
        total += Number(t.Nominal);
      });
    } else if(focus === 'piutang-tambah'){
      STATE.transaksi.forEach(function(t){
        if(t.Tanggal < fromYMD || t.Tanggal > toYMD_) return;
        if(t.Kategori === 'Beri Piutang' || t.Kategori === 'Top Up Piutang'){
          items.push({ tanggal: t.Tanggal, nama: t.Catatan || t.Kategori, sub: t.Akun || '', nominal: Number(t.Nominal), kind: 'trx' });
          total += Number(t.Nominal);
        }
      });
      STATE.hutangPiutang.forEach(function(h){
        if(!h.Tanggal || h.Tanggal < fromYMD || h.Tanggal > toYMD_) return;
        if(h.Bentuk !== 'Barang' || h.Jenis !== 'Piutang') return;
        var pokok = Number(h.Pokok) || 0;
        if(pokok <= 0) return;
        items.push({ tanggal: h.Tanggal, nama: h.Nama, sub: (h.Catatan || 'Barang/Jasa') + ' • Piutang', nominal: pokok, kind: 'hp', id: h.ID });
        total += pokok;
      });
    } else if(focus === 'piutang-kurang'){
      STATE.transaksi.forEach(function(t){
        if(t.Tanggal < fromYMD || t.Tanggal > toYMD_) return;
        if(t.Kategori !== 'Terima Piutang') return;
        items.push({ tanggal: t.Tanggal, nama: t.Catatan || 'Terima Piutang', sub: t.Akun || '', nominal: Number(t.Nominal), kind: 'trx' });
        total += Number(t.Nominal);
      });
    }

    items.sort(function(a,b){ return b.tanggal < a.tanggal ? -1 : b.tanggal > a.tanggal ? 1 : 0; });

    var isTambah = focus.indexOf('tambah') !== -1;

      '<div style="font-size:12.5px; color:var(--ink-faint); margin-bottom:6px;">' + fmtRangeLabel(parseYMD(fromYMD), parseYMD(toYMD_)) + '</div>' +
      '<div style="font-size:22px; font-weight:800; margin-bottom:14px;" class="num ' + (isTambah?'red':'green') + '">' +

  function monthsWithData(){
    var set = {};
    STATE.transaksi.forEach(function(t){ var d = parseYMD(t.Tanggal); set[d.getFullYear()+'-'+d.getMonth()] = true; });
    STATE.hutangPiutang.forEach(function(h){ if(h.Tanggal){ var d = parseYMD(h.Tanggal); set[d.getFullYear()+'-'+d.getMonth()] = true; } });
    var today = new Date();
    delete set[today.getFullYear()+'-'+today.getMonth()];
    var arr = Object.keys(set).map(function(k){ var p = k.split('-'); return { y: Number(p[0]), m: Number(p[1]) }; });
    arr.sort(function(a,b){ return (b.y*12+b.m) - (a.y*12+a.m); });
    return arr;
  }

  function categoryBreakdown(trx, jenis){
    var map = {};
    trx.forEach(function(t){
      if(t.Jenis !== jenis) return;
      if(isTransferLeg(t)) return;
      var k = t.Kategori || 'Tanpa Kategori';
      map[k] = (map[k] || 0) + Number(t.Nominal);
    });
    var arr = Object.keys(map).map(function(k){ return { kategori: k, total: map[k] }; });
    arr.sort(function(a,b){ return b.total - a.total; });
    return arr;
  }

  function svgBarCompare(pemasukan, pengeluaran){
    var max = Math.max(pemasukan, pengeluaran, 1);
    var chartH = 120;
    var hIn = Math.round((pemasukan/max) * chartH);
    var hOut = Math.round((pengeluaran/max) * chartH);
    return '<svg viewBox="0 0 240 165" style="width:100%; max-width:260px; display:block; margin:8px auto 4px;">' +
      '<rect x="35" y="' + (chartH-hIn+10) + '" width="60" height="' + Math.max(hIn,2) + '" rx="6" fill="#1FAA6D"/>' +
      '<rect x="145" y="' + (chartH-hOut+10) + '" width="60" height="' + Math.max(hOut,2) + '" rx="6" fill="#E5484D"/>' +
      '<text x="65" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#1FAA6D">' + numOnly(pemasukan) + '</text>' +
      '<text x="175" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#E5484D">' + numOnly(pengeluaran) + '</text>' +
      '<text x="65" y="150" text-anchor="middle" font-size="12" fill="#5B6478">Pemasukan</text>' +
      '<text x="175" y="150" text-anchor="middle" font-size="12" fill="#5B6478">Pengeluaran</text>' +
    '</svg>';
  }

  function svgDailyTrend(trx, fromYMD, toYMD_){
    var start = parseYMD(fromYMD), end = parseYMD(toYMD_);
    var days = [];
    var d = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    var guard = 0;
    while(d <= end && guard < 62){ days.push(toYMD(d)); d.setDate(d.getDate()+1); guard++; }
    if(days.length < 2) return '';
    var map = {};
    trx.forEach(function(t){
      if(t.Jenis === 'Pengeluaran' && !isTransferLeg(t)) map[t.Tanggal] = (map[t.Tanggal]||0) + Number(t.Nominal);
    });
    var max = 1;
    days.forEach(function(dy){ if((map[dy]||0) > max) max = map[dy]; });
    var barW = 9, gap = 5, chartH = 90;
    var svgW = days.length * (barW+gap);
    var bars = days.map(function(dy, i){
      var val = map[dy] || 0;
      var h = Math.max(Math.round((val/max) * chartH), val>0?2:0);
      var x = i * (barW+gap);
      return '<rect x="' + x + '" y="' + (chartH-h) + '" width="' + barW + '" height="' + h + '" rx="2" fill="' + (val>0?'#E5484D':'#E7EBF2') + '"/>';
    }).join('');
    return '<div style="margin-top:18px;"><div class="riwayat-title" style="margin-bottom:10px;">Tren Pengeluaran Harian</div>' +
      '<div style="overflow-x:auto;"><svg viewBox="0 0 ' + svgW + ' ' + chartH + '" style="width:' + Math.max(svgW,280) + 'px; height:' + chartH + 'px; display:block;">' + bars + '</svg></div></div>';
  }

  function renderKategoriRows(items, colorVar){

      return '<div class="kategori-row" data-kategori="' + esc(it.kategori) + '">' +
        '<div class="kategori-row-top"><span>' + esc(it.kategori) + '</span><span class="num">' + numOnly(it.total) + ' <span class="chev">›</span></span></div>' +
        '<div class="kategori-bar-track"><div class="kategori-bar-fill" style="width:' + pct + '%; background:' + colorVar + ';"></div></div>' +
      '</div>';
    }).join('');
  }

              '<div class="item-amount ' + amountClass + ' num">' + (isTransfer ? '' : (isIn?'+':'-')) + fmtRupiah(t.Nominal) + '</div>' +

  function doExport(format, fromYMD, toYMD_, btn){
    var original = btn.innerHTML;

      var url = 'https://docs.google.com/spreadsheets/d/' + res.spreadsheetId + '/export?format=' + format + '&gid=' + res.sheetId +
        (format === 'pdf' ? '&size=A4&portrait=true&fitw=true&gridlines=false' : '');

      toast('Export siap, membuka di tab baru…');
    }).withFailureHandler(function(err){
      btn.innerHTML = original;
      toast('Gagal export: ' + err.message);
    }).generateRekapExport({ fromYMD: fromYMD, toYMD: toYMD_, labelRange: label });

  function openSheet(html){
    document.getElementById('sheet-content').innerHTML = html;
    overlay.classList.add('show'); sheet.classList.add('show');
    if(!sheetHistoryPushed){
      try{ history.pushState({ kasSheet: true }, ''); sheetHistoryPushed = true; }catch(e){}
    }
    fitViewport();
  }
  function closeSheet(){
    overlay.classList.remove('show'); sheet.classList.remove('show');
    if(sheetHistoryPushed){
      sheetHistoryPushed = false;
      try{ history.back(); }catch(e){}
    }
    fitViewport();
  }
  window.addEventListener('popstate', function(){
    // Fires either from our own history.back() above (harmless no-op here since
    // the sheet is already hidden by then), or from the user pressing the phone's
    // back button while the sheet is open — in which case we close the sheet
    // instead of letting the browser navigate away from the app.
    if(sheet.classList.contains('show')){
      overlay.classList.remove('show'); sheet.classList.remove('show');
      sheetHistoryPushed = false;

  function submitTrxForm(today){
    var nominal = rawNum('f-nominal');
    var tanggal = document.getElementById('f-tanggal').value;
    if(!nominal || nominal <= 0){ toast('Nominal harus diisi'); return; }
    if(!tanggal){ toast('Tanggal harus diisi'); return; }
    var btn = document.getElementById('btn-save-trx');

    if(trxSumber === 'Hutang' && trxJenis === 'Pengeluaran'){
      var kategori = document.getElementById('f-kategori').value.trim();
      var namaHutang = document.getElementById('f-h-nama').value.trim() || kategori || 'Pembelian';
      var payload = {
        jenis: 'Hutang', nama: namaHutang, metode: trxHutangMetode, bentuk: 'Barang',
        pokok: nominal, tanggal: tanggal, kategori: kategori,
        jatuhTempo: document.getElementById('f-h-tempo') ? document.getElementById('f-h-tempo').value : '',
        catatan: document.getElementById('f-catatan').value || ''
      };
      if(trxHutangMetode === 'Cicilan Tetap'){
        var tenor = Number(document.getElementById('f-h-tenor').value);
        if(!tenor || tenor <= 0){ toast('Tenor harus diisi'); return; }
        payload.tenor = tenor;
        payload.bungaPersen = Number(document.getElementById('f-h-bunga-persen').value) || 0;
        payload.bungaNominal = rawNum('f-h-bunga-nominal') || 0;
      } else if(trxHutangMetode === 'Paylater'){
        payload.biayaLayanan = rawNum('f-h-biaya') || 0;
      }
      saveOptimistic('Dicatat sebagai Hutang', function(ok, fail){
        google.script.run.withSuccessHandler(function(data){
          ok(data);
          var hb = document.querySelector('#bottomnav button[data-tab="hutang"]');
          if(hb) hb.click();
        }).withFailureHandler(fail).addHutangPiutang(payload);
      });
      return;
    }

    if(trxSumber === 'Reimburse' && trxJenis === 'Pengeluaran'){
      var akun = document.getElementById('f-akun').value;
      if(!akun){ toast('Pilih sumber rekening'); return; }
      var payload = {
        nominal: nominal, akun: akun, tanggal: tanggal,
        persentase: Math.max(0, Math.min(100, Number(document.getElementById('f-reimburse-persen').value) || 0)),
        kategori: document.getElementById('f-kategori').value,
        catatan: document.getElementById('f-catatan').value
      };
      saveOptimistic('Transaksi Reimburse dicatat', function(ok, fail){
        google.script.run.withSuccessHandler(ok).withFailureHandler(fail).addReimburseTransaksi(payload);
      });
      return;
    }

    var akun = document.getElementById('f-akun').value;
    var kategori = (document.getElementById('f-kategori').value || '').trim();
    if(!akun){ toast('Pilih akun'); return; }
    if(!kategori){ toast('Pilih kategori'); return; }

    // Lainnya → input manual jadi kategori baru
    if(kategori === 'Lainnya'){
      var customKat = (document.getElementById('f-kategori-custom') && document.getElementById('f-kategori-custom').value || '').trim();
      if(!customKat){ toast('Isi nama kategori baru'); return; }
      if(customKat === 'Lainnya'){ toast('Pakai nama kategori yang lebih spesifik'); return; }
      kategori = customKat;
      saveCustomKategori_(kategori);
    }

    var catatanExtra = (document.getElementById('f-catatan') && document.getElementById('f-catatan').value) || '';
    var catatanParts = [];

    if(trxJenis === 'Pengeluaran'){
      var untuk = window.__trxUntuk || 'Pribadi';
      if(!untuk){ toast('Pilih pengeluaran untuk siapa'); return; }
      catatanParts.push('Untuk: ' + untuk);

      if(kategori === 'Makan & Minum'){
        var item = (document.getElementById('f-item-detail') && document.getElementById('f-item-detail').value || '').trim();
        var tempat = (document.getElementById('f-tempat') && document.getElementById('f-tempat').value || '').trim();
        if(!item){ toast('Isi makan/minum apa'); return; }
        if(!tempat){ toast('Isi beli di mana'); return; }
        catatanParts.push('Menu: ' + item);
        catatanParts.push('Tempat: ' + tempat);
      }
    }
    if(catatanExtra.trim()) catatanParts.push(catatanExtra.trim());
    if(window.__trxFotoDataUrl) catatanParts.push('[Foto]');

    var payload = {
      jenis: trxJenis, nominal: nominal, tanggal: tanggal,
      akun: akun,
      kategori: kategori,
      catatan: catatanParts.join(' • ')
    };

    // Langsung tampil di list (optimistic), baru sync ke server
    var tempId = 'local-' + Date.now();
    var localRow = {
      ID: tempId,
      Tanggal: tanggal,
      Jenis: trxJenis,
      Kategori: kategori,
      Akun: akun,
      Nominal: nominal,
      Catatan: payload.catatan
    };
    if(window.__trxFotoDataUrl){
      saveTrxFoto_(fotoKeyFromTrx_(localRow), window.__trxFotoDataUrl);
    }
    STATE.transaksi = [localRow].concat(STATE.transaksi || []);
    // Update saldo rekening kasar di UI
    STATE.rekening.forEach(function(r){
      if(r.Nama === akun){
        var s = Number(r.Saldo) || 0;
        r.Saldo = trxJenis === 'Pemasukan' ? s + nominal : s - nominal;
      }
    });
    closeSheet();
    toast('Transaksi disimpan');
    renderAll();

    google.script.run.withSuccessHandler(function(data){
      if(data) refreshState(data);
    }).withFailureHandler(function(err){
      // Rollback item lokal + saldo kalau server gagal
      STATE.transaksi = (STATE.transaksi || []).filter(function(t){ return t.ID !== tempId; });
      STATE.rekening.forEach(function(r){
        if(r.Nama === akun){
          var s = Number(r.Saldo) || 0;
          r.Saldo = trxJenis === 'Pemasukan' ? s - nominal : s + nominal;
        }
      });
      renderAll();
      toast(err && err.message ? err.message : 'Belum tersimpan ke server');
    }).addTransaksi(payload);
  }

  function addMonthsJS(ymd, n){
    if(!ymd) return '';
    var d = parseYMD(ymd);
    var day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    var lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day, lastDay));
    return toYMD(d);
  }

  // Jadwal cicilan tidak rata di Catatan: JADWAL:2026-10-05=384471;2026-11-05=109555
  function parseJadwalTagihan_(catatan){
    var m = String(catatan || '').match(/JADWAL:([^\n|]+)/i);
    if(!m) return [];
    return m[1].split(';').map(function(part){
      part = part.trim();
      if(!part) return null;
      var bits = part.split('=');
      if(bits.length < 2) return null;
      var amount = Number(String(bits[1]).replace(/[^\d.]/g, '')) || 0;
      if(amount <= 0) return null;
      return { date: bits[0].trim(), amount: amount };
    }).filter(Boolean);
  }
  function nextTagihanDariJadwal_(h){
    var jadwal = parseJadwalTagihan_(h.Catatan);
    if(!jadwal.length) return null;
    var terbayar = Math.max(0, Number(h.TotalHutang) - Number(h.SisaHutang));
    var acc = 0;
    for(var i = 0; i < jadwal.length; i++){
      var prevAcc = acc;
      acc += jadwal[i].amount;
      if(terbayar < acc - 0.01){
        var alreadyOnThis = Math.max(0, terbayar - prevAcc);
        var sisaTagihan = Math.round(jadwal[i].amount - alreadyOnThis);
        if(sisaTagihan <= 0) continue;
        return { amount: sisaTagihan, date: jadwal[i].date, ke: i + 1, total: jadwal.length };
      }
    }
    return null;
  }
