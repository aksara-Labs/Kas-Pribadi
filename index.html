<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <title>Kas Pribadi</title>
  <style>
    :root{
      --blue:#1B3A5F;
      --blue-dark:#0F2744;
      --blue-pale:#E8EEF5;
      --green:#2BB673;
      --green-pale:#E6F7EF;
      --red:#E0524F;
      --red-pale:#FBEAE9;
      --amber:#E2993D;
      --amber-pale:#FBF0DF;
      --ink:#1A2332;
      --ink-soft:#5A6577;
      --ink-faint:#8B95A5;
      --line:#E2E8F0;
      --bg:#F4F6F9;
      --card:#FFFFFF;
      --input-bg:#EEF2F7;
      --overlay:rgba(15,30,50,.5);
      --radius:20px;
      --radius-sm:14px;
    }
    html.dark{
      --blue-pale:#1A2D45;
      --green-pale:#0F3324;
      --red-pale:#3A2220;
      --amber-pale:#3A2C15;
      --ink:#E8EEF5;
      --ink-soft:#A8B4C4;
      --ink-faint:#6B7A8F;
      --line:#2A3548;
      --bg:#0B1220;
      --card:#152033;
      --input-bg:#1A2740;
      --overlay:rgba(0,0,0,.6);
    }
    html.dark body{ background:var(--bg); }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; min-width:0;}
    html,body{
      margin:0; padding:0; height:100%; width:100%;
      overflow:hidden; overflow-x:hidden; overscroll-behavior:none;
      touch-action:pan-y; -ms-touch-action:pan-y;
      font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg); color:var(--ink);
    }
    #app{
      position:fixed; top:0; left:50%; transform:translateX(-50%);
      display:flex; flex-direction:column;
      width:100vw; background:var(--bg);
      overflow:hidden; overflow-x:hidden; touch-action:pan-y;
    }
    #appInner{
      display:flex; flex-direction:column; width:100%; height:100%;
      transform-origin:top left;
    }
    button{font-family:inherit; border:none; background:none; cursor:pointer;}
    .num{ font-variant-numeric:tabular-nums; }

    /* ---------- TOP BAR ---------- */
    #topbar{
      flex:0 0 auto; color:#fff; padding:12px 16px 22px; position:relative; z-index:2;
      background:
        linear-gradient(180deg, rgba(15,39,68,.55) 0%, rgba(15,39,68,.72) 45%, rgba(15,39,68,.88) 100%),
        url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80') center 40%/cover no-repeat,
        linear-gradient(135deg, var(--blue), var(--blue-dark));
    }
    .topbar-row{display:flex; align-items:center; justify-content:space-between; width:100%;}
    .topbar-row h1{font-size:21px; font-weight:700; margin:0; letter-spacing:.2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    .topbar-icon-btn{
      width:40px; height:40px; flex:0 0 40px; display:flex; align-items:center; justify-content:center;
      border-radius:50%; color:#fff; opacity:.95;
    }
    .topbar-icon-btn:active{background:rgba(255,255,255,.18);}
    .topbar-spacer{width:40px; flex:0 0 40px;}
    .month-nav{display:flex; align-items:center; justify-content:center; gap:6px; flex:1 1 auto; min-width:0; overflow:hidden;}
    .month-nav .month-label{font-size:25px; font-weight:700; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

    /* ---------- SUMMARY CARD (overlaps top bar) ---------- */
    #summary{
      margin:-12px 14px 0; background:var(--card); border-radius:var(--radius);
      box-shadow:0 8px 24px -8px rgba(15,39,68,.18); padding:14px 6px;
      display:grid; grid-template-columns:1fr 1fr 1fr; position:relative; z-index:3;
      flex:0 0 auto;
    }
    #summary.cols-4{grid-template-columns:1fr 1fr; row-gap:10px;}
    #summary.hero-mode{
      display:block; background:transparent; box-shadow:none; padding:0; margin:-12px 0 0;
    }
    #summary .stat{text-align:center; padding:2px 3px; position:relative; min-width:0;}
    #summary .stat:not(:last-child)::after{
      content:""; position:absolute; right:0; top:8%; bottom:8%; width:1px; background:var(--line);
    }
    #summary.cols-4 .stat::after{display:none;}
    #summary.cols-4 .stat:nth-child(1)::after,
    #summary.cols-4 .stat:nth-child(3)::after{
      display:block; content:""; position:absolute; right:0; top:8%; bottom:8%; width:1px; background:var(--line);
    }
    #summary.cols-4 .stat:nth-child(3),
    #summary.cols-4 .stat:nth-child(4){
      border-top:1px solid var(--line); padding-top:10px;
    }
    #summary .stat .lbl{font-size:17px; color:var(--ink-faint); font-weight:600; margin-bottom:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    #summary .stat .val{font-size:26px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    #summary .stat .val.green{color:var(--green);}
    #summary .stat .val.red{color:var(--red);}
    #summary .stat .val.blue{color:var(--blue-dark);}

    /* ---------- GREETING + DATE ROW ---------- */
    .greeting-row{
      display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
      padding:2px 2px 10px; color:#fff;
    }
    .greeting-row .hello{font-size:12.5px; opacity:.85; font-weight:600;}
    .greeting-row .name{font-size:19px; font-weight:800; margin-top:1px;}
    .name-edit-btn{text-align:left; color:#fff;}
    .name-edit-btn:active{opacity:.8;}
    .date-pill{
      display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.16); color:#fff;
      border-radius:12px; padding:9px 12px; font-size:12.5px; font-weight:700; white-space:nowrap; flex:0 0 auto;
    }
    .date-pill:active{background:rgba(255,255,255,.26);}
    .date-pill svg{flex:0 0 auto;}

    /* ---------- BALANCE HERO CARD ---------- */
    .balance-hero{
      margin:0 14px; padding:14px 16px 12px; border-radius:var(--radius); color:#fff;
      background:radial-gradient(120% 140% at 90% -10%, rgba(255,255,255,.14), transparent 55%), linear-gradient(160deg,var(--blue),var(--blue-dark));
      box-shadow:0 10px 24px -10px rgba(15,39,68,.4); position:relative; z-index:3; overflow:hidden;
    }
    .balance-hero .top-lbl{
      display:flex; align-items:center; gap:7px; font-size:11px; font-weight:700; letter-spacing:.5px;
      opacity:.85; text-transform:uppercase;
    }
    .balance-hero .top-lbl button{color:#fff; opacity:.9; display:flex; align-items:center;}
    .balance-hero .amount{font-size:26px; font-weight:800; margin:4px 0 10px; letter-spacing:.2px;}
    .balance-hero .pill-row{display:flex; gap:8px;}
    .balance-hero .pill{
      flex:1; display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.14);
      border-radius:12px; padding:7px 10px; min-width:0;
    }
    .balance-hero .pill .ic{
      width:26px; height:26px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    }
    .balance-hero .pill.in .ic{background:var(--green);}
    .balance-hero .pill.out .ic{background:var(--red);}
    .balance-hero .pill .txt{min-width:0;}
    .balance-hero .pill .txt .l{font-size:10px; opacity:.85; font-weight:600;}
    .balance-hero .pill .txt .v{font-size:12.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .balance-hero .cashflow-row{
      display:flex; align-items:center; justify-content:space-between; margin-top:10px; padding-top:10px;
      border-top:1px solid rgba(255,255,255,.18);
    }
    .balance-hero .cashflow-row .l{font-size:10.5px; opacity:.8; font-weight:600;}
    .balance-hero .cashflow-row .v{font-size:16px; font-weight:800; margin-top:1px;}
    .cashflow-tag{
      background:rgba(255,255,255,.18); border-radius:20px; padding:4px 10px; font-size:10px; font-weight:700;
    }

    /* ---------- QUICK ACTIONS ---------- */
    .quick-actions{
      margin:12px 14px 4px; background:var(--card); border-radius:var(--radius);
      box-shadow:0 1px 2px rgba(40,30,15,.06); padding:14px 6px;
      display:grid; grid-template-columns:repeat(4,1fr);
    }
    .quick-actions button{
      display:flex; flex-direction:column; align-items:center; gap:6px; padding:2px 2px;
    }
    .quick-actions .qa-ic{
      width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff;
    }
    .quick-actions .qa-ic.in{background:var(--green);}
    .quick-actions .qa-ic.out{background:var(--red);}
    .quick-actions .qa-ic.transfer{background:var(--blue);}
    .quick-actions .qa-ic.more{background:var(--input-bg); color:var(--ink-faint);}
    .quick-actions .qa-lbl{font-size:12px; font-weight:700; color:var(--ink);}
    .quick-actions .qa-sub{font-size:10px; color:var(--ink-faint); font-weight:600;}

    /* ---------- SECTION HEADER ---------- */
    .section-header{
      display:flex; align-items:center; justify-content:space-between; margin:18px 2px 10px;
    }
    .section-header .t{font-size:15px; font-weight:800; color:var(--ink);}
    .section-header .more{
      display:flex; align-items:center; gap:2px; color:var(--blue); font-size:12.5px; font-weight:700;
    }

    .day-heading{gap:6px; align-items:center;}
    .day-heading .cal-ic{color:var(--ink-faint); display:flex; flex:0 0 auto;}

    /* ---------- NOTIF BADGE (topbar bell) ---------- */
    .topbar-icon-btn{position:relative;}
    .topbar-notif-badge{
      position:absolute; top:2px; right:2px; min-width:16px; height:16px; padding:0 4px; border-radius:8px;
      background:var(--red); color:#fff; font-size:9.5px; font-weight:800; display:flex; align-items:center;
      justify-content:center; line-height:1; border:1.5px solid var(--blue);
    }

    /* ---------- CONTENT ---------- */
    #content{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 14px 100px;}
    .view{display:none;}
    .view.active{display:block;}

    .day-group{margin-bottom:16px;}
    .day-heading{
      font-size:15px; font-weight:700; color:var(--ink-faint); text-transform:uppercase;
      letter-spacing:.4px; margin:0 2px 8px; display:flex; justify-content:space-between;
    }
    .item-card{
      background:var(--card); border-radius:var(--radius-sm); padding:12px 14px;
      display:flex; align-items:center; gap:12px; margin-bottom:8px;
      box-shadow:0 1px 2px rgba(40,30,15,.06);
    }
    .item-card:active{background:#FBFCFE;}
    .icon-badge{
      width:58px; height:58px; border-radius:15px; flex:0 0 auto;
      display:flex; align-items:center; justify-content:center;
    }
    .icon-badge.green{background:var(--green-pale); color:var(--green);}
    .icon-badge.red{background:var(--red-pale); color:var(--red);}
    .icon-badge.amber{background:var(--amber-pale); color:var(--amber);}
    .icon-badge.blue{background:var(--blue-pale); color:var(--blue-dark);}
    .item-main{flex:1 1 auto; min-width:0;}
    .item-title{font-size:23px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .item-sub{font-size:17.5px; color:var(--ink-faint); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .item-amount{font-size:23px; font-weight:800; flex:0 0 auto; text-align:right;}
    .item-amount.green{color:var(--green);}
    .item-amount.red{color:var(--red);}
    .item-amount.blue{color:var(--blue-dark);}
    .item-amount.lunas-amount{opacity:.55;}

    .empty-state{
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:70px 20px; color:var(--ink-faint); text-align:center;
    }
    .empty-state svg{margin-bottom:14px; opacity:.55;}
    .empty-state .t1{font-size:14px; font-weight:600; color:var(--ink-soft);}
    .empty-state .t2{font-size:12.5px; margin-top:4px;}

    /* segmented control (hutang piutang filter) */
    .segmented{
      display:flex; background:var(--card); border-radius:12px; padding:4px; margin-bottom:14px;
      box-shadow:0 1px 2px rgba(40,30,15,.06);
    }
    .segmented button{
      flex:1; padding:9px 0; font-size:13px; font-weight:700; border-radius:9px; color:var(--ink-faint);
    }
    .segmented button.active{background:var(--blue); color:#fff;}

    .status-pill{
      font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; margin-left:8px; white-space:nowrap;
    }
    .status-pill.belum{background:var(--amber-pale); color:var(--amber);}
    .status-pill.lunas{background:var(--green-pale); color:var(--green); }

    .metode-tag{
      font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px; margin-left:6px;
      background:var(--blue-pale); color:var(--blue-dark); white-space:nowrap;
    }

    /* urgency chips */
    .urgency-row{display:flex; gap:8px; margin-bottom:14px;}
    .urgency-chip{
      flex:1; display:flex; align-items:center; gap:8px; background:var(--card); border-radius:12px;
      padding:10px 12px; box-shadow:0 1px 2px rgba(40,30,15,.06); border:1.5px solid transparent;
      text-align:left;
    }
    .urgency-chip .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
    .urgency-chip.overdue .dot{background:var(--red);}
    .urgency-chip.upcoming .dot{background:var(--amber);}
    .urgency-chip .n{font-size:16px; font-weight:800; line-height:1;}
    .urgency-chip .t{font-size:10.5px; color:var(--ink-faint); font-weight:600; margin-top:2px;}
    .urgency-chip.active.overdue{border-color:var(--red); background:var(--red-pale);}
    .urgency-chip.active.upcoming{border-color:var(--amber); background:var(--amber-pale);}

    /* metode selector grid (form) */
    .metode-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
    .metode-btn{
      border:1.5px solid var(--line); border-radius:10px; padding:12px 8px; font-size:14.5px;
      font-weight:700; color:var(--ink-soft); background:var(--input-bg); text-align:center; line-height:1.3;
    }
    .metode-btn small{display:block; font-weight:500; color:var(--ink-faint); font-size:12px; margin-top:2px;}
    .metode-btn.active{background:var(--blue-pale); border-color:var(--blue); color:var(--blue-dark);}
    .metode-btn.active small{color:var(--blue-dark); opacity:.75;}

    .bunga-toggle{display:flex; gap:8px; margin-bottom:8px;}
    .bunga-toggle button{
      padding:6px 12px; border-radius:8px; border:1.5px solid var(--line); font-size:12px; font-weight:700;
      color:var(--ink-faint); background:var(--input-bg);
    }
    .bunga-toggle button.active{background:var(--blue); border-color:var(--blue); color:#fff;}

    .preview-box{
      background:var(--blue-pale); border-radius:12px; padding:12px 14px; margin:4px 0 14px;
    }
    .preview-box .pr{display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; color:var(--blue-dark);}
    .preview-box .pr b{font-weight:800;}
    .preview-box .pr.big{font-size:14.5px; padding-top:6px; margin-top:4px; border-top:1px dashed rgba(47,99,176,.25);}

    .progress-wrap{margin:6px 0 14px;}
    .progress-track{height:8px; background:var(--line); border-radius:6px; overflow:hidden;}
    .progress-fill{height:100%; background:var(--blue); border-radius:6px;}
    .progress-label{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-faint); margin-top:6px; font-weight:600;}

    .riwayat-title{font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:16px 0 8px;}
    .riwayat-empty{font-size:12.5px; color:var(--ink-faint); padding:6px 0 2px;}

    /* rekap */
    .rekap-card{
      background:var(--card); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:10px;
      box-shadow:0 1px 2px rgba(40,30,15,.06);
    }
    .rekap-card:active{background:#FBFCFE;}
    .rekap-date{font-size:21px; font-weight:700; color:var(--ink); margin-bottom:8px; text-align:center;}
    .rekap-row{display:flex; justify-content:space-between; padding:9px 0; font-size:22px;}
    .rekap-row .k{color:var(--ink-soft);}
    .rekap-row .v{font-weight:700; color:var(--ink);}
    .rekap-row .v.green{color:var(--green);}
    .custom-range-box{background:var(--card); border-radius:var(--radius-sm); padding:14px; margin-bottom:14px; box-shadow:0 1px 2px rgba(40,30,15,.06);}

    .kategori-row{padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer;}
    .kategori-row:last-child{border-bottom:none;}
    .kategori-row-top{display:flex; justify-content:space-between; font-size:15.5px; margin-bottom:6px;}
    .kategori-row-top .chev{color:var(--ink-faint); font-weight:400; margin-left:2px;}
    .kategori-bar-track{height:6px; background:var(--line); border-radius:4px; overflow:hidden;}
    .kategori-bar-fill{height:100%; border-radius:4px;}

    .export-icon-btn{
      display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 10px;
      border-radius:10px; background:var(--blue-pale); color:var(--blue-dark); font-size:9.5px; font-weight:700;
    }
    .export-icon-btn:active{background:var(--blue); color:#fff;}

    /* rekening cards */
    .total-saldo-card{
      background:radial-gradient(120% 160% at 85% -30%, rgba(255,255,255,.18), transparent 55%), linear-gradient(135deg,var(--blue),var(--blue-dark)); color:#fff; border-radius:var(--radius);
      padding:18px 20px; margin-bottom:16px;
    }
    .total-saldo-card .lbl{font-size:15.5px; opacity:.85; font-weight:600;}
    .total-saldo-card .val{font-size:34px; font-weight:800; margin-top:6px;}
    .rekening-card{
      background:var(--card); border-radius:var(--radius-sm); padding:14px; margin-bottom:10px;
      display:flex; align-items:center; gap:12px; box-shadow:0 1px 2px rgba(40,30,15,.06);
    }
    .rekening-dot{width:12px; height:38px; border-radius:6px; flex:0 0 auto;}
    .rekening-info{flex:1; min-width:0;}
    .rekening-info .nm{font-size:23px; font-weight:700;}
    .rekening-info .sd{font-size:25px; font-weight:800; margin-top:3px;}
    .rekening-more{color:var(--ink-faint); padding:6px;}

    /* ---------- FAB ---------- */
    #fab{ display:none !important; }

    /* ---------- BOTTOM NAV ---------- */
    #bottomnav{
      flex:0 0 auto; display:flex; background:var(--card); border-top:1px solid var(--line);
      padding:8px 6px calc(8px + env(safe-area-inset-bottom)); z-index:14;
    }
    #bottomnav button{
      flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
      padding:4px 0; color:var(--ink-faint); font-size:15.5px; font-weight:600;
    }
    #bottomnav button.active{color:var(--blue);}
    #bottomnav button svg{width:28px; height:28px;}
    .nav-icon-wrap{position:relative; display:inline-flex;}
    .nav-badge{
      position:absolute; top:-4px; right:-8px; min-width:16px; height:16px; padding:0 4px;
      border-radius:8px; background:var(--red); color:#fff; font-size:10px; font-weight:800;
      display:flex; align-items:center; justify-content:center; line-height:1;
    }

    /* ---------- SHEET / MODAL ---------- */
    #sheet-overlay{
      position:fixed; inset:0; background:var(--overlay); z-index:20; opacity:0; pointer-events:none;
      transition:opacity .2s ease;
    }
    #sheet-overlay.show{opacity:1; pointer-events:auto;}
    #sheet{
      position:fixed; left:50%; bottom:0; width:100vw;
      transform:translateX(-50%) translateY(100%);
      z-index:21; transition:transform .25s cubic-bezier(.32,.72,0,1);
      overflow-x:hidden;
    }
    #sheet.show{transform:translateX(-50%) translateY(0);}
    #sheetInner{
      background:var(--card); border-radius:20px 20px 0 0; display:flex; flex-direction:column;
      overflow-x:hidden; overflow-y:auto; -webkit-overflow-scrolling:touch;
      transform-origin:top left; width:100%;
    }
    #sheet-handle{width:36px; height:4px; background:var(--line); border-radius:3px; margin:10px auto 2px; flex:0 0 auto;}
    #sheet-close-btn{
      position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
      display:flex; align-items:center; justify-content:center; color:var(--ink-faint); background:var(--input-bg); z-index:2;
    }
    #sheet-close-btn:active{background:var(--line);}
    #sheet-content{padding:6px 20px 24px; overflow-y:auto; overflow-x:hidden;}
    .sheet-title{font-size:29px; font-weight:800; margin:6px 32px 16px 0;}

    .riwayat-row{display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:8px 0; border-bottom:1px solid var(--line); gap:10px;}
    .riwayat-row:last-child{border-bottom:none;}
    .riwayat-row .d{color:var(--ink-faint); flex:1; min-width:0;}
    .riwayat-del-btn{color:var(--ink-faint); flex:0 0 auto; padding:4px;}
    .riwayat-del-btn:active{color:var(--red);}

    .form-group{margin-bottom:14px;}
    .form-label{font-size:18px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; display:block;}
    .form-input, .form-select, .form-textarea{
      width:100%; border:1.5px solid var(--line); border-radius:10px; padding:11px 12px;
      font-size:23px; color:var(--ink); background:var(--input-bg); font-family:inherit;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus{outline:none; border-color:var(--blue); background:var(--card);}
    .toggle-pair{display:flex; gap:8px;}
    .toggle-pair button{
      flex:1; padding:15px 0; border-radius:10px; border:1.5px solid var(--line); font-weight:700; font-size:17px;
      color:var(--ink-faint); background:var(--input-bg);
    }
    .toggle-pair button.active{background:var(--blue-pale); border-color:var(--blue); color:var(--blue-dark);}
    .toggle-pair button.active.income{background:var(--green-pale); border-color:var(--green); color:var(--green);}
    .toggle-pair button.active.expense{background:var(--red-pale); border-color:var(--red); color:var(--red);}
    .toggle-pair button.active.hutang{background:var(--amber-pale); border-color:var(--amber); color:var(--amber);}
    .toggle-pair button.active.piutang{background:var(--green-pale); border-color:var(--green); color:var(--green);}

    .btn-primary{
      width:100%; padding:17px 0; border-radius:12px; background:var(--blue); color:#fff;
      font-weight:700; font-size:18.5px; margin-top:6px;
    }
    .btn-primary:active{background:var(--blue-dark);}
    .btn-danger-text{width:100%; text-align:center; padding:12px 0; color:var(--red); font-weight:700; font-size:13.5px;}
    .btn-secondary{
      width:100%; padding:12px 0; border-radius:12px; background:var(--input-bg); color:var(--ink-soft);
      font-weight:700; font-size:13.5px; margin-top:8px;
    }
    .settings-list{display:flex; flex-direction:column; gap:0; background:var(--card); border-radius:14px; overflow:hidden; border:1px solid var(--line);}
    .settings-row{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      width:100%; padding:14px 14px; background:transparent; border:none; border-bottom:1px solid var(--line);
      text-align:left; font-family:inherit; color:var(--ink); cursor:pointer;
    }
    .settings-row:last-child{border-bottom:none;}
    .settings-row:active{background:var(--input-bg);}
    .settings-row .sr-label{font-size:14.5px; font-weight:600;}
    .settings-row .sr-value{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-faint); font-weight:600; flex:0 0 auto;}
    .settings-row .sr-chev{font-size:18px; color:var(--ink-faint); font-weight:400;}
    .settings-row.danger .sr-label{color:var(--red);}
    .settings-row.active-row{background:var(--blue-pale);}
    .settings-row.active-row .sr-label{color:var(--blue-dark);}
    .row-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
    .detail-row{display:flex; justify-content:space-between; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); font-size:22px;}
    .detail-row:last-child{border-bottom:none;}
    .detail-row .k{color:var(--ink-faint); flex:0 0 auto;}
    .detail-row .v{font-weight:700; text-align:right; word-break:break-word; overflow-wrap:anywhere; min-width:0;}

    /* ---------- LOADING / TOAST ---------- */
    #loading{
      position:fixed; inset:0; background:var(--bg); z-index:50; display:flex; align-items:center;
      justify-content:center; flex-direction:column; gap:12px;
    }
    #lockscreen{
      position:fixed; inset:0; background:var(--bg); z-index:70; display:none;
      align-items:center; justify-content:center;
    }
    .lock-box{width:100%; max-width:320px; padding:0 24px; text-align:center;}
    .lock-icon{color:var(--blue); margin-bottom:10px;}
    .lock-title{font-size:19px; font-weight:800; color:var(--ink); margin-bottom:4px;}
    #lock-error{color:var(--red); font-size:12.5px; font-weight:600; min-height:18px; margin-bottom:4px;}
    .spinner{
      width:34px; height:34px; border:3px solid var(--blue-pale); border-top-color:var(--blue);
      border-radius:50%; animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg);}}
    #toast{
      position:fixed; left:50%; bottom:110px; transform:translate(-50%,20px); background:#1C2333; color:#fff;
      padding:11px 18px; border-radius:12px; font-size:13.5px; font-weight:600; z-index:60; opacity:0;
      transition:all .25s ease; pointer-events:none; max-width:80%; text-align:center;
    }
    #toast.show{opacity:1; transform:translate(-50%,0);}
    #undo-toast{
      position:fixed; left:50%; bottom:110px; transform:translate(-50%,20px); background:#1C2333; color:#fff;
      padding:11px 12px 11px 18px; border-radius:12px; font-size:13.5px; font-weight:600; z-index:61; opacity:0;
      transition:all .25s ease; pointer-events:none; max-width:88%; display:flex; align-items:center; gap:14px;
    }
    #undo-toast.show{opacity:1; transform:translate(-50%,0); pointer-events:auto;}
    #undo-toast-btn{color:var(--blue); font-weight:800; font-size:13px; padding:6px 8px; flex:0 0 auto;}
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div style="font-size:13px; color:var(--ink-faint); font-weight:600;">Memuat data…</div>
</div>

<div id="lockscreen">
  <div class="lock-box">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>
    <div class="lock-title">Masukkan PIN</div>
    <input id="lock-pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" class="form-input" style="text-align:center; letter-spacing:10px; font-size:24px; margin:16px 0;">
    <div id="lock-error"></div>
    <button id="lock-submit" class="btn-primary">Buka</button>
  </div>
</div>

<div id="app" style="display:none;">
<div id="appInner">

  <!-- TOP BAR -->
  <header id="topbar">
    <div class="topbar-row" id="topbar-transaksi">
      <button class="topbar-icon-btn" id="btn-settings-1" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 style="flex:1; text-align:left; padding-left:2px;">Transaksi</h1>
      <button class="topbar-icon-btn" id="btn-search" aria-label="Cari">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="topbar-icon-btn" id="btn-notif" aria-label="Notifikasi">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="topbar-notif-badge" id="notif-badge" style="display:none;">0</span>
      </button>
    </div>
    <div class="topbar-row" id="topbar-title" style="display:none;">
      <button class="topbar-icon-btn" id="btn-settings-2" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 id="page-title" style="flex:1; text-align:center;"></h1>
      <span class="topbar-spacer"></span>
    </div>
    <div id="greeting-row" style="display:none;"></div>
  </header>

  <!-- SUMMARY -->
  <section id="summary"></section>
  <input type="date" id="jump-date-input" style="position:absolute; opacity:0; pointer-events:none; width:1px; height:1px;">

  <!-- CONTENT -->
  <main id="content">
    <div class="view active" id="view-transaksi"></div>
    <div class="view" id="view-hutang"></div>
    <div class="view" id="view-rekening"></div>
    <div class="view" id="view-rekap"></div>
  </main>

  <button id="fab">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <!-- BOTTOM NAV -->
  <nav id="bottomnav">
    <button data-tab="transaksi" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      Transaksi
    </button>
    <button data-tab="hutang">
      <span class="nav-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="nav-badge" id="hutang-badge" style="display:none;">0</span>
      </span>
      Hutang &amp; Piutang
    </button>
    <button data-tab="rekening">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      Rekening
    </button>
    <button data-tab="rekap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>
      Rekap
    </button>
  </nav>
</div>
</div>

<div id="sheet-overlay"></div>
<div id="sheet">
<div id="sheetInner">
  <div id="sheet-handle"></div>
  <button id="sheet-close-btn" aria-label="Tutup">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <div id="sheet-content"></div>
</div>
</div>

<div id="toast"></div>
<div id="undo-toast"><span id="undo-toast-msg"></span><button id="undo-toast-btn">URUNGKAN</button></div>

<script>
  // ================= GITHUB PAGES + GAS API =================
  // URL Web App Google Apps Script (sudah diisi)
  var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwS5U4gH1kTpPtBbSC8_Oj7ZnS0pOWjvZN4P6fT6aICABp6QhXLu68_S1HXl-lSoOM/exec';

  // Polyfill google.script.run — pakai GET (POST sering gagal 302/405 dari GitHub Pages)
  function createRunner(successCb, failCb) {
    return new Proxy({}, {
      get: function(_, action) {
        if (action === 'withFailureHandler') {
          return function(newFail) { return createRunner(successCb, newFail); };
        }
        return function() {
          var args = Array.prototype.slice.call(arguments);
          var payload = args.length === 0 ? undefined : (args.length === 1 ? args[0] : args);

          var url = WEB_APP_URL + '?action=' + encodeURIComponent(action);
          if (payload !== undefined) {
            var dataStr = typeof payload === 'string' ? payload : JSON.stringify(payload);
            // Restore backup besar → POST; lainnya GET biar andal
            if (action === 'restoreBackupJson' || dataStr.length > 1800) {
              callWithPost_(action, payload, successCb, failCb);
              return;
            }
            url += '&data=' + encodeURIComponent(dataStr);
          }

          var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
          var timer = setTimeout(function(){ if (ctrl) try { ctrl.abort(); } catch(e) {} }, 18000);

          fetch(url, { method: 'GET', redirect: 'follow', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
            .then(function(res) { return res.text(); })
            .then(function(text) {
              clearTimeout(timer);
              var json;
              try { json = JSON.parse(text); }
              catch(e) { throw new Error('Respons server tidak valid'); }
              if (!json.success) throw new Error(json.error || 'Gagal');
              if (typeof successCb === 'function') successCb(json.data);
            })
            .catch(function(err) {
              clearTimeout(timer);
              var msg = (err && err.name === 'AbortError') ? 'Timeout — coba refresh' : (err.message || String(err));
              if (typeof failCb === 'function') failCb(new Error(msg));
              else console.error(err);
            });
        };
      }
    });
  }

  function callWithPost_(action, payload, successCb, failCb) {
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctrl) try { ctrl.abort(); } catch(e) {} }, 25000);
    fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, data: payload }),
      redirect: 'follow',
      signal: ctrl ? ctrl.signal : undefined
    })
    .then(function(res) { return res.text(); })
    .then(function(text) {
      clearTimeout(timer);
      var json = JSON.parse(text);
      if (!json.success) throw new Error(json.error || 'Gagal');
      if (typeof successCb === 'function') successCb(json.data);
    })
    .catch(function(err) {
      clearTimeout(timer);
      if (typeof failCb === 'function') failCb(err);
    });
  }

  var google = {
    script: {
      run: {
        withSuccessHandler: function(successCb) {
          return createRunner(successCb, null);
        }
      }
    }
  };

  // ================= VISUAL VIEWPORT FIT =================
  // The layout viewport this page renders inside (governed by Apps Script's
  // wrapper page) can be wider/positioned differently than what's actually
  // visible on screen. window.visualViewport reports the REAL visible area
  // directly from the OS/browser, independent of that wrapper's math — so we
  // use it to explicitly pin #app (and the modal sheet) to the real screen,
  // in pixels, instead of trusting vw/%/transform-based CSS alone.
  // Default 0.82 biar tidak kegedean di HP (bisa diubah di Pengaturan → Ukuran tampilan)
  var uiScale = Number(localStorage.getItem('kasUiScale'));
  if (!uiScale || isNaN(uiScale) || uiScale < 0.5 || uiScale > 1.4) uiScale = 0.82;
  var isDarkMode = localStorage.getItem('kasDarkMode') === '1';
  document.documentElement.classList.toggle('dark', isDarkMode);
  function setDarkMode(on){
    isDarkMode = on;
    document.documentElement.classList.toggle('dark', on);
    try{ localStorage.setItem('kasDarkMode', on ? '1' : '0'); }catch(e){}
  }

  function applyUiScale(realW, realH){
    var inner = document.getElementById('appInner');
    if(inner){
      var virtualW = realW / uiScale;
      var virtualH = realH / uiScale;
      inner.style.width = virtualW + 'px';
      inner.style.height = virtualH + 'px';
      inner.style.transform = 'scale(' + uiScale + ')';
    }
  }
  function applySheetScale(realW, realH){
    var sheetInner = document.getElementById('sheetInner');
    if(!sheetInner) return;
    sheetInner.style.width = realW + 'px';
    sheetInner.style.maxHeight = (realH * 0.9) + 'px';
    sheetInner.style.transform = 'none';
  }
  function setUiScale(scale){
    uiScale = scale;
    try{ localStorage.setItem('kasUiScale', String(scale)); }catch(e){}
    fitViewport();
  }

  function fitViewport(){
    var vv = window.visualViewport;
    var app = document.getElementById('app');
    var sheet = document.getElementById('sheet');
    if(!app) return;
    if(vv){
      var w = vv.width;
      var left = vv.offsetLeft + (vv.width - w) / 2;
      app.style.left = left + 'px';
      app.style.top = vv.offsetTop + 'px';
      app.style.width = w + 'px';
      app.style.height = vv.height + 'px';
      app.style.transform = 'none';
      applyUiScale(w, vv.height);
      if(sheet){
        sheet.style.left = left + 'px';
        sheet.style.width = w + 'px';
        sheet.style.transform = sheet.classList.contains('show') ? 'translateY(0)' : 'translateY(100%)';
        applySheetScale(w, vv.height);
      }
    } else {
      var w2 = window.innerWidth;
      app.style.left = ((window.innerWidth - w2) / 2) + 'px';
      app.style.top = '0px';
      app.style.width = w2 + 'px';
      app.style.height = window.innerHeight + 'px';
      app.style.transform = 'none';
      applyUiScale(w2, window.innerHeight);
      if(sheet){
        sheet.style.left = ((window.innerWidth - w2) / 2) + 'px';
        sheet.style.width = w2 + 'px';
        sheet.style.transform = sheet.classList.contains('show') ? 'translateY(0)' : 'translateY(100%)';
        applySheetScale(w2, window.innerHeight);
      }
    }
  }
  fitViewport();
  window.addEventListener('resize', fitViewport);
  window.addEventListener('orientationchange', function(){ setTimeout(fitViewport, 150); });
  window.addEventListener('load', fitViewport);
  setTimeout(fitViewport, 300);
  setTimeout(fitViewport, 800);
  setTimeout(fitViewport, 1500);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', fitViewport);
    window.visualViewport.addEventListener('scroll', fitViewport);
  }

  // ================= RIBUAN (thousand-separator) FORMATTING =================
  // Any <input class="num-input"> gets live "1.000.000" style formatting as the
  // user types. Use rawNum(el) to read back the plain number for calculations —
  // never read a num-input's .value directly with Number()/parseInt().
  function formatRibuan(digitsStr){
    digitsStr = String(digitsStr || '').replace(/\D/g, '');
    if(!digitsStr) return '';
    return digitsStr.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }
  function ribuanStr(n){
    n = Math.round(Number(n) || 0);
    return formatRibuan(String(Math.abs(n)));
  }
  function rawNum(elOrId){
    var el = typeof elOrId === 'string' ? document.getElementById(elOrId) : elOrId;
    if(!el) return 0;
    var digits = String(el.value || '').replace(/\D/g, '');
    return digits ? Number(digits) : 0;
  }
  document.getElementById('sheet-content').addEventListener('input', function(e){
    if(!e.target.classList || !e.target.classList.contains('num-input')) return;
    var el = e.target;
    var digitsBeforeCursor = el.value.slice(0, el.selectionStart).replace(/\D/g, '').length;
    var formatted = formatRibuan(el.value);
    el.value = formatted;
    // Re-place the cursor after the same count of digits it was after before formatting.
    var seen = 0, pos = formatted.length;
    for(var i = 0; i < formatted.length; i++){
      if(/\d/.test(formatted[i])) seen++;
      if(seen === digitsBeforeCursor){ pos = i + 1; break; }
    }
    try{ el.setSelectionRange(pos, pos); }catch(err){}
  });

  // ================= STATE =================
  var STATE = { transaksi: [], rekening: [], hutangPiutang: [], anggaran: [], recurring: [], tujuanNabung: [], dailyTriggerActive: false, userName: 'Pengguna' };
  var currentTab = 'transaksi';
  var currentDate = new Date();
  var hutangFilter = 'Semua';

  var MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  var MONTHS_SHORT = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  var DAYS = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  var DAYS_SHORT = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];

  function fmtRupiah(n){
    n = Math.round(Number(n) || 0);
    var neg = n < 0; n = Math.abs(n);
    var s = n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (neg ? '-Rp ' : 'Rp ') + s;
  }
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  var undoState = null;
  function toastWithUndo(msg, onUndo, onCommit){
    if(undoState) undoState.commit();
    var el = document.getElementById('undo-toast');
    document.getElementById('undo-toast-msg').textContent = msg;
    el.classList.add('show');
    var committed = false;
    var timer = setTimeout(function(){ commit(); }, 4000);
    function commit(){
      if(committed) return; committed = true;
      el.classList.remove('show');
      undoState = null;
      onCommit();
    }
    function undo(){
      if(committed) return; committed = true;
      clearTimeout(timer);
      el.classList.remove('show');
      undoState = null;
      onUndo();
    }
    undoState = { commit: commit, undo: undo };
    document.getElementById('undo-toast-btn').onclick = undo;
  }
  function parseYMD(s){
    var p = String(s).split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  function toYMD(d){
    var y = d.getFullYear(), m = ('0' + (d.getMonth()+1)).slice(-2), day = ('0' + d.getDate()).slice(-2);
    return y + '-' + m + '-' + day;
  }
  function fmtDayHeading(ymd){
    var d = parseYMD(ymd);
    return DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

  // ================= INIT =================
  var pinEnabled = false;
  function initApp(){
    // Langsung load data (1 request). Status PIN ikut di dalam getInitialData.
    // Hindari 2x round-trip ke GAS (hasPin + getInitialData) yang bikin 8+ detik.
    loadData();
  }
  function loadData(){
    document.getElementById('lockscreen').style.display = 'none';

    // 1) Tampilkan cache dulu (buka app ~langsung), lalu refresh dari server di belakang
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem('kasCacheV1') || 'null'); } catch(e) {}
    if (cached && cached.transaksi) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      onDataLoaded(cached, true); // true = dari cache, jangan tutup loading dua kali
    } else {
      document.getElementById('loading').style.display = 'flex';
    }

    // 2) Ambil data terbaru dari server
    google.script.run.withSuccessHandler(function(data){
      try { localStorage.setItem('kasCacheV1', JSON.stringify(data)); } catch(e) {}
      onDataLoaded(data, false);
    }).withFailureHandler(function(err){
      if (!cached) onLoadError(err);
      else {
        // Ada cache: biarkan user pakai data lama, kasih tahu gagal refresh
        try { toast('Gagal sync: ' + (err.message || err)); } catch(e) {}
      }
    }).getInitialData();
  }

  function openSearchSheet(){
    openSheet(
      '<div class="sheet-title">Cari Transaksi</div>' +
      '<div class="form-group"><label class="form-label">Kata Kunci</label><input class="form-input" id="f-search-q" type="text" list="kategori-list" placeholder="Kategori atau catatan…" autofocus></div>' +
      kategoriDatalist() +
      '<div class="row-2 form-group">' +
        '<div><label class="form-label">Dari (opsional)</label><input class="form-input" id="f-search-dari" type="date"></div>' +
        '<div><label class="form-label">Sampai (opsional)</label><input class="form-input" id="f-search-sampai" type="date"></div>' +
      '</div>' +
      '<div id="search-result"></div>'
    );
    var qEl = document.getElementById('f-search-q');
    var dariEl = document.getElementById('f-search-dari');
    var sampaiEl = document.getElementById('f-search-sampai');
    function runSearch(){
      var q = qEl.value.trim().toLowerCase();
      var dari = dariEl.value, sampai = sampaiEl.value;
      var resEl = document.getElementById('search-result');
      if(!q && !dari && !sampai){ resEl.innerHTML = ''; return; }
      var results = STATE.transaksi.filter(function(t){
        if(dari && t.Tanggal < dari) return false;
        if(sampai && t.Tanggal > sampai) return false;
        if(q){
          var hay = ((t.Kategori||'') + ' ' + (t.Catatan||'') + ' ' + (t.Akun||'')).toLowerCase();
          if(hay.indexOf(q) === -1) return false;
        }
        return true;
      });
      results.sort(function(a,b){ return b.Tanggal < a.Tanggal ? -1 : b.Tanggal > a.Tanggal ? 1 : 0; });
      if(!results.length){
        resEl.innerHTML = '<div class="riwayat-empty" style="text-align:center; padding:20px 0;">Tidak ada transaksi yang cocok.</div>';
        return;
      }
      var totalNominal = 0;
      results.forEach(function(t){ totalNominal += (t.Jenis==='Pemasukan'?1:-1) * Number(t.Nominal); });
      var html = '<div style="font-size:12.5px; color:var(--ink-faint); margin:14px 0 8px;">' + results.length + ' transaksi ditemukan • Total <span class="num" style="font-weight:700; color:' + (totalNominal>=0?'var(--green)':'var(--red)') + '">' + fmtRupiah(totalNominal) + '</span></div>';
      results.forEach(function(t){
        var isIn = t.Jenis === 'Pemasukan';
        var isTransfer = isTransferLeg(t);
        var badgeClass = isTransfer ? 'blue' : (isIn ? 'green' : 'red');
        var icon = isTransfer ? ICON_TRANSFER : (isIn ? ICON_INCOME : ICON_EXPENSE);
        var amountClass = isTransfer ? 'blue' : (isIn ? 'green' : 'red');
        html += '<div class="item-card">' +
          '<div class="icon-badge ' + badgeClass + '">' + icon + '</div>' +
          '<div class="item-main"><div class="item-title">' + esc(t.Kategori || (isIn?'Pemasukan':'Pengeluaran')) + '</div>' +
          '<div class="item-sub">' + esc(t.Tanggal) + ' • ' + esc(t.Akun || '-') + (t.Catatan ? ' • ' + esc(t.Catatan) : '') + '</div></div>' +
          '<div class="item-amount ' + amountClass + ' num">' + (isTransfer ? '' : (isIn?'+':'-')) + fmtRupiah(t.Nominal) + '</div>' +
        '</div>';
      });
      resEl.innerHTML = html;
    }
    qEl.addEventListener('input', runSearch);
    dariEl.addEventListener('change', runSearch);
    sampaiEl.addEventListener('change', runSearch);
  }

  function currentMonthSpent(kategori){
    var today = new Date();
    var y = today.getFullYear(), m = today.getMonth();
    var total = 0;
    STATE.transaksi.forEach(function(t){
      if(t.Jenis !== 'Pengeluaran') return;
      if(isTransferLeg(t)) return;
      if((t.Kategori||'') !== kategori) return;
      var d = parseYMD(t.Tanggal);
      if(d.getFullYear()===y && d.getMonth()===m) total += Number(t.Nominal);
    });
    return total;
  }

  function openAnggaranList(){
    var html = '<div class="sheet-title">Anggaran Bulanan</div>';
    if(!STATE.anggaran.length){
      html += emptyState('Belum ada anggaran', 'Tambahkan batas pengeluaran per kategori di bawah.');

      STATE.anggaran.forEach(function(a){
        var used = currentMonthSpent(a.Kategori);
        var limit = Number(a.LimitBulanan) || 1;
        var pct = Math.min(100, Math.round(used/limit*100));
        var over = used > Number(a.LimitBulanan);
        html += '<div class="kategori-row" style="cursor:default;">' +
          '<div class="kategori-row-top"><span>' + esc(a.Kategori) + '</span>' +
          '<span class="num">' + numOnly(used) + ' / ' + numOnly(a.LimitBulanan) + ' <button class="riwayat-del-btn" data-id="' + a.ID + '" style="vertical-align:middle;">' + ICON_TRASH + '</button></span></div>' +
          '<div class="kategori-bar-track"><div class="kategori-bar-fill" style="width:' + pct + '%; background:' + (over?'var(--red)':'var(--blue)') + ';"></div></div>' +
        '</div>';

    html += '<div class="form-group" style="margin-top:16px;"><label class="form-label">Kategori</label><input class="form-input" id="f-anggaran-kategori" type="text" list="kategori-list" placeholder="Contoh: Makan"></div>' + kategoriDatalist() +

  // ================= SUMMARY =================
  function isTransferLeg(t){
    return t.Kategori === 'Transfer Keluar' || t.Kategori === 'Transfer Masuk';
  }
  function totalSaldoSemua(){
    var total = 0;
    STATE.rekening.forEach(function(r){
      if(r.Nama === 'Kredit (Non-Kas)') return; // virtual, tidak dihitung ke total kas
      total += Number(r.Saldo);
    });
    return total;
  }
  function statHtml(lbl, val, colorClass){
    return '<div class="stat"><div class="lbl">' + lbl + '</div><div class="val ' + (colorClass||'') + ' num">' + val + '</div></div>';
  }

  var showBalance = localStorage.getItem('kasShowBalance') !== '0';
  function toggleShowBalance(){
    showBalance = !showBalance;
    try{ localStorage.setItem('kasShowBalance', showBalance ? '1' : '0'); }catch(e){}
    renderSummary();
  }
  function maskRupiah(str){ return showBalance ? str : 'Rp ••••••'; }

  function dayRangeOf(d){
    var ymd = toYMD(d);
    return { from: ymd, to: ymd };
  }

  function renderSummary(){
    var el = document.getElementById('summary');
    el.style.display = '';
    el.classList.remove('cols-4');
    el.classList.toggle('hero-mode', currentTab === 'transaksi');
    if(currentTab === 'transaksi'){
      var range = dayRangeOf(currentDate);
      var masuk = 0, keluar = 0;
      STATE.transaksi.forEach(function(t){
        if(t.Tanggal < range.from || t.Tanggal > range.to) return;
        if(isTransferLeg(t)) return; // perpindahan antar rekening sendiri, bukan pemasukan/pengeluaran riil
        if(t.Jenis==='Pemasukan') masuk += Number(t.Nominal); else keluar += Number(t.Nominal);
      });
      var selisih = masuk - keluar;
      el.innerHTML =
        '<div class="balance-hero">' +
          '<div class="top-lbl"><span>Total Saldo</span><button id="btn-toggle-balance">' +
            (showBalance
              ? '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>'

          '<div class="pill-row">' +
            '<div class="pill in"><span class="ic">' + iconTiny(ICON_INCOME) + '</span><span class="txt"><div class="l">Pemasukan</div><div class="v num">' + maskRupiah(fmtRupiah(masuk)) + '</div></span></div>' +
            '<div class="pill out"><span class="ic">' + iconTiny(ICON_EXPENSE) + '</span><span class="txt"><div class="l">Pengeluaran</div><div class="v num">' + maskRupiah(fmtRupiah(keluar)) + '</div></span></div>' +
          '</div>' +
          '<div class="cashflow-row">' +

            '<span class="cashflow-tag">Hari ini</span>' +
          '</div>' +
        '</div>' +
        '<div class="quick-actions">' +
          '<button id="qa-in"><span class="qa-ic in">' + iconTiny(ICON_PLUS) + '</span><span class="qa-lbl">Pemasukan</span><span class="qa-sub">Tambah masuk</span></button>' +
          '<button id="qa-out"><span class="qa-ic out">' + iconTiny(ICON_MINUS) + '</span><span class="qa-lbl">Pengeluaran</span><span class="qa-sub">Tambah keluar</span></button>' +
          '<button id="qa-transfer"><span class="qa-ic transfer">' + iconTiny(ICON_TRANSFER) + '</span><span class="qa-lbl">Transfer</span><span class="qa-sub">Pindah dana</span></button>' +
          '<button id="qa-more"><span class="qa-ic more">' + iconTiny(ICON_DOTS) + '</span><span class="qa-lbl">Lainnya</span><span class="qa-sub">Menu lainnya</span></button>' +
        '</div>';
      document.getElementById('btn-toggle-balance').addEventListener('click', toggleShowBalance);
      document.getElementById('qa-in').addEventListener('click', function(){ openTrxForm('Pemasukan'); });
      document.getElementById('qa-out').addEventListener('click', function(){ openTrxForm('Pengeluaran'); });
      document.getElementById('qa-transfer').addEventListener('click', function(){
        if(STATE.rekening.length < 2){ toast('Tambahkan minimal 2 rekening dulu untuk transfer'); return; }
        openTransferForm();
      });
      document.getElementById('qa-more').addEventListener('click', openSettingsSheet);
    } else if(currentTab === 'hutang'){
      var hutang = 0, piutang = 0;
      STATE.hutangPiutang.forEach(function(h){
        if(h.Status === 'Belum Lunas'){
          if(h.Jenis === 'Hutang') hutang += Number(h.SisaHutang); else piutang += Number(h.SisaHutang);
        }
      });
      el.innerHTML =
        statHtml('Piutang', fmtRupiah(piutang), 'green') +
        statHtml('Hutang', fmtRupiah(hutang), 'red') +
        statHtml('Selisih', fmtRupiah(piutang-hutang), 'blue');

      el.style.display = 'none';

      '<div class="item-amount ' + amountClass + ' num">' + (isTransfer ? '' : (isIn?'+':'-')) + fmtRupiah(t.Nominal) + '</div>' +
    '</div>';
  }

    });

  }

  function emptyState(t1, t2){
    return '<div class="empty-state">' + ICON_EMPTY + '<div class="t1">' + t1 + '</div><div class="t2">' + t2 + '</div></div>';
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }

  // ================= HUTANG & PIUTANG VIEW =================
  var urgencyFilter = 'all'; // 'all' | 'overdue' | 'upcoming'
  var hutangStatusFilter = 'Aktif'; // 'Aktif' | 'Lunas'
  var METODE_SHORT = { 'Sekaligus':'Sekaligus', 'Cicilan Tetap':'Cicilan', 'Cicilan Bebas':'Cicilan Bebas', 'Paylater':'Paylater' };

  function daysUntil(ymd){
    if(!ymd) return null;
    var today = new Date(); today.setHours(0,0,0,0);
    var d = parseYMD(ymd); d.setHours(0,0,0,0);
    return Math.round((d - today) / 86400000);
  }
  function urgencyOf(h){
    if(h.Status === 'Lunas' || !h.JatuhTempo) return null;
    var days = daysUntil(h.JatuhTempo);
    if(days === null) return null;
    if(days < 0) return 'overdue';
    if(days <= 7) return 'upcoming';
    return null;
  }

  // Nominal yang ditampilkan di kartu: untuk yang sudah Lunas selalu TotalHutang
  // (SisaHutang-nya 0), untuk yang masih Aktif berupa SisaHutang pada metode cicilan.
  function amountShownFor(h){
    var lunas = h.Status === 'Lunas';
    return (h.Metode === 'Cicilan Bebas' || h.Metode === 'Cicilan Tetap') && !lunas ? Number(h.SisaHutang) : Number(h.TotalHutang);
  }

  var hutangSortBy = 'default';
  function sortHutangList(list){
    var arr = list.slice();
    if(hutangSortBy === 'jatuh-tempo'){
      arr.sort(function(a,b){
        if(!a.JatuhTempo && !b.JatuhTempo) return 0;
        if(!a.JatuhTempo) return 1;
        if(!b.JatuhTempo) return -1;
        return a.JatuhTempo < b.JatuhTempo ? -1 : a.JatuhTempo > b.JatuhTempo ? 1 : 0;
      });
    } else if(hutangSortBy === 'nominal-desc'){
      arr.sort(function(a,b){ return amountShownFor(b) - amountShownFor(a); });
    }
    return arr;
  }

  function renderHutang(){
    var el = document.getElementById('view-hutang');
    var byJenis = STATE.hutangPiutang.filter(function(h){ return hutangFilter === 'Semua' || h.Jenis === hutangFilter; });

    var aktifCount = 0, lunasCount = 0;
    var overdueCount = 0, upcomingCount = 0;
    byJenis.forEach(function(h){
      if(h.Status === 'Lunas') lunasCount++; else aktifCount++;
      var u = urgencyOf(h);
      if(u === 'overdue') overdueCount++;
      else if(u === 'upcoming') upcomingCount++;
    });

    var statusHtml = '<div class="segmented" id="hp-status-segmented" style="margin-bottom:10px;">' +
      '<button data-st="Aktif" class="' + (hutangStatusFilter==='Aktif'?'active':'') + '">Aktif (' + aktifCount + ')</button>' +
      '<button data-st="Lunas" class="' + (hutangStatusFilter==='Lunas'?'active':'') + '">Lunas (' + lunasCount + ')</button>' +
    '</div>';

    var segHtml = '<div class="segmented" id="hp-segmented">' +
      ['Semua','Hutang','Piutang'].map(function(f){
        return '<button data-f="' + f + '" class="' + (hutangFilter===f?'active':'') + '">' + f + '</button>';
      }).join('') + '</div>';

    var sortHtml = '<select class="form-select" id="f-hutang-sort" style="margin-bottom:14px;">' +
      '<option value="default"' + (hutangSortBy==='default'?' selected':'') + '>Terbaru Ditambahkan</option>' +
      (hutangStatusFilter==='Aktif' ? '<option value="jatuh-tempo"' + (hutangSortBy==='jatuh-tempo'?' selected':'') + '>Jatuh Tempo Terdekat</option>' : '') +
      '<option value="nominal-desc"' + (hutangSortBy==='nominal-desc'?' selected':'') + '>' + (hutangStatusFilter==='Aktif' ? 'Sisa Terbesar' : 'Nominal Terbesar') + '</option>' +
    '</select>';

    var urgencyHtml = hutangStatusFilter !== 'Aktif' ? '' : (
      '<div class="urgency-row">' +
      '<button class="urgency-chip overdue' + (urgencyFilter==='overdue'?' active':'') + '" id="chip-overdue">' +
        '<span class="dot"></span><div><div class="n">' + overdueCount + '</div><div class="t">Jatuh Tempo</div></div>' +
      '</button>' +
      '<button class="urgency-chip upcoming' + (urgencyFilter==='upcoming'?' active':'') + '" id="chip-upcoming">' +
        '<span class="dot"></span><div><div class="n">' + upcomingCount + '</div><div class="t">Akan Jatuh Tempo (7 hari)</div></div>' +
      '</button>' +
    '</div>');

    var list = byJenis.filter(function(h){
      var isLunas = h.Status === 'Lunas';
      if(hutangStatusFilter === 'Aktif' && isLunas) return false;
      if(hutangStatusFilter === 'Lunas' && !isLunas) return false;
      if(hutangStatusFilter === 'Aktif' && urgencyFilter !== 'all' && urgencyOf(h) !== urgencyFilter) return false;
      return true;
    });
    list = sortHutangList(list);

    var html = statusHtml + segHtml + sortHtml + urgencyHtml;
    if(!list.length){
      html += hutangStatusFilter === 'Lunas'
        ? emptyState('Belum ada yang lunas', 'Hutang atau piutang yang sudah lunas akan muncul di sini.')
        : emptyState('Belum ada catatan aktif', 'Catat hutang atau piutang dengan tombol + di kanan bawah.');
    } else {
      list.forEach(function(h){
        var isHutang = h.Jenis === 'Hutang';
        var lunas = h.Status === 'Lunas';
        var sub = (isHutang?'Hutang':'Piutang') + ' • ' + esc(METODE_SHORT[h.Metode] || h.Metode) + (h.Bentuk === 'Barang' ? ' (Barang)' : '');
        if(h.Metode === 'Cicilan Tetap' && !lunas){
          sub += ' ' + (Number(h.CicilanTerbayar)+1 <= Number(h.Tenor) ? (Number(h.CicilanTerbayar)+1) : Number(h.Tenor)) + '/' + h.Tenor;
        }
        if(Number(h.BungaNominal) > 0){
          sub += ' • Bunga ' + fmtRupiah(h.BungaNominal) + (h.BungaPersen ? ' (' + h.BungaPersen + '%)' : '');
        }
        if(!lunas && h.JatuhTempo){
          var days = daysUntil(h.JatuhTempo);
          sub += ' • ' + (days < 0 ? 'Telat ' + Math.abs(days) + ' hari' : days === 0 ? 'Jatuh tempo hari ini' : days + ' hari lagi');
        }
        var amountShown = amountShownFor(h);
        html += '<div class="item-card" data-id="' + h.ID + '" data-kind="hp">' +
          '<div class="icon-badge ' + (isHutang?'amber':'green') + '">' +
            (isHutang ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>'
                      : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>') +
          '</div>' +
          '<div class="item-main"><div class="item-title">' + esc(h.Nama) +
            '<span class="status-pill ' + (lunas?'lunas':'belum') + '">' + (lunas?'Lunas':'Belum Lunas') + '</span></div>' +
          '<div class="item-sub">' + sub + '</div></div>' +
          '<div class="item-amount ' + (isHutang?'red':'green') + ' num' + (lunas?' lunas-amount':'') + '">' + fmtRupiah(amountShown) + '</div>' +
        '</div>';
      });
    }
    el.innerHTML = html;
    el.querySelectorAll('#hp-status-segmented button').forEach(function(b){
      b.addEventListener('click', function(){
        hutangStatusFilter = b.dataset.st;
        urgencyFilter = 'all';
        if(hutangSortBy === 'jatuh-tempo') hutangSortBy = 'default';
        renderHutang();
      });
    });
    el.querySelectorAll('#hp-segmented button').forEach(function(b){
      b.addEventListener('click', function(){ hutangFilter = b.dataset.f; renderHutang(); });
    });
    var chipOverdue = document.getElementById('chip-overdue');
    var chipUpcoming = document.getElementById('chip-upcoming');
    if(chipOverdue) chipOverdue.addEventListener('click', function(){
      urgencyFilter = urgencyFilter === 'overdue' ? 'all' : 'overdue'; renderHutang();
    });
    if(chipUpcoming) chipUpcoming.addEventListener('click', function(){
      urgencyFilter = urgencyFilter === 'upcoming' ? 'all' : 'upcoming'; renderHutang();
    });
    document.getElementById('f-hutang-sort').addEventListener('change', function(){ hutangSortBy = this.value; renderHutang(); });
    el.querySelectorAll('.item-card[data-kind="hp"]').forEach(function(card){
      card.addEventListener('click', function(){ openHutangDetail(card.dataset.id); });
    });
  }

  // ================= REKENING VIEW =================
  var rekeningSortBy = 'default';
  function sortRekeningList(list){
    var arr = list.slice();
    if(rekeningSortBy === 'nama') arr.sort(function(a,b){ return a.Nama.localeCompare(b.Nama); });
    else if(rekeningSortBy === 'saldo-desc') arr.sort(function(a,b){ return Number(b.Saldo) - Number(a.Saldo); });
    else if(rekeningSortBy === 'saldo-asc') arr.sort(function(a,b){ return Number(a.Saldo) - Number(b.Saldo); });
    return arr;
  }

  function renderRekening(){
    var el = document.getElementById('view-rekening');
    var total = 0;
    STATE.rekening.forEach(function(r){
      if(r.Nama === 'Kredit (Non-Kas)') return;
      total += Number(r.Saldo);
    });
    var html = '<div class="total-saldo-card"><div class="lbl">TOTAL SALDO KESELURUHAN</div><div class="val num">' + fmtRupiah(total) + '</div></div>';
    if(STATE.rekening.length >= 2){
      html += '<button class="btn-secondary" id="btn-transfer" style="margin-bottom:10px; display:flex; align-items:center; justify-content:center; gap:8px;">' +
        '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>' +
        'Transfer Antar Rekening</button>';
    }
    if(STATE.rekening.length >= 2){
      html += '<select class="form-select" id="f-rekening-sort" style="margin-bottom:14px;">' +
        '<option value="default"' + (rekeningSortBy==='default'?' selected':'') + '>Urutan Ditambahkan</option>' +
        '<option value="nama"' + (rekeningSortBy==='nama'?' selected':'') + '>Nama A-Z</option>' +
        '<option value="saldo-desc"' + (rekeningSortBy==='saldo-desc'?' selected':'') + '>Saldo Terbesar</option>' +
        '<option value="saldo-asc"' + (rekeningSortBy==='saldo-asc'?' selected':'') + '>Saldo Terkecil</option>' +
      '</select>';
    }
    if(!STATE.rekening.length){
      html += emptyState('Belum ada rekening', 'Tambahkan rekening atau dompet kas dengan tombol +.');
    } else {
      sortRekeningList(STATE.rekening).forEach(function(r){
        var isReimburse = r.Nama === 'Reimburse';
        var isKreditNonKas = r.Nama === 'Kredit (Non-Kas)';
        var tag = isReimburse ? '<span class="metode-tag" style="margin-left:6px;">Klaim</span>'
          : (isKreditNonKas ? '<span class="metode-tag" style="margin-left:6px;">Virtual</span>' : '');
        html += '<div class="rekening-card" data-id="' + r.ID + '" data-kind="rek">' +
          '<div class="rekening-dot" style="background:' + r.Warna + '"></div>' +
          '<div class="rekening-info"><div class="nm">' + esc(r.Nama) + tag + '</div><div class="sd num">' + fmtRupiah(r.Saldo) + '</div></div>' +
          '<div class="rekening-more">' +
            '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>' +
          '</div></div>';
      });
    }

    html += '<div class="riwayat-title" style="margin-top:22px; display:flex; justify-content:space-between; align-items:center;">' +
      '<span>Tujuan Nabung</span><button id="btn-add-goal" style="color:var(--blue); font-weight:700; font-size:13px;">+ Tambah</button></div>';
    if(!STATE.tujuanNabung.length){
      html += '<div class="riwayat-empty">Belum ada tujuan nabung.</div>';
    } else {
      STATE.tujuanNabung.forEach(function(g){
        var pct = g.TargetNominal > 0 ? Math.min(100, Math.round(Number(g.TerkumpulNominal)/Number(g.TargetNominal)*100)) : 0;
        var tercapai = Number(g.TerkumpulNominal) >= Number(g.TargetNominal);
        html += '<div class="kategori-row" data-goal-id="' + g.ID + '">' +
          '<div class="kategori-row-top"><span>' + esc(g.Nama) + (tercapai?' 🎉':'') + '</span><span class="num">' + numOnly(g.TerkumpulNominal) + ' / ' + numOnly(g.TargetNominal) + '</span></div>' +
          '<div class="kategori-bar-track"><div class="kategori-bar-fill" style="width:' + pct + '%; background:' + (tercapai?'var(--green)':'var(--blue)') + ';"></div></div>' +
        '</div>';
      });
    }

    el.innerHTML = html;
    el.querySelectorAll('.rekening-card').forEach(function(card){
      card.addEventListener('click', function(){
        var r = STATE.rekening.find(function(x){ return x.ID === card.dataset.id; });
        if(r && r.Nama === 'Reimburse') openReimburseDetail(r);
        else openRekeningEdit(card.dataset.id);
      });
    });
    var transferBtn = document.getElementById('btn-transfer');
    if(transferBtn) transferBtn.addEventListener('click', openTransferForm);
