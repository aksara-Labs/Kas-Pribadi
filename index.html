  function exportTransaksiCsv_(){
    var rows = [['Tanggal','Jenis','Kategori','Akun','Nominal','Untuk','Catatan']];
    (STATE.transaksi || []).forEach(function(t){
      var untuk = parseUntuk_(t) || '';
      var cat = String(t.Catatan || '').replace(/"/g, '""');
      rows.push([
        t.Tanggal || '',
        t.Jenis || '',
        t.Kategori || '',
        t.Akun || '',
        String(t.Nominal || 0),
        untuk,
        cat
      ]);
    });
    var csv = rows.map(function(r){
      return r.map(function(c){ return '"' + String(c) + '"'; }).join(',');
    }).join('\n');
    var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'catatan-kas-' + toYMD(new Date()) + '.csv';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('CSV diunduh — buka di Excel');
  }

  function currentMonthSpent(kategori){
    var today = new Date();
    var y = today.getFullYear(), m = today.getMonth();
    var total = 0;
    STATE.transaksi.forEach(function(t){
      if(t.Jenis !== 'Pengeluaran') return;
      if(isTransferLeg(t)) return;
      if((t.Kategori||'') !== kategori) return;
      var d = parseYMD(t.Tanggal);
      if(d.getFullYear()===y && d.getMonth()===m) total += Number(t.Nominal);
    });
    return total;
  }

  function wxCodeLabel_(code){
    var c = Number(code);
    if(c === 0) return { ic:'☀️', t:'Cerah' };
    if(c <= 3) return { ic:'⛅', t:'Berawan' };
    if(c <= 48) return { ic:'🌫️', t:'Berkabut' };
    if(c <= 57) return { ic:'🌦️', t:'Gerimis' };
    if(c <= 67) return { ic:'🌧️', t:'Hujan' };
    if(c <= 77) return { ic:'🌨️', t:'Salju' };
    if(c <= 82) return { ic:'🌧️', t:'Hujan deras' };
    if(c <= 86) return { ic:'🌨️', t:'Salju deras' };
    if(c <= 99) return { ic:'⛈️', t:'Badai' };
    return { ic:'🌡️', t:'—' };
  }
  function readWxCache_(){
    try {
      var raw = JSON.parse(localStorage.getItem(WX_CACHE_KEY) || 'null');
      if(!raw || !raw.ts || (Date.now() - raw.ts > WX_CACHE_MS)) return null;
      return raw;
    } catch(e){ return null; }
  }
  function writeWxCache_(data){
    try { localStorage.setItem(WX_CACHE_KEY, JSON.stringify(Object.assign({ ts: Date.now() }, data))); } catch(e) {}
  }
  function renderWxPillHtml_(data, loading){
    if(loading) return '<span class="wx-pill loading" id="wx-pill">…</span>';
    if(!data || data.temp == null) return '';

    return '<span class="wx-pill" id="wx-pill" title="' + esc(meta.t + place) + '">' +
      '<span class="wx-ic">' + meta.ic + '</span>' +
      '<span class="wx-t">' + Math.round(data.temp) + '°' + (data.place ? ' ' + esc(data.place) : '') + '</span>' +
    '</span>';

  function applyWxToDom_(data, loading){
    var el = document.getElementById('wx-slot');

  function reverseGeocode_(lat, lon, cb){
    // Open-Meteo geocoding reverse via bigdatacloud style free endpoint
    var url = 'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' +
      encodeURIComponent(lat) + '&longitude=' + encodeURIComponent(lon) + '&localityLanguage=id';
    fetch(url).then(function(r){ return r.json(); }).then(function(j){
      var place = j.city || j.locality || j.principalSubdivision || '';
      // pendekkan
      if(place && place.length > 14) place = place.slice(0, 13) + '…';
      cb(place || '');
    }).catch(function(){ cb(''); });
  }
  function fetchWeatherAt_(lat, lon){
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat +
      '&longitude=' + lon + '&current=temperature_2m,weather_code&timezone=auto';
    return fetch(url).then(function(r){ return r.json(); }).then(function(j){
      var cur = j.current || {};
      return { temp: cur.temperature_2m, code: cur.weather_code, lat: lat, lon: lon };
    });
  }
  function loadWeather_(){
    if(!navigator.onLine) return;
    var cached = readWxCache_();
    if(cached){
      applyWxToDom_(cached, false);
      return;
    }
    applyWxToDom_(null, true);
    if(!navigator.geolocation){
      applyWxToDom_(null, false);
      return;
    }
    navigator.geolocation.getCurrentPosition(function(pos){
      var lat = pos.coords.latitude;
      var lon = pos.coords.longitude;
      fetchWeatherAt_(lat, lon).then(function(data){
        reverseGeocode_(lat, lon, function(place){
          data.place = place;
          writeWxCache_(data);
          applyWxToDom_(data, false);
        });
      }).catch(function(){ applyWxToDom_(null, false); });
    }, function(){
      // izin ditolak / gagal — coba IP approx via open-meteo tanpa lat? skip
      applyWxToDom_(null, false);
    }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 30 * 60 * 1000 });
  }

  function isCashAccountName_(nama){
    var n = String(nama || '').toLowerCase().trim();
    return n === 'uang tunai' || n === 'tunai' || n === 'cash' || n === 'kas tunai'
      || n.indexOf('uang tunai') >= 0;

  function isTransferLeg(t){
    var k = t.Kategori || '';
    return k === 'Transfer Keluar' || k === 'Transfer Masuk' || k === 'Biaya Admin Transfer'
      || k === 'Tarik Tunai' || k === 'Setor Tunai';
  }
  function transferLabelFromAccounts_(asal, tujuan){
    if(isCashAccountName_(tujuan) && !isCashAccountName_(asal)) return 'Tarik Tunai';
    if(isCashAccountName_(asal) && !isCashAccountName_(tujuan)) return 'Setor Tunai';
    return 'Transfer';
  }
  function extractTfidClient_(catatan){
    var m = String(catatan || '').match(/TFID:([A-Za-z0-9\-_]+)/);
    return m ? m[1] : '';
  }

  function collapseTransferLegs_(list){
    // Selalu 1 kartu: sembunyikan kaki Pemasukan + Biaya Admin dari pasangan transfer/tarik/setor
    var hide = {};
    var byTfid = {};
    (list || []).forEach(function(t){
      var tf = extractTfidClient_(t.Catatan);
      if(tf){
        if(!byTfid[tf]) byTfid[tf] = [];
        byTfid[tf].push(t);
      }
    });
    Object.keys(byTfid).forEach(function(tf){
      var g = byTfid[tf];
      var hasOut = g.some(function(x){ return x.Jenis === 'Pengeluaran' && x.Kategori !== 'Biaya Admin Transfer'; });
      var hasIn = g.some(function(x){ return x.Jenis === 'Pemasukan'; });
      if(hasOut && hasIn){
        g.forEach(function(x){
          if(x.Jenis === 'Pemasukan' || x.Kategori === 'Biaya Admin Transfer') hide[x.ID] = 1;
        });
      }
    });
    // Tanpa TFID / TFID beda (dobel sync): pair by tanggal+nominal+kategori transfer-ish
    (list || []).forEach(function(t){
      if(hide[t.ID]) return;
      if(t.Jenis !== 'Pemasukan') return;
      if(!isTransferLeg(t)) return;
      var nom = Number(t.Nominal) || 0;
      var tgl = String(t.Tanggal || '');
      var pair = (list || []).some(function(x){
        if(hide[x.ID] || x.ID === t.ID) return false;
        if(x.Jenis !== 'Pengeluaran' || x.Kategori === 'Biaya Admin Transfer') return false;
        if(!isTransferLeg(x)) return false;
        return String(x.Tanggal || '') === tgl && Number(x.Nominal) === nom;
      });
      if(pair) hide[t.ID] = 1;
    });
    (list || []).forEach(function(t){
      if(t.Kategori !== 'Biaya Admin Transfer') return;
      if(hide[t.ID]) return;
      var tgl = String(t.Tanggal || '');
      var pair = (list || []).some(function(x){
        return x.ID !== t.ID && x.Jenis === 'Pengeluaran' && isTransferLeg(x)
          && x.Kategori !== 'Biaya Admin Transfer'
          && String(x.Tanggal || '') === tgl && x.Akun === t.Akun;
      });
      if(pair) hide[t.ID] = 1;
    });
    return (list || []).filter(function(t){ return !hide[t.ID]; });
  }
  function transferGroupIdsClient_(id){
    var list = STATE.transaksi || [];
    var target = null;
    for(var i=0;i<list.length;i++){ if(list[i].ID === id){ target = list[i]; break; } }
    if(!target) return [id];
    if(!isTransferLeg(target)) return [id];
    var tfid = extractTfidClient_(target.Catatan);
    if(tfid){
      return list.filter(function(x){ return extractTfidClient_(x.Catatan) === tfid; }).map(function(x){ return x.ID; });
    }
    // legacy
    var nom = Number(target.Nominal)||0;
    var tgl = String(target.Tanggal||'');
    var ids = [target.ID];
    list.forEach(function(x){
      if(x.ID === target.ID) return;
      if(!isTransferLeg(x)) return;
      if(String(x.Tanggal||'') !== tgl) return;
      if(x.Kategori === 'Transfer Keluar' || x.Kategori === 'Transfer Masuk'){
        if(Number(x.Nominal) !== nom) return;
      }
      // pasangan kasar: keluar+masuk nominal sama hari
      if((target.Kategori === 'Transfer Keluar' && x.Kategori === 'Transfer Masuk') ||
         (target.Kategori === 'Transfer Masuk' && x.Kategori === 'Transfer Keluar') ||
         (x.Kategori === 'Biaya Admin Transfer' && target.Akun === x.Akun) ||
         (target.Kategori === 'Biaya Admin Transfer' && (x.Kategori==='Transfer Keluar'||x.Kategori==='Transfer Masuk'))){
        ids.push(x.ID);
      }
    });
    var seen={}, out=[];
    ids.forEach(function(x){ if(!seen[x]){ seen[x]=1; out.push(x);} });
    return out;
  }
  function recomputeSaldoLocal_(){
    var map = {};
    (STATE.transaksi || []).forEach(function(tr){
      var a = tr.Akun; if(!a) return;
      if(map[a] === undefined) map[a] = 0;
      if(tr.Jenis === 'Pemasukan') map[a] += Number(tr.Nominal)||0;
      else if(tr.Jenis === 'Pengeluaran') map[a] -= Number(tr.Nominal)||0;
    });
    (STATE.rekening || []).forEach(function(r){
      if(!r.Nama || r.Nama === 'Kredit (Non-Kas)' || r.Nama === 'Reimburse') return;
      r.Saldo = (Number(r.SaldoAwal)||0) + (map[r.Nama]||0);
    });
  }

  function dayRangeOf(d){
    var ymd = toYMD(d);
    return { from: ymd, to: ymd };

  function weekRange_(d){
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var day = (x.getDay() + 6) % 7; // Senin=0
    var from = new Date(x); from.setDate(x.getDate() - day);
    var to = new Date(from); to.setDate(from.getDate() + 6);
    return { from: toYMD(from), to: toYMD(to) };
  }
  function sumKeluarRange_(from, to){
    var n = 0;
    (STATE.transaksi || []).forEach(function(t){
      if(t.Jenis !== 'Pengeluaran' || isTransferLeg(t)) return;
      if(t.Tanggal < from || t.Tanggal > to) return;
      n += Number(t.Nominal) || 0;
    });
    return n;
  }
  function insightStripHtml_(){
    var today = new Date();
    var thisW = weekRange_(today);
    var prevStart = new Date(today);
    prevStart.setDate(today.getDate() - 7);
    var prevW = weekRange_(prevStart);
    var cur = sumKeluarRange_(thisW.from, thisW.to);
    var prev = sumKeluarRange_(prevW.from, prevW.to);
    var chip1 = '';
    var cls1 = '';
    if(prev <= 0 && cur <= 0){ chip1 = 'Belum ada keluar minggu ini'; cls1 = ''; }
    else if(prev <= 0){ chip1 = 'Keluar ' + fmtRupiah(cur); cls1 = ''; }
    else {
      var pct = Math.round((cur - prev) / prev * 100);
      if(pct > 5){ chip1 = 'Minggu ini +' + pct + '%'; cls1 = 'warn'; }
      else if(pct < -5){ chip1 = 'Hemat ' + fmtRupiah(prev - cur); cls1 = 'ok'; }
      else { chip1 = 'Stabil · ' + fmtRupiah(cur); cls1 = ''; }
    }
    var due = 0, overdue = 0;
    (STATE.hutangPiutang || []).forEach(function(h){
      if(h.Status === 'Lunas') return;
      var u = urgencyOf(h);
      if(u === 'overdue'){ overdue++; due++; }
      else if(u === 'upcoming') due++;
    });
    var monthInfo = monthTagihanSummary_();
    var html = '<div class="insight-row">';
    html += '<button type="button" class="insight-chip' + (cls1 ? (' ' + cls1) : '') + '" data-insight="spend">' + esc(chip1) + '</button>';
    if(due > 0){
      html += '<button type="button" class="insight-chip ' + (overdue ? 'danger' : 'warn') + '" data-insight="bills">' +
        due + ' tagihan dekat</button>';
    }
    if(monthInfo.total > 0){
      html += '<button type="button" class="insight-chip warn" data-insight="month">' +
        'Tagihan ' + esc(monthInfo.short) + ' · ' + fmtRupiah(monthInfo.total) + '</button>';

    html += '</div>';
    return html;
  }

  function monthTagihanSummary_(){
    var now = new Date();
    var y = now.getFullYear(), m = now.getMonth();
    var from = toYMD(new Date(y, m, 1));
    var to = toYMD(new Date(y, m + 1, 0));
    var items = [];
    var total = 0;
    var seen = {};
    (STATE.hutangPiutang || []).forEach(function(h){
      if(h.Status === 'Lunas') return;
      var jadwal = [];
      try { jadwal = parseJadwalTagihan_(h.Catatan) || []; } catch(e){ jadwal = []; }
      if(jadwal.length){
        jadwal.forEach(function(j){
          if(!j.date || j.date < from || j.date > to) return;
          var key = h.ID + '|' + j.date + '|' + j.amount;
          if(seen[key]) return;
          seen[key] = 1;
          items.push({ id: h.ID, nama: h.Nama, date: j.date, amount: Number(j.amount)||0 });
          total += Number(j.amount)||0;
        });
      } else {
        var due = '';
        try { due = nextDueDateFor_(h) || h.JatuhTempo || ''; } catch(e){ due = h.JatuhTempo || ''; }
        if(!due || due < from || due > to) return;
        var amt = 0;
        try { amt = Number(amountShownFor(h))||0; } catch(e){ amt = Number(h.SisaHutang)||0; }
        var key2 = h.ID + '|' + due;
        if(seen[key2]) return;
        seen[key2] = 1;
        items.push({ id: h.ID, nama: h.Nama, date: due, amount: amt });
        total += amt;
      }
    });
    items.sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    var short = (typeof MONTHS_SHORT !== 'undefined' ? MONTHS_SHORT[m] : String(m+1));
    return { total: total, items: items, from: from, to: to, short: short, label: short + ' ' + y };
  }

  function renderTrxCard(t){
    var isIn = t.Jenis === 'Pemasukan';
    var isTransfer = isTransferLeg(t);
    var badgeClass = isTransfer ? 'blue' : (isIn ? 'green' : 'red');
    var amountClass = isTransfer ? 'blue' : (isIn ? 'green' : 'red');
    var icon = kategoriIconSvg_(t.Kategori, isIn, isTransfer);
    // Logo Pertamina jika isi BBM di SPBU Pertamina
    var catAll = String(t.Catatan || '') + ' ' + String(t.Kategori || '');
    if(/spbu\s*pertamina/i.test(catAll) || (/\b(bbm|bensin)\b/i.test(String(t.Kategori||'')) && /pertamina/i.test(String(t.Catatan||'')))){
      icon = '<img src="' + LOGO_PERTAMINA_DATA + '" alt="Pertamina" width="22" height="22" style="object-fit:contain;display:block;">';
    }
    var title = t.Kategori || (isIn ? 'Pemasukan' : 'Pengeluaran');
    var bits = [];
    if(t.Kategori === 'Transfer Keluar' || t.Kategori === 'Tarik Tunai' || t.Kategori === 'Setor Tunai' || t.Kategori === 'Transfer Masuk'){
      title = (t.Kategori === 'Transfer Keluar' || t.Kategori === 'Transfer Masuk') ? 'Transfer' : t.Kategori;
      var cat = String(t.Catatan || '').replace(/TFID:[A-Za-z0-9\-_]+/gi, '').replace(/\s*[•|]\s*/g, ' · ').trim();
      var mTo = cat.match(/(?:Transfer ke|·\s*ke)\s+([^·]+)/i);
      var mFrom = cat.match(/(?:Transfer dari|·\s*dari)\s+([^·]+)/i);
      var tujuan = mTo ? mTo[1].replace(/Tarik Tunai|Setor Tunai|Transfer/gi,'').trim() : '';
      var asal = mFrom ? mFrom[1].replace(/Tarik Tunai|Setor Tunai|Transfer/gi,'').trim() : '';
      if(t.Kategori === 'Tarik Tunai'){
        if(!tujuan) tujuan = 'Uang Tunai';
        bits.push((t.Akun || '') + ' → ' + tujuan);
      } else if(t.Kategori === 'Setor Tunai'){
        bits.push((t.Akun || 'Uang Tunai') + (tujuan ? (' → ' + tujuan) : ''));
      } else if(t.Kategori === 'Transfer Keluar'){
        bits.push((t.Akun || '') + (tujuan ? (' → ' + tujuan) : ''));
      } else {
        bits.push((asal || '') + (t.Akun ? (' → ' + t.Akun) : ''));
      }
    } else if(t.Akun) bits.push(String(t.Akun));
    var untuk = parseUntuk_(t);
    if(untuk) bits.push(String(untuk));
    else if(t.Catatan){
      var cat = stripJadwalFromCatatan_ ? stripJadwalFromCatatan_(t.Catatan) : String(t.Catatan);
      cat = String(cat || '').replace(/Untuk:\s*[^•|]+/i, '').replace(/\s*•\s*/g, ' ').trim();
      if(cat) bits.push(cat.slice(0, 36));
    }
    if(isTransfer) bits.unshift('Transfer');
    var sub = bits.filter(Boolean).join(' · ');
    var sign = isTransfer ? '' : (isIn ? '+' : '−');
    return '<div class="trx-card item-card" data-id="' + t.ID + '" data-kind="trx">' +
      '<div class="trx-card-left">' +
        '<div class="icon-badge ' + badgeClass + '">' + icon + '</div>' +
        '<div class="trx-card-text">' +
          '<div class="trx-card-title">' + esc(title) + '</div>' +
          (sub ? '<div class="trx-card-sub">' + esc(sub) + '</div>' : '') +
        '</div>' +
      '</div>' +
      '<div class="trx-card-amt item-amount ' + amountClass + ' num">' + sign + fmtRupiah(t.Nominal) + '</div>' +
    '</div>';
  }

  function fotoKeyFromTrx_(t){

  function loadFotoMap_(){

  function saveTrxFoto_(key, dataUrl){
    if(!key || !dataUrl) return;
    var map = loadFotoMap_();
    map[key] = dataUrl;
    // batasi max ~40 foto biar storage tidak penuh
    var keys = Object.keys(map);
    if(keys.length > 40){

  function compressImageFile_(file, maxW, quality, cb){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try { cb(canvas.toDataURL('image/jpeg', quality || 0.7)); }
        catch(e){ cb(''); }
      };
      img.onerror = function(){ cb(''); };
      img.src = reader.result;
    };
    reader.onerror = function(){ cb(''); };
    reader.readAsDataURL(file);
  }

  function esc(s){

  // ================= HUTANG & PIUTANG VIEW =================
  var urgencyFilter = 'all'; // 'all' | 'overdue' | 'upcoming'

  function daysUntil(ymd){
    if(!ymd) return null;
    var today = new Date(); today.setHours(0,0,0,0);
    var d = parseYMD(ymd); d.setHours(0,0,0,0);
    return Math.round((d - today) / 86400000);
  }
  function urgencyOf(h){
    if(h.Status === 'Lunas') return null;
    var due = (typeof nextDueDateFor_ === 'function') ? nextDueDateFor_(h) : h.JatuhTempo;
    if(!due) return null;
    var days = daysUntil(due);
    if(days === null) return null;
    if(days < 0) return 'overdue';
    if(days <= 7) return 'upcoming';
    return null;
  }

  // Nominal yang ditampilkan di kartu: untuk yang sudah Lunas selalu TotalHutang
  // (SisaHutang-nya 0), untuk yang masih Aktif berupa SisaHutang pada metode cicilan.
  function amountShownFor(h){
    if(h.Status === 'Lunas') return 0;
    var nj = nextTagihanDariJadwal_(h);
    if(nj) return nj.amount;
    if(h.Metode === 'Cicilan Tetap') return Math.min(Number(h.NominalCicilan) || 0, Number(h.SisaHutang) || 0);
    return Number(h.SisaHutang) || Number(h.TotalHutang) || 0;
  }
  function nextDueDateFor_(h){
    var nj = nextTagihanDariJadwal_(h);
    if(nj && nj.date) return nj.date;
    return h.JatuhTempo || '';
  }

  var hutangSortBy = 'default';
  function sortHutangList(list){
    var arr = list.slice();
    if(hutangSortBy === 'jatuh-tempo'){
      arr.sort(function(a,b){
        if(!a.JatuhTempo && !b.JatuhTempo) return 0;
        if(!a.JatuhTempo) return 1;
        if(!b.JatuhTempo) return -1;
        return a.JatuhTempo < b.JatuhTempo ? -1 : a.JatuhTempo > b.JatuhTempo ? 1 : 0;
      });
    } else if(hutangSortBy === 'nominal-desc'){
      arr.sort(function(a,b){ return amountShownFor(b) - amountShownFor(a); });
    }
    return arr;
  }

    if(btnAddHutang) btnAddHutang.addEventListener('click', function(){ openHutangForm('Hutang'); });

      card.addEventListener('click', function(){ openHutangDetail(card.dataset.id); });
    });

  // ================= REKENING VIEW =================
  var rekeningSortBy = 'default';
  function sortRekeningList(list){
    var arr = list.slice();
    if(rekeningSortBy === 'nama') arr.sort(function(a,b){ return a.Nama.localeCompare(b.Nama); });
    else if(rekeningSortBy === 'saldo-desc') arr.sort(function(a,b){ return Number(b.Saldo) - Number(a.Saldo); });
    else if(rekeningSortBy === 'saldo-asc') arr.sort(function(a,b){ return Number(a.Saldo) - Number(b.Saldo); });
    return arr;
  }

  function bankLogoHtml(nama, sizeClass){

      return '<div class="' + cls + '" style="' + style + 'padding:4px;" title="' + esc(nama) + '">' +

  function renderRekening(){
    var el = document.getElementById('view-rekening');
    var total = 0;
    STATE.rekening.forEach(function(r){
      if(!r.Nama || r.Nama === 'Kredit (Non-Kas)' || r.Nama === 'Reimburse') return;
      total += Number(r.Saldo) || 0;
    });
    var nRek = STATE.rekening.filter(function(r){ return r.Nama && r.Nama !== 'Kredit (Non-Kas)' && r.Nama !== 'Reimburse'; }).length;
    var html = '<div class="total-saldo-card"><div class="lbl">Total saldo kas</div><div class="val num">' + fmtRupiah(total) + '</div><div class="sub">' + nRek + ' rekening aktif · tidak termasuk virtual</div></div>';
    // Tombol tambah rekening — selalu tampil
    html += '<button class="btn-primary" id="btn-add-rekening" style="margin-bottom:10px; display:flex; align-items:center; justify-content:center; gap:8px;">' +
      '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
      'Tambah Rekening</button>';
    if(STATE.rekening.filter(function(r){ return r.Nama && r.Nama !== 'Kredit (Non-Kas)' && r.Nama !== 'Reimburse'; }).length >= 2){
      html += '<button class="btn-secondary" id="btn-transfer" style="margin-bottom:10px; display:flex; align-items:center; justify-content:center; gap:8px;">' +
        '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>' +
        'Transfer Antar Rekening</button>';
    }
    if(STATE.rekening.length >= 2){
      html += '<select class="form-select" id="f-rekening-sort" style="margin-bottom:14px;">' +
        '<option value="default"' + (rekeningSortBy==='default'?' selected':'') + '>Urutan Ditambahkan</option>' +
        '<option value="nama"' + (rekeningSortBy==='nama'?' selected':'') + '>Nama A-Z</option>' +
        '<option value="saldo-desc"' + (rekeningSortBy==='saldo-desc'?' selected':'') + '>Saldo Terbesar</option>' +
        '<option value="saldo-asc"' + (rekeningSortBy==='saldo-asc'?' selected':'') + '>Saldo Terkecil</option>' +
      '</select>';
    }
    var visibleRek = STATE.rekening.filter(function(r){ return r.Nama && String(r.Nama).trim(); });
    if(!visibleRek.length){
      html += emptyState('Belum ada rekening', 'Yuk tambah rekening pertama — BCA, Gopay, atau tunai — biar saldo ke-track.');
    } else {
      sortRekeningList(STATE.rekening).forEach(function(r){
        if(!r.Nama || !String(r.Nama).trim()) return;
        var isReimburse = r.Nama === 'Reimburse';
        var isKreditNonKas = r.Nama === 'Kredit (Non-Kas)';
        var chip = isReimburse ? '<span class="rek-chip">Klaim</span>'
          : (isKreditNonKas ? '<span class="rek-chip">Virtual</span>' : '');
        var saldo = Number(r.Saldo) || 0;
        var tipeRek = 'Rekening';
        var nm = String(r.Nama||'').toLowerCase();
        if(/tunai|cash|kas/.test(nm)) tipeRek = 'Tunai';
        else if(/gopay|ovo|dana|shopeepay|linkaja|e-?wallet|dompet/.test(nm)) tipeRek = 'E-wallet';
        else if(/bca|bni|bri|mandiri|seabank|btn|cimb|permata|jenius|bank/.test(nm)) tipeRek = 'Bank';
        html +=
          '<div class="rek-wallet rekening-card" data-id="' + r.ID + '" data-kind="rek">' +
            '<div class="rw-logo">' + bankLogoHtml(r.Nama, 'sm') + '</div>' +
            '<div class="rw-body">' +
              '<div class="rw-name">' + esc(r.Nama) + chip + '</div>' +
              '<div class="rw-type">' + tipeRek + '</div>' +
            '</div>' +
            '<div class="rw-saldo num' + (saldo < 0 ? ' red' : '') + '">' + fmtRupiah(saldo) + '</div>' +
          '</div>';
      });
    }

    html += '<div class="riwayat-title" style="margin-top:22px; display:flex; justify-content:space-between; align-items:center;">' +
      '<span>Tujuan Nabung</span><button id="btn-add-goal" style="color:var(--blue); font-weight:700; font-size:13px;">+ Tambah</button></div>';
    if(!STATE.tujuanNabung.length){
      html += '<div class="riwayat-empty">Belum ada tujuan nabung.</div>';
    } else {
      STATE.tujuanNabung.forEach(function(g){
        var pct = g.TargetNominal > 0 ? Math.min(100, Math.round(Number(g.TerkumpulNominal)/Number(g.TargetNominal)*100)) : 0;
        var tercapai = Number(g.TerkumpulNominal) >= Number(g.TargetNominal);
        html += '<div class="kategori-row" data-goal-id="' + g.ID + '">' +
          '<div class="kategori-row-top"><span>' + esc(g.Nama) + (tercapai?' 🎉':'') + '</span><span class="num">' + numOnly(g.TerkumpulNominal) + ' / ' + numOnly(g.TargetNominal) + '</span></div>' +
          '<div class="kategori-bar-track"><div class="kategori-bar-fill" style="width:' + pct + '%; background:' + (tercapai?'var(--green)':'var(--blue)') + ';"></div></div>' +
        '</div>';
      });
    }

    el.innerHTML = html;
    var addRekBtn = document.getElementById('btn-add-rekening');
    if(addRekBtn) addRekBtn.addEventListener('click', openRekeningForm);
    el.querySelectorAll('.rekening-card').forEach(function(card){
      card.addEventListener('click', function(){
        var r = STATE.rekening.find(function(x){ return x.ID === card.dataset.id; });
        if(r && r.Nama === 'Reimburse') openReimburseDetail(r);
        else openRekeningEdit(card.dataset.id);
      });
    });
    var transferBtn = document.getElementById('btn-transfer');
    if(transferBtn) transferBtn.addEventListener('click', openTransferForm);
    var sortSel = document.getElementById('f-rekening-sort');
    if(sortSel) sortSel.addEventListener('change', function(){ rekeningSortBy = this.value; renderRekening(); });
    var addGoalBtn = document.getElementById('btn-add-goal');
    if(addGoalBtn) addGoalBtn.addEventListener('click', openGoalForm);
    el.querySelectorAll('.kategori-row[data-goal-id]').forEach(function(row){
      row.addEventListener('click', function(){ openGoalDetail(row.dataset.goalId); });
    });
  }

  function openGoalForm(){
    openSheet(
      '<div class="sheet-title">Tambah Tujuan Nabung</div>' +
      '<div class="form-group"><label class="form-label">Nama Tujuan</label><input class="form-input" id="f-goal-nama" type="text" placeholder="Contoh: DP Motor, Dana Darurat"></div>' +
      '<div class="form-group"><label class="form-label">Target Nominal</label><input class="form-input num num-input" id="f-goal-target" type="text" inputmode="numeric" placeholder="0"></div>' +
      '<div class="form-group"><label class="form-label">Target Tanggal (opsional)</label><input class="form-input" id="f-goal-tanggal" type="date"></div>' +
      '<button class="btn-primary" id="btn-save-goal">Simpan</button>'
    );
    document.getElementById('btn-save-goal').addEventListener('click', function(){
      var nama = document.getElementById('f-goal-nama').value.trim();
      var target = rawNum('f-goal-target');
      if(!nama){ toast('Nama tujuan harus diisi'); return; }
      if(!target || target <= 0){ toast('Target nominal harus diisi'); return; }
      var payload = { nama: nama, targetNominal: target, tanggalTarget: document.getElementById('f-goal-tanggal').value };
      var btn = document.getElementById('btn-save-goal');
      if(btn && btn.dataset.busy==='1') return;
      if(btn){ btn.dataset.busy='1'; btn.disabled=true; btn.textContent='Menyimpan…'; }
      google.script.run.withSuccessHandler(function(list){
        STATE.tujuanNabung = list; closeSheet(); renderRekening(); toast('Tujuan nabung ditambahkan');
      }).withFailureHandler(function(err){ btn.textContent='Simpan'; toast('Gagal: ' + err.message); }).addTujuanNabung(payload);
    });
  }

  function openGoalDetail(id){
    var g = STATE.tujuanNabung.find(function(x){ return x.ID === id; });
    if(!g) return;
    var pct = g.TargetNominal > 0 ? Math.min(100, Math.round(Number(g.TerkumpulNominal)/Number(g.TargetNominal)*100)) : 0;
    var sisa = Math.max(0, Number(g.TargetNominal) - Number(g.TerkumpulNominal));
    openSheet(
      '<div class="sheet-title">' + esc(g.Nama) + '</div>' +
      '<div class="detail-row"><span class="k">Terkumpul</span><span class="v num">' + fmtRupiah(g.TerkumpulNominal) + '</span></div>' +
      '<div class="detail-row"><span class="k">Target</span><span class="v num">' + fmtRupiah(g.TargetNominal) + '</span></div>' +
      '<div class="detail-row"><span class="k">Sisa</span><span class="v num">' + fmtRupiah(sisa) + '</span></div>' +
      (g.TanggalTarget ? '<div class="detail-row"><span class="k">Target Tanggal</span><span class="v">' + esc(g.TanggalTarget) + '</span></div>' : '') +

    document.getElementById('btn-save-transfer').addEventListener('click', function(){
      var btn = document.getElementById('btn-save-transfer');

      var akunAsal = document.getElementById('f-akun-asal').value;
      var akunTujuan = document.getElementById('f-akun-tujuan').value;
      var nominal = rawNum('f-transfer-nominal');
      var biayaAdmin = rawNum('f-transfer-biaya') || 0;
      var tanggal = document.getElementById('f-tanggal').value;
      var catatan = (document.getElementById('f-catatan').value || '').trim();
      if(!akunAsal || !akunTujuan){ toast('Pilih rekening asal dan tujuan'); return; }
      if(akunAsal === akunTujuan){ toast('Rekening asal dan tujuan tidak boleh sama'); return; }
      if(!nominal || nominal <= 0){ toast('Nominal transfer harus diisi'); return; }
      if(!tanggal){ toast('Tanggal harus diisi'); flashFieldErr_('f-tanggal'); return; }
      if(btn){ btn.dataset.busy = '1'; btn.disabled = true; btn.textContent = 'Menyimpan…'; }

      // Update saldo lokal dulu (langsung terasa)
      function adjSaldo(nama, delta){
        (STATE.rekening || []).forEach(function(r){
          if(r.Nama === nama) r.Saldo = (Number(r.Saldo) || 0) + delta;
        });
      }
      adjSaldo(akunAsal, -(nominal + (biayaAdmin > 0 ? biayaAdmin : 0)));
      adjSaldo(akunTujuan, nominal);

      var localRows = [];
      function localId(){ return 'local-' + Date.now().toString(36) + '-' + Math.floor(Math.random()*1e5).toString(36); }
      var localTfid = 'L' + Date.now().toString(36);
      var labelUtama = transferLabelFromAccounts_(akunAsal, akunTujuan);
      var katKeluar = labelUtama === 'Transfer' ? 'Transfer Keluar' : labelUtama;
      var katMasuk = labelUtama === 'Transfer' ? 'Transfer Masuk' : labelUtama;
      var catKeluar = (labelUtama === 'Transfer' ? ('Transfer ke ' + akunTujuan) : (labelUtama + ' · ke ' + akunTujuan))
        + (catatan ? ' • ' + catatan : '') + ' • TFID:' + localTfid;
      var catMasuk = (labelUtama === 'Transfer' ? ('Transfer dari ' + akunAsal) : (labelUtama + ' · dari ' + akunAsal))
        + (catatan ? ' • ' + catatan : '') + ' • TFID:' + localTfid;
      localRows.push({
        ID: localId(), Tanggal: tanggal, Jenis: 'Pengeluaran', Kategori: katKeluar,
        Akun: akunAsal, Nominal: nominal, Catatan: catKeluar, BudgetId: '', Untuk: ''
      });
      localRows.push({
        ID: localId(), Tanggal: tanggal, Jenis: 'Pemasukan', Kategori: katMasuk,
        Akun: akunTujuan, Nominal: nominal, Catatan: catMasuk, BudgetId: '', Untuk: ''
      });
      if(biayaAdmin > 0){
        localRows.push({
          ID: localId(), Tanggal: tanggal, Jenis: 'Pengeluaran', Kategori: 'Biaya Admin Transfer',
          Akun: akunAsal, Nominal: biayaAdmin,
          Catatan: 'Biaya transfer ke ' + akunTujuan + ' • TFID:' + localTfid, BudgetId: '', Untuk: ''
        });

      localRows.forEach(function(row){ STATE.transaksi.unshift(row); });

      var payload = {
        akunAsal: akunAsal, akunTujuan: akunTujuan, nominal: nominal,
        biayaAdmin: biayaAdmin, tanggal: tanggal, catatan: catatan,
        clientKey: 'tf-' + tanggal + '-' + akunAsal + '-' + akunTujuan + '-' + nominal + '-' + biayaAdmin + '-' + localTfid
      };
      // Optimistic: tutup form & tampilkan dulu; sync server di background
      closeSheet();
      try { renderAll(); } catch(e){}
      toast('Transfer dicatat');
      try { localStorage.setItem('kasCacheV1', JSON.stringify(STATE)); } catch(e){}

      function softOk(data){
        if(btn){ btn.dataset.busy = '0'; }
        if(data){
          try { refreshState(data); } catch(e){}
        }
        try { recomputeSaldoLocal_(); renderAll(); } catch(e){}
        try { localStorage.setItem('kasCacheV1', JSON.stringify(STATE)); } catch(e){}
      }
      function softFail(err){
        var msg = String((err && err.message) || err || '');
        var slow = /lambat|Timeout|Abort|network|fetch|internet/i.test(msg);
        if(slow){
          // JANGAN rollback — data lokal tetap; server sering tetap nulis meski response telat
          if(btn){ btn.dataset.busy = '0'; }
          toast('Server lambat — transfer sudah di HP, nanti disamakan');
          // retry 1x diam-diam setelah 2 dtk
          setTimeout(function(){
            try {
              google.script.run.withSuccessHandler(softOk).withFailureHandler(function(){}).addTransfer(payload);
            } catch(e){}
          }, 2000);
          return;
        }
        // Error nyata (validasi dll) → rollback
        localRows.forEach(function(row){
          STATE.transaksi = (STATE.transaksi || []).filter(function(x){ return x.ID !== row.ID; });
        });
        adjSaldo(akunAsal, nominal + (biayaAdmin > 0 ? biayaAdmin : 0));
        adjSaldo(akunTujuan, -nominal);
        if(btn){ btn.dataset.busy = '0'; btn.disabled = false; btn.textContent = 'Transfer'; }
        try { renderAll(); } catch(e){}
        toast(msg || 'Gagal transfer');
      }
      try {
        google.script.run.withSuccessHandler(softOk).withFailureHandler(softFail).addTransfer(payload);
      } catch(e){ softFail(e); }
    });
  }

  // ================= REKAP =================
  var rekapSubTab = 'realtime'; // 'realtime' | 'bulanan' | 'custom'
  var rekapUntukFilter = ''; // '' = semua | Pribadi | Istri | Anak | Bersama
  var rekapBulanCursor = null; // {y,m} bulan dipilih di tab Bulanan
  var HUTANG_KATEGORI = ['Terima Hutang','Bayar Hutang','Beri Piutang','Terima Piutang','Top Up Hutang','Top Up Piutang'];

  function numOnly(n){
    n = Math.round(Number(n) || 0);
    var neg = n < 0; n = Math.abs(n);
    return (neg ? '-' : '') + formatRibuan(String(n));
  }
  function pad2(n){ return ('0' + n).slice(-2); }
  function fmtRangeLabel(fromD, toD){
    return pad2(fromD.getDate()) + ' ' + MONTHS_SHORT[fromD.getMonth()] + ' ' + fromD.getFullYear() +
      ' - ' + pad2(toD.getDate()) + ' ' + MONTHS_SHORT[toD.getMonth()] + ' ' + toD.getFullYear();
  }

  function parseUntukDariCatatan_(catatan){
    var m = String(catatan || '').match(/Untuk:\s*(Pribadi|Istri|Anak|Bersama)/i);
    return m ? m[1] : null;
  }

  function simpleBarChartHtml_(items, clickable){
    var max = 0;
    items.forEach(function(it){ if(it.value > max) max = it.value; });
    if(max <= 0) return '';
    var html = '<div style="margin:8px 0 4px; display:flex; flex-direction:column; gap:6px;">';
    items.forEach(function(it){
      if(!it.value) return;
      var pct = Math.max(4, Math.round(it.value / max * 100));
      var attr = clickable ? ' class="kategori-row" data-kategori="' + esc(it.label) + '" style="cursor:pointer;"' : '';
      html += '<div' + attr + '>' +
        '<div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:2px;"><span>' + esc(it.label) + (clickable ? ' ›' : '') + '</span><span class="num">' + fmtRupiah(it.value) + '</span></div>' +
        '<div style="height:8px; background:var(--input-bg); border-radius:99px; overflow:hidden;">' +
          '<div style="height:100%; width:' + pct + '%; background:' + (it.color || 'var(--blue)') + '; border-radius:99px;"></div>' +
        '</div></div>';
    });
    html += '</div>';
    return html;
  }
  function topKategoriBars_(fromYMD, toYMD, limit){
    var map = {};
    var uf = rekapUntukFilter || '';
    (STATE.transaksi || []).forEach(function(t){
      if(t.Jenis !== 'Pengeluaran') return;
      if(t.Tanggal < fromYMD || t.Tanggal > toYMD) return;
      if(isTransferLeg(t)) return;
      if(uf){
        var u = parseUntuk_(t) || '';
        if(u !== uf) return;
      }
      var k = t.Kategori || 'Lainnya';
      map[k] = (map[k] || 0) + (Number(t.Nominal) || 0);
    });
    var arr = Object.keys(map).map(function(k){ return { label: k, value: map[k], color: '#1A365D' }; });
    arr.sort(function(a,b){ return b.value - a.value; });
    return arr.slice(0, limit || 5);
  }

  function computeRekap(fromYMD, toYMD, untukFilter){
    untukFilter = untukFilter || rekapUntukFilter || '';
    var pengeluaran = 0, pemasukan = 0;
    var hutangTambah = 0, hutangKurang = 0;
    var piutangTambah = 0, piutangKurang = 0;
    var untukMap = { Pribadi: 0, Istri: 0, Anak: 0, Bersama: 0, Lainnya: 0 };
    STATE.transaksi.forEach(function(t){
      if(t.Tanggal < fromYMD || t.Tanggal > toYMD) return;
      if(isTransferLeg(t)) return;
      var n = Number(t.Nominal) || 0;
      if(t.Kategori === 'Terima Hutang' || t.Kategori === 'Top Up Hutang') hutangTambah += n;
      else if(t.Kategori === 'Bayar Hutang') hutangKurang += n;
      else if(t.Kategori === 'Beri Piutang' || t.Kategori === 'Top Up Piutang') piutangTambah += n;
      else if(t.Kategori === 'Terima Piutang') piutangKurang += n;

      if(t.Jenis === 'Pemasukan'){
        if(!untukFilter) pemasukan += n;
        return;
      }
      var u = parseUntuk_(t) || '';
      var bucket = (u && untukMap[u] !== undefined) ? u : 'Lainnya';
      if(untukFilter){
        if(untukFilter === 'Lainnya'){
          if(bucket !== 'Lainnya') return;
        } else if(u !== untukFilter) return;
      }
      pengeluaran += n;
      untukMap[bucket] += n;
    });
    // Hutang/piutang bentuk Barang: kewajiban nambah tanpa kas "Terima Hutang"
    STATE.hutangPiutang.forEach(function(h){
      if(!h.Tanggal || h.Tanggal < fromYMD || h.Tanggal > toYMD) return;
      if(h.Bentuk !== 'Barang') return;
      var pokok = Number(h.Pokok) || 0;
      if(pokok <= 0) return;
      if(h.Jenis === 'Hutang') hutangTambah += pokok;
      else if(h.Jenis === 'Piutang') piutangTambah += pokok;
    });
    return {
      pengeluaran: pengeluaran,
      pemasukan: pemasukan,
      selisih: pemasukan - pengeluaran,
      hutangTambah: hutangTambah,
      hutangKurang: hutangKurang,
      piutangTambah: piutangTambah,
      piutangKurang: piutangKurang,
      hutangPiutang: hutangTambah - hutangKurang,
      untuk: untukMap
    };
  }

  function rekapRowHtml(label, value, mode, focus){
    var cls = 'dark', text;
    if(mode === 'pemasukan'){ cls = 'green'; text = '+' + numOnly(value); }
    else if(mode === 'delta'){ if(value >= 0){ cls = 'green'; text = '+' + numOnly(value); } else { text = numOnly(value); } }
    else if(mode === 'hutang-tambah'){ cls = 'red'; text = '+' + numOnly(value); }
    else if(mode === 'hutang-kurang'){ cls = 'green'; text = '−' + numOnly(value); }
    else { text = numOnly(value); }
    var focusAttr = focus ? ' data-focus="' + focus + '" style="cursor:pointer;"' : '';
    var hero = (mode === 'delta' || label === 'Selisih') ? ' rekap-hero' : '';
    return '<div class="rekap-row' + hero + '"' + focusAttr + '><span class="k">' + label + '</span><span class="v ' + cls + ' num">' + text + '</span></div>';
  }
  function rekapCardHtml(dateLabel, data, fromYMD, toYMD){
    var fLabel = rekapUntukFilter ? (' · ' + rekapUntukFilter) : '';
    var html = '<div class="rekap-card" data-from="' + fromYMD + '" data-to="' + toYMD + '">' +

      '<div class="rekap-hint">Ketuk angka untuk lihat detail</div>';

    if(rekapUntukFilter){

        '<div class="rekap-sum-cell" data-focus="untuk-' + rekapUntukFilter + '">' +

          '<div class="sv red">' + numOnly(data.pengeluaran) + '</div>' +

            (data.selisih >= 0 ? '+' : '') + numOnly(data.selisih) +
          '</div>' +

      '</div>';

    // Top kategori dilipat — 3 angka hero tetap fokus
    var katBars = topKategoriBars_(fromYMD, toYMD, 5);

        '</button>' +
        '<div class="rekap-fold-body">' + simpleBarChartHtml_(katBars, true) + '</div>' +
      '</div>';
    }

    // Hutang dilipat — tidak mengganggu cashflow
    var hasHp = data.hutangTambah || data.hutangKurang || data.piutangTambah || data.piutangKurang;
    if(hasHp && !rekapUntukFilter){
      html += '<div class="rekap-fold" data-fold="hp">' +
        '<button type="button" class="rekap-fold-btn">' +
          '<span>Hutang &amp; piutang</span>' +
          '<span class="rekap-fold-chev">›</span>' +
        '</button>' +
        '<div class="rekap-fold-body">' +
          rekapRowHtml('Hutang bertambah', data.hutangTambah, 'hutang-tambah', 'hutang-tambah') +
          rekapRowHtml('Hutang berkurang (bayar)', data.hutangKurang, 'hutang-kurang', 'hutang-kurang');
      if(data.piutangTambah || data.piutangKurang){
        html += rekapRowHtml('Piutang bertambah', data.piutangTambah, 'hutang-tambah', 'piutang-tambah') +
          rekapRowHtml('Piutang berkurang', data.piutangKurang, 'hutang-kurang', 'piutang-kurang');
      }
      html += '</div></div>';
    }

    html += '</div>';
    return html;
  }
  function wireRekapCards(container){

      });

    function handleFocus_(from, to, focus){
      if(!focus) return;
      if(focus === 'hutang-tambah' || focus === 'hutang-kurang' || focus === 'piutang-tambah' || focus === 'piutang-kurang'){
        openHutangRekapDetail(from, to, focus);

        openUntukRekapDetail(from, to, focus.replace('untuk-', ''));
      } else if(focus === 'pemasukan'){
        openRekapDetail(from, to, 'kategori', 'Pemasukan');
      } else if(focus === 'pengeluaran'){
        openRekapDetail(from, to, 'transaksi', 'Pengeluaran');

    };

    if(focus === 'hutang-tambah'){
      STATE.transaksi.forEach(function(t){
        if(t.Tanggal < fromYMD || t.Tanggal > toYMD_) return;

          items.push({ tanggal: t.Tanggal, nama: t.Catatan || t.Kategori, sub: t.Akun || '', nominal: Number(t.Nominal), kind: 'trx' });

        }

        total += pokok;
      });
    } else if(focus === 'hutang-kurang'){
      STATE.transaksi.forEach(function(t){
        if(t.Tanggal < fromYMD || t.Tanggal > toYMD_) return;
        if(t.Kategori !== 'Bayar Hutang') return;
        items.push({ tanggal: t.Tanggal, nama: t.Catatan || 'Bayar Hutang', sub: t.Akun || '', nominal: Number(t.Nominal), kind: 'trx' });
        total += Number(t.Nominal);
      });
    } else if(focus === 'piutang-tambah'){
      STATE.transaksi.forEach(function(t){
        if(t.Tanggal < fromYMD || t.Tanggal > toYMD_) return;
        if(t.Kategori === 'Beri Piutang' || t.Kategori === 'Top Up Piutang'){
          items.push({ tanggal: t.Tanggal, nama: t.Catatan || t.Kategori, sub: t.Akun || '', nominal: Number(t.Nominal), kind: 'trx' });
          total += Number(t.Nominal);
        }

        if(!h.Tanggal || h.Tanggal < fromYMD || h.Tanggal > toYMD_) return;
        if(h.Bentuk !== 'Barang' || h.Jenis !== 'Piutang') return;
        var pokok = Number(h.Pokok) || 0;
        if(pokok <= 0) return;
        items.push({ tanggal: h.Tanggal, nama: h.Nama, sub: (h.Catatan || 'Barang/Jasa') + ' • Piutang', nominal: pokok, kind: 'hp', id: h.ID });
        total += pokok;
      });
    } else if(focus === 'piutang-kurang'){
      STATE.transaksi.forEach(function(t){
        if(t.Tanggal < fromYMD || t.Tanggal > toYMD_) return;
        if(t.Kategori !== 'Terima Piutang') return;
        items.push({ tanggal: t.Tanggal, nama: t.Catatan || 'Terima Piutang', sub: t.Akun || '', nominal: Number(t.Nominal), kind: 'trx' });
        total += Number(t.Nominal);
      });
    }

    items.sort(function(a,b){ return b.tanggal < a.tanggal ? -1 : b.tanggal > a.tanggal ? 1 : 0; });

    var isTambah = focus.indexOf('tambah') !== -1;
    var html = '<div class="sheet-title">' + title + '</div>' +
      '<div style="font-size:12.5px; color:var(--ink-faint); margin-bottom:6px;">' + fmtRangeLabel(parseYMD(fromYMD), parseYMD(toYMD_)) + '</div>' +
      '<div style="font-size:22px; font-weight:800; margin-bottom:14px;" class="num ' + (isTambah?'red':'green') + '">' +
        (isTambah?'+':'−') + fmtRupiah(total) + '</div>';

    if(!items.length){
      html += emptyState('Tidak ada data', 'Tidak ada catatan di rentang ini.');
    } else {
      items.forEach(function(it){
        html += '<div class="item-card"' + (it.kind==='hp' && it.id ? ' data-hpid="' + it.id + '"' : '') + '>' +
          '<div class="icon-badge ' + (isTambah?'red':'green') + '">' + (isTambah?ICON_EXPENSE:ICON_INCOME) + '</div>' +
          '<div class="item-main"><div class="item-title">' + esc(it.nama) + '</div>' +
          '<div class="item-sub">' + esc(it.tanggal) + (it.sub ? ' • ' + esc(it.sub) : '') + '</div></div>' +
          '<div class="item-amount ' + (isTambah?'red':'green') + ' num">' + (isTambah?'+':'−') + fmtRupiah(it.nominal) + '</div>' +
        '</div>';
      });
    }
    openSheet(html);
    document.querySelectorAll('.item-card[data-hpid]').forEach(function(card){
      card.addEventListener('click', function(){
        openHutangDetail(card.dataset.hpid);
      });
    });
  }

    el.innerHTML =

    document.querySelectorAll('#rekap-segmented button').forEach(function(b){

      moreBtn.addEventListener('click', function(e){

    var xlsTop = document.getElementById('btn-rekap-xlsx');
    if(pdfTop) pdfTop.addEventListener('click', function(){
      if(moreMenu) moreMenu.hidden = true;
      var r = getActiveRekapRange_();
      if(!r){ toast('Pilih rentang tanggal dulu'); return; }
      doExport('pdf', r.from, r.to, pdfTop);
    });
    if(xlsTop) xlsTop.addEventListener('click', function(){
      if(moreMenu) moreMenu.hidden = true;

      if(!r){ toast('Pilih rentang tanggal dulu'); return; }
      doExport('xlsx', r.from, r.to, xlsTop);

  function getActiveRekapRange_(){
    var today = new Date();
    if(rekapSubTab === 'realtime'){
      var y = today.getFullYear(), m = today.getMonth();
      return { from: toYMD(new Date(y, m, 1)), to: toYMD(today) };
    }
    if(rekapSubTab === 'bulanan'){
      ensureRekapBulanCursor_();
      var y2 = rekapBulanCursor.y, m2 = rekapBulanCursor.m;
      return { from: toYMD(new Date(y2, m2, 1)), to: toYMD(new Date(y2, m2 + 1, 0)) };
    }
    // custom
    var f = document.getElementById('f-rekap-dari');
    var te = document.getElementById('f-rekap-sampai');
    if(f && te && f.value && te.value) return { from: f.value, to: te.value };
    var y3 = today.getFullYear(), m3 = today.getMonth();
    return { from: toYMD(new Date(y3, m3, 1)), to: toYMD(today) };
  }

  function renderRekapRealtime(){
    var body = document.getElementById('rekap-body');
    var today = new Date();
    var y = today.getFullYear(), m = today.getMonth();
    var fromD = new Date(y, m, 1), toD = new Date(y, m, lastDayOfMonth(y, m));
    var fromYMD = toYMD(fromD), toYMD_ = toYMD(toD);
    var data = computeRekap(fromYMD, toYMD_);
    var hasData = data.pengeluaran || data.pemasukan || data.hutangTambah || data.hutangKurang || data.piutangTambah || data.piutangKurang;
    body.innerHTML = hasData
      ? rekapCardHtml(fmtRangeLabel(fromD, toD), data, fromYMD, toYMD_)
      : emptyState('Belum ada data bulan ini', 'Catat pemasukan/pengeluaran dulu — rekap akan terisi otomatis.');
    wireRekapCards(body);
  }

  function monthsWithData(){
    var set = {};
    STATE.transaksi.forEach(function(t){ var d = parseYMD(t.Tanggal); set[d.getFullYear()+'-'+d.getMonth()] = true; });
    STATE.hutangPiutang.forEach(function(h){ if(h.Tanggal){ var d = parseYMD(h.Tanggal); set[d.getFullYear()+'-'+d.getMonth()] = true; } });
    var today = new Date();
    delete set[today.getFullYear()+'-'+today.getMonth()];
    var arr = Object.keys(set).map(function(k){ var p = k.split('-'); return { y: Number(p[0]), m: Number(p[1]) }; });
    arr.sort(function(a,b){ return (b.y*12+b.m) - (a.y*12+a.m); });
    return arr;
  }

  function ensureRekapBulanCursor_(){
    if(rekapBulanCursor && typeof rekapBulanCursor.y === 'number') return;
    var now = new Date();
    rekapBulanCursor = { y: now.getFullYear(), m: now.getMonth() };
  }
  function shiftRekapBulan_(delta){
    ensureRekapBulanCursor_();
    var d = new Date(rekapBulanCursor.y, rekapBulanCursor.m + delta, 1);
    rekapBulanCursor = { y: d.getFullYear(), m: d.getMonth() };
    renderRekapBulanan();
  }
  function renderRekapBulanan(){
    var body = document.getElementById('rekap-body');
    if(!body) return;
    ensureRekapBulanCursor_();
    var months = monthsWithData();
    var y = rekapBulanCursor.y, m = rekapBulanCursor.m;
    var fromD = new Date(y, m, 1), toD = new Date(y, m, lastDayOfMonth(y, m));
    var fromYMD = toYMD(fromD), toYMD_ = toYMD(toD);
    var label = (typeof MONTHS !== 'undefined' ? MONTHS[m] : (m+1)) + ' ' + y;
    var html = '';
    html += '<div class="rekap-month-nav">' +
      '<button type="button" class="rekap-month-btn" id="rekap-bln-prev" aria-label="Bulan sebelumnya">‹</button>' +
      '<div class="rekap-month-label">' + esc(label) + '</div>' +
      '<button type="button" class="rekap-month-btn" id="rekap-bln-next" aria-label="Bulan berikutnya">›</button>' +
    '</div>';
    if(months.length){
      html += '<div class="rekap-month-jump">' +
        '<label class="form-label" style="margin:0 0 4px;">Loncat ke bulan</label>' +
        '<select class="form-select" id="rekap-bln-select">' +
          months.map(function(mo){
            var lb = (typeof MONTHS !== 'undefined' ? MONTHS[mo.m] : (mo.m+1)) + ' ' + mo.y;
            var sel = (mo.y === y && mo.m === m) ? ' selected' : '';
            return '<option value="' + mo.y + '-' + mo.m + '"' + sel + '>' + lb + '</option>';
          }).join('') +
        '</select></div>';
    }
    var data = computeRekap(fromYMD, toYMD_);
    var has = data.pengeluaran || data.pemasukan || data.hutangTambah || data.hutangKurang;
    if(!has && !(STATE.transaksi || []).some(function(tr){ return tr.Tanggal >= fromYMD && tr.Tanggal <= toYMD_; })){
      html += emptyState('Belum ada data bulan ini', 'Geser ‹ › atau loncat ke bulan yang ada transaksi.');
    } else {
      html += rekapCardHtml(fmtRangeLabel(fromD, toD), data, fromYMD, toYMD_);
      html += '<div class="rekap-hint" style="margin-top:10px;">PDF / Excel memakai bulan yang dipilih di atas.</div>';
    }
    body.innerHTML = html;
    var prev = document.getElementById('rekap-bln-prev');
    var next = document.getElementById('rekap-bln-next');
    if(prev) prev.addEventListener('click', function(){ shiftRekapBulan_(-1); });
    if(next) next.addEventListener('click', function(){ shiftRekapBulan_(1); });
    var jump = document.getElementById('rekap-bln-select');
    if(jump) jump.addEventListener('change', function(){
      var p = String(jump.value || '').split('-');
      if(p.length === 2){
        rekapBulanCursor = { y: Number(p[0]), m: Number(p[1]) };
        renderRekapBulanan();
      }
    });
    wireRekapCards(body);
  }

    body.innerHTML =

        '<div class="row-2 form-group" style="margin-bottom:8px;">' +
          '<div><label class="form-label">Dari</label><input class="form-input" id="f-rekap-dari" type="date" value="' + today + '"></div>' +

  function categoryBreakdown(trx, jenis){
    var map = {};
    trx.forEach(function(t){
      if(t.Jenis !== jenis) return;
      if(isTransferLeg(t)) return;
      var k = t.Kategori || 'Tanpa Kategori';
      map[k] = (map[k] || 0) + Number(t.Nominal);
    });
    var arr = Object.keys(map).map(function(k){ return { kategori: k, total: map[k] }; });
    arr.sort(function(a,b){ return b.total - a.total; });
    return arr;
  }

  function svgBarCompare(pemasukan, pengeluaran){
    var max = Math.max(pemasukan, pengeluaran, 1);
    var chartH = 120;
    var hIn = Math.round((pemasukan/max) * chartH);
    var hOut = Math.round((pengeluaran/max) * chartH);
    return '<svg viewBox="0 0 240 165" style="width:100%; max-width:260px; display:block; margin:8px auto 4px;">' +
      '<rect x="35" y="' + (chartH-hIn+10) + '" width="60" height="' + Math.max(hIn,2) + '" rx="6" fill="#1FAA6D"/>' +
      '<rect x="145" y="' + (chartH-hOut+10) + '" width="60" height="' + Math.max(hOut,2) + '" rx="6" fill="#E5484D"/>' +
      '<text x="65" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#1FAA6D">' + numOnly(pemasukan) + '</text>' +
      '<text x="175" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#E5484D">' + numOnly(pengeluaran) + '</text>' +
      '<text x="65" y="150" text-anchor="middle" font-size="12" fill="#5B6478">Pemasukan</text>' +
      '<text x="175" y="150" text-anchor="middle" font-size="12" fill="#5B6478">Pengeluaran</text>' +
    '</svg>';
  }

  function svgDailyTrend(trx, fromYMD, toYMD_){
    var start = parseYMD(fromYMD), end = parseYMD(toYMD_);
    var days = [];
    var d = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    var guard = 0;
    while(d <= end && guard < 62){ days.push(toYMD(d)); d.setDate(d.getDate()+1); guard++; }
    if(days.length < 2) return '';
    var map = {};
    trx.forEach(function(t){
      if(t.Jenis === 'Pengeluaran' && !isTransferLeg(t)) map[t.Tanggal] = (map[t.Tanggal]||0) + Number(t.Nominal);
    });
    var max = 1;
    days.forEach(function(dy){ if((map[dy]||0) > max) max = map[dy]; });
    var barW = 9, gap = 5, chartH = 90;
    var svgW = days.length * (barW+gap);
    var bars = days.map(function(dy, i){
      var val = map[dy] || 0;
      var h = Math.max(Math.round((val/max) * chartH), val>0?2:0);
      var x = i * (barW+gap);
      return '<rect x="' + x + '" y="' + (chartH-h) + '" width="' + barW + '" height="' + h + '" rx="2" fill="' + (val>0?'#E5484D':'#E7EBF2') + '"/>';
    }).join('');
    return '<div style="margin-top:18px;"><div class="riwayat-title" style="margin-bottom:10px;">Tren Pengeluaran Harian</div>' +
      '<div style="overflow-x:auto;"><svg viewBox="0 0 ' + svgW + ' ' + chartH + '" style="width:' + Math.max(svgW,280) + 'px; height:' + chartH + 'px; display:block;">' + bars + '</svg></div></div>';
  }

  function renderKategoriRows(items, colorVar){
    if(!items.length) return '<div class="riwayat-empty">Tidak ada data.</div>';
    var max = items[0].total || 1;
    return items.map(function(it){
      var pct = Math.round((it.total/max) * 100);
      return '<div class="kategori-row" data-kategori="' + esc(it.kategori) + '">' +
        '<div class="kategori-row-top"><span>' + esc(it.kategori) + '</span><span class="num">' + numOnly(it.total) + ' <span class="chev">›</span></span></div>' +
        '<div class="kategori-bar-track"><div class="kategori-bar-fill" style="width:' + pct + '%; background:' + colorVar + ';"></div></div>' +
      '</div>';
    }).join('');
  }


  function openUntukRekapDetail(fromYMD, toYMD_, untukSiapa){
    var label = untukSiapa === 'Lainnya' ? 'Belum ditandai' : untukSiapa;
    var trx = STATE.transaksi.filter(function(t){
      if(t.Tanggal < fromYMD || t.Tanggal > toYMD_) return false;
      if(t.Jenis !== 'Pengeluaran') return false;
      if(isTransferLeg(t)) return false;
      var u = parseUntuk_(t);
      if(untukSiapa === 'Lainnya') return !u || (u !== 'Pribadi' && u !== 'Istri' && u !== 'Anak' && u !== 'Bersama');
      return u === untukSiapa;
    });
    trx.sort(function(a,b){ return b.Tanggal < a.Tanggal ? -1 : b.Tanggal > a.Tanggal ? 1 : 0; });
    var total = 0;
    trx.forEach(function(t){ total += Number(t.Nominal) || 0; });
    var html = '<div class="sheet-title">Pengeluaran ' + esc(label) + '</div>' +
      '<div style="font-size:12.5px;color:var(--ink-faint);margin-bottom:4px;">' + fmtRangeLabel(parseYMD(fromYMD), parseYMD(toYMD_)) + '</div>' +
      '<div style="font-size:15px;font-weight:800;margin-bottom:14px;" class="num">Total ' + fmtRupiah(total) + ' · ' + trx.length + ' transaksi</div>';
    if(!trx.length){
      html += emptyState('Tidak ada data', 'Belum ada pengeluaran untuk ' + label + ' di rentang ini.');
    } else {
      var byDay = {};
      trx.forEach(function(t){ (byDay[t.Tanggal] = byDay[t.Tanggal] || []).push(t); });
      Object.keys(byDay).sort().reverse().forEach(function(day){
        html += '<div class="day-group"><div class="day-heading"><span>' + fmtDayHeading(day) + '</span></div>';
        byDay[day].forEach(function(t){
          html += '<div class="item-card" data-id="' + t.ID + '" data-kind="trx">' +
            '<div class="icon-badge red">' + kategoriIconSvg_(t.Kategori, false, false) + '</div>' +
            '<div class="item-main"><div class="item-title">' + esc(t.Kategori || 'Pengeluaran') + '</div>' +
            '<div class="item-sub">' + esc(t.Akun || '-') + (t.Catatan ? ' • ' + esc(String(t.Catatan).slice(0, 48)) : '') + '</div></div>' +
            '<div class="item-amount red num">-' + fmtRupiah(t.Nominal) + '</div></div>';
        });
        html += '</div>';
      });
    }
    openSheet(html);
    document.querySelectorAll('#sheet-content .item-card[data-kind="trx"]').forEach(function(card){
      card.addEventListener('click', function(){
        try { openTrxDetail(card.dataset.id); } catch(e){}
      });
    });
  }

  function openRekapDetail(fromYMD, toYMD_, presetTab, filterJenis){
    var detailTab = presetTab || 'kategori';

    function renderDetail(){
      var trx = STATE.transaksi.filter(function(t){
        if(t.Tanggal < fromYMD || t.Tanggal > toYMD_) return false;
        if(filterJenis && t.Jenis !== filterJenis) return false;
        return true;
      });
      var html =
        '<div class="sheet-title" style="display:flex; align-items:center; justify-content:space-between;">' +
          '<span>' + fmtRangeLabel(parseYMD(fromYMD), parseYMD(toYMD_)) + '</span>' +
          '<span style="display:flex; gap:6px; flex:0 0 auto;">' +
            '<button class="export-icon-btn" id="btn-export-xlsx" title="Excel rekap periode ini">' + ICON_DOWNLOAD + '<span>Excel</span></button>' +
            '<button class="export-icon-btn" id="btn-export-pdf" title="PDF rekap periode ini">' + ICON_DOWNLOAD + '<span>PDF</span></button>' +
          '</span>' +
        '</div>' +
        '<div class="segmented" id="rekapdetail-segmented">' +
          [['grafik','Grafik'],['kategori','Kategori'],['transaksi','Transaksi']].map(function(s){
            return '<button data-s="' + s[0] + '" class="' + (detailTab===s[0]?'active':'') + '">' + s[1] + '</button>';
          }).join('') +
        '</div>';

      if(!trx.length){
        html += emptyState('Tidak ada data', 'Tidak ada transaksi pada rentang ini.');
      } else if(detailTab === 'grafik'){
        var d = computeRekap(fromYMD, toYMD_);
        html += svgBarCompare(d.pemasukan, d.pengeluaran);
        html += svgDailyTrend(trx, fromYMD, toYMD_);
      } else if(detailTab === 'kategori'){
        var pengKat = categoryBreakdown(trx, 'Pengeluaran');
        var masKat = categoryBreakdown(trx, 'Pemasukan');
        html += '<div class="riwayat-title" style="margin-top:14px;">Pengeluaran per Kategori</div>' + renderKategoriRows(pengKat, 'var(--red)');
        html += '<div class="riwayat-title" style="margin-top:18px;">Pemasukan per Kategori</div>' + renderKategoriRows(masKat, 'var(--green)');
      } else {
        var byDay = {};
        trx.forEach(function(t){ (byDay[t.Tanggal] = byDay[t.Tanggal] || []).push(t); });
        var days = Object.keys(byDay).sort().reverse();
        days.forEach(function(day){
          html += '<div class="day-group"><div class="day-heading"><span>' + fmtDayHeading(day) + '</span></div>';
          byDay[day].forEach(function(t){
            var isIn = t.Jenis === 'Pemasukan';
            var isTransfer = isTransferLeg(t);
            var badgeClass = isTransfer ? 'blue' : (isIn ? 'green' : 'red');
            var icon = isTransfer ? ICON_TRANSFER : (isIn ? ICON_INCOME : ICON_EXPENSE);
            var amountClass = isTransfer ? 'blue' : (isIn ? 'green' : 'red');
            html += '<div class="item-card">' +
              '<div class="icon-badge ' + badgeClass + '">' + icon + '</div>' +

  var __sheetPrevFocus = null;
  function openSheet(html){
    __sheetPrevFocus = document.activeElement;
    var sc = document.getElementById('sheet-content');
    sc.onclick = null;
    // Fase B: body scroll + CTA sticky di footer
    var body = document.createElement('div');
    body.className = 'sheet-body';
    body.innerHTML = html;
    var footer = document.createElement('div');
    footer.className = 'sheet-footer';
    var primaries = body.querySelectorAll('.btn-primary');
    if(primaries.length){
      var last = primaries[primaries.length - 1];
      // ikutkan btn-secondary tepat setelah primary (opsional sepasang)
      var next = last.nextElementSibling;
      footer.appendChild(last);
      if(next && next.classList && next.classList.contains('btn-secondary') && next.id !== 'btn-pk-back'){
        // biarkan secondary di body kecuali pasangan aksi utama
      }
    }
    sc.innerHTML = '';
    sc.appendChild(body);
    if(footer.childNodes.length) sc.appendChild(footer);
    else footer.classList.add('empty');
    try { autoLinkFormLabels_(sc); } catch(e) {}
    var titleEl = sc.querySelector('.sheet-title');
    if(titleEl){
      if(!titleEl.id) titleEl.id = 'sheet-title-live';
      sheet.setAttribute('aria-labelledby', titleEl.id);
    }
    sheet.setAttribute('role', 'dialog');
    sheet.setAttribute('aria-modal', 'true');
    sheet.setAttribute('aria-label', 'Panel');
    overlay.classList.add('show'); sheet.classList.add('show');
    if(!sheetHistoryPushed){
      try{ history.pushState({ kasSheet: true }, ''); sheetHistoryPushed = true; }catch(e){}
    }
    fitViewport();
    setTimeout(function(){
      var focusEl = document.querySelector('#sheet-content .form-input, #sheet-content .form-select, #sheet-content .btn-primary');
      if(focusEl) try{ focusEl.focus(); }catch(e){}
    }, 80);
  }
  function closeSheet(){
    overlay.classList.remove('show'); sheet.classList.remove('show');
    sheet.removeAttribute('role');
    if(sheetHistoryPushed){
      sheetHistoryPushed = false;
      try{ history.back(); }catch(e){}
    }
    fitViewport();
    if(__sheetPrevFocus && typeof __sheetPrevFocus.focus === 'function'){
      try{ __sheetPrevFocus.focus(); }catch(e){}
    }
    __sheetPrevFocus = null;
  }

    if(sheet.classList.contains('show')){

  function persistBudgetLocal_(){
    try { localStorage.setItem('kasBudgetLiburan', JSON.stringify(STATE.budgetLiburan || [])); } catch(e) {}
    try { localStorage.setItem('kasCacheV1', JSON.stringify(STATE)); } catch(e) {}
  }
  function genLocalId_(prefix){
    return (prefix || 'id') + '-' + Date.now() + '-' + Math.floor(Math.random()*9999);
  }
  function parseBudgetIdFromCatatan_(catatan){
    var m = String(catatan || '').match(/LiburanID:([^\s•]+)/);
    return m ? m[1] : '';
  }
  function parseBudgetId_(t){
    if(t && typeof t === 'object'){
      if(t.BudgetId) return String(t.BudgetId);
      return parseBudgetIdFromCatatan_(t.Catatan);
    }
    return parseBudgetIdFromCatatan_(t);
  }
  function parseUntuk_(t){
    if(t && typeof t === 'object' && t.Untuk) return String(t.Untuk);
    return parseUntukDariCatatan_(t && t.Catatan != null ? t.Catatan : t);
  }
  function activeBudgetsOn_(ymd){
    return (STATE.budgetLiburan || []).filter(function(b){
      return b.Status !== 'Selesai' && b.Dari && b.Sampai && ymd >= b.Dari && ymd <= b.Sampai;
    });
  }
  function spentMapForBudget_(b){
    var map = {};
    (STATE.transaksi || []).forEach(function(t){
      if(t.Jenis !== 'Pengeluaran') return;
      if(isTransferLeg(t)) return;
      if(parseBudgetId_(t) !== b.ID) return;
      var akun = t.Akun || '';
      map[akun] = (map[akun] || 0) + (Number(t.Nominal) || 0);
    });
    return map;
  }
  function budgetStats_(b){
    var spentMap = spentMapForBudget_(b);
    var kantong = (b.Kantong || []).map(function(k){
      var terisi = Number(k.terisi) || 0;
      var terpakai = spentMap[k.akun] || 0;
      return { akun: k.akun, terisi: terisi, terpakai: terpakai, sisa: terisi - terpakai };
    });
    var terpakai = 0, terisi = 0;
    kantong.forEach(function(k){ terpakai += k.terpakai; terisi += k.terisi; });
    var plafon = Number(b.Plafon) || terisi;
    return { kantong: kantong, terpakai: terpakai, terisi: terisi, plafon: plafon, sisa: plafon - terpakai };
  }
  function hutangOfBudget_(b){
    if(!b.HutangId) return null;
    for(var i=0;i<(STATE.hutangPiutang||[]).length;i++){
      if(STATE.hutangPiutang[i].ID === b.HutangId) return STATE.hutangPiutang[i];
    }
    return null;
  }
  function isFullKasData_(data){
    return data && Array.isArray(data.transaksi) && Array.isArray(data.rekening);
  }
  function applyCreateBudgetLocal_(payload){
    var id = genLocalId_('bl');
    var hutangId = '';
    var pokok = Number(payload.pokok) || 0;
    var cairKe = payload.cairKe;
    var dari = payload.dari;
    if(payload.pakaiHutang){
      hutangId = genLocalId_('hp');
      var bungaNominal = Number(payload.bungaNominal) || Number(payload.biayaLayanan) || 0;
      var totalHutang = pokok + bungaNominal;
      STATE.hutangPiutang.unshift({
        ID: hutangId, Jenis: 'Hutang', Nama: payload.hutangNama || payload.nama,
        Metode: payload.metode || 'Sekaligus', Bentuk: 'Tunai',
        Pokok: pokok, BungaPersen: Number(payload.bungaPersen)||0, BungaNominal: bungaNominal,
        Tenor: Number(payload.tenor)||1, NominalCicilan: totalHutang,
        TotalHutang: totalHutang, SisaHutang: totalHutang, CicilanTerbayar: 0,
        Tanggal: dari, JatuhTempo: payload.jatuhTempo || '', Status: 'Belum Lunas',
        Akun: cairKe, Catatan: 'Pinjol untuk liburan: ' + payload.nama
      });
      STATE.transaksi.unshift({
        ID: genLocalId_('trx'), Tanggal: dari, Jenis: 'Pemasukan',
        Kategori: 'Terima Hutang', Akun: cairKe, Nominal: pokok,
        Catatan: 'Hutang dari: ' + (payload.hutangNama || payload.nama) + ' • Liburan: ' + payload.nama
      });
      var rek = STATE.rekening.filter(function(r){ return r.Nama === cairKe; })[0];
      if(rek) rek.Saldo = (Number(rek.Saldo)||0) + pokok;
    }
    (payload.splits || []).forEach(function(s){
      var akun = s.akun, nom = Number(s.nominal)||0;
      if(!akun || nom<=0 || akun === cairKe) return;
      STATE.transaksi.unshift({
        ID: genLocalId_('trx'), Tanggal: dari, Jenis: 'Pengeluaran',
        Kategori: 'Transfer Keluar', Akun: cairKe, Nominal: nom,
        Catatan: 'Transfer ke ' + akun + ' • Kantong liburan ' + payload.nama
      });
      STATE.transaksi.unshift({
        ID: genLocalId_('trx'), Tanggal: dari, Jenis: 'Pemasukan',
        Kategori: 'Transfer Masuk', Akun: akun, Nominal: nom,
        Catatan: 'Transfer dari ' + cairKe + ' • Kantong liburan ' + payload.nama
      });
      STATE.rekening.forEach(function(r){
        if(r.Nama === cairKe) r.Saldo = (Number(r.Saldo)||0) - nom;
        if(r.Nama === akun) r.Saldo = (Number(r.Saldo)||0) + nom;
      });
    });
    var kantong = (payload.splits||[]).filter(function(s){ return (Number(s.nominal)||0)>0 && s.akun; })
      .map(function(s){ return { akun: s.akun, terisi: Number(s.nominal)||0 }; });
    STATE.budgetLiburan.unshift({

      if(sampai < dari){ toast('Tanggal selesai salah'); return; }

      if(!cairKe){ toast('Pilih rekening cair'); return; }

          return;
        }
        var outLain = 0;
        splits.forEach(function(s){ if(s.akun !== cairKe) outLain += s.nominal; });
        if(outLain > saldoSrc + 0.5){
          toast('Saldo ' + cairKe + ' tidak cukup untuk transfer ke kantong lain');
          return;
        }

        nama: nama, dari: dari, sampai: sampai, pokok: pokok, cairKe: cairKe, splits: splits,

      };

        google.script.run.withSuccessHandler(function(data){
          if(isFullKasData_(data) && Array.isArray(data.budgetLiburan)){
            ok(data); return;
          }
          applyCreateBudgetLocal_(payload);
          ok(STATE);
        }).withFailureHandler(function(err){
          applyCreateBudgetLocal_(payload);
          ok(STATE);
        }).createBudgetLiburan(payload);
      });
    });
  }

    );
    document.getElementById('btn-pk-back').addEventListener('click', function(){ openLiburanDetail(b.ID); });
    document.getElementById('btn-pk-save').addEventListener('click', function(){
      var dariAkun = document.getElementById('f-pk-dari').value;
      var keAkun = document.getElementById('f-pk-ke').value;
      var nominal = rawNum('f-pk-nom');
      var tanggal = document.getElementById('f-pk-tgl').value;
      if(!nominal){ toast('Isi nominal'); return; }
      var payload = { id: b.ID, dariAkun: dariAkun, keAkun: keAkun, nominal: nominal, tanggal: tanggal };
      saveOptimistic('Kantong dipindah', function(ok, fail){
        google.script.run.withSuccessHandler(function(data){
          if(isFullKasData_(data)){ ok(data); return; }
          applyPindahLocal_(b, payload); ok(STATE);
        }).withFailureHandler(function(){
          applyPindahLocal_(b, payload); ok(STATE);
        }).pindahKantongLiburan(payload);
      });
    });
  }
  function applyPindahLocal_(b, payload){
    var kantong = b.Kantong || [];
    var from = kantong.filter(function(k){ return k.akun === payload.dariAkun; })[0];
    if(!from) return;
    from.terisi = (Number(from.terisi)||0) - payload.nominal;
    var to = kantong.filter(function(k){ return k.akun === payload.keAkun; })[0];
    if(!to){ to = { akun: payload.keAkun, terisi: 0 }; kantong.push(to); }
    to.terisi = (Number(to.terisi)||0) + payload.nominal;
    b.Kantong = kantong;
    STATE.transaksi.unshift({
      ID: genLocalId_('trx'), Tanggal: payload.tanggal, Jenis: 'Pengeluaran',
      Kategori: 'Transfer Keluar', Akun: payload.dariAkun, Nominal: payload.nominal,
      Catatan: 'Transfer ke ' + payload.keAkun + ' • Kantong liburan ' + b.Nama
    });
    STATE.transaksi.unshift({
      ID: genLocalId_('trx'), Tanggal: payload.tanggal, Jenis: 'Pemasukan',
      Kategori: 'Transfer Masuk', Akun: payload.keAkun, Nominal: payload.nominal,
      Catatan: 'Transfer dari ' + payload.dariAkun + ' • Kantong liburan ' + b.Nama
    });
    STATE.rekening.forEach(function(r){
      if(r.Nama === payload.dariAkun) r.Saldo = (Number(r.Saldo)||0) - payload.nominal;
      if(r.Nama === payload.keAkun) r.Saldo = (Number(r.Saldo)||0) + payload.nominal;
    });
    persistBudgetLocal_();
  }

  function accountOptions(selected){
    var list = STATE.rekening.filter(function(r){ return r.Nama !== 'Kredit (Non-Kas)'; });

    return list.map(function(r){

  var KATEGORI_PENGELUARAN_BASE = ['Makan & Minum', 'Jajan', 'Rokok', 'Listrik', 'Belanja Bulanan', 'Transport', 'Bensin', 'Tagihan', 'Internet', 'Pulsa', 'Kesehatan', 'Pendidikan', 'Hiburan', 'Entertainment', 'Fashion', 'Rumah', 'Anak', 'Keluarga', 'Donasi / Zakat', 'Cicilan', 'Olahraga', 'Kecantikan', 'Laundry', 'Service', 'Liburan', 'Asuransi', 'Biaya Admin', 'Lainnya'];
  var KATEGORI_PEMASUKAN = ['Gaji', 'Bonus', 'Freelance', 'Hadiah', 'Investasi', 'Lainnya'];
  var PENGELUARAN_UNTUK = ['Pribadi', 'Istri', 'Anak', 'Bersama'];
  var KATEGORI_SKIP = {
    'Transfer Keluar':1, 'Transfer Masuk':1, 'Tarik Tunai':1, 'Setor Tunai':1, 'Terima Hutang':1, 'Bayar Hutang':1,
    'Beri Piutang':1, 'Terima Piutang':1, 'Top Up Hutang':1, 'Top Up Piutang':1,
    'Penyesuaian Saldo':1, 'Biaya Admin Transfer':1, 'Klaim Reimburse':1
  };

  function loadCustomKategori_(){
    try {
      var arr = JSON.parse(localStorage.getItem('kasCustomKategori') || '[]');
      return Array.isArray(arr) ? arr.filter(Boolean) : [];
    } catch (e) { return []; }
  }
  function saveCustomKategori_(nama){
    if(!nama || nama === 'Lainnya') return;
    if(KATEGORI_PENGELUARAN_BASE.indexOf(nama) !== -1 && nama !== 'Lainnya') return;
    var list = loadCustomKategori_();
    if(list.indexOf(nama) === -1){
      list.push(nama);
      try { localStorage.setItem('kasCustomKategori', JSON.stringify(list)); } catch(e) {}
    }
  }
  function kategoriDariRiwayat_(){
    var seen = {}, out = [];
    (STATE.transaksi || []).forEach(function(t){
      if(t.Jenis !== 'Pengeluaran') return;
      var k = (t.Kategori || '').trim();
      if(!k || KATEGORI_SKIP[k] || seen[k]) return;
      seen[k] = 1;
      out.push(k);
    });
    return out;
  }
  function listKategoriPengeluaran_(){
    var base = KATEGORI_PENGELUARAN_BASE.filter(function(c){ return c !== 'Lainnya'; });
    var seen = {};
    base.forEach(function(c){ seen[c] = 1; });
    var extra = [];
    loadCustomKategori_().concat(kategoriDariRiwayat_()).forEach(function(c){
      if(!c || c === 'Lainnya' || seen[c] || KATEGORI_SKIP[c]) return;
      seen[c] = 1;
      extra.push(c);
    });
    extra.sort(function(a,b){ return a.localeCompare(b, 'id'); });
    return base.concat(extra).concat(['Lainnya']);
  }

  function tempatFieldSpec_(kat){
    var k = String(kat || '').toLowerCase();
    if(/keluarga|donasi|zakat|sedekah|infaq|amal/.test(k))
      return { label: 'Diberikan kepada', ph: 'Contoh: Kakak, ponakan, orang tua', prefix: 'ke' };
    if(/cicilan|hutang|kredit|paylater|kpr|pinjol/.test(k))
      return { label: 'Dibayar ke', ph: 'Contoh: SeaBank, BTN, Shopee PayLater', prefix: 'ke' };
    if(/tagihan|listrik|pdam|wifi|internet|pulsa|kuota|pln|token|asuransi/.test(k))
      return { label: 'Bayar lewat / ke', ph: 'Contoh: PLN Mobile, IndiHome, counter', prefix: 'via' };
    if(/\bbbm\b|bensin|pertamina|shell|spbu/.test(k))
      return { label: 'Isi di mana', ph: '', prefix: 'di', mode: 'bbm' };
    if(/parkir|tol/.test(k))
      return { label: 'Lokasi', ph: 'Contoh: Mall ABC, Tol Japek', prefix: 'di' };
    if(/ojek|grab|gojek|ride|transport/.test(k))
      return { label: 'Dari / ke mana', ph: 'Contoh: Rumah → Kantor', prefix: '' };
    if(/transfer|kirim uang/.test(k))
      return { label: 'Dikirim ke', ph: 'Contoh: Rekening mama', prefix: 'ke' };
    if(/admin|biaya admin/.test(k))
      return { label: 'Untuk transaksi', ph: 'Contoh: Transfer BCA, top up GoPay', prefix: 'untuk' };

  function tempatInputHtml_(spec){
    if(spec.mode === 'bbm'){
      return '<div class="form-group"><label class="form-label">' + spec.label + ' *</label>' +
        '<select class="form-select" id="f-tempat">' +
          '<option value="">Pilih lokasi…</option>' +
          BBM_LOKASI.map(function(x){ return '<option value="' + x + '">' + x + '</option>'; }).join('') +
        '</select></div>';
    }
    return '<div class="form-group"><label class="form-label">' + spec.label + ' *</label>' +
      '<input class="form-input" id="f-tempat" type="text" placeholder="' + (spec.ph || '') + '"></div>';
  }
  function renderKategoriDetailFields_(){
    var box = document.getElementById('trx-kategori-detail');
    if(!box) return;
    var kat = (document.getElementById('f-kategori') || {}).value || '';
    if(trxJenis !== 'Pengeluaran' || !kat){ box.innerHTML = ''; window.__trxTransportSub = ''; return; }
    var html = '';
    if(kat === 'Lainnya'){
      html +=
        '<div class="form-group"><label class="form-label">Nama kategori baru *</label>' +
          '<input class="form-input" id="f-kategori-custom" type="text" placeholder="Contoh: Gas LPG, dll" autofocus></div>';
    }
    if(/^transport$/i.test(String(kat).trim())){
      window.__trxTransportSub = window.__trxTransportSub || '';
      html +=
        '<div class="form-group"><label class="form-label">Jenis transport *</label>' +
          '<div class="transport-sub-grid" id="trx-transport-sub">' +
            TRANSPORT_SUB.map(function(s){
              var on = window.__trxTransportSub === s.id ? ' active' : '';
              return '<button type="button" class="transport-sub-btn' + on + '" data-sub="' + s.id + '">' +
                '<span class="ts-ic">' + transportSubIcon_(s.icon) + '</span>' +
                '<span class="ts-lb">' + s.label + '</span></button>';
            }).join('') +
          '</div></div>';
      if(window.__trxTransportSub){
        html += tempatInputHtml_(tempatFieldSpec_(window.__trxTransportSub));
      }
      box.innerHTML = html;
      document.querySelectorAll('#trx-transport-sub .transport-sub-btn').forEach(function(b){
        b.addEventListener('click', function(){
          window.__trxTransportSub = b.dataset.sub;
          renderKategoriDetailFields_();
        });
      });
      return;
    }
    html += tempatInputHtml_(tempatFieldSpec_(kat));
    box.innerHTML = html;
  }

      });

        var pokok = rawNum('f-nominal')||0, nom = rawNum(this)||0;
        document.getElementById('f-h-bunga-persen').value = pokok && nom ? Math.round((nom/pokok*100)*10)/10 : '';

      });
      document.getElementById('f-h-tenor').addEventListener('input', updateTrxHPreview);
      updateTrxHPreview();
    } else if(trxHutangMetode === 'Paylater'){
      document.getElementById('f-h-biaya').addEventListener('input', updateTrxHPaylaterPreview);
      updateTrxHPaylaterPreview();
    }
  }

  function updateTrxHPreview(){
    var pokok = rawNum('f-nominal')||0;
    var bungaNominal = rawNum('f-h-bunga-nominal')||0;
    var tenor = Number(document.getElementById('f-h-tenor').value)||1;
    document.getElementById('trxh-prev-bunga').textContent = fmtRupiah(bungaNominal);
    document.getElementById('trxh-prev-total').textContent = fmtRupiah(pokok+bungaNominal);
    document.getElementById('trxh-prev-angsuran').textContent = fmtRupiah(Math.round((pokok+bungaNominal)/tenor));
  }
  function updateTrxHPaylaterPreview(){
    var pokok = rawNum('f-nominal')||0;
    var biaya = rawNum('f-h-biaya')||0;
    document.getElementById('trxh-prev-total').textContent = fmtRupiah(pokok+biaya);
  }
