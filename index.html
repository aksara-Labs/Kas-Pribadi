  function submitTrxForm(today){
    var nominal = rawNum('f-nominal');
    var tanggal = document.getElementById('f-tanggal').value;
    if(!nominal || nominal <= 0){ toast('Nominal harus diisi'); return; }
    if(!tanggal){ toast('Tanggal harus diisi'); return; }
    var btn = document.getElementById('btn-save-trx');

    if(trxSumber === 'Hutang' && trxJenis === 'Pengeluaran'){
      var kategori = document.getElementById('f-kategori').value.trim();
      var namaHutang = document.getElementById('f-h-nama').value.trim() || kategori || 'Pembelian';
      var payload = {
        jenis: 'Hutang', nama: namaHutang, metode: trxHutangMetode, bentuk: 'Barang',
        pokok: nominal, tanggal: tanggal, kategori: kategori,
        jatuhTempo: document.getElementById('f-h-tempo') ? document.getElementById('f-h-tempo').value : '',
        catatan: document.getElementById('f-catatan').value || ''
      };
      if(trxHutangMetode === 'Cicilan Tetap'){
        var tenor = Number(document.getElementById('f-h-tenor').value);
        if(!tenor || tenor <= 0){ toast('Tenor harus diisi'); return; }
        payload.tenor = tenor;
        payload.bungaPersen = Number(document.getElementById('f-h-bunga-persen').value) || 0;
        payload.bungaNominal = rawNum('f-h-bunga-nominal') || 0;
      } else if(trxHutangMetode === 'Paylater'){
        payload.biayaLayanan = rawNum('f-h-biaya') || 0;
      }
      saveOptimistic('Dicatat sebagai Hutang', function(ok, fail){
        google.script.run.withSuccessHandler(function(data){
          ok(data);
          var hb = document.querySelector('#bottomnav button[data-tab="hutang"]');
          if(hb) hb.click();
        }).withFailureHandler(fail).addHutangPiutang(payload);
      });
      return;
    }

    if(trxSumber === 'Reimburse' && trxJenis === 'Pengeluaran'){
      var akun = document.getElementById('f-akun').value;
      if(!akun){ toast('Pilih sumber rekening'); return; }
      var payload = {
        nominal: nominal, akun: akun, tanggal: tanggal,
        persentase: Math.max(0, Math.min(100, Number(document.getElementById('f-reimburse-persen').value) || 0)),
        kategori: document.getElementById('f-kategori').value,
        catatan: document.getElementById('f-catatan').value
      };
      saveOptimistic('Transaksi Reimburse dicatat', function(ok, fail){
        google.script.run.withSuccessHandler(ok).withFailureHandler(fail).addReimburseTransaksi(payload);
      });
      return;
    }

    var akun = document.getElementById('f-akun').value;
    var kategori = (document.getElementById('f-kategori').value || '').trim();
    if(!akun){ toast('Pilih akun'); return; }
    if(!kategori){ toast('Pilih kategori'); return; }

    // Lainnya → input manual jadi kategori baru
    if(kategori === 'Lainnya'){
      var customKat = (document.getElementById('f-kategori-custom') && document.getElementById('f-kategori-custom').value || '').trim();
      if(!customKat){ toast('Isi nama kategori baru'); return; }
      if(customKat === 'Lainnya'){ toast('Pakai nama kategori yang lebih spesifik'); return; }
      kategori = customKat;
      saveCustomKategori_(kategori);
    }

    var catatanExtra = (document.getElementById('f-catatan') && document.getElementById('f-catatan').value) || '';
    var catatanParts = [];

    if(trxJenis === 'Pengeluaran'){
      var untuk = window.__trxUntuk || 'Pribadi';
      if(!untuk){ toast('Pilih pengeluaran untuk siapa'); return; }
      catatanParts.push('Untuk: ' + untuk);

      if(kategori === 'Makan & Minum'){
        var item = (document.getElementById('f-item-detail') && document.getElementById('f-item-detail').value || '').trim();
        var tempat = (document.getElementById('f-tempat') && document.getElementById('f-tempat').value || '').trim();
        if(!item){ toast('Isi makan/minum apa'); return; }
        if(!tempat){ toast('Isi beli di mana'); return; }
        catatanParts.push('Menu: ' + item);
        catatanParts.push('Tempat: ' + tempat);
      }
    }
    if(catatanExtra.trim()) catatanParts.push(catatanExtra.trim());

    var payload = {
      jenis: trxJenis, nominal: nominal, tanggal: tanggal,
      akun: akun,
      kategori: kategori,
      catatan: catatanParts.join(' • ')
    };

    // Langsung tampil di list (optimistic), baru sync ke server
    var tempId = 'local-' + Date.now();
    var localRow = {
      ID: tempId,
      Tanggal: tanggal,
      Jenis: trxJenis,
      Kategori: kategori,
      Akun: akun,
      Nominal: nominal,
      Catatan: payload.catatan
    };
    STATE.transaksi = [localRow].concat(STATE.transaksi || []);
    // Update saldo rekening kasar di UI
    STATE.rekening.forEach(function(r){
      if(r.Nama === akun){
        var s = Number(r.Saldo) || 0;
        r.Saldo = trxJenis === 'Pemasukan' ? s + nominal : s - nominal;
      }
    });
    closeSheet();
    toast('Transaksi disimpan');
    renderAll();

    google.script.run.withSuccessHandler(function(data){
      if(data) refreshState(data);
    }).withFailureHandler(function(err){
      toast(err && err.message ? err.message : 'Belum tersimpan ke server');
    }).addTransaksi(payload);
  }

  function addMonthsJS(ymd, n){
    if(!ymd) return '';
    var d = parseYMD(ymd);
    var day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    var lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day, lastDay));
    return toYMD(d);
  }

  // Jadwal cicilan tidak rata di Catatan: JADWAL:2026-10-05=384471;2026-11-05=109555
  function parseJadwalTagihan_(catatan){
    var m = String(catatan || '').match(/JADWAL:([^\n|]+)/i);
    if(!m) return [];
    return m[1].split(';').map(function(part){
      part = part.trim();
      if(!part) return null;
      var bits = part.split('=');
      if(bits.length < 2) return null;
      var amount = Number(String(bits[1]).replace(/[^\d.]/g, '')) || 0;
      if(amount <= 0) return null;
      return { date: bits[0].trim(), amount: amount };
    }).filter(Boolean);
  }
  function nextTagihanDariJadwal_(h){
    var jadwal = parseJadwalTagihan_(h.Catatan);
    if(!jadwal.length) return null;
    var terbayar = Math.max(0, Number(h.TotalHutang) - Number(h.SisaHutang));
    var acc = 0;
    for(var i = 0; i < jadwal.length; i++){
      var prevAcc = acc;
      acc += jadwal[i].amount;
      if(terbayar < acc - 0.01){
        var alreadyOnThis = Math.max(0, terbayar - prevAcc);
        var sisaTagihan = Math.round(jadwal[i].amount - alreadyOnThis);
        if(sisaTagihan <= 0) continue;
        return { amount: sisaTagihan, date: jadwal[i].date, ke: i + 1, total: jadwal.length };
      }
    }
    return null;
  }

        '<div class="preview-box">' +
          '<div class="pr"><span>Total Hutang Baru</span><b class="num" id="e-prev-total">Rp 0</b></div>' +
          '<div class="pr"><span>Angsuran / bulan Baru</span><b class="num" id="e-prev-angsuran">Rp 0</b></div>' +
        '</div>';
    } else if(isPaylater){
      html += '<div class="form-group"><label class="form-label">Biaya Layanan (opsional)</label><input class="form-input num num-input" id="f-e-bunga-nominal" type="text" inputmode="numeric" value="' + ribuanStr(h.BungaNominal) + '"></div>';
    }
    html +=
      '<div class="form-group"><label class="form-label">Jatuh Tempo</label><input class="form-input" id="f-e-tempo" type="date" value="' + esc(h.JatuhTempo || '') + '"></div>' +
      '<div class="form-group"><label class="form-label">Catatan</label><input class="form-input" id="f-e-catatan" type="text" value="' + esc(h.Catatan || '') + '"></div>' +
      '<div style="font-size:11px; color:var(--ink-faint); margin:-8px 0 4px;">Bagian yang sudah terbayar tidak berubah — hanya sisa hutangnya yang menyesuaikan angka baru ini.</div>' +
      '<button class="btn-primary" id="btn-save-edit-hp">Simpan Perubahan</button>';
    openSheet(html);

    function updateEditPreview(){
      if(!isCicilanTetap) return;
      var pokok = rawNum('f-e-pokok') || 0;
      var bunga = rawNum('f-e-bunga-nominal') || 0;
      var tenor = Number(document.getElementById('f-e-tenor').value) || 1;
      document.getElementById('e-prev-total').textContent = fmtRupiah(pokok + bunga);
      document.getElementById('e-prev-angsuran').textContent = fmtRupiah(Math.round((pokok + bunga) / tenor));
    }
    if(isCicilanTetap){
      document.querySelectorAll('.bunga-toggle button').forEach(function(b){
        b.addEventListener('click', function(){
          document.querySelectorAll('.bunga-toggle button').forEach(function(x){ x.classList.remove('active'); });
          b.classList.add('active');
        });
      });
      var pokokEl = document.getElementById('f-e-pokok');
      var persenEl = document.getElementById('f-e-bunga-persen');
      var nominalEl = document.getElementById('f-e-bunga-nominal');
      var tenorEl = document.getElementById('f-e-tenor');
      var lock = false;
      function fromPersen(){ if(lock)return; lock=true; var p=rawNum(pokokEl)||0, per=Number(persenEl.value)||0; nominalEl.value = p&&per?ribuanStr(Math.round(p*per/100)):''; updateEditPreview(); lock=false; }
      function fromNominal(){ if(lock)return; lock=true; var p=rawNum(pokokEl)||0, n=rawNum(nominalEl)||0; persenEl.value = p&&n?Math.round((n/p*100)*10)/10:''; updateEditPreview(); lock=false; }
      persenEl.addEventListener('input', fromPersen);
      nominalEl.addEventListener('input', fromNominal);
      pokokEl.addEventListener('input', function(){ persenEl.value ? fromPersen() : fromNominal(); });
      tenorEl.addEventListener('input', updateEditPreview);
      updateEditPreview();
    } else if(isPaylater){
      document.getElementById('f-e-pokok').addEventListener('input', function(){});
    }

    document.getElementById('btn-save-edit-hp').addEventListener('click', function(){
      var nama = document.getElementById('f-e-nama').value.trim();
      var pokok = rawNum('f-e-pokok');
      if(!nama){ toast('Nama harus diisi'); return; }
      if(!pokok || pokok <= 0){ toast('Nominal harus diisi'); return; }
      var payload = {
        id: h.ID, nama: nama, pokok: pokok,
        jatuhTempo: document.getElementById('f-e-tempo').value,
        catatan: document.getElementById('f-e-catatan').value,
        tanggal: h.Tanggal
      };
      if(isCicilanTetap){
        var tenor = Number(document.getElementById('f-e-tenor').value);
        if(!tenor || tenor <= 0){ toast('Tenor harus diisi'); return; }
        payload.tenor = tenor;
        payload.bungaPersen = Number(document.getElementById('f-e-bunga-persen').value) || 0;
        payload.bungaNominal = rawNum('f-e-bunga-nominal');
      } else if(isPaylater){
        payload.bungaNominal = rawNum('f-e-bunga-nominal');
      }
      saveOptimistic('Perubahan disimpan', function(ok, fail){
        google.script.run.withSuccessHandler(ok).withFailureHandler(fail).updateHutangPiutang(payload);
      });
    });
  }

  function openTopUpForm(h){
    var today = toYMD(currentDate);
    var isHutang = h.Jenis === 'Hutang';
    var html =
      '<div class="sheet-title">Top Up ' + esc(h.Nama) + '</div>' +
      '<div class="form-group"><label class="form-label">Nominal Tambahan</label><input class="form-input num num-input" id="f-topup-nominal" type="text" inputmode="numeric" placeholder="0"></div>' +
      '<div class="form-group"><label class="form-label">Tanggal</label><input class="form-input" id="f-topup-tanggal" type="date" value="' + today + '"></div>';
    if(h.Bentuk === 'Tunai'){
      html += '<div class="form-group"><label class="form-label">' + (isHutang ? 'Rekening Sumber (uang masuk ke sini)' : 'Rekening Sumber (uang keluar dari sini)') + '</label>' +
        '<select class="form-select" id="f-topup-akun">' + accountOptions() + '</select></div>';
    } else {
      html += '<div style="font-size:11px; color:var(--ink-faint); margin:-8px 0 4px;">Ini hutang bentuk Barang/Jasa, jadi tambahan ini juga tidak dicatat sebagai transaksi rekening.</div>';
    }
    html += '<button class="btn-primary" id="btn-save-topup">Tambahkan</button>';
    openSheet(html);
    document.getElementById('btn-save-topup').addEventListener('click', function(){
      var nominalTambahan = rawNum('f-topup-nominal');
      var tanggal = document.getElementById('f-topup-tanggal').value;
      if(!nominalTambahan || nominalTambahan <= 0){ toast('Nominal tambahan harus diisi'); return; }
      if(!tanggal){ toast('Tanggal harus diisi'); return; }
      var akunEl = document.getElementById('f-topup-akun');
      if(h.Bentuk === 'Tunai' && (!akunEl || !akunEl.value)){ toast('Pilih rekening sumber dana'); return; }
      var payload = { id: h.ID, nominalTambahan: nominalTambahan, tanggal: tanggal, akun: akunEl ? akunEl.value : '' };
      saveOptimistic('Nominal berhasil ditambahkan', function(ok, fail){
        google.script.run.withSuccessHandler(ok).withFailureHandler(fail).topUpHutang(payload);
      });
    });
  }

  // ---- Tambah / Edit Rekening ----
  function openRekeningForm(){
    openSheet(
      '<div class="sheet-title">Tambah Rekening</div>' +
      '<div class="form-group"><label class="form-label">Nama Rekening</label><input class="form-input" id="f-nama" type="text" placeholder="Contoh: Kas Tunai, BCA, GoPay"></div>' +
      '<div class="form-group"><label class="form-label">Saldo Awal</label><input class="form-input num num-input" id="f-saldo" type="text" inputmode="numeric" placeholder="0"></div>' +
      '<button class="btn-primary" id="btn-save-rek">Simpan</button>'
    );
    document.getElementById('btn-save-rek').addEventListener('click', function(){
      var nama = document.getElementById('f-nama').value.trim();
      if(!nama){ toast('Nama rekening harus diisi'); return; }
      var payload = { nama: nama, saldoAwal: rawNum('f-saldo') || 0 };
      saveOptimistic('Rekening ditambahkan', function(ok, fail){
        google.script.run.withSuccessHandler(ok).withFailureHandler(fail).addRekening(payload);
      });
    });
  }

  function openReimburseDetail(r){
    var today = toYMD(currentDate);
    var otherAccounts = STATE.rekening.filter(function(x){ return x.Nama !== 'Reimburse'; });
    var saldo = Number(r.Saldo);
    var html =
      '<div class="sheet-title">Saldo Reimburse</div>' +
      '<div class="total-saldo-card"><div class="lbl">TOTAL KLAIM BELUM DICAIRKAN</div><div class="val num">' + fmtRupiah(saldo) + '</div></div>' +
      '<div style="font-size:12.5px; color:var(--ink-soft); line-height:1.6; margin-bottom:16px;">Ini kumpulan klaim reimburse dari transaksi yang kamu bayar duluan. Kalau kantor/pihak lain sudah mengganti uangnya, catat di sini biar masuk ke rekening yang benar.</div>';
    if(saldo <= 0 || !otherAccounts.length){
      html += emptyState('Belum ada yang bisa diklaim', saldo<=0 ? 'Saldo reimburse masih kosong.' : 'Tambahkan rekening lain dulu buat tujuan klaim.');
    } else {
      html +=
        '<div class="form-group"><label class="form-label">Rekening Tujuan</label><select class="form-select" id="f-claim-akun">' +
          otherAccounts.map(function(a){ return '<option value="' + esc(a.Nama) + '">' + esc(a.Nama) + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="form-group"><label class="form-label">Nominal Claim</label><input class="form-input num num-input" id="f-claim-nominal" type="text" inputmode="numeric" value="' + ribuanStr(saldo) + '"></div>' +
        '<div class="form-group"><label class="form-label">Tanggal</label><input class="form-input" id="f-claim-tanggal" type="date" value="' + today + '"></div>' +
        '<button class="btn-primary" id="btn-claim">Claim Sekarang</button>';
    }
    openSheet(html);
    var claimBtn = document.getElementById('btn-claim');
    if(claimBtn){
      claimBtn.addEventListener('click', function(){
        var akunTujuan = document.getElementById('f-claim-akun').value;
        var nominal = rawNum('f-claim-nominal');
        var tanggal = document.getElementById('f-claim-tanggal').value;
        if(!akunTujuan){ toast('Pilih rekening tujuan'); return; }
        if(!nominal || nominal <= 0){ toast('Nominal claim harus diisi'); return; }
        if(nominal > saldo){ toast('Nominal claim melebihi saldo reimburse'); return; }
        if(!tanggal){ toast('Tanggal harus diisi'); return; }
        var payload = { akunAsal: 'Reimburse', akunTujuan: akunTujuan, nominal: nominal, biayaAdmin: 0, tanggal: tanggal, catatan: 'Claim Reimburse' };
        saveOptimistic('Claim berhasil dicatat', function(ok, fail){
          google.script.run.withSuccessHandler(ok).withFailureHandler(fail).addTransfer(payload);
        });
      });
    }
  }

  function openRekeningEdit(id){
    var r = STATE.rekening.find(function(x){ return x.ID === id; });
    if(!r) return;
    openSheet(
      '<div class="sheet-title">Edit Rekening</div>' +
      '<div class="form-group"><label class="form-label">Nama Rekening</label><input class="form-input" id="f-nama" type="text" value="' + esc(r.Nama) + '"></div>' +
      '<div class="detail-row"><span class="k">Saldo Saat Ini</span><span class="v num">' + fmtRupiah(r.Saldo) + '</span></div>' +
      '<div class="form-group"><label class="form-label">Saldo Baru (sesuai kenyataan)</label><input class="form-input num num-input" id="f-saldo-baru" type="text" inputmode="numeric" value="' + ribuanStr(r.Saldo) + '"></div>' +
      '<div style="font-size:11px; color:var(--ink-faint); margin:-8px 0 12px; line-height:1.5;">Kalau beda dengan saldo sistem, selisihnya otomatis dicatat sebagai <b>Pemasukan</b> atau <b>Pengeluaran</b> kategori “Penyesuaian Saldo”.</div>' +
      '<button class="btn-primary" id="btn-update-rek">Simpan Perubahan</button>' +
      '<button class="btn-danger-text" id="btn-del-rek">' + ICON_TRASH + ' &nbsp;Hapus Rekening</button>'
    );
    document.getElementById('btn-update-rek').addEventListener('click', function(){
      var nama = document.getElementById('f-nama').value.trim();
      if(!nama){ toast('Nama rekening harus diisi'); return; }
      var payload = { id: id, nama: nama, saldoBaru: rawNum('f-saldo-baru') };
      if(payload.saldoBaru === null || payload.saldoBaru === undefined || isNaN(payload.saldoBaru)){
        toast('Saldo baru harus diisi'); return;
      }
      saveOptimistic('Rekening diperbarui', function(ok, fail){
        google.script.run.withSuccessHandler(ok).withFailureHandler(fail).updateRekening(payload);
      });
    });
    document.getElementById('btn-del-rek').addEventListener('click', function(){
      if(!confirm('Hapus rekening ini? Transaksi yang terkait tidak akan terhapus.')) return;
      closeSheet();
      var card = document.querySelector('.rekening-card[data-id="' + id + '"]');
      if(card) card.style.display = 'none';
      toastWithUndo('Rekening dihapus', function onUndo(){
        if(card) card.style.display = '';
      }, function onCommit(){
        google.script.run.withSuccessHandler(function(data){
          refreshState(data);
        }).withFailureHandler(function(err){ toast('Gagal: ' + err.message); if(card) card.style.display = ''; }).deleteRekening(id);
      });
    });
  }

  // Start app setelah semua fungsi & ICON_* siap (hindari crash cache load)
  initApp();
</script>
</body>
</html>
